<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e2a5e">
  <title>Xoay Chiều — Hành trình 4 tuần</title>
  <meta name="description" content="Thử, nghĩ, nối và chia sẻ. Một cuốn sổ trải nghiệm học tập trong bốn tuần.">
  <style>:root {
  --bg: #f7f5ef;
  --paper: #fffdf8;
  --ink: #202b4b;
  --muted: #646b7c;
  --line: #e1dfd5;
  --accent: #1e2a5e;
  --gold: #c69432;
  --rose: #a83f53;
  --green: #297765;
  --soft: #eeeee6;
  --shadow: 0 12px 36px #222c4b08
}

* {
  box-sizing: border-box
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif
}

body.dark {
  --bg: #151c2d;
  --paper: #202a3c;
  --ink: #f1eee5;
  --muted: #b5bdcc;
  --line: #3a4558;
  --accent: #aebcff;
  --soft: #293548;
  --gold: #edc16e;
  --rose: #f19aaa;
  --green: #8bd6b8
}

button,
input,
select,
textarea {
  font: inherit
}

button,
a,
input,
textarea,
select {
  -webkit-tap-highlight-color: transparent
}

button {
  cursor: pointer
}

button:disabled {
  opacity: .55;
  cursor: wait
}

button:focus-visible,
a:focus-visible,
input:focus,
textarea:focus,
select:focus {
  outline: 3px solid #c6943280;
  outline-offset: 3px
}

button {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  padding: 10px 17px;
  min-height: 44px
}

button:hover {
  border-color: var(--gold)
}

button.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink)
}

button.ghost {
  background: transparent
}

button.small {
  font-size: 13px;
  padding: 5px 12px
}

a {
  color: var(--accent)
}

h1,
h2,
h3,
p {
  margin-top: 0
}

h1,
h2,
.serif {
  font-family: Georgia, 'Times New Roman', serif;
  font-weight: 500;
  line-height: 1.2
}

h1 {
  font-size: clamp(34px, 4.6vw, 58px);
  letter-spacing: -1.5px;
  margin-bottom: 18px
}

h2 {
  font-size: 30px
}

h3 {
  font-size: 18px
}

small,
.muted {
  color: var(--muted)
}

.eyebrow {
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 750;
  color: var(--muted)
}

.stripe {
  height: 7px;
  background: repeating-linear-gradient(135deg, #1e2a5e 0 15px, #b4233c 15px 22px, #d39b14 22px 28px, #1e2a5e 28px 43px)
}

.shell {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh
}

.side {
  padding: 34px 23px;
  border-right: 1px solid var(--line);
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--paper)
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 38px
}

.brand strong {
  font-size: 23px;
  font-family: Georgia, serif
}

.brand small {
  display: block;
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase
}

.logo {
  display: grid;
  grid-template-columns: repeat(3, 9px);
  gap: 3px;
  transform: rotate(-8deg)
}

.logo i {
  width: 9px;
  height: 9px;
  background: #c69432
}

.logo i:nth-child(3n) {
  background: #a83f53
}

.logo i:nth-child(2n) {
  background: #297765
}

.nav {
  display: grid;
  gap: 8px
}

.nav button {
  text-align: left;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 14px;
  display: flex;
  gap: 12px
}

.nav button.on {
  background: var(--soft);
  color: var(--ink);
  font-weight: 700
}

.nav span {
  width: 20px
}

.sidefoot {
  margin-top: auto;
  padding-top: 24px;
  font-size: 12px
}

.profile {
  padding: 16px 0;
  border-top: 1px solid var(--line)
}

.main {
  min-width: 0
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 42px;
  border-bottom: 1px solid var(--line);
  gap: 12px
}

.status {
  font-size: 12px;
  color: var(--muted)
}

.page {
  max-width: 1120px;
  padding: 42px;
  margin: auto
}

.hero {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 30px;
  align-items: center;
  margin-bottom: 35px
}

.hero p {
  max-width: 510px;
  color: var(--muted)
}

.compass {
  position: relative;
  aspect-ratio: 1;
  max-width: 260px;
  width: 100%;
  margin: auto;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, var(--paper) 0 27%, transparent 28% 47%, var(--line) 47% 47.4%, transparent 48%)
}

.compass:before {
  content: '';
  position: absolute;
  width: 56%;
  height: 56%;
  border: 1px solid var(--gold);
  transform: rotate(45deg);
  border-radius: 10px
}

.compass:after {
  content: '✦';
  font: 100px Georgia;
  color: var(--accent);
  transform: rotate(12deg)
}

.compass .n {
  position: absolute;
  top: 10px;
  font-size: 11px;
  letter-spacing: 2px
}

.compass .s {
  position: absolute;
  bottom: 10px;
  font-size: 11px;
  color: var(--muted)
}

.progress {
  height: 6px;
  background: var(--line);
  border-radius: 8px;
  overflow: hidden
}

.progress i {
  display: block;
  background: var(--green);
  height: 100%
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap
}

.between {
  justify-content: space-between
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px
}

.card,
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 26px;
  box-shadow: var(--shadow)
}

.card {
  position: relative;
  overflow: hidden
}

.card:before {
  content: '';
  position: absolute;
  left: 0;
  top: 24px;
  bottom: 24px;
  width: 4px;
  background: var(--cardcolor, var(--gold))
}

.card h2 {
  font-size: 26px;
  margin: 16px 0 12px
}

.card p {
  font-size: 14px;
  color: var(--muted)
}

.card .num {
  font: 36px Georgia;
  color: var(--cardcolor, var(--gold))
}

.tag {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px
}

.caption {
  font-size: 12px;
  color: var(--muted)
}

.notice {
  padding: 13px 18px;
  background: var(--soft);
  border-radius: 10px;
  font-size: 13px;
  margin: 16px 0
}

.five {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-top: 26px
}

.five div {
  font-size: 12px;
  color: var(--muted);
  border-top: 2px solid var(--gold);
  padding-top: 12px
}

.welcome {
  max-width: 560px;
  margin: 28px auto
}

.welcome h1 {
  font-size: 42px
}

.field {
  display: block;
  margin: 19px 0
}

.field>span {
  display: block;
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 8px
}

input:not([type=radio]):not([type=checkbox]),
select,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  background: var(--bg);
  color: var(--ink);
  min-height: 48px
}

textarea {
  min-height: 160px;
  resize: vertical;
  line-height: 1.7
}

input[type=checkbox],
input[type=radio] {
  accent-color: var(--accent)
}

.field small {
  display: block;
  margin-top: 5px
}

.error {
  color: var(--rose);
  font-size: 13px
}

.work {
  max-width: 800px;
  margin: auto
}

.workhead {
  margin-bottom: 25px
}

.workhead h1 {
  font-size: 36px
}

.stepmeta {
  margin: 18px 0;
  color: var(--muted);
  font-size: 12px
}

.work .panel {
  padding: 34px
}

.letter {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 19px;
  line-height: 1.85
}

.letter h2 {
  font-size: 32px
}

.letter p {
  white-space: pre-wrap
}

.letter .signature {
  font-size: 14px;
  color: var(--muted)
}

.actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px
}

.rating {
  display: grid;
  gap: 10px
}

.rating label {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: flex-start
}

.rating label:has(input:checked) {
  border-color: var(--green);
  background: var(--soft)
}

.hint {
  border-left: 3px solid var(--gold);
  padding: 7px 15px;
  margin-top: 12px;
  font-size: 14px
}

.safety {
  padding: 18px;
  border: 1px solid var(--rose);
  border-radius: 10px;
  margin: 15px 0
}

.entry {
  border-top: 1px solid var(--line);
  padding: 18px 0
}

.entry pre,
pre.text {
  font: inherit;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px
}

.timer {
  font: 46px Georgia;
  font-variant-numeric: tabular-nums
}

.checks {
  display: grid;
  gap: 10px
}

.checks label {
  display: flex;
  gap: 10px
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  max-width: min(90vw, 600px);
  background: var(--ink);
  color: var(--paper);
  padding: 13px 22px;
  border-radius: 12px;
  z-index: 20;
  font-size: 14px
}

.hidden {
  display: none !important
}

.divider {
  height: 1px;
  background: var(--line);
  margin: 28px 0
}

.empty {
  text-align: center;
  padding: 45px 15px
}

.mobilebrand {
  display: none
}

footer {
  margin-top: 30px;
  font-size: 11px;
  color: var(--muted);
  text-align: center
}

.backlink {
  border: 0;
  background: transparent;
  padding-left: 0
}

.titleline {
  margin-bottom: 22px
}

.badge {
  color: var(--green);
  font-size: 12px
}

.historydetails summary {
  cursor: pointer;
  padding: 10px 0;
  font-weight: 650
}

dialog {
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 18px;
  max-width: 620px;
  width: 92%;
  padding: 28px
}

dialog::backdrop {
  background: #14203c88
}

@media(max-width:900px) {
  .shell {
    grid-template-columns: 190px 1fr
  }

  .side {
    padding: 25px 15px
  }

  .page {
    padding: 28px
  }

  .top {
    padding: 16px 28px
  }

  .hero {
    grid-template-columns: 1fr
  }

  .compass {
    display: none
  }

  .five {
    grid-template-columns: repeat(3, 1fr)
  }
}

@media(max-width:640px) {
  .shell {
    display: block
  }

  .side {
    position: static;
    height: auto;
    padding: 14px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--line)
  }

  .brand {
    margin: 0 0 12px
  }

  .brand strong {
    font-size: 21px
  }

  .nav {
    display: flex;
    overflow-x: auto;
    gap: 3px
  }

  .nav button {
    font-size: 12px;
    white-space: nowrap;
    padding: 8px 10px;
    min-height: 44px
  }

  .nav span {
    display: none
  }

  .sidefoot {
    display: none
  }

  .page {
    padding: 24px 16px
  }

  .top {
    padding: 10px 16px
  }

  .cards {
    grid-template-columns: 1fr
  }

  .hero {
    margin-bottom: 25px;
    gap: 0
  }

  .hero h1 {
    font-size: 38px
  }

  .card,
  .panel {
    padding: 22px
  }

  .work .panel {
    padding: 22px 18px
  }

  .five {
    grid-template-columns: repeat(2, 1fr)
  }

  .workhead h1 {
    font-size: 29px
  }

  .letter {
    font-size: 18px
  }

  .welcome {
    margin-top: 0
  }

  .actions button {
    font-size: 14px
  }

  .top .caption {
    max-width: 200px
  }

  .timer {
    font-size: 36px
  }
}

@media(prefers-reduced-motion:no-preference) {
  .card {
    transition: transform .18s
  }

  .card:hover {
    transform: translateY(-3px)
  }
}

/* Nhóm tự đánh giá có legend đọc được bằng trình đọc màn hình. */
.ratingfield {
  border: 0;
  padding: 0;
  min-width: 0;
}

.ratingfield legend {
  margin-bottom: 12px;
  font-weight: 600;
}
</style>
</head>

i qua đường. Ông tên là Socrates. Ông không viết cuốn sách nào; điều ta biết về ông chủ yếu do học trò là Plato ghi lại.", "Chuyện kể rằng một người bạn của ông đến đền Delphi hỏi: “Có ai khôn ngoan hơn Socrates không?”. Lời sấm đáp: không có ai. Socrates rất ngạc nhiên, vì ông thấy mình chẳng biết bao nhiêu. Ông bèn đi trò chuyện với những người nổi tiếng là hiểu biết: chính khách, nhà thơ, thợ thủ công. Sau mỗi cuộc trò chuyện, ông nhận ra họ tưởng mình biết nhiều điều mà thật ra không biết. Còn ông, ít ra cũng không tưởng mình biết điều mình không biết. Có lẽ ông hơn họ đúng ở một điểm nhỏ ấy.", "Người ta hay tóm chuyện này thành câu “Tôi chỉ biết một điều là tôi không biết gì”. Câu ấy không có nguyên văn trong sách của Plato, nhưng ý thì gần đúng.", "Điều thú vị là Socrates không coi “không biết” là xấu hổ. Ông coi đó là điểm xuất phát. Ai tưởng mình đã biết thì thôi không hỏi nữa. Ai biết mình chưa biết thì mới bắt đầu học.", "P.S. Một câu đố nhỏ: nếu không ai biết hết mọi thứ, thì ai nên là thầy của ai?"], "cau_hoi_lon": "Có điều gì bạn tưởng mình đã biết, nhưng thật ra chưa biết?", "nguoi_gui": "Hộp thư Xoay Chiều", "nguon": "Plato, Biện hộ của Socrates (Apology), 21a–23b.", "nguoi_viet": "Bản mẫu có AI hỗ trợ — nhóm nghiên cứu cần đọc duyệt, chỉnh sửa và ghi nhận đóng góp."}, "steps": [{"title": "Một lá thư gửi bạn", "stage": "Mở thư", "minutes": 2, "body": "", "fields": [], "hints": []}, {"title": "Thử giải thích không nhìn vở", "stage": "Thử", "minutes": 3, "body": "Chọn một khái niệm trong bài học tuần này mà bạn nghĩ là đã hiểu. Giải thích nó cho một bạn trong 1 phút, không nhìn vở. Bạn vấp ở chỗ nào?", "fields": [{"key": "thu_lam", "label": "Mình đã thử thế nào?", "min": 5, "kind": "text", "max": 6000}], "hints": []}, {"title": "Bạn vấp ở chỗ nào khi giải thích?", "stage": "Nghĩ", "minutes": 4, "body": "", "fields": [{"key": "nghi_1", "label": "Câu trả lời của mình", "min": 5, "kind": "text", "max": 6000}], "hints": ["Nhớ lại một tình huống cụ thể trong   <script>'use strict';

    render();
  };
}

function home() {
  const p = person(),
    done = new Set(p.history.map(h => h.record.tuan));
  $('page').innerHTML =
    `<section class="hero"><div><p class="eyebrow">SỔ TRẢI NGHIỆM CỦA ${E(profile.ma)}</p><h1>Thử một chút.<br>Hiểu mình thêm.</h1><p>Bốn tuần để nhìn việc học từ những phía khác nhau. Mỗi lần thử là một cơ hội để bạn tìm ra cách của mình.</p><div class="row between"><span class="caption">Hành trình của bạn</span><strong>${done.size}/${CONTENT.so_tuan} tuần đã lưu</strong></div><div class="progress" style="margin-top:10px"><i style="width:${done.size/CONTENT.so_tuan*100}%"></i></div></div><div class="compass" aria-hidden="true"><span class="n">LA BÀN HỌC HỎI</span><span class="s">MỖI BƯỚC LÀ MỘT KHÁM PHÁ</span></div></section><div class="row between titleline"><h3 style="margin:0">Bốn tuần, bốn trải nghiệm</h3><span class="caption">Đi theo nhịp của lớp bạn</span></div><section class="cards">${CONTENT.weeks.map((w,i)=>`<article class="card" style="--cardcolor:${['#b7791f','#0f7c70','#a83f53','#4c51bf'][i]}"><div class="row between"><span class="num">0${w.tuan}</span><span class="tag">${w.duration} phút · ${E(w.focus)}</span></div><h2>${E(w.title)}</h2><p>${E(w.letter.triet_gia)} · ${E(w.letter.tieu_de)}</p><div class="row between"><span class="badge">${done.has(w.tuan)?'✓ Đã có bài nộp':p.drafts[w.tuan]?'◌ Đang viết':'Chưa bắt đầu'}</span><button data-week="${w.tuan}" class="${i===0?'primary':''}">${p.drafts[w.tuan]?'Viết tiếp':done.has(w.tuan)?'Làm lượt mới':'Khám phá'} →</button></div></article>`).join('')}</section><div class="five">${CONTENT.mat_nang_luc.map(m=>`<div style="border-color:${E(m.mau)}"><strong>${E(m.ten)}</strong><br>${E(m.mo_ta)}</div>`).join('')}</div><footer>Không xếp hạng · Không chấm đúng sai · Lắng nghe theo cách của bạn</footer>`;
  document.querySelectorAll('[data-week]').forEach(b => b.onclick = () => start(+b.dataset.week));
}

function start(n) {
  if (storageConflict || loadBroken) {
    showStorageConflict();
    return;
  }
  const p = person();
  if (!p.drafts[n]) {
    if (p.history.some(h => h.record.tuan === n) && !confirm(
        'Tạo một lượt làm mới? Bài đã nộp vẫn được giữ nguyên.')) return;
    p.drafts[n] = {
      id: Core.id(),
      version: CONTENT.phien_ban,
      step: 0,
      answers: {},
      started: new Date().toISOString(),
      activeMs: 0,
      stageTimes: {},
      hints: {}
    };
    if (!persist()) return;
  }
  activeWeek = n;
  lastTick = Date.now();
  tab = 'work';
  render();
}

function current() {
  return person()?.drafts[activeWeek];
}

function letterHTML(w) {
  return `<article class="letter"><p class="eyebrow">LÁ THƯ ${w.tuan} · ${E(w.letter.triet_gia)}</p><h2>${E(w.letter.tieu_de)}</h2>${w.letter.doan.map(p=>`<p>${E(p)}</p>`).join('')}<p><strong>${E(w.letter.cau_hoi_lon)}</strong></p><p class="signature">Hộp thư Xoay Chiều<br>${E(w.letter.nguon)}</p></article>`;
}

/** Tạo ô nhập. Gán .value sau khi dựng DOM để không mất dòng trống đầu tiên. */
function fieldHTML(f, a) {
  const val = a[f.key] ?? '';
  let control;
  if (f.kind === 'rating') control =
    `<div class="rating">${CONTENT.tieu_chi_san_pham.map(([v,t])=>`<label><input type="radio" name="rating" data-field="${f.key}" value="${v}" ${+val===v?'checked':''}><span><strong>Mức ${v}</strong><br>${E(t)}</span></label>`).join('')}</div>`;
  else if (f.options) control =
    `<select id="f_${f.key}" data-field="${f.key}"><option value="">Chọn một phương án</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${E(o)}</option>`).join('')}</select>`;
  else control =
    `<textarea id="f_${f.key}" data-field="${f.key}" aria-describedby="err_${f.key}" ${f.min===30?'style="min-height:260px"':''}></textarea><small id="count_${f.key}">${Core.words(val)} từ · tối thiểu ${f.min} từ · tối đa ${f.max} ký tự</small>`;
  if (f.kind === 'rating')
  return `<fieldset class="field ratingfield"><legend>${E(f.label)}</legend>${control}<div id="err_${f.key}" class="error" role="alert"></div></fieldset>`;
  return `<div class="field"><span><label for="f_${f.key}">${E(f.label)}</label></span>${control}<div id="err_${f.key}" class="error" role="alert"></div></div>`;
}

function work() {
  const w = CONTENT.weeks.find(w => w.tuan === activeWeek),
    d = current();
  if (!d) {
    go('home');
    return;
  }
  d.step = Math.min(d.step, w.steps.length - 1);
  const s = w.steps[d.step],
    a = d.answers;
  $('page').innerHTML =
    `<div class="work"><button class="backlink" id="leave">← Hành trình của mình</button><header class="workhead"><p class="eyebrow">TUẦN ${w.tuan} · ${E(w.focus)}</p><h1>${E(w.title)}</h1><div class="row between"><span class="caption">${E(s.stage)} · ${d.step+1}/${w.steps.length} màn hình</span><span id="stepTimer" class="caption"></span></div><div class="progress" style="margin-top:10px"><i style="width:${(d.step+1)/w.steps.length*100}%"></i></div></header><section class="panel">${d.step===0?letterHTML(w):`<h2>${E(s.title)}</h2>`}${s.body?`<p>${E(s.body)}</p>`:''}${w.quy_trinh==='trien_lam_45'&&s.fields.some(f=>f.key==='san_pham')?oldProductHTML():''}${s.fields.map(f=>fieldHTML(f,a)).join('')}<div id="safety" class="hidden safety" role="status">${E(CONTENT.an_toan.loi_nhan)}${CONTENT.an_toan.lien_he?'<br>'+E(CONTENT.an_toan.lien_he):''}</div>${s.hints.length?`<button id="hint" class="small">Mình chưa biết bắt đầu thế nào</button><div id="hints">${s.hints.slice(0,d.hints[d.step]||0).map(h=>`<p class="hint">${E(h)}</p>`).join('')}</div>`:''}<div class="actions"><button id="prev" ${d.step===0?'disabled':''}>← Quay lại</button><button id="next" class="primary">${d.step===w.steps.length-1?'Lưu & nộp bài ✓':'Tiếp tục →'}</button></div><p class="caption" style="margin:18px 0 0" id="draftStatus">Bản nháp lưu trên máy · Đồng hồ chỉ gợi ý, không khóa bài</p></section></div>`;
  $('leave').onclick = () => go('home');
  $('prev').onclick = () => {
    flushDraft();
    d.step--;
    persist();
    render();
  };
  $('next').onclick = () => nextStep(w, s, d);
  document.querySelectorAll('[data-field]').forEach(el => {
    if (el.type !== 'radio') el.value = a[el.dataset.field] ?? '';
  });
  document.querySelectorAll('[data-field]').forEach(el => el.addEventListener('input', () => {
    d.answers[el.dataset.field] = el.type === 'radio' ? Number(el.value) : el.value;
    const f = s.fields.find(f => f.key === el.dataset.field);
    if ($('count_' + f.key)) $('count_' + f.key).textContent =
      `${Core.words(el.value)} từ · tối thiểu ${f.min} từ · tối đa ${f.max} ký tự`;
    $('err_' + f.key).textContent = '';
    safety();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (persist() && $('draftStatus')) $('draftStatus').textContent =
        'Đã lưu nháp trên máy · Đồng hồ chỉ gợi ý';
    }, 250);
  }));
  if ($('hint')) $('hint').onclick = () => {
    d.hints[d.step] = Math.min(s.hints.length, (d.hints[d.step] || 0) + 1);
    persist();
    $('hints').innerHTML = s.hints.slice(0, d.hints[d.step]).map(h =>
      `<p class="hint">${E(h)}</p>`).join('');
    $('hint').disabled = d.hints[d.step] >= s.hints.length;
  };
  if ($('reuse')) $('reuse').onclick = () => {
    const h = person().history.find(h => h.record.id === $('oldProduct').value);
    if (!h) {
      toast('Hãy chọn một sản phẩm trước.');
      return;
    }
    if (a.san_pham && !confirm('Thay nội dung đang sửa bằng sản phẩm đã chọn?')) return;
    d.sourceId = h.record.id;
    a.dang_san_pham = h.record.dang_san_pham;
    a.san_pham = h.record.san_pham;
    persist();
    render();
  };
  safety();
  updateClock();
}

function safety() {
  const d = current();
  if (!$('safety') || !d) return;
  const text = Object.values(d.answers).join(' ').toLowerCase();
  $('safety').classList.toggle('hidden', !CONTENT.an_toan.tu_khoa.some(k => text.includes(k)));
}

function oldProductHTML() {
  const hs = person().history.filter(h => h.record.tuan < 4);
  return `<div class="notice"><label for="oldProduct">Sản phẩm tuần 1–3 trên máy này</label><select id="oldProduct"><option value="">${hs.length?'Chọn sản phẩm để sửa':'Chưa có sản phẩm cũ trên máy này'}</option>${hs.map(h=>`<option value="${E(h.record.id)}">Tuần ${h.record.tuan} · ${new Date(h.record.thoi_gian).toLocaleString('vi-VN')}</option>`).join('')}</select><button id="reuse" class="small" style="margin-top:10px">Dùng làm bản gốc</button><p class="caption" style="margin:8px 0 0">Bài gốc vẫn được giữ nguyên. Nếu đổi máy, bạn có thể nhập lại sản phẩm từ bản giấy.</p></div>`;
}

function collect() {
  if (tab !== 'work' || !current()) return;
  document.querySelectorAll('[data-field]').forEach(el => {
    if (el.type === 'radio' && !el.checked) return;
    current().answers[el.dataset.field] = el.type === 'radio' ? +el.value : el.value;
  });
}

function flushDraft() {
  collect();
  clearTimeout(saveTimer);
  if (profile) persist();
}

/** Kiểm tra màn hình hiện tại; nộp chỉ khi mọi trường của cả tuần hợp lệ. */
function nextStep(w, s, d) {
  if (storageConflict || loadBroken) {
    showStorageConflict();
    return;
  }
  collect();
  let bad = false;
  s.fields.forEach(f => {
    const err = Core.validate(f, d.answers[f.key]);
    $('err_' + f.key).textContent = err;
    if (err) bad = true;
  });
  if (bad) {
    document.querySelector('.error:not(:empty)')?.scrollIntoView({
      block: 'center'
    });
    return;
  }
  if (d.step < w.steps.length - 1) {
    d.step++;
    persist();
    render();
    window.scrollTo({
      top: 0
    });
    return;
  }
  for (let i = 0; i < w.steps.length; i++)
    if (w.steps[i].fields.some(f => Core.validate(f, d.answers[f.key]))) {
      d.step = i;
      render();
      toast('Hãy hoàn thành phần còn thiếu trước khi nộp.');
      return;
    }
  const record = Core.record(d, profile, w, APP_CONFIG.version),
    p = person();
  $('next').disabled = true;
  p.history.push({
    record,
    sent: false
  });
  db.queue.push({
    record
  });
  delete p.drafts[w.tuan];
  if (!persist()) {
    p.drafts[w.tuan] = d;
    p.history = p.history.filter(h => h.record.id !== record.id);
    db.queue = db.queue.filter(q => q.record.id !== record.id);
    $('next').disabled = false;
    return;
  }
  tab = 'notebook';
  render();
  toast(LIVE ? 'Đã lưu trên máy. Đang chờ xác nhận gửi từ máy chủ.' :
    'Đã lưu bài trên máy. Bản xem thử chưa gửi Google Sheets.');
  sync();
}

function updateClock() {
  if (tab !== 'work' || !current()) return;
  const w = CONTENT.weeks.find(w => w.tuan === activeWeek),
    d = current(),
    s = w.steps[d.step];
  if (!$('stepTimer')) return;
  const left = Math.max(0, s.minutes * 60 - Math.floor((d.stageTimes[s.stage] || 0) / 1000));
  $('stepTimer').textContent = s.minutes ?
    `${s.stage} · ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} gợi ý` :
    'Tự đánh giá theo nhịp của bạn';
}
setInterval(() => {
  const now = Date.now(),
    dt = Math.min(now - lastTick, 2000);
  lastTick = now;
  if (tab === 'work' && current() && !document.hidden && !storageConflict && !loadBroken) {
    const d = current(),
      w = CONTENT.weeks.find(w => w.tuan === activeWeek),
      s = w.steps[d.step];
    d.activeMs += dt;
    d.stageTimes[s.stage] = (d.stageTimes[s.stage] || 0) + dt;
    updateClock();
    if (Math.floor(d.activeMs / 1000) % 5 === 0) persist();
  }
}, 1000);

function notebook() {
  const h = person().history.slice().reverse();
  $('page').innerHTML =
    `<p class="eyebrow">NHỮNG ĐIỀU BẠN ĐÃ NHẬN RA</p><div class="row between"><h1>Sổ của mình</h1><button id="exportMine">Tải bản sao JSON ↓</button></div><p class="muted">Bài nộp được giữ theo từng lượt. Dữ liệu ở đây chỉ thuộc mã đang chọn trên máy này.</p>${h.length?h.map(x=>`<article class="panel" style="margin:18px 0"><div class="row between"><span class="tag">TUẦN ${x.record.tuan}</span><span class="caption">${new Date(x.record.thoi_gian).toLocaleString('vi-VN')}</span></div><h2 style="margin:15px 0">${E(CONTENT.weeks.find(w=>w.tuan===x.record.tuan)?.title)}</h2><p class="badge">${x.sent?'✓ Máy chủ đã xác nhận':LIVE?'◌ Chờ gửi — bài còn trên máy':'◌ Chỉ lưu trên máy ở bản xem thử'}</p><p class="caption">${Math.floor(x.record.thoi_luong_giay/60)} phút ${x.record.thoi_luong_giay%60} giây hoạt động · Tự đánh giá mức ${x.record.tu_danh_gia}</p><details class="historydetails"><summary>Xem câu trả lời và sản phẩm</summary>${['thu_lam','nghi_1','nghi_2','nghi_3','noi','san_pham','chia_se'].map(k=>`<div class="entry"><strong>${({thu_lam:'Thử',nghi_1:'Nghĩ 1',nghi_2:'Nghĩ 2 / Thư gửi mình',nghi_3:'Nghĩ 3',noi:'Nối',san_pham:'Sản phẩm',chia_se:'Chia sẻ / Đổi hoặc giữ ý'})[k]}</strong><pre class="text">${E(x.record[k])}</pre></div>`).join('')}</details></article>`).join(''):'<div class="panel empty"><h2>Trang đầu đang chờ bạn.</h2><p>Hoàn thành một tuần để lưu trải nghiệm của mình ở đây.</p><button id="first" class="primary">Bắt đầu tuần 1 →</button></div>'}`;
  $('exportMine').onclick = () => download('XoayChieu-' + profile.ma + '.json', JSON.stringify({
    profile,
    ...person()
  }, null, 2));
  if ($('first')) $('first').onclick = () => start(1);
}

function letters() {
  $('page').innerHTML =
    `<p class="eyebrow">MỖI TUẦN, MỘT CÂU HỎI LỚN</p><h1>Hộp thư triết học</h1><p class="muted">Một lá thư nhỏ để mở đầu cuộc trò chuyện với chính mình.</p><div class="cards">${CONTENT.weeks.map(w=>`<article class="card"><span class="eyebrow">LÁ THƯ 0${w.tuan} · ${E(w.letter.triet_gia)}</span><h2>${E(w.letter.tieu_de)}</h2><p>${E(w.letter.cau_hoi_lon)}</p><button data-letter="${w.tuan}">Mở thư ↗</button></article>`).join('')}</div><div class="notice">${E(CONTENT.noi_dung_status)}</div>`;
  document.querySelectorAll('[data-letter]').forEach(b => b.onclick = () => {
    const w = CONTENT.weeks.find(w => w.tuan === +b.dataset.letter);
    $('letterDialog').innerHTML = letterHTML(w) + '<button id="closeLetter">Đóng thư</button>';
    $('closeLetter').onclick = () => $('letterDialog').close();

function download(name, text) {
  const u = URL.createObjectURL(new Blob([text], {
      type: 'application/json;charset=utf-8'
    })),
    a = document.createElement('a');
  a.href = u;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}

function settings() {
  $('page').innerHTML =
    `<h1>Cài đặt & dữ liệu</h1><section class="panel"><h3>${profile?'Mã đang dùng: '+E(profile.ma):'Chưa chọn mã'}</h3><p class="muted">Đổi mã không xóa bài của mã cũ trên máy. Trên máy dùng chung, người khác có quyền truy cập trình duyệt có thể xem dữ liệu đã lưu.</p><button id="change">${profile?'Đổi mã / trường / lớp':'Nhập mã'}</button><div class="divider"></div><h3>${LIVE?'Kết nối Google Sheets':'Bản xem thử trên máy'}</h3><p>${LIVE?'Chỉ xóa bài khỏi hàng đợi sau khi máy chủ xác nhận đúng mã bản ghi.':'Bản này không gửi dữ liệu nghiên cứu. Hãy triển khai bộ Apps Script đi kèm để sử dụng chính thức.'}</p><p>${db.queue.length} bản ghi đang chờ.</p><button id="retry">Thử gửi lại</button>${db.queue.filter(q=>q.error).map(q=>`<p class="error">${E(q.record.loai)}: ${E(q.error)}</p>`).join('')}<div class="divider"></div><h3>Bản sao trên máy</h3><p class="caption">Tải bản sao trước khi đổi máy hoặc xóa dữ liệu trình duyệt. Bản sao toàn bộ có dữ liệu của mọi mã từng dùng trên máy này, hãy giữ riêng.</p><button id="backup">Tải bản sao toàn bộ</button><label class="field"><span>Khôi phục bản sao toàn bộ trên máy mới</span><input type="file" id="import" accept=".json,application/json"></label><p class="caption">Khôi phục chỉ áp dụng trên trình duyệt chưa có dữ liệu; bài chưa gửi được giữ ở trạng thái tạm dừng. Bấm Thử gửi lại để tiếp tục.</p><div class="divider"></div><details><summary>Thông tin phiên bản</summary><p>Ứng dụng ${E(APP_CONFIG.version)} · Nội dung ${E(CONTENT.phien_ban)} · ${E(CONTENT.noi_dung_status)}</p><p>Thời gian hoạt động chỉ tính khi màn hình làm bài đang mở và hiển thị; không phải thước đo mức độ tập trung. Học sinh tự giữ mã; mã không phải mật khẩu.</p></details></section>`;
  $('change').onclick = () => {
    flushDraft();
    profile = null;
    delete db.current;
    coordToken = '';
    persist();
    tab = 'home';
    render();
  };
  $('retry').onclick = () => LIVE ? sync(true) : toast('Bản xem thử chưa kết nối Google Sheets.');
  $('backup').onclick = () => download('XoayChieu-backup.json', loadBroken ? (localStorage.getItem(
    KEY) || '{}') : JSON.stringify(db, null, 2));
  $('import').onchange = async e => {
    try {
      const file = e.target.files[0];
      if (!file) return;
      if (Object.keys(db.profiles).length || db.queue.length) throw Error(
        'Hãy dùng trình duyệt mới chưa có dữ liệu để khôi phục, tránh ghi đè.');
      if (file.size > APP_CONFIG.maxBackupBytes) throw Error('Tệp quá lớn.');
      const v = Backup.restore(JSON.parse(await file.text()), CONTENT);
      if (!confirm(
          'Khôi phục dữ liệu? Bài chưa gửi sẽ được giữ và tạm dừng; bấm Thử gửi lại khi sẵn sàng.'
        )) return;
      const oldDb = db,
        oldProfile = profile;
      db = v;
      profile = db.current || null;
      loadBroken = false;
      if (!persist()) {
        db = oldDb;
        profile = oldProfile;
        throw Error('Không ghi được bản khôi phục. Dữ liệu hiện tại chưa bị thay.');
      }
      render();
      toast('Đã khôi phục, giữ nguyên các bài chờ gửi. Chưa tự gửi lên máy chủ.');
    } catch (err) {
      toast(err.message);
    }
  };
}

function coord() {
  if (LIVE && (!coordToken || Date.now() > coordUntil)) {
    coordLogin();
    return;
  }
  const p = profile;
  $('page').innerHTML =
    `<p class="eyebrow">GIỮ NHỊP · LẮNG NGHE · CÙNG SUY NGHĨ</p><h1>Góc điều phối</h1>${LIVE?'':'<div class="notice">Chế độ xem thử. Phiếu chỉ lưu trên máy; khi triển khai thật cần PIN do giáo viên cấp.</div>'}<section class="panel"><label class="field"><span>Buổi của tuần</span><select id="coordWeek">${CONTENT.weeks.map(w=>`<option value="${w.tuan}">Tuần ${w.tuan} · ${w.duration} phút</option>`).join('')}</select></label><div class="row between"><div><span id="stageName" class="eyebrow"></span><div id="coordTime" class="timer">00:00</div></div><div class="row"><button id="timerPlay">Bắt đầu / Tạm dừng</button><button id="timerNext">Chặng tiếp →</button></div></div><p class="caption">Thời gian gợi ý. Điều phối viên chủ động chuyển chặng.</p><div id="coordStages" class="caption"></div><div class="divider"></div><div class="row between"><h3>Thẻ câu hỏi</h3><button id="draw" class="small">Rút thẻ khác</button></div><p id="questionCard"></p><details><summary>Vai trò & luật trao đổi</summary>${CONTENT.vai.map(v=>`<p><strong>${E(v[0])}</strong>: ${E(v[1])}</p>`).join('')}<p>${CONTENT.luat_vong_tron.map(E).join(' · ')}</p></details></section><section class="panel" style="margin-top:20px"><h2>Phiếu ghi buổi</h2><p class="caption">${E(p.truong)} · ${E(p.lop)}. Điền sau khi buổi hoạt động kết thúc.</p><form id="sessionForm"><div class="cards"><label class="field"><span>Ngày</span><input name="ngay" type="date" required value="${localDate()}"></label><label class="field"><span>Khung giờ</span><input name="khung_gio" placeholder="Ví dụ 08:00–08:45" required maxlength="60"></label><label class="field"><span>Thời lượng thực tế (phút)</span><input name="thoi_luong_thuc_te_phut" type="number" min="1" max="240" required></label><label class="field"><span>Sĩ số</span><input name="si_so" type="number" min="1" max="200" required></label><label class="field"><span>Số bạn tham gia</span><input name="so_tham_gia" type="number" min="0" max="200" required></label><label class="field"><span>Hình thức</span><select name="dung_app_hay_giay"><option>App</option><option>Giấy</option><option>Kết hợp</option></select></label></div><div class="checks">${['mo_thu','thu','nghi','noi','chia_se'].map((k,i)=>`<label><input type="checkbox" name="da_lam_${k}">${['Đã mở thư','Đã Thử','Đã Nghĩ','Đã Nối','Đã Chia sẻ'][i]}</label>`).join('')}</div><label class="field"><span>Điều diễn ra tốt</span><textarea name="dieu_tot" required maxlength="6000"></textarea></label><label class="field"><span>Khó khăn (ghi “Không có” nếu không có)</span><textarea name="kho_khan" required maxlength="6000"></textarea></label><label class="field"><span>Điều phối viên — viết tắt</span><input name="dieu_phoi_vien_viet_tat" required maxlength="30"></label><button class="primary">Lưu phiếu ghi buổi</button></form></section><section class="panel" style="margin-top:20px" id="debatePanel"><h2>Đổi / giữ ý của nhóm — tuần 3</h2><form id="debateForm"><label class="field"><span>Mã hoặc tên nhóm (không ghi họ tên)</span><input name="nhom" required maxlength="60"></label><label class="field"><span>Lựa chọn</span><select name="doi_hay_giu"><option value="doi">Đổi ý</option><option value="giu">Giữ ý</option></select></label><label class="field"><span>Vì sao?</span><textarea name="vi_sao" required maxlength="6000"></textarea></label><button class="primary">Lưu ý kiến nhóm</button></form></section>`;

  function resetTimer() {
    if (stageClock?.interval) clearInterval(stageClock.interval);
    const w = CONTENT.weeks.find(w => w.tuan === +$('coordWeek').value),
      map = new Map();
    w.steps.forEach(s => {
      if (s.minutes && !map.has(s.stage)) map.set(s.stage, s.minutes)
    });
    stageClock = {
      stages: [...map],
      idx: 0,
      remaining: [...map][0][1] * 60,
      running: false
    };
    $('debatePanel').classList.toggle('hidden', w.tuan !== 3);
    $('coordStages').textContent = [...map].map(([s, m]) => `${s} ${m}′`).join(' → ');
    paintCoord();
  }
  $('coordWeek').onchange = resetTimer;
  resetTimer();
  $('timerPlay').onclick = () => {
    stageClock.running = !stageClock.running;
    stageClock.last = Date.now();
  };
  $('timerNext').onclick = () => {
    if (stageClock.idx >= stageClock.stages.length - 1) {
      stageClock.running = false;
      toast('Đã đến chặng cuối. Hãy ghi phiếu buổi.');
      return;
    }
    stageClock.idx++;
    stageClock.remaining = stageClock.stages[stageClock.idx][1] * 60;
    stageClock.last = Date.now();
    paintCoord();
  };
  const qs = Object.values(CONTENT.loai_cau_hoi_socrates).flatMap(x => x.mau_cau.map(q => x.ten +
    ': ' + q));
  const draw = () => {
    $('questionCard').textContent = qs[Math.floor(Math.random() * qs.length)];
  };
  $('draw').onclick = draw;
  draw();
  $('sessionForm').onsubmit = e => {
    e.preventDefault();
    const form = e.target,
      d = Object.fromEntries(new FormData(form));
    for (const k of ['thoi_luong_thuc_te_phut', 'si_so', 'so_tham_gia']) d[k] = Number(d[k]);
    if (d.so_tham_gia > d.si_so) {
      toast('Số tham gia không được lớn hơn sĩ số.');
      return;
    } ['mo_thu', 'thu', 'nghi', 'noi', 'chia_se'].forEach(k => d['da_lam_' + k] = !!form.elements[
      'da_lam_' + k].checked);
    saveCoord(form, {
      ...d,
      loai: 'phieu_buoi',
      tuan: +$('coordWeek').value
    });
  };
  $('debateForm').onsubmit = e => {
    e.preventDefault();
    const form = e.target,
      d = Object.fromEntries(new FormData(form));
    if (Core.words(d.vi_sao) < 5) {
      toast('Hãy ghi ít nhất 5 từ giải thích.');
      return;
    }
    saveCoord(form, {
      ...d,
      loai: 'doi_y',
      tuan: 3
    });
  };
  bindCoordinatorDrafts();
}
/** Lưu nháp phiếu điều phối giống bài học sinh, tách theo hồ sơ và form. */
function bindCoordinatorDrafts() {
  const p = person();
  p.coordDrafts ||= {};
  for (const formId of ['sessionForm', 'debateForm']) {
    const form = $(formId),
      draft = p.coordDrafts[formId];
    if (draft) {
      for (const [name, value] of Object.entries(draft.fields)) {
        const el = form.elements[name];
        if (!el) continue;
        if (el.type === 'checkbox') el.checked = value === true;
        else el.value = value;
      }
      if (formId === 'sessionForm' && draft.week) {
        $('coordWeek').value = draft.week;
        $('coordWeek').dispatchEvent(new Event('change'));
      }
    }
    const save = () => {
      const fields = {};
      for (const el of form.elements) {
        if (!el.name) continue;
        fields[el.name] = el.type === 'checkbox' ? el.checked : el.value;
      }
      p.coordDrafts[formId] = {
        fields,
        week: Number($('coordWeek').value)
      };
      persist();
    };
    form.addEventListener('input', save);
    form.addEventListener('change', save);
    if (formId === 'sessionForm') $('coordWeek').addEventListener('change', save);
  }
}

function localDate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function saveCoord(form, data) {
  form.dataset.id ||= Core.id();
  const record = {
    ...data,
    id: form.dataset.id,
    truong: profile.truong,
    lop: profile.lop,
    thoi_gian: new Date().toISOString(),
    phien_ban_app: APP_CONFIG.version
  };
  if (enqueue(record)) {
    delete person().coordDrafts?.[form.id];
    form.reset();
    delete form.dataset.id;
    persist();
    toast('Đã lưu phiếu trên máy. ' + (LIVE ? 'Đang chờ gửi.' : 'Bản xem thử chưa gửi.'));
  }
}

function paintCoord() {
  if (!$('coordTime') || !stageClock) return;
  const t = Math.max(0, Math.ceil(stageClock.remaining));
  $('stageName').textContent = stageClock.stages[stageClock.idx][0];
  $('coordTime').textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  $('timerPlay').textContent = stageClock.running ? 'Tạm dừng' : 'Bắt đầu / Tiếp tục';
}
setInterval(() => {
  if (stageClock?.running) {
    const n = Date.now();
    stageClock.remaining = Math.max(0, stageClock.remaining - (n - stageClock.last) / 1000);
    stageClock.last = n;
    if (!stageClock.remaining) {
      stageClock.running = false;
      toast('Hết thời gian gợi ý của chặng.');
    }
  }
  paintCoord();
}, 500);

function coordLogin() {
  $('page').innerHTML =
    `<div class="welcome panel"><h2>Chế độ điều phối</h2><p>${E(profile.truong)} · ${E(profile.lop)}</p><p class="muted">Nhập PIN được giáo viên cấp cho lớp. PIN được kiểm tra trên máy chủ.</p><form id="pinForm"><label class="field"><span>PIN điều phối</span><input id="pin" type="password" inputmode="numeric" minlength="6" maxlength="12" required autocomplete="off"></label><button class="primary">Mở chế độ điều phối</button><p id="pinErr" class="error" role="alert"></p></form></div>`;
  $('pinForm').onsubmit = async e => {
    e.preventDefault();
    const b = e.target.querySelector('button');
    b.disabled = true;
    try {
      const r = await rpc('loginCoordinator', {
        truong: profile.truong,
        lop: profile.lop,
        pin: $('pin').value
      });
      if (!r.ok) throw Error(r.error || 'PIN không đúng.');
      coordToken = r.token;
      coordUntil = r.expires;
      render();
      sync(true);
    } catch (err) {
      $('pinErr').textContent = err.message;
    } finally {
      b.disabled = false;
    }
  };
}
/** Đăng ký vòng đời sau khi giao diện được dựng. */
function boot() {
  window.addEventListener('online', () => {
    status();
    sync();
  });
  window.addEventListener('pagehide', flushDraft);
  window.addEventListener('storage', event => {
    if (event.key === KEY && event.newValue !== storageSnapshot) {
      storageConflict = true;
      showStorageConflict();
    }
  });
  document.addEventListener('visibilitychange', () => {
    lastTick = Date.now();
    if (document.hidden) flushDraft();
  });
  render();
  if (loadBroken) toast('Dữ liệu trên máy không đọc được. Chưa ghi đè dữ liệu cũ.');
  if (LIVE) sync();
  // Kiểm tra định kỳ, nhưng mỗi bản ghi có backoff riêng sau lỗi mạng/quota.
  setInterval(() => sync(), 5000);
  if ('serviceWorker' in navigator && !LIVE && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
if (!globalThis.__XOAY_CHIEU_TEST__) boot();
</script>
