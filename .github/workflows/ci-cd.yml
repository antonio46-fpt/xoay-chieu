name: CI/CD

# Chỉ chạy trên main. Không đụng gh-pages nên workflow pages-build-deployment
# của GitHub Pages vẫn chạy độc lập.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Job 1
  # Chỉ dùng action chính chủ (actions/*) và lệnh shell chuẩn. Không cần
  # secret, không cần license, không cần Advanced Security.
  checks:
    name: Chất lượng & bảo mật tĩnh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cài dependencies (server)
        working-directory: server
        run: npm ci

      - name: Cài dependencies (web)
        working-directory: web
        run: npm ci

      - name: Kiểm tra kiểu (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Kiểm tra kiểu (web)
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Lỗ hổng thư viện (server)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Lỗ hổng thư viện (web)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Chặn mẫu mã nguy hiểm
        run: |
          set -e
          if grep -rn --include='*.ts' --include='*.tsx' \
              -E 'dangerouslySetInnerHTML|new Function\(|[^a-zA-Z_.]eval\(' \
              web/src server/src; then
            echo "::error::Phát hiện mẫu mã có nguy cơ XSS hoặc thực thi mã."
            exit 1
          fi
          echo "Không có mẫu nguy hiểm."

      - name: Quét bí mật bị lộ
        run: node tools/scan-secrets.mjs

  # ------------------------------------------------------------------ Job 2
  test:
    name: Kiểm thử (đơn vị + bảo mật + tích hợp)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xoaychieu
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: xoaychieu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xoaychieu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    # Giá trị giả, chỉ dùng trong job này. Không phụ thuộc GitHub Secrets.
    env:
      DATABASE_URL: postgres://xoaychieu:test_password@127.0.0.1:5432/xoaychieu_test
      TEST_DATABASE_URL: postgres://xoaychieu:test_password@127.0.0.1:5432/xoaychieu_test
      COOKIE_SECRET: ci-secret-phai-dai-hon-32-ky-tu-0123456789
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cài dependencies
        working-directory: server
        run: npm ci

      - name: Áp dụng migration
        working-directory: server
        run: node scripts/migrate.ts

      - name: Chạy test
        working-directory: server
        run: npm test

  # ------------------------------------------------------------------ Job 3
  build:
    name: Build giao diện
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cài dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Lưu bản build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
          if-no-files-found: error
