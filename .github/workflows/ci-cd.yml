name: CI/CD

# Chạy cho mọi push và pull request vào main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Job 1
  security:
    name: Kiểm tra chất lượng & bảo mật tĩnh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Cài dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web

      - name: Kiểm tra kiểu (server)
        run: npx --prefix server tsc --noEmit
        working-directory: .

      - name: Kiểm tra kiểu (web)
        run: npm run typecheck --prefix web

      - name: Kiểm tra lỗ hổng thư viện (production)
        run: |
          npm audit --omit=dev --audit-level=high --prefix server
          npm audit --omit=dev --audit-level=high --prefix web

      - name: Chặn mẫu mã nguy hiểm (SAST nhanh, theo dự án)
        run: |
          set -e
          echo "Tìm dangerouslySetInnerHTML / eval / new Function trong mã nguồn..."
          if grep -rn --include='*.ts' --include='*.tsx' -E 'dangerouslySetInnerHTML|new Function\(|[^a-zA-Z_.]eval\(' web/src server/src ; then
            echo "::error::Phát hiện mẫu mã có nguy cơ XSS/thực thi mã."
            exit 1
          fi
          echo "Không có mẫu nguy hiểm."

      - name: Quét bí mật bị lộ (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Phân tích bảo mật tĩnh (Semgrep - OWASP Top 10)
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/sql-injection \
            --config=p/xss \
            --error \
            --severity=ERROR \
            --exclude=node_modules \
            --exclude=dist \
            server/src web/src

  # ------------------------------------------------------------------ Job 2
  test:
    name: Kiểm thử tự động (đơn vị + bảo mật + tích hợp)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xoaychieu
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: xoaychieu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xoaychieu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://xoaychieu:test_password@127.0.0.1:5432/xoaychieu_test
      COOKIE_SECRET: ci-secret-phai-dai-hon-32-ky-tu-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Cài dependencies
        run: npm ci --prefix server

      - name: Áp dụng migration vào CSDL test
        run: node --experimental-strip-types server/scripts/migrate.ts
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Chạy toàn bộ test
        run: npm test --prefix server

  # ------------------------------------------------------------------ Job 3
  build:
    name: Build giao diện
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cài dependencies
        run: npm ci --prefix web

      - name: Build
        run: npm run build --prefix web

      - name: Lưu bản build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
          if-no-files-found: error
