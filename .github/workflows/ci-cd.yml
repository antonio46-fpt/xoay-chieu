name: CI/CD

# Chạy cho push và pull request vào main.
# Không đụng tới nhánh gh-pages, nên workflow pages-build-deployment
# (do GitHub Pages tạo) vẫn chạy độc lập như trước.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Job 1
  # Kiểm tra chất lượng và bảo mật tĩnh. Mọi bước đều chạy được trên repo
  # công khai, không cần license riêng, không cần Advanced Security.
  checks:
    name: Kiểm tra chất lượng & bảo mật tĩnh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài dependencies (server)
        working-directory: server
        run: npm ci

      - name: Cài dependencies (web)
        working-directory: web
        run: npm ci

      - name: Kiểm tra kiểu (server)
        working-directory: server
        run: npx tsc --noEmit

      - name: Kiểm tra kiểu (web)
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Kiểm tra lỗ hổng thư viện (production, mức high trở lên)
        run: |
          npm audit --omit=dev --audit-level=high --prefix server
          npm audit --omit=dev --audit-level=high --prefix web

      - name: Chặn mẫu mã nguy hiểm (XSS / thực thi mã)
        run: |
          set -e
          echo "Tìm dangerouslySetInnerHTML, eval(, new Function( ..."
          if grep -rn --include='*.ts' --include='*.tsx' -E 'dangerouslySetInnerHTML|new Function\(|[^a-zA-Z_.]eval\(' web/src server/src; then
            echo "::error::Phát hiện mẫu mã có nguy cơ XSS hoặc thực thi mã động."
            exit 1
          fi
          echo "Không có mẫu nguy hiểm."

      - name: Quét bí mật bị lộ
        run: node tools/scan-secrets.mjs

      # Semgrep chạy bằng CLI, không cần token hay license. Ban đầu để chế độ
      # báo cáo (không chặn) để tránh đỏ vì cảnh báo giả trên truy vấn SQL động
      # có chủ đích; sau khi xem kết quả có thể chuyển thành chặn.
      - name: Phân tích bảo mật tĩnh (Semgrep, OWASP Top 10)
        continue-on-error: true
        run: |
          python -m pip install --quiet semgrep
          semgrep scan \
            --config=p/owasp-top-ten \
            --severity=ERROR \
            --exclude=node_modules \
            --exclude=dist \
            server/src web/src

  # ------------------------------------------------------------------ Job 2
  test:
    name: Kiểm thử tự động (đơn vị + bảo mật + tích hợp)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xoaychieu
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: xoaychieu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xoaychieu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://xoaychieu:test_password@127.0.0.1:5432/xoaychieu_test
      DATABASE_URL: postgres://xoaychieu:test_password@127.0.0.1:5432/xoaychieu_test
      COOKIE_SECRET: ci-secret-phai-dai-hon-32-ky-tu-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cài dependencies
        working-directory: server
        run: npm ci

      - name: Áp dụng migration
        working-directory: server
        run: node scripts/migrate.ts

      - name: Chạy toàn bộ test
        working-directory: server
        run: npm test

  # ------------------------------------------------------------------ Job 3
  build:
    name: Build giao diện
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cài dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Lưu bản build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
          if-no-files-found: error
