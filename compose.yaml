name: xoay-chieu

# Arcane server: only WEB_PORT is published; API and Postgres stay private.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xoaychieu
      POSTGRES_USER: xoaychieu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Arcane .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xoaychieu -d xoaychieu"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: https://github.com/antonio46-fpt/xoay-chieu.git#main
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY server/package*.json ./server/
        RUN cd server && npm ci --omit=dev
        COPY server/ ./server/
        COPY db/ ./db/
        WORKDIR /app/server
        EXPOSE 3000
        CMD ["sh", "-c", "node scripts/migrate.ts && exec node src/server.ts"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://xoaychieu:${DB_PASSWORD:?Set DB_PASSWORD in Arcane .env}@db:5432/xoaychieu
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in Arcane .env}
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to public HTTPS origin without trailing slash}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: https://github.com/antonio46-fpt/xoay-chieu.git#main
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS build
        WORKDIR /app/web
        COPY web/package*.json ./
        RUN npm ci
        COPY web/ ./
        RUN npm run build
        FROM nginx:stable-alpine
        COPY --from=build /app/web/dist /usr/share/nginx/html
        RUN printf '%s\n' \
          'map $$http_x_forwarded_proto $$public_scheme {' \
          '    default $$http_x_forwarded_proto;' \
          '    "" $$scheme;' \
          '}' \
          'server {' \
          '    listen 80;' \
          '    server_name _;' \
          '    root /usr/share/nginx/html;' \
          '    index index.html;' \
          '    client_max_body_size 10m;' \
          '    location /api/ {' \
          '        proxy_pass http://api:3000;' \
          '        proxy_set_header Host $$host;' \
          '        proxy_set_header X-Real-IP $$remote_addr;' \
          '        proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' \
          '        proxy_set_header X-Forwarded-Proto $$public_scheme;' \
          '        proxy_read_timeout 60s;' \
          '    }' \
          '    location / {' \
          '        try_files $$uri $$uri/ /index.html;' \
          '    }' \
          '}' > /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
