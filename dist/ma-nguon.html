n  theme: 'dark',\n  newer: true\n});\ndisk.xoaychieu_v2 = external;\nassert.equal(vm.runInContext('persist()', c), false);\nassert.equal(disk.xoaychieu_v2, external);\nassert.equal(vm.runInContext('storageConflict', c), true);\n\n// Retry delays grow but remain bounded, with deterministic test jitter.\nassert.equal(Core.retryDelay(1, () => 0), 5000);\nassert.equal(Core.retryDelay(2, () => 0), 10000);\nassert.equal(Core.retryDelay(20, () => 0), 120000);\nconsole.log(\n  'PASS recovery: preserves pending/ID/raw text, pauses resends, validates backups, rejects duplicates, detects another tab, bounded retry'\n);\n", "tests/ui.cjs": "/** DOM integration tests. jsdom is not a real browser and does not check layout. */\nconst assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst path = require('node:path');\nconst {\n  JSDOM\n} = require('jsdom');\nconst content = require('../src/content.json');\nconst html = fs.readFileSync(path.join(__dirname, '../dist/index.html'), 'utf8');\nconst storageKey = 'xoaychieu_v2';\nconst raw = '\\n  Mình thử nhìn vấn đề từ một cách khác, lắng nghe bạn và chọn điều phù hợp.\\n' +\n  'Mình sẽ giải thích suy nghĩ bằng ví dụ và điều chỉnh khi cách cũ chưa hiệu quả.\\n' +\n  '\u003cscript>window.injected = true\u003c/script>  ';\n\nfunction open(snapshot) {\n  const dom = new JSDOM(html, {\n    url: 'https://xoaychieu.test/',\n    runScripts: 'dangerously',\n    beforeParse(window) {\n      window.confirm = () => true;\n      window.scrollTo = () => {};\n      window.HTMLElement.prototype.scrollIntoView = () => {};\n      window.setInterval = () => 0;\n      if (snapshot) window.localStorage.setItem(storageKey, snapshot);\n    },\n  });\n  const window = dom.window;\n  const $ = id => window.document.getElementById(id);\n  const input = (el, value) => {\n    if (el.type === 'radio') el.checked = true;\n    else el.value = value;\n    el.dispatchEvent(new window.Event('input', {\n      bubbles: true\n    }));\n  };\n  return {\n    dom,\n    window,\n    $,\n    input,\n    get: code => window.eval(code)\n  };\n}\n\nlet app = open();\ntry {\n  const {\n    $,\n    window\n  } = app;\n  $('code').value = 'bi08-t';\n  $('school').value = content.truong_lop[0].truong;\n  $('school').dispatchEvent(new window.Event('change'));\n  $('class').value = content.truong_lop[0].lop[0];\n  $('login').dispatchEvent(new window.Event('submit', {\n    cancelable: true,\n    bubbles: true\n  }));\n  assert.equal(app.get('profile.ma'), 'BI08-T');\n\n  for (const week of content.weeks) {\n    window.document.querySelector(`[data-week=\"${week.tuan}\"]`).click();\n    for (let index = 0; index \u003c week.steps.length; index++) {\n      const step = week.steps[index];\n      assert.equal(app.get('current().step'), index);\n      // A displayed question may not be silently passed while empty.\n      if (step.fields.length) {\n        $('next').click();\n        assert.equal(app.get('current().step'), index);\n      }\n      for (const field of step.fields) {\n        const elements = [...window.document.querySelectorAll(`[data-field=\"${field.key}\"]`)];\n        if (field.kind === 'rating') {\n          assert(!elements.some(el => el.checked), 'Rating has no default selection');\n          app.input(elements[1]);\n        } else {\n          app.input(elements[0], field.options ? field.options[0] : raw);\n        }\n      }\n      if (week.tuan === 1 && step.fields.some(field => field.key === 'thu_lam')) {\n        $('brandHome').click();\n        assert.equal(app.get('tab'), 'home', 'Brand returns home while writing');\n        window.document.querySelector('[data-week=\"1\"]').click();\n        assert.equal($('f_thu_lam').value, raw, 'Brand navigation preserves the current draft');\n        $('prev').click();\n        $('next').click();\n        assert.equal($('f_thu_lam').value, raw, 'Rerender preserves leading newline and spaces');\n        app.get('flushDraft()');\n        const snapshot = window.localStorage.getItem(storageKey);\n        const reloaded = open(snapshot);\n        try {\n          reloaded.window.document.querySelector('[data-week=\"1\"]').click();\n          assert.equal(reloaded.$('f_thu_lam').value, raw, 'Reload resumes raw draft');\n        } finally {\n          reloaded.dom.window.close();\n        }\n      }\n      if (week.tuan === 4 && step.fields.some(field => field.key === 'san_pham')) {\n        const original = app.get('person().history[0].record.san_pham');\n        $('oldProduct').selectedIndex = 1;\n        $('reuse').click();\n        assert.equal($('f_san_pham').value, original);\n        app.input($('f_san_pham'), original + '\\nBản sửa thứ hai của mình.');\n        assert.equal(app.get('person().history[0].record.san_pham'), original,\n          'Original is unchanged');\n      }\n      $('next').click();\n    }\n    assert.equal(app.get('tab'), 'notebook');\n    assert.equal(app.get('person().history.length'), week.tuan);\n    assert.equal(app.get('db.queue.length'), week.tuan);\n    assert.equal(window.injected, undefined, 'User HTML is displayed as text');\n    $('brandHome').querySelector('.logo').dispatchEvent(new window.MouseEvent('click', { bubbles: true, cancelable: true }));\n    assert.equal(app.get('tab'), 'home', 'Clicking the logo returns home');\n  }\n  assert.equal(app.get('person().history[0].record.thu_lam'), raw);\n  assert.equal(app.get('person().history[3].record.ban_goc_id'), app.get(\n    'person().history[0].record.id'));\n  const previousId = app.get('person().history[0].record.id');\n  window.document.querySelector('[data-week=\"1\"]').click();\n  assert.notEqual(app.get('current().id'), previousId, 'Intentional repeat creates a new ID');\n  window.document.querySelector('[data-tab=\"coord\"]').click();\n  $('coordWeek').value = '3';\n  $('coordWeek').dispatchEvent(new window.Event('change'));\n  app.input($('sessionForm').elements.dieu_tot, raw);\n  window.document.querySelector('[data-tab=\"home\"]').click();\n  window.document.querySelector('[data-tab=\"coord\"]').click();\n  assert.equal($('coordWeek').value, '3');\n  assert.equal($('sessionForm').elements.dieu_tot.value, raw, 'Coordinator draft persists');\n  console.log(\n    'PASS DOM: four week flows, required fields, explicit rating, draft reload, raw newlines, HTML escaping, week 4 revision, new attempt ID, coordinator draft, brand navigation'\n    );\n} finally {\n  app.dom.window.close();\n}\n", "tests/run.cjs": "// Run serially so failures name the exact layer; Node.js + dev dependency jsdom.\nconst {\n  spawnSync\n} = require('node:child_process');\nconst path = require('node:path');\nfor (const file of ['test.cjs', 'queue.cjs', 'recovery.cjs', 'ui.cjs', 'scope.cjs', 'fe.cjs', 'preview.cjs']) {\n  const result = spawnSync(process.execPath, [path.join(__dirname, file)], {\n    stdio: 'inherit'\n  });\n  if (result.status !== 0) process.exit(result.status || 1);\n}\nconsole.log(\n  '\\nAll automated checks passed. Real phone layout and a live Google deployment still need verification.'\n  );\n", "tools/source-reader.html": "\u003c!doctype html>\n\u003chtml lang=\"vi\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Mã nguồn Xoay Chiều\u003c/title>\n  \u003cstyle>\n    *{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#253153;font:16px/1.65 system-ui,sans-serif}header{padding:24px max(20px,calc((100vw - 1180px)/2));background:#1e2a5e;color:#fff}h1{font-size:26px;margin:0}header p{margin:6px 0 0;opacity:.85;font-size:14px}main{max-width:1220px;margin:auto;padding:22px 20px}label{font-size:14px;font-weight:650}select,button,a.button{padding:11px 14px;border:1px solid #aab2c5;border-radius:8px;font:inherit;background:#fff;color:#253153}select{width:100%;margin-top:6px}button,a.button{cursor:pointer;font-size:14px;text-decoration:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}.muted{font-size:13px;color:#555f70}pre{tab-size:2;margin:0;background:#fff;border:1px solid #d7dbea;border-radius:12px;overflow:auto;padding:20px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:60vh}footer{padding-top:16px}#feedback{font-size:13px;min-height:22px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d69036;outline-offset:3px}\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader>\u003ch1>Mã nguồn Xoay Chiều\u003c/h1>\u003cp>HTML · CSS · JavaScript thuần · JSON · Google Apps Script\u003c/p>\u003c/header>\n  \u003cmain>\n    \u003clabel for=\"file\">Chọn tệp để đọc hoặc sao chép\u003c/label>\n    \u003cselect id=\"file\">\u003c/select>\n    \u003cdiv class=\"toolbar\">\u003cbutton id=\"copy\">Sao chép nội dung\u003c/button>\u003cbutton id=\"download\">Tải tệp đang mở\u003c/button>\u003ca class=\"button\" href=\"XoayChieu_Source.zip\" download>Tải toàn bộ ZIP\u003c/a>\u003cspan id=\"info\" class=\"muted\">\u003c/span>\u003c/div>\n    \u003cp id=\"feedback\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cpre>\u003ccode id=\"code\">\u003c/code>\u003c/pre>\n    \u003cfooter class=\"muted\">Đọc README.md trước khi triển khai. src/ là mã chỉnh sửa; Index.html và Schema.gs là đầu ra của build.py. Không có PIN, khóa truy cập hay dữ liệu học sinh trong bộ mã này.\u003c/footer>\n  \u003c/main>\n  \u003cscript>\n    const FILES = /*FILES*/;\n    const select = document.getElementById('file');\n    const feedback = document.getElementById('feedback');\n    for (const name of Object.keys(FILES)) {\n      const option = document.createElement('option');\n      option.value = name;\n      option.textContent = name;\n      select.append(option);\n    }\n    function show() {\n      const source = FILES[select.value];\n      document.getElementById('code').textContent = source;\n      document.getElementById('info').textContent = source.split('\\n').length + ' dòng';\n      feedback.textContent = '';\n    }\n    select.onchange = show;\n    document.getElementById('copy').onclick = async () => {\n      try {\n        await navigator.clipboard.writeText(FILES[select.value]);\n        feedback.textContent = 'Đã sao chép ' + select.value;\n      } catch {\n        const selection = getSelection();\n        const range = document.createRange();\n        range.selectNodeContents(document.getElementById('code'));\n        selection.removeAllRanges(); selection.addRange(range);\n        feedback.textContent = 'Trình duyệt không cho tự sao chép. Nội dung đã được chọn; nhấn Ctrl+C hoặc Cmd+C.';\n      }\n    };\n    document.getElementById('download').onclick = () => {\n      const url = URL.createObjectURL(new Blob([FILES[select.value]], {type:'text/plain;charset=utf-8'}));\n      const link = document.createElement('a'); link.href=url; link.download=select.value.split('/').pop(); link.click();\n      setTimeout(() => URL.revokeObjectURL(url), 1000);\n    };\n    show();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n", ".github/ISSUE_TEMPLATE/backend_task.yml": "name: Backend task\ndescription: Yêu cầu hoặc kiểm chứng BE theo scope Xoay Chiều\ntitle: \"feat(be): \"\nbody:\n  - type: textarea\n    id: context\n    attributes:\n      label: Bối cảnh và hiện trạng\n      description: Mô tả vấn đề và phần đã được cài đặt/kiểm thử.\n    validations:\n      required: true\n  - type: textarea\n    id: scope\n    attributes:\n      label: Phạm vi và API\n      description: RPC, payload, response, quyền truy cập; chỉ dùng ví dụ giả.\n    validations:\n      required: true\n  - type: textarea\n    id: acceptance\n    attributes:\n      label: Tiêu chí nghiệm thu\n      description: Checklist hành vi quan sát được, gồm lỗi và quyền dữ liệu.\n    validations:\n      required: true\n  - type: textarea\n    id: validation\n    attributes:\n      label: Cách kiểm thử\n      description: Nêu rõ test mock hay Apps Script/Sheet thử, không dùng dữ liệu thật.\n    validations:\n      required: true\n  - type: checkboxes\n    id: data\n    attributes:\n      label: Quyền dữ liệu\n      options:\n        - label: Chỉ dùng dữ liệu giả và Sheet thử; không đưa credential hay dữ liệu thật vào issue.\n          required: true\n", "docs/issues/README.md": "# Backend issue drafts\n\nTrạng thái: **chưa đăng lên GitHub**. Git push hoạt động nhưng GitHub API trả `Forbidden`. Đề xuất mở `api.github.com` đã được lưu trong cấu hình môi trường; cần áp dụng và kiểm tra lại quyền API. Không đưa credential vào các tệp này.\n\n| Tiêu đề issue theo convention | Nội dung |\n|---|---|\n| `feat(be): support approved class rosters in progress reports` | [Roster lớp](be-class-roster.md) |\n| `test(be): verify class-scoped teacher permissions on Apps Script` | [Quyền tiến độ](be-progress-permissions.md) |\n| `test(be): verify redaction and idempotent submissions on test Sheets` | [An toàn và chống trùng](be-submission-integrity.md) |\n| `test(be): measure Apps Script capacity for the planned cohort` | [Tải dự kiến](be-capacity.md) |\n\nSau khi API hoạt động, kiểm tra issue đã có để tránh trùng trước khi tạo. Ví dụ:\n\n```bash\ngh issue create --repo antonio46-fpt/xoay-chieu \\\n  --title 'feat(be): support approved class rosters in progress reports' \\\n  --body-file docs/issues/be-class-roster.md\n```\n\nKhông đánh dấu các bản nháp là issue đã đăng khi chưa có URL/số issue từ GitHub. Không cần viết lại backend hiện có chỉ để đóng issue kiểm chứng; ghi rõ lỗi thật nếu kiểm thử tích hợp phát hiện vấn đề.\n", "docs/issues/be-class-roster.md": "## Bối cảnh và hiện trạng\n\n`getClassProgress` hiện chỉ trả mã đã có bài được máy chủ xác nhận. FE đã ghi rõ giới hạn này. Chưa thể liệt kê mọi học sinh chưa nộp, vì chưa có danh sách mã được cấp theo bốn lớp.\n\n## Phạm vi và API\n\nBổ sung nguồn danh sách mã được chủ dự án duyệt, gắn với đúng trường/lớp, không có họ tên, số điện thoại hoặc ảnh. Duy trì RPC `getClassProgress({token, truong, lop})`, response `{ok:true, students:[{ma, weeks:[1,2]}]}`. Mã hợp lệ chưa nộp phải có `weeks:[]`. Thiết kế nguồn roster riêng ở máy chủ; không nhúng danh sách các lớp vào HTML phát cho học sinh. Khi chưa cấu hình roster, tiếp tục thông báo chế độ chỉ liệt kê mã có bài; không âm thầm suy luận các mã còn lại.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Có đặc tả nguồn roster và cách chủ dự án nhập/cập nhật bằng dữ liệu giả.\n- [ ] Chặn mã trùng trong cùng trường/lớp; cho phép cùng mã ở lớp khác nếu đúng chính sách.\n- [ ] Trả đủ roster đúng lớp, kể cả `weeks:[]`, không lộ mã lớp khác.\n- [ ] Chỉ trả `ma`, `weeks`; không thêm nội dung, tự đánh giá, thời lượng hay thông tin nhận diện.\n- [ ] Có đường chuyển tiếp rõ ràng cho dữ liệu đã ghi và lớp chưa cấu hình roster.\n- [ ] Nhóm nghiên cứu duyệt danh sách thực tế ngoài Git trước khi sử dụng thật.\n\n## Kiểm thử\n\nFixture hai trường, bốn lớp; có mã chưa nộp, nộp nhiều lượt, trùng mã khác lớp, roster sai cấu trúc. Test cả quyền giáo viên, PIN sai và đổi lớp. Kiểm thử tích hợp trên Sheet thử; không truy cập Sheet thật.\n", "docs/issues/be-progress-permissions.md": "## Bối cảnh và hiện trạng\n\nĐã có `loginTeacher`, `getClassProgress`, `logoutTeacher`, `TEACHER_PINS`, phiên teacher/coord tách nhau và test mock. FE đã nối RPC. Chưa xác minh trên deployment Google Apps Script và quyền Google thật của Sheet thử. Issue này kiểm chứng tích hợp, không yêu cầu viết lại API đã có.\n\n## Phạm vi và API\n\n- `loginTeacher({truong,lop,pin})` → `{ok,token,expires}` hoặc `{ok:false,code,error}`.\n- `getClassProgress({token,truong,lop})` → `{ok:true,students:[{ma,weeks}]}`.\n- `logoutTeacher(token)` → `{ok:true}` và thu hồi phiên.\n- `loginCoordinator`/`submitRecord` giữ quyền độc lập; không thêm API đọc bài riêng tư.\n\n## Tiêu chí nghiệm thu\n\n- [ ] PIN giáo viên đúng/sai và giới hạn thử PIN hoạt động trên deployment thử.\n- [ ] Token sai, hết hạn, bị thu hồi, token điều phối và yêu cầu đổi lớp đều bị từ chối.\n- [ ] Giáo viên chỉ nhận mã + tuần của đúng lớp, không nhận bài, sản phẩm, mức tự đánh giá hoặc metadata ngoài contract.\n- [ ] Token giáo viên không nộp được phiếu điều phối.\n- [ ] GVCN không có quyền mở Sheet nguồn; nhóm nghiên cứu/GV hướng dẫn chỉ có quyền do chủ dự án cấp.\n- [ ] Ghi bằng chứng request/response đã loại credential và chỉ chứa mã thử.\n\n## Kiểm thử\n\nTạo Sheet/deployment thử, cấu hình PIN thử bằng Script Properties ngoài Git, dùng trình duyệt riêng cho từng vai trò. Test luồng đăng nhập/làm mới/hết phiên/đăng xuất. Không kiểm thử với Sheet chính thức hoặc dữ liệu học sinh thật.\n", "docs/issues/be-submission-integrity.md": "## Bối cảnh và hiện trạng\n\nClient đã che ô có từ khóa trước RPC; máy chủ áp dụng lại trước ghi RAW. Đã có mock tests cho bốn tuần, cột dẫn xuất, retry và xung đột ID. Cần kiểm chứng trên Sheets API/LockService thật của deployment thử, nhất là mất ACK và nộp đồng thời.\n\n## Phạm vi và API\n\n`submitRecord({record,token})` giữ `{ok,id,duplicate}` hoặc `{ok:false,code,error}`. Cùng ID + cùng bản đã che xác nhận lại; cùng ID + nội dung khác trả `ID_CONFLICT`; ID mới thêm dòng. Không sửa bản ghi cũ hay tự đổi ID để né xung đột.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Request từ FE không chứa nguyên văn ô nhạy cảm; local history vẫn có bản gốc.\n- [ ] Gọi máy chủ trực tiếp bỏ qua client vẫn không ghi nguyên văn ô có từ khóa.\n- [ ] Tuần 3 giữ tiền tố, tuần 4 giữ cột tổng hợp nhưng không lộ lại nội dung đã che.\n- [ ] RAW không thực thi chuỗi bắt đầu bằng `=`, `+`, `-`, `@` thành công thức.\n- [ ] Retry sau mất ACK, reload và khôi phục bản sao tạo đúng một dòng cho cùng ID.\n- [ ] Hai request cùng ID đồng thời không tạo hai dòng; nội dung khác bị từ chối.\n- [ ] Có hướng dẫn xử lý gói 2.1 đã ghi nguyên văn nhưng chưa nhận ACK trước nâng cấp; không tự sửa Sheet hoặc đổi ID.\n\n## Kiểm thử\n\nChỉ dùng mã và nội dung giả trên Sheet thử. Mô phỏng mất ACK, tắt/bật mạng, gửi đồng thời, lỗi quota và BUSY. Không ghi request nguyên văn hoặc token vào log. Đính kèm kết quả đã loại credential.\n", "docs/issues/be-capacity.md": "## Bối cảnh và hiện trạng\n\nQuy mô dự kiến khoảng 150 học sinh ở hai trường, bốn lớp. Hiện chỉ có kiểm thử chức năng và mock, chưa có số đo tải đồng thời với Apps Script/Sheets. Không coi quy mô dự kiến là cam kết năng lực hệ thống.\n\n## Phạm vi\n\nĐo `submitRecord` trên deployment/Sheet thử với dữ liệu giả, tăng tải theo bước do chủ dự án cho phép. Kiểm tra LockService, quota, backoff client và thời gian hàng đợi được xử lý. Không thực hiện stress test trên deployment chính thức.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Có kế hoạch tải và mức dừng trước khi chạy; ghi rõ số người dùng/request đồng thời.\n- [ ] Báo cáo tỷ lệ ACK, BUSY, lỗi quota/timeout, độ trễ p50/p95 và thời gian xử lý hết hàng đợi.\n- [ ] Đối chiếu ID gửi/ID Sheet để chứng minh không mất bài hoặc ghi trùng.\n- [ ] Kiểm tra retry sau lỗi vẫn giữ ID và nội dung đã che.\n- [ ] Nếu chưa đạt tải dự kiến, ghi giới hạn và phương án điều phối buổi học; không báo sẵn sàng vô điều kiện.\n\n## Kiểm thử\n\nChạy tải bằng mã giả, chỉ trên Sheet thử, trong giới hạn Google và mức được chủ dự án phê duyệt. Xóa dữ liệu thử chỉ theo quy trình của chủ dự án; không truy cập Sheet chính thức sau khi chạy thật.\n"};
    const select = document.getElementById('file');
    const feedback = document.getElementById('feedback');
    for (const name of Object.keys(FILES)) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.append(option);
    }
    function show() {
      const source = FILES[select.value];
      document.getElementById('code').textContent = source;
      document.getElementById('info').textContent = source.split('\n').length + ' dòng';
      feedback.textContent = '';
    }
    select.onchange = show;
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(FILES[select.value]);
        feedback.textContent = 'Đã sao chép ' + select.value;
      } catch {
        const selection = getSelection();
        const range = document.createRange();
        range.selectNodeContents(document.getElementById('code'));
        selection.removeAllRanges(); selection.addRange(range);
        feedback.textContent = 'Trình duyệt không cho tự sao chép. Nội dung đã được chọn; nhấn Ctrl+C hoặc Cmd+C.';
      }
    };
    document.getElementById('download').onclick = () => {
      const url = URL.createObjectURL(new Blob([FILES[select.value]], {type:'text/plain;charset=utf-8'}));
      const link = document.createElement('a'); link.href=url; link.download=select.value.split('/').pop(); link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    show();
  </script>
</body>
</html>
