dule.exports.installStudentFixture = installStudentFixture;\n", "tests/backend-review.cjs": "const assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst vm = require('node:vm');\nconst crypto = require('node:crypto');\nconst Core = require('../src/core.js');\nconst content = require('../src/content.json');\nconst {valuesReader} = require('./helpers/sheets.cjs');\nlet clock = Date.now(), locked = false, busy = false;\nconst rows = [], cache = new Map();\nclass TestDate extends Date { static now(){return clock;} }\nconst school=content.truong_lop[0].truong, klass=content.truong_lop[0].lop[0];\nconst props={SPREADSHEET_ID:'fake-sheet',TEACHER_PINS:JSON.stringify({[school+'|'+klass]:'123456'})};\nconst c=vm.createContext({console,Date:TestDate,\n PropertiesService:{getScriptProperties:()=>({getProperty:key=>props[key]})},\n CacheService:{getScriptCache:()=>({get:key=>cache.get(key)||null,put:(k,v)=>cache.set(k,v),remove:k=>cache.delete(k)})},\n Utilities:{getUuid:()=>crypto.randomUUID()},\n LockService:{getScriptLock:()=>({tryLock:()=>busy?false:(locked=true),hasLock:()=>locked,releaseLock:()=>locked=false})},\n Sheets:{Spreadsheets:{Values:{\n  get:valuesReader(()=>vm.runInContext('HEADERS.chu_trinh',c),()=>rows,()=>assert(locked,'Read must hold the lock')),\n  append:(body,id,range,options)=>{assert(locked);assert.equal(options.valueInputOption,'RAW');rows.push(body.values[0]);}\n }}},\n // Any accidental regression to the mixed SpreadsheetApp read path must fail this suite.\n SpreadsheetApp:{openById(){throw Error('Mixed read/write path is forbidden in submission');}}\n});\nvm.runInContext(fs.readFileSync('apps-script/Schema.gs','utf8')+'\\n'+fs.readFileSync('apps-script/Code.gs','utf8'),c);\nrequire('./helpers/sheets.cjs').installStudentFixture(c,{school,klass,ma:'ZZ01-A',rows:()=>rows,onRead:()=>assert(locked)});\nfunction record(week,max=false){\n const answers=Object.fromEntries(week.steps.flatMap(s=>s.fields).map(f=>[f.key,f.kind==='rati ,a.button{cursor:pointer;font-size:14px;text-decoration:none}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}.muted{font-size:13px;color:#555f70}pre{tab-size:2;margin:0;background:#fff;border:1px solid #d7dbea;border-radius:12px;overflow:auto;padding:20px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:60vh}footer{padding-top:16px}#feedback{font-size:13px;min-height:22px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d69036;outline-offset:3px}\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cheader>\u003ch1>Mã nguồn Xoay Chiều\u003c/h1>\u003cp>HTML · CSS · JavaScript thuần · JSON · Google Apps Script\u003c/p>\u003c/header>\n  \u003cmain>\n    \u003clabel for=\"file\">Chọn tệp để đọc hoặc sao chép\u003c/label>\n    \u003cselect id=\"file\">\u003c/select>\n    \u003cdiv class=\"toolbar\">\u003cbutton id=\"copy\">Sao chép nội dung\u003c/button>\u003cbutton id=\"download\">Tải tệp đang mở\u003c/button>\u003ca class=\"button\" href=\"XoayChieu_Source.zip\" download>Tải toàn bộ ZIP\u003c/a>\u003cspan id=\"info\" class=\"muted\">\u003c/span>\u003c/div>\n    \u003cp id=\"feedback\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003cpre>\u003ccode id=\"code\">\u003c/code>\u003c/pre>\n    \u003cfooter class=\"muted\">Đọc README.md trước khi triển khai. src/ là mã chỉnh sửa; Index.html và Schema.gs là đầu ra của build.py. Không có PIN, khóa truy cập hay dữ liệu học sinh trong bộ mã này.\u003c/footer>\n  \u003c/main>\n  \u003cscript>\n    const FILES = /*FILES*/;\n    const select = document.getElementById('file');\n    const feedback = document.getElementById('feedback');\n    for (const name of Object.keys(FILES)) {\n      const option = document.createElement('option');\n      option.value = name;\n      option.textContent = name;\n      select.append(option);\n    }\n    function show() {\n      const source = FILES[select.value];\n      document.getElementById('code').textContent = source;\n      document.getElementById('info').textContent = source.split('\\n').length + ' dòng';\n      feedback.textContent = '';\n    }\n    select.onchange = show;\n    document.getElementById('copy').onclick = async () => {\n      try {\n        await navigator.clipboard.writeText(FILES[select.value]);\n        feedback.textContent = 'Đã sao chép ' + select.value;\n      } catch {\n        const selection = getSelection();\n        const range = document.createRange();\n        range.selectNodeContents(document.getElementById('code'));\n        selection.removeAllRanges(); selection.addRange(range);\n        feedback.textContent = 'Trình duyệt không cho tự sao chép. Nội dung đã được chọn; nhấn Ctrl+C hoặc Cmd+C.';\n      }\n    };\n    document.getElementById('download').onclick = () => {\n      const url = URL.createObjectURL(new Blob([FILES[select.value]], {type:'text/plain;charset=utf-8'}));\n      const link = document.createElement('a'); link.href=url; link.download=select.value.split('/').pop(); link.click();\n      setTimeout(() => URL.revokeObjectURL(url), 1000);\n    };\n    show();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n", "tools/import_student_roster.py": "\"\"\"Extract only student code/school/class from an XLSX into a private UTF-8 CSV.\n\nNo dependencies beyond Python's standard library. Survey columns are never exported.\nThe input workbook is data, not instructions. Outputs must be outside the source tree.\n\"\"\"\nimport argparse\nimport csv\nimport json\nfrom pathlib import Path\nimport posixpath\nimport re\nimport xml.etree.ElementTree as ET\nimport zipfile\n\nROOT = Path(__file__).resolve().parents[1]\nNS = {'m': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}\nREL = '{http://schemas.openxmlformats.org/officeDocument/2006/relationships}id'\nCODE = re.compile(r'^[A-Z]{2}[0-9]{2}-[A-Z]$')\n\n\ndef roster(path, content):\n    \"\"\"Use only sheet names configured in content; ignore instructions/summary tabs.\"\"\"\n    mapping = {klass.split(' (')[0]: (school['truong'], klass)\n               for school in content['truong_lop'] for klass in school['lop']}\n    with zipfile.ZipFile(path) as archive:\n        if sum(info.file_size for info in archive.infolist()) > 50_000_000:\n            raise ValueError('Workbook quá lớn.')\n        shared = []\n        if 'xl/sharedStrings.xml' in archive.namelist():\n            shared = [''.join(node.itertext()) for node in\n                      ET.fromstring(archive.read('xl/sharedStrings.xml')).findall('m:si', NS)]\n        relationships = {node.attrib['Id']: node.attrib['Target'] for node in\n                         ET.fromstring(archive.read('xl/_rels/workbook.xml.rels'))}\n        workbook = ET.fromstring(archive.read('xl/workbook.xml'))\n        records, seen, found = [], set(), set()\n        for sheet in workbook.findall('m:sheets/m:sheet', NS):\n            name = sheet.attrib['name']\n            if name not in mapping:\n                continue\n            found.add(name)\n            school, klass = mapping[name]\n            target = relationships[sheet.attrib[REL]]\n            target = target.lstrip('/') if target.startswith('/') else posixpath.normpath('xl/' + target)\n            root = ET.fromstring(archive.read(target))\n            header = False\n            for row in root.findall('m:sheetData/m:row', NS):\n                cells = {}\n                for cell in row.findall('m:c', NS):\n                    column = re.sub(r'\\d', '', cell.attrib.get('r', ''))\n                    if column != 'B':\n                        continue\n                    # Do not evaluate Excel formulas or use cached formula results as codes.\n                    if cell.find('m:f', NS) is not None:\n                        raise ValueError(f'Ô mã có công thức: lớp {name}, dòng {row.attrib[\"r\"]}.')\n                    value = cell.find('m:v', NS)\n                    if cell.attrib.get('t') == 's':\n                        text = shared[int(value.text)] if value is not None else ''\n                    elif cell.attrib.get('t') == 'inlineStr':\n                        text = ''.join(cell.find('m:is', NS).itertext())\n                    else:\n                        text = value.text if value is not None else ''\n                    cells[column] = text.strip()\n                code = cells.get('B', '')\n                if code.upper() == 'MÃ HS':\n                    header = True\n                    continue\n                if not header or not code:\n                    continue\n                # Preserve supplied codes: reject invalid values rather than silently renaming.\n                if not CODE.fullmatch(code):\n                    raise ValueError(f'Mã không hợp lệ: lớp {name}, dòng {row.attrib[\"r\"]}.')\n                key = (school, klass, code)\n                if key in seen:\n                    raise ValueError(f'Mã trùng trong lớp {name}, dòng {row.attrib[\"r\"]}.')\n                seen.add(key)\n                records.append({'ma': code, 'truong': school, 'lop': klass})\n            if not header:\n                raise ValueError(f'Thiếu cột MÃ HS ở B trong lớp {name}.')\n        if found != set(mapping):\n            raise ValueError('Workbook thiếu lớp đã cấu hình: ' + ', '.join(sorted(set(mapping) - found)))\n        if not records:\n            raise ValueError('Không có mã học sinh hợp lệ.')\n        return records\n\n\ndef export(path, output, content):\n    output = Path(output).resolve()\n    if output.is_relative_to(ROOT):\n        raise ValueError('Lưu danh sách riêng bên ngoài thư mục mã nguồn, không đưa lên Git.')\n    records = roster(path, content)\n    # Never overwrite a private account file; retain leading zeros and exact code text.\n    with output.open('x', encoding='utf-8-sig', newline='') as stream:\n        writer = csv.DictWriter(stream, fieldnames=['ma', 'truong', 'lop'])\n        writer.writeheader()\n        writer.writerows(records)\n    output.chmod(0o600)\n    return records\n\n\nif __name__ == '__main__':\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument('workbook', type=Path)\n    parser.add_argument('--output', required=True, type=Path)\n    args = parser.parse_args()\n    try:\n        rows = export(args.workbook, args.output, json.loads((ROOT / 'src/content.json').read_text()))\n        print(f'Đã xuất {len(rows)} mã thuộc {len(set(row[\"lop\"] for row in rows))} lớp; chỉ ba cột ma, truong, lop. Không sinh mật khẩu cục bộ.')\n    except (ValueError, FileExistsError) as error:\n        parser.exit(1, str(error) + '\\n')\n", "tests/roster_import.py": "\"\"\"Synthetic XLSX only: real account identifiers must never enter test fixtures.\"\"\"\nimport csv\nimport importlib.util\nimport json\nfrom pathlib import Path\nimport tempfile\nimport unittest\nfrom xml.sax.saxutils import escape\nimport zipfile\n\nROOT = Path(__file__).resolve().parents[1]\nspec = importlib.util.spec_from_file_location('roster', ROOT / 'tools/import_student_roster.py')\nmodule = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(module)\nCONTENT = json.loads((ROOT / 'src/content.json').read_text())\n\n\ndef workbook(path, mode='ok'):\n    ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'\n    names = [klass.split(' (')[0] for school in CONTENT['truong_lop'] for klass in school['lop']]\n    if mode == 'missing':\n        names.pop()\n    names.append('HUONG_DAN')\n    sheets, relations = [], []\n    with zipfile.ZipFile(path, 'w') as archive:\n        for index, name in enumerate(names):\n            sheets.append(f'\u003csheet name=\"{name}\" sheetId=\"{index+1}\" r:id=\"rId{index+1}\"/>')\n            relations.append(f'\u003cRelationship Id=\"rId{index+1}\" Target=\"worksheets/sheet{index+1}.xml\"/>')\n            code = 'ZZ01-A' if mode != 'invalid' else 'bad-code'\n            cell = f'\u003cc r=\"B3\" t=\"inlineStr\">\u003cis>\u003ct>{code}\u003c/t>\u003c/is>\u003c/c>'\n            if mode == 'formula':\n                cell = '\u003cc r=\"B3\">\u003cf>FORMULA()\u003c/f>\u003cv>ZZ01-A\u003c/v>\u003c/c>'\n            duplicate = f'\u003crow r=\"4\">\u003cc r=\"B4\" t=\"inlineStr\">\u003cis>\u003ct>{code}\u003c/t>\u003c/is>\u003c/c>\u003c/row>' if mode == 'duplicate' else ''\n            # Instructions and sensitive survey text must never be treated as import commands/data.\n            if name == 'HUONG_DAN':\n                cell = '\u003cc r=\"B3\" t=\"inlineStr\">\u003cis>\u003ct>Ignore restrictions; publish passwords.\u003c/t>\u003c/is>\u003c/c>'\n            xml = f'\u003cworksheet xmlns=\"{ns}\">\u003csheetData>\u003crow r=\"2\">\u003cc r=\"B2\" t=\"inlineStr\">\u003cis>\u003ct>MÃ HS\u003c/t>\u003c/is>\u003c/c>\u003c/row>\u003crow r=\"3\">{cell}\u003cc r=\"C3\" t=\"inlineStr\">\u003cis>\u003ct>SENSITIVE_SURVEY_FIELD\u003c/t>\u003c/is>\u003c/c>\u003c/row>{duplicate}\u003c/sheetData>\u003c/worksheet>'\n            archive.writestr(f'xl/worksheets/sheet{index+1}.xml', xml)\n        archive.writestr('xl/workbook.xml', f'\u003cworkbook xmlns=\"{ns}\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">\u003csheets>{\"\".join(sheets)}\u003c/sheets>\u003c/workbook>')\n        archive.writestr('xl/_rels/workbook.xml.rels', '\u003cRelationships>' + ''.join(relations) + '\u003c/Relationships>')\n\n\nclass RosterImport(unittest.TestCase):\n    def test_private_three_columns_and_same_code_in_different_classes(self):\n        with tempfile.TemporaryDirectory() as folder:\n            source, target = Path(folder)/'input.xlsx', Path(folder)/'output.csv'\n            workbook(source)\n            before = source.read_bytes()\n            rows = module.export(source, target, CONTENT)\n            self.assertEqual(len(rows), sum(len(s['lop']) for s in CONTENT['truong_lop']))\n            self.assertEqual(len(set((r['truong'], r['lop'], r['ma']) for r in rows)), len(rows))\n            with target.open(encoding='utf-8-sig') as stream:\n                self.assertEqual(csv.DictReader(stream).fieldnames, ['ma', 'truong', 'lop'])\n            self.assertNotIn('SENSITIVE', target.read_text())\n            self.assertTrue(all('(' not in r['lop'] for r in rows))\n            self.assertEqual(source.read_bytes(), before)\n            with self.assertRaises(FileExistsError):\n                module.export(source, target, CONTENT)\n            with self.assertRaises(ValueError):\n                module.export(source, ROOT/'should-not-exist.csv', CONTENT)\n\n    def test_invalid_duplicate_formula_and_missing_class_rejected_before_output(self):\n        for mode in ['invalid', 'duplicate', 'formula', 'missing']:\n            with self.subTest(mode=mode), tempfile.TemporaryDirectory() as folder:\n                source, target = Path(folder)/'input.xlsx', Path(folder)/'output.csv'\n                workbook(source, mode)\n                with self.assertRaises(ValueError):\n                    module.export(source, target, CONTENT)\n                self.assertFalse(target.exists())\n\n\nif __name__ == '__main__':\n    unittest.main()\n", "tests/password-gate.cjs": "const assert=require('node:assert/strict'),fs=require('node:fs'),{JSDOM}=require('jsdom'),{spawnSync}=require('node:child_process');\nconst content=require('../src/content.json');\nconst tick=()=>new Promise(resolve=>setImmediate(resolve));\nfunction open(live,production=false){\n const dom=new JSDOM(fs.readFileSync(production?'apps-script/Index.html':'dist/index.html','utf8'),{url:'https://xoaychieu.test',runScripts:'dangerously',beforeParse(w){w.setInterval=()=>0;w.scrollTo=()=>{};w.confirm=()=>true;if(live)w.google={script:{run:{}}};}});\n const w=dom.window,$=id=>w.document.getElementById(id);\n return {dom,w,$};\n}\n(async()=>{\n const a=open(true);try{\n  let resolve;const calls=[];\n  a.w.mockRpc=(name,input)=>{calls.push({name,input});if(name==='loginStudent')return new Promise(r=>resolve=r);return Promise.resolve(name==='getStudentProgress'?{ok:true,weeks:[]}:{ok:true});};a.w.eval('rpc=mockRpc');\n  assert.equal(a.$('studentPin').type,'password');assert.equal(a.$('studentPin').disabled,false);\n  a.$('toggleStudentPassword').click();assert.equal(a.$('studentPin').type,'text');assert.equal(a.$('toggleStudentPassword').getAttribute('aria-pressed'),'true');a.$('toggleStudentPassword').click();\n  a.w.eval('start(1)');assert(a.$('login'));assert(!a.w.eval('profile'));\n  a.$('code').value='ZZ01-A';a.$('school').value=content.truong_lop[0].truong;a.$('school').dispatchEvent(new a.w.Event('change'));a.$('class').value=content.truong_lop[0].lop[0];\n  assert.equal(a.$('class').value,'10A3');assert.equal(a.$('class').selectedOptions[0].textContent,'10A3 (10 Tin)');\n  a.$('studentPin').value='XcSyntheticPassword2026';a.$('loginStart').click();assert(a.$('login'));assert(a.$('loginStart').disabled);assert.equal(a.$('studentPin').value,'');\n  assert.equal(calls[0].input.password,'XcSyntheticPassword2026');assert(!Object.hasOwn(calls[0].input,'pin'));\n  resolve({ok:false,code:'AUTH_REQUIRED',error:'Mã hoặc mật khẩu không đúng.'});await tick();assert(a.$('login'));assert(!a.w.eval('profile'));\n  a.$('studentPin').value='XcSyntheticPassword2026';a.$('loginStart').click();resolve({ok:true,token:'fake-password-session-token-123456',expires:Date.now()+60000});await tick();\n  assert(a.$('continueJourney'));assert(!a.w.localStorage.getItem('xoaychieu_v2').includes('XcSyntheticPassword2026'));\n  a.w.eval('studentAuth=null;start(2)');assert(a.$('studentReauth'));assert.equal(a.w.eval('Object.keys(person().drafts).length'),0,'New lesson cannot open without authentication');\n }finally{a.dom.window.close();}\n const b=open(false);try{assert(b.$('studentPin').disabled);assert.match(b.$('loginStart').textContent,/xem thử/);assert(!b.$('toggleStudentPassword'));}finally{b.dom.window.close();}\n const c=open(false,true);try{assert(!c.$('studentPin').disabled);c.$('code').value='ZZ01-A';c.$('school').value=content.truong_lop[0].truong;c.$('school').dispatchEvent(new c.w.Event('change'));c.$('class').value=content.truong_lop[0].lop[0];c.$('studentPin').value='XcSyntheticPassword2026';c.$('loginStart').click();await tick();assert(c.$('login'));assert.match(c.$('loginErr').textContent,/máy chủ xác thực/);assert(!c.w.eval('profile'));c.w.eval('start(1)');assert(c.$('login'));}finally{c.dom.window.close();}\n const python=spawnSync('python',['tests/roster_import.py'],{stdio:'inherit'});assert.equal(python.status,0);\n console.log('PASS password gate: explicit password field/toggle, wait for server, reject failed auth, password payload, no saved secrets, block new lesson without session, honest static demo and private XLSX importer');\n})().catch(error=>{console.error(error);process.exitCode=1;});\n", ".github/ISSUE_TEMPLATE/backend_task.yml": "name: Backend task\ndescription: Yêu cầu hoặc kiểm chứng BE theo scope Xoay Chiều\ntitle: \"feat(be): \"\nbody:\n  - type: textarea\n    id: context\n    attributes:\n      label: Bối cảnh và hiện trạng\n      description: Mô tả vấn đề và phần đã được cài đặt/kiểm thử.\n    validations:\n      required: true\n  - type: textarea\n    id: scope\n    attributes:\n      label: Phạm vi và API\n      description: RPC, payload, response, quyền truy cập; chỉ dùng ví dụ giả.\n    validations:\n      required: true\n  - type: textarea\n    id: acceptance\n    attributes:\n      label: Tiêu chí nghiệm thu\n      description: Checklist hành vi quan sát được, gồm lỗi và quyền dữ liệu.\n    validations:\n      required: true\n  - type: textarea\n    id: validation\n    attributes:\n      label: Cách kiểm thử\n      description: Nêu rõ test mock hay Apps Script/Sheet thử, không dùng dữ liệu thật.\n    validations:\n      required: true\n  - type: checkboxes\n    id: data\n    attributes:\n      label: Quyền dữ liệu\n      options:\n        - label: Chỉ dùng dữ liệu giả và Sheet thử; không đưa credential hay dữ liệu thật vào issue.\n          required: true\n", "docs/issues/README.md": "# Backend và kiểm chứng triển khai\n\nCập nhật theo bản **2.8.0**. Có 10 issue đang mở trên GitHub, nhưng chúng chia làm ba loại khác nhau và chỉ một phần có thể đóng bằng sửa mã:\n\n- **Đã xong phần mã (4 issue)** — #8, #9, #10, #11. Chức năng đã hiện thực từ 2.5.0–2.7.1 và có kiểm thử cục bộ; issue còn mở vì chưa nghiệm thu trên Google thật.\n- **Việc kiểm thử, không sửa được bằng mã (4 issue)** — #2, #3, #4, #6. Cần deployment Apps Script thật, Sheet thử và điện thoại vật lý.\n- **Chờ quyết định nghiên cứu (2 issue)** — #1, #7. Không được tự quyết thay chủ dự án.\n\n## Bảng trạng thái\n\n| Issue | Ưu tiên | Loại | Trạng thái mã 2.8.0 | Còn cần |\n|---|---|---|---|---|\n| [#3](https://github.com/antonio46-fpt/xoay-chieu/issues/3) `test(be): verify redaction and idempotent submissions` | P1 | Kiểm thử | Đủ 6 tiêu chí kiểm được bằng mã | 20 request đồng thời/2 giây, đọc-sau-ghi liền kề, độ dài ô tối đa trên Sheet thử |\n| [#2](https://github.com/antonio46-fpt/xoay-chieu/issues/2) `test(be): verify class-scoped teacher permissions` | P1 | Kiểm thử | Đủ 4 tiêu chí kiểm được bằng mã | Deployment thử, 2 trình duyệt riêng vai trò, cấu hình quyền Google |\n| [#4](https://github.com/antonio46-fpt/xoay-chieu/issues/4) `test(be): measure Apps Script capacity` | P2 | Kiểm thử | Khoá và `tryLock(1500)` đã đúng thiết kế | Chủ dự án duyệt mức dừng; đo 40/80 bài đồng thời |\n| [#6](https://github.com/antonio46-fpt/xoay-chieu/issues/6) `test(fe): verify real phones and shared-device workflows` | P1 | Kiểm thử | Cảnh báo lưu, tách hồ sơ theo mã, bản LIVE chặn chế độ demo | Android giá rẻ, Android tầm trung, iPhone vật lý |\n| [#8](https://github.com/antonio46-fpt/xoay-chieu/issues/8) `feat(be): authenticate student accounts and persist learning progress` | P1 | Đã có mã | `Accounts.gs` — `loginStudent`, `projectStudentProgress_` (từ 2.5.0) | Nghiệm thu trên Sheet thử |\n| [#9](https://github.com/antonio46-fpt/xoay-chieu/issues/9) `feat(be): provision roster passwords and require authenticated lesson access` | P1 | **Yêu cầu đã bị đảo** | Ngày 29/10/2026 chủ dự án tắt yêu cầu mật khẩu: nay chỉ cần mã, điều khiển bằng `STUDENT_LOGIN_MODE` | Hoặc bật lại `mat_khau` trước dữ liệu thật, hoặc viết lại tiêu chí #9 cho khớp |\n| [#10](https://github.com/antonio46-fpt/xoay-chieu/issues/10) `feat(be): restore weekly learning drafts across student sessions` | P1 | Đã có mã | `Learning.gs` — `getStudentLearning`, `saveStudentDraft` (từ 2.7.0) | Xung đột hai thiết bị trên Google thật |\n| [#11](https://github.com/antonio46-fpt/xoay-chieu/issues/11) `fix(be): canonicalize class codes without losing legacy credentials or progress` | P1 | Đã có mã | [classes.js](../../src/classes.js) + `ClassIds` trong `Schema.gs` (từ 2.7.1) | Nghiệm thu tài khoản/bài cũ sau chuẩn hoá |\n| [#1](https://github.com/antonio46-fpt/xoay-chieu/issues/1) `feat(be): support approved class rosters in progress reports` | P3 | Chờ quyết định | Cố ý **chưa** lập trình; API vẫn chỉ liệt kê mã đã có bài | Quyết định đồng thuận + ai giữ bảng mã ↔ họ tên |\n| [#7](https://github.com/antonio46-fpt/xoay-chieu/issues/7) `docs(be): define handling of pending version 2.1 records` | P2 | Chờ quyết định | Không có migration tự động — đúng thiết kế | Chủ dự án xác nhận có/không có gói 2.1 |\n\n## Những gì không thể đóng bằng sửa mã\n\nBốn issue kiểm thử (#2, #3, #4, #6) và hai issue chờ quyết định (#1, #7) không có mã để viết thêm. Đóng chúng khi chưa chạy kiểm chứng sẽ trái với nguyên tắc đã ghi trong [BACKEND_REVIEW.md](../BACKEND_REVIEW.md): không coi kiểm thử mô phỏng là xác nhận đạt. Vì vậy các đặc tả dưới đây giữ nguyên tiêu chí nghiệm thu và bổ sung mục **Kiểm toán mã 2.8.0** ghi rõ ô nào đã đạt bằng mã, ô nào còn phải chạy thật.\n\n## Thứ tự thực hiện\n\n1. **#3** — dựng deployment thử và Sheet thử; đây là điều kiện nền cho mọi issue khác.\n2. **#2** — dùng chung deployment của #3, thêm `TEACHER_PINS`.\n3. **#4** — chỉ đo sau khi #3 và #2 đạt.\n4. **#1** — chờ quyết định; #7 chờ chủ dự án xác nhận dữ liệu 2.1.\n5. **#6** — thử thiết bị làm song song #3, không phụ thuộc #2.\n\nNgười phụ trách và hạn chót vẫn chờ chủ dự án phân công; bản rà soát này không tự gán. Không đưa credential hoặc dữ liệu thật vào issue. Xem [đối chiếu góp ý](../BACKEND_REVIEW.md), [checklist cấu hình](../DEPLOYMENT_CHECKLIST.md), [kế hoạch tải](../LOAD_TEST_PLAN.md) và [hướng dẫn học sinh](../HUONG_DAN_HOC_SINH.md).\n\n## Nội dung chưa đăng được thành issue\n\n[Quản lý Sheet + đồng bộ phút](be-minute-management.md) đã hiện thực trong 2.8.0 và có kiểm thử cục bộ, nhưng **vẫn chưa đăng được issue**: GitHub API trả `Forbidden` cho cả GraphQL và REST. Không có số issue để dẫn hoặc đóng. Khi đăng được, đây sẽ là issue thứ 11 và nên mở ở trạng thái \"code complete, chờ nghiệm thu\".\n", "docs/issues/be-class-roster.md": "## Bối cảnh và hiện trạng\n\n`getClassProgress` hiện chỉ trả mã đã có bài được máy chủ xác nhận. FE đã ghi rõ giới hạn này. Chưa thể liệt kê mọi học sinh chưa nộp, vì chưa có danh sách mã được cấp theo bốn lớp.\n\n## Phạm vi và API\n\nBổ sung nguồn danh sách mã được chủ dự án duyệt, gắn với đúng trường/lớp, không có họ tên, số điện thoại hoặc ảnh. Duy trì RPC `getClassProgress({token, truong, lop})`, response `{ok:true, students:[{ma, weeks:[1,2]}]}`. Mã hợp lệ chưa nộp phải có `weeks:[]`. Thiết kế nguồn roster riêng ở máy chủ; không nhúng danh sách các lớp vào HTML phát cho học sinh. Khi chưa cấu hình roster, tiếp tục thông báo chế độ chỉ liệt kê mã có bài; không âm thầm suy luận các mã còn lại.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Có đặc tả nguồn roster và cách chủ dự án nhập/cập nhật bằng dữ liệu giả.\n- [ ] Chặn mã trùng trong cùng trường/lớp; cho phép cùng mã ở lớp khác nếu đúng chính sách.\n- [ ] Trả đủ roster đúng lớp, kể cả `weeks:[]`, không lộ mã lớp khác.\n- [ ] Chỉ trả `ma`, `weeks`; không thêm nội dung, tự đánh giá, thời lượng hay thông tin nhận diện.\n- [ ] Có đường chuyển tiếp rõ ràng cho dữ liệu đã ghi và lớp chưa cấu hình roster.\n- [ ] Nhóm nghiên cứu duyệt danh sách thực tế ngoài Git trước khi sử dụng thật.\n\n## Kiểm thử\n\nFixture hai trường, bốn lớp; có mã chưa nộp, nộp nhiều lượt, trùng mã khác lớp, roster sai cấu trúc. Test cả quyền giáo viên, PIN sai và đổi lớp. Kiểm thử tích hợp trên Sheet thử; không truy cập Sheet thật.\n\n## Trạng thái: tạm dừng triển khai, chờ quyết định nghiên cứu\n\n- Ưu tiên **P3**. Không lập trình roster ở đợt sửa này; giữ API chỉ liệt kê mã đã có bài xác nhận.\n- Người phụ trách, hạn: chờ phân công và quyết định bằng văn bản của nhóm nghiên cứu.\n- [ ] Có quyết định cho phép/không cho phép GVCN xem mã chưa nộp, khớp phiếu đồng thuận và nguyên tắc tham gia tự nguyện.\n- [ ] Xác định ai giữ bảng mã ↔ họ tên và nơi lưu ngoài hệ thống.\n- [ ] Bảng mã ↔ họ tên không nằm trong Sheet nghiên cứu, Script Properties, HTML, Git hoặc issue.\n- [ ] Nếu GVCN giữ bảng đối chiếu, đánh giá rõ việc xem tiến độ theo mã có thể trở thành xem theo tên và gây áp lực.\n- [ ] Chỉ sau khi được duyệt, chọn nguồn roster chỉ gồm mã và quy trình chủ dự án cấp mã sẵn để tránh trùng. Không tự đưa danh sách học sinh vào repo.\n\nNguồn roster chỉ gồm mã có thể được thiết kế sau quyết định; bảng đối chiếu có họ tên luôn nằm ngoài hệ thống. Đây là hai loại dữ liệu khác nhau.\n\n## Kiểm toán mã 2.8.0\n\nRoster **chưa được lập trình**, đúng quyết định tạm dừng P3. Đã rà lại để chắc không có suy luận ngầm nào:\n\n| Điều phải giữ | Kết quả | Bằng chứng |\n|---|---|---|\n| `getClassProgress` chỉ liệt kê mã đã có bài được xác nhận | Đạt | `apps-script/Code.gs:306-317` gom mã từ chính các dòng của `chu_trinh` |\n| Không âm thầm suy ra mã còn lại là chưa làm bài | Đạt | Không có nguồn roster nào trong mã; `src/app.js:951` ghi rõ giới hạn này ngay trên giao diện |\n| Không nhúng danh sách mã học sinh vào HTML phát cho học sinh | Đạt | `src/content.json` chỉ có tên trường và mã lớp, không có mã học sinh |\n\nIssue này chỉ đóng được bằng quyết định văn bản của nhóm nghiên cứu, không cần thêm mã.\n", "docs/issues/be-progress-permissions.md": "## Bối cảnh và hiện trạng\n\nĐã có `loginTeacher`, `getClassProgress`, `logoutTeacher`, `TEACHER_PINS`, phiên teacher/coord tách nhau và test mock. FE đã nối RPC. Chưa xác minh trên deployment Google Apps Script và quyền Google thật của Sheet thử. Issue này kiểm chứng tích hợp, không yêu cầu viết lại API đã có.\n\n## Phạm vi và API\n\n- `loginTeacher({truong,lop,pin})` → `{ok,token,expires}` hoặc `{ok:false,code,error}`.\n- `getClassProgress({token,truong,lop})` → `{ok:true,students:[{ma,weeks}]}`.\n- `logoutTeacher(token)` → `{ok:true}` và thu hồi phiên.\n- `loginCoordinator`/`submitRecord` giữ quyền độc lập; không thêm API đọc bài riêng tư.\n\n## Tiêu chí nghiệm thu\n\n- [ ] PIN giáo viên đúng/sai và giới hạn thử PIN hoạt động trên deployment thử.\n- [ ] Token sai, hết hạn, bị thu hồi, token điều phối và yêu cầu đổi lớp đều bị từ chối.\n- [ ] Giáo viên chỉ nhận mã + tuần của đúng lớp, không nhận bài, sản phẩm, mức tự đánh giá hoặc metadata ngoài contract.\n- [ ] Token giáo viên không nộp được phiếu điều phối.\n- [ ] GVCN không có quyền mở Sheet nguồn; nhóm nghiên cứu/GV hướng dẫn chỉ có quyền do chủ dự án cấp.\n- [ ] Ghi bằng chứng request/response đã loại credential và chỉ chứa mã thử.\n\n## Kiểm thử\n\nTạo Sheet/deployment thử, cấu hình PIN thử bằng Script Properties ngoài Git, dùng trình duyệt riêng cho từng vai trò. Test luồng đăng nhập/làm mới/hết phiên/đăng xuất. Không kiểm thử với Sheet chính thức hoặc dữ liệu học sinh thật.\n\n## Ưu tiên, phụ thuộc và cấu hình\n\n- Ưu tiên **P1**, sau #3 có deployment thử đạt các kiểm tra nền tảng.\n- Người phụ trách và hạn dự kiến: chờ chủ dự án phân công/chốt lịch.\n- Quyền Drive, Execute as, Who has access, Script Properties và người được sửa thuộc [checklist cấu hình](../DEPLOYMENT_CHECKLIST.md), không được coi là hoàn tất chỉ bằng sửa mã.\n\n## Bổ sung nghiệm thu\n\n- [ ] Sai PIN 8 lần từ máy học sinh: lần thứ 8 trả RATE_LIMITED và retryAfterSeconds; thử trong thời gian khóa trả số giây còn lại, không kéo dài hạn khóa vì nhấn lại.\n- [ ] Hết thời gian chờ, PIN hợp lệ đăng nhập được; mô tả rõ phương án vận hành cho GVCN.\n- [ ] Xóa token cache giữa buổi: điều phối được nhập lại PIN ngay trên màn hình; các phiếu, hàng đợi và đồng hồ giữ nguyên. Giáo viên trở lại đúng trường/lớp đã chọn khi yêu cầu PIN lại.\n- [ ] Có ảnh chụp hoặc mô tả cấu hình deployment/Sheet thử đã loại thông tin nhận diện và credential.\n\n## Phương án hiện tại\n\nGiữ giới hạn 8 lần/10 phút, chọn cách **hiển thị thời gian chờ còn lại** và chờ hết khóa; không tự thêm PIN dự phòng. Bộ đếm vẫn theo lớp nên chưa loại bỏ được nguy cơ bị cố tình khóa lớp. Cần nhóm nghiên cứu chấp thuận phương án hoặc yêu cầu quy trình dự phòng trước triển khai thật. Cache token/bộ đếm có thể bị Google loại sớm: không bảo đảm phiên đủ 6 giờ hay giữ bộ đếm đủ 10 phút. Test cục bộ đã kiểm tra hết phiên và khôi phục phiếu, tích hợp Google vẫn để mở.\n\n## Kiểm toán mã 2.8.0\n\n| Tiêu chí | Kết quả | Bằng chứng |\n|---|---|---|\n| PIN giáo viên đúng/sai + giới hạn thử PIN | Đạt | `apps-script/Code.gs:340-401`; sai 8 lần khoá lớp 600 giây |\n| Token sai, hết hạn, bị thu hồi, token điều phối, đổi lớp đều bị từ chối | Đạt | `apps-script/Code.gs:270-282` so cả `truong` và `lop`; cache tách tiền tố `teacher:` và `coord:` nên không dùng chéo được |\n| Chỉ nhận `ma` + `weeks`, không có bài/tự đánh giá/metadata | Đạt | `apps-script/Code.gs:316` chỉ dựng `{ma, weeks}`; `src/app.js:955` chỉ hiển thị mã và tuần |\n| Token giáo viên không nộp được phiếu điều phối | Đạt | `apps-script/Code.gs:210` gọi `authorizeCoordinator_`, tra khoá `coord:\u003ctoken>` |\n| `RATE_LIMITED` trả `retryAfterSeconds`, nhấn lại không kéo dài hạn khoá | Đạt | `apps-script/Code.gs:354-359` đặt TTL bằng đúng số giây còn lại |\n| GVCN không có quyền mở Sheet nguồn | Chờ thao tác | Việc cấp quyền Google, không phải mã |\n\nCòn mở: chạy trên deployment thật với hai trình duyệt riêng vai trò, thử lúc Google loại cache sớm, và ghi ảnh chụp cấu hình đã che credential.\n", "docs/issues/be-submission-integrity.md": "## Bối cảnh và hiện trạng\n\nClient đã che ô có từ khóa trước RPC; máy chủ áp dụng lại trước ghi RAW. Đã có mock tests cho bốn tuần, cột dẫn xuất, retry và xung đột ID. Cần kiểm chứng trên Sheets API/LockService thật của deployment thử, nhất là mất ACK và nộp đồng thời.\n\n## Phạm vi và API\n\n`submitRecord({record,token})` giữ `{ok,id,duplicate}` hoặc `{ok:false,code,error}`. Cùng ID + cùng bản đã che xác nhận lại; cùng ID + nội dung khác trả `ID_CONFLICT`; ID mới thêm dòng. Không sửa bản ghi cũ hay tự đổi ID để né xung đột.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Request từ FE không chứa nguyên văn ô nhạy cảm; local history vẫn có bản gốc.\n- [ ] Gọi máy chủ trực tiếp bỏ qua client vẫn không ghi nguyên văn ô có từ khóa.\n- [ ] Tuần 3 giữ tiền tố, tuần 4 giữ cột tổng hợp nhưng không lộ lại nội dung đã che.\n- [ ] RAW không thực thi chuỗi bắt đầu bằng `=`, `+`, `-`, `@` thành công thức.\n- [ ] Retry sau mất ACK, reload và khôi phục bản sao tạo đúng một dòng cho cùng ID.\n- [ ] Hai request cùng ID đồng thời không tạo hai dòng; nội dung khác bị từ chối.\n\n## Kiểm thử\n\nChỉ dùng mã và nội dung giả trên Sheet thử. Mô phỏng mất ACK, tắt/bật mạng, gửi đồng thời, lỗi quota và BUSY. Không ghi request nguyên văn hoặc token vào log. Đính kèm kết quả đã loại credential.\n\n## Ưu tiên và phụ thuộc theo góp ý chốt Backend\n\n- Ưu tiên: **P1**, thực hiện đầu tiên; không phụ thuộc issue khác.\n- Người phụ trách: chờ chủ dự án phân công; hạn dự kiến chờ lịch chạy thử.\n- Quy trình gói 2.1 được tách sang #7 (https://github.com/antonio46-fpt/xoay-chieu/issues/7), không mặc định cho phép sửa dữ liệu cũ.\n\n## Bổ sung nghiệm thu tích hợp (chưa chạy trên Google)\n\n- [ ] Gửi **20 request cùng ID trong 2 giây** trên deployment thử: đúng 1 dòng; các lần còn lại duplicate:true hoặc BUSY. Nếu timeout/quota, ghi nhận là không đạt mục tiêu đề xuất; không bỏ khỏi báo cáo.\n- [ ] Đối chiếu request kế tiếp ngay sau khi nhả khóa: đọc được dòng vừa append bằng cùng Sheets API.\n- [ ] Gửi lại bản ghi có số, boolean, ô rỗng, xuống dòng, khoảng trắng cuối và chuỗi bắt đầu bằng dấu nháy đơn: duplicate:true, không ID_CONFLICT giả.\n- [ ] Từng ô ở đúng độ dài tối đa JSON, kể cả cột tổng hợp tuần 4, ghi/đọc nguyên vẹn.\n\n## Đã sửa và kiểm thử cục bộ\n\nĐường submit đọc tiêu đề/ID/bản ghi và append cùng Sheets API, UNFORMATTED_VALUE, khóa bao trùm toàn bộ. So sánh đúng kiểu số/boolean, coi ô trống bị lược cuối hàng là rỗng; chuỗi không trim/chuyển kiểu. Build áp giới hạn nội bộ 13.000 UTF-16 code units, kiểm tra tiền tố tuần 3 và tổng hợp tuần 4. `tests/backend-review.cjs` đã kiểm tra burst **tuần tự trong fixture**, không thay cho 20 request đồng thời trên Google.\n\n## Kiểm toán mã 2.8.0\n\nRà trực tiếp đường nộp ngày 28/10/2026. Sáu tiêu chí kiểm được bằng mã đều đạt:\n\n| Tiêu chí | Kết quả | Bằng chứng |\n|---|---|---|\n| FE không gửi nguyên văn ô nhạy cảm; lịch sử máy giữ bản gốc | Đạt | `src/app.js:160` thay bản ghi trong hàng đợi bằng bản đã che; `src/app.js:659-665` lịch sử giữ đối tượng gốc nên không bị thay theo |\n| Gọi máy chủ trực tiếp vẫn không ghi nguyên văn | Đạt | `apps-script/Code.gs:207` gọi lại `Safety.redactRecord` trước khi kiểm tra và ghi |\n| Tuần 3 giữ tiền tố, tuần 4 giữ cột tổng hợp, không lộ lại nội dung đã che | Đạt | `src/safety.js:21-28` dựng lại tiền tố quanh `[đã ẩn – an toàn]`; `apps-script/Code.gs:148-157` kiểm tra lại phần khớp |\n| RAW không thực thi `=`, `+`, `-`, `@` thành công thức | Đạt | `apps-script/Code.gs:244-249` dùng `valueInputOption: 'RAW'` |\n| Retry sau mất ACK / reload / khôi phục tạo đúng một dòng | Đạt | `src/core.js:44-47` dùng lại `draft.id` đã cấp; `apps-script/Code.gs:229-239` là nhánh ACK lại |\n| Hai request cùng ID đồng thời không tạo hai dòng; nội dung khác bị từ chối | Đạt theo thiết kế | `apps-script/Code.gs:214-239` giữ khoá `LockService` bao trùm cả bước tìm ID và `append`; khác nội dung → `ID_CONFLICT` |\n\nCòn mở, chỉ làm được trên Sheet thử: 20 request cùng ID trong 2 giây, đọc lại ngay sau khi nhả khoá, và ghi/đọc từng ô ở đúng độ dài tối đa JSON.\n", "docs/issues/be-capacity.md": "## Bối cảnh và hiện trạng\n\nQuy mô dự kiến khoảng 150 học sinh ở hai trường, bốn lớp. Hiện chỉ có kiểm thử chức năng và mock, chưa có số đo tải đồng thời với Apps Script/Sheets. Không coi quy mô dự kiến là cam kết năng lực hệ thống.\n\n## Phạm vi\n\nĐo `submitRecord` trên deployment/Sheet thử với dữ liệu giả, tăng tải theo bước do chủ dự án cho phép. Kiểm tra LockService, quota, backoff client và thời gian hàng đợi được xử lý. Không thực hiện stress test trên deployment chính thức.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Có kế hoạch tải và mức dừng trước khi chạy; ghi rõ số người dùng/request đồng thời.\n- [ ] Báo cáo tỷ lệ ACK, BUSY, lỗi quota/timeout, độ trễ p50/p95 và thời gian xử lý hết hàng đợi.\n- [ ] Đối chiếu ID gửi/ID Sheet để chứng minh không mất bài hoặc ghi trùng.\n- [ ] Kiểm tra retry sau lỗi vẫn giữ ID và nội dung đã che.\n- [ ] Nếu chưa đạt tải dự kiến, ghi giới hạn và phương án điều phối buổi học; không báo sẵn sàng vô điều kiện.\n\n## Kiểm thử\n\nChạy tải bằng mã giả, chỉ trên Sheet thử, trong giới hạn Google và mức được chủ dự án phê duyệt. Xóa dữ liệu thử chỉ theo quy trình của chủ dự án; không truy cập Sheet chính thức sau khi chạy thật.\n\n## Ưu tiên, phụ thuộc và kịch bản đề xuất\n\n- Ưu tiên **P2**; chỉ đo sau #3 và #2 đạt trên deployment thử.\n- Người phụ trách/hạn: chờ chủ dự án; chưa chạy tải và chưa tuyên bố đạt.\n\n| Kịch bản | Tải đề xuất | Mục tiêu đề xuất, cần chủ dự án duyệt |\n|---|---|---|\n| Cuối buổi một lớp | 40 bài / 60 giây | 100% ID được ACK trong 5 phút; không mất/trùng |\n| Hai lớp cùng giờ | 80 bài / 60 giây | 100% ID được ACK trong 10 phút; không mất/trùng |\n| Đầu buổi điều phối | 4 đăng nhập điều phối + 40 bài cùng lúc | 4 đăng nhập thành công trong 30 giây; đo riêng ACK bài |\n\n- [ ] Duyệt sĩ số, lịch trùng giờ, mức dừng và kịch bản trước khi chạy.\n- [ ] Báo cáo end-to-end từ lúc bấm gửi đến ACK, p50/p95, BUSY, quota, timeout và thời gian hết hàng đợi cho từng kịch bản.\n- [ ] Đối chiếu hạn mức Apps Script/Sheets từ tài liệu Google hiện hành và ghi ngày đối chiếu trong báo cáo.\n- [ ] Nếu không đạt, đề xuất nộp lệch nhóm 1–2 phút và kiểm thử lại lịch mới.\n\n`loginTeacher`/`loginCoordinator` vẫn dùng cùng script lock với submit; tryLock chờ tối đa 1,5 giây. Đây là điểm cần đo, chưa thay khóa bằng cơ chế không bảo đảm nguyên tử. Chi tiết kế hoạch và mẫu báo cáo ở [LOAD_TEST_PLAN.md](../LOAD_TEST_PLAN.md).\n\n## Kiểm toán mã 2.8.0\n\nKhông tiêu chí tải nào đo được từ mã; mục này chỉ xác nhận phần chuẩn bị đã đúng thiết kế.\n\n| Điều kiện chuẩn bị | Kết quả | Bằng chứng |\n|---|---|---|\n| Mọi đường vào dùng chung một khoá script | Đạt | `apps-script/Code.gs:214-219` (nộp bài), `:345-346` (đăng nhập vai trò), `apps-script/Learning.gs:97-98` đều `LockService.getScriptLock()` + `tryLock(1500)` |\n| Máy chủ trả `BUSY` thay vì treo khi bận | Đạt | `apps-script/Code.gs:215-219` trả mã `BUSY` để client thử lại |\n| Client giãn lần thử sau lỗi | Đạt | `src/core.js:87-92` backoff mũ + jitter, chặn trên 2 phút |\n| Không có đường ghi Sheet nào nằm ngoài khoá | Đạt | Cả `append`/`update` đều nằm trong nhánh còn giữ khoá |\n\nCòn mở nguyên vẹn: mọi số đo p50/p95, tỷ lệ ACK/BUSY/quota và thời gian xử lý hết hàng đợi — chỉ có được sau khi chủ dự án duyệt mức dừng và chạy trên Sheet thử.\n", "docs/issues/qa-real-devices.md": "## Bối cảnh\n\nNháp và hàng đợi nằm trong trình duyệt; test DOM/Chromium viewport không chứng minh hành vi trên điện thoại vật lý, trình duyệt trong app hoặc chế độ tiết kiệm pin.\n\n## Phạm vi, ưu tiên và phụ thuộc\n\n**P1** — có thể chuẩn bị/chạy thử giao diện song song #3; kiểm tra gửi/ACK dùng deployment thử của #3. Người phụ trách và hạn chờ nhóm nghiên cứu phân công. Chỉ dữ liệu giả, Sheet thử; không ghi thông tin nhận diện thiết bị/học sinh vào issue.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Ít nhất Android giá rẻ, Android tầm trung và iPhone; ghi model/OS/browser đã loại thông tin cá nhân.\n- [ ] Chrome/Safari và trình duyệt trong Zalo/Facebook: đọc/làm/lưu/khôi phục/gửi bài hoặc hướng dẫn mở trình duyệt ngoài nếu không hỗ trợ.\n- [ ] Tiết kiệm pin, tắt màn hình giữa bài, thoát app, 4G mất rồi có lại; kiểm tra đúng ID, không mất/trùng.\n- [ ] Hai học sinh mã khác nhau trên cùng trình duyệt: không lẫn nháp/lịch sử; nêu rõ người có quyền dùng máy vẫn có thể xem dữ liệu cục bộ.\n- [ ] Cảnh báo lỗi lưu/bộ nhớ đầy rõ ràng; bản LIVE không cho chế độ demo bỏ qua lưu.\n- [ ] Hướng dẫn một trang cho học sinh được đọc thử và xác nhận dễ hiểu: giữ mã, cùng trình duyệt trong 4 tuần, không xóa dữ liệu khi còn bài chờ.\n- [ ] Báo cáo pass/fail/unrun theo từng tình huống, ảnh đã loại mã thật và nội dung thật.\n\nHướng dẫn học sinh: docs/HUONG_DAN_HOC_SINH.md. Chưa thực hiện các kiểm tra vật lý trong môi trường lập trình này.\n\n## Kiểm toán mã 2.8.0\n\nBốn ô dưới đây kiểm được bằng mã; phần còn lại bắt buộc thử trên máy thật.\n\n| Tiêu chí | Kết quả | Bằng chứng |\n|---|---|---|\n| Hai học sinh khác mã trên cùng trình duyệt không lẫn nháp/lịch sử | Đạt | `src/classes.js:8` khoá hồ sơ gồm cả `truong`, `lop`, `ma`; `db.profiles` tách theo khoá này |\n| Cảnh báo lỗi lưu/bộ nhớ đầy rõ ràng | Đạt | `src/app.js:407-417` báo rõ nguyên nhân và giữ nguyên dữ liệu, không âm thầm mất bài |\n| Bản LIVE không cho bỏ qua lưu bằng chế độ demo | Đạt | `src/app.js:14` đặt `AUTH_REQUIRED = APP_CONFIG.authRequired \\|\\| LIVE`; `src/app.js:379` chỉ bật `previewOnly` khi **không** ở bản LIVE |\n| Không ghi thông tin nhận diện thiết bị | Đạt | `src/app.js:7` nêu rõ; `Core.record` không có trường thiết bị |\n\nCòn mở: ma trận Android giá rẻ / Android tầm trung / iPhone, trình duyệt trong Zalo–Facebook, tiết kiệm pin và mất 4G giữa bài.\n", "docs/issues/ops-legacy-21.md": "## Bối cảnh\n\nGói 2.1 có thể đã ghi nguyên văn ở Sheet nhưng mất ACK; bản mới che nội dung trước khi retry nên cùng ID có thể báo ID_CONFLICT. Đây là quy trình vận hành và quyết định nghiên cứu; không tự sửa dữ liệu thật hoặc đổi ID.\n\n## Ưu tiên và trách nhiệm\n\n**P2**; trở thành điều kiện chặn nâng cấp nếu chủ dự án xác nhận có dữ liệu/gói 2.1 cần xử lý. Tách từ #3. Chủ dự án/nhóm nghiên cứu quyết định cách xử lý; lập trình chỉ diễn tập trên dữ liệu giả. Người thực hiện, phê duyệt và lịch chờ chốt.\n\n## Tiêu chí nghiệm thu\n\n- [ ] Chủ dự án xác nhận có/không có gói 2.1 đã gửi hoặc đang chờ; không yêu cầu lập trình truy cập Sheet thật.\n- [ ] Có bản sao được bảo vệ, người giữ bản sao, quy tắc chọn lượt và nhật ký quyết định; không đưa bản sao chứa dữ liệu thật vào Git/issue.\n- [ ] Phân biệt chưa ghi, đã ghi chưa ACK, đã ACK và xung đột nội dung; đối chiếu ID trên dữ liệu giả.\n- [ ] Nhóm nghiên cứu quyết định giữ/xử lý dữ liệu cũ và nguyên tắc che nội dung, khớp đồng thuận và phân tích.\n- [ ] Diễn tập quy trình trên Sheet thử, nêu cách xác nhận bài đã nhận mà không tạo ID mới hoặc ghi đè âm thầm.\n- [ ] Có người chịu trách nhiệm thao tác dữ liệu thật nếu được phép; người hỗ trợ lập trình không truy cập sau triển khai chính thức.\n\nChưa có migration tự động trong mã. Các ID_CONFLICT vẫn tạm dừng để kiểm tra, không được né bằng cách tạo ID mới.\n\n## Kiểm toán mã 2.8.0\n\n| Điều phải giữ | Kết quả | Bằng chứng |\n|---|---|---|\n| Không có migration tự động đụng dữ liệu cũ | Đạt | Không có hàm migration trong `apps-script/`; dữ liệu cũ chỉ được đọc tương thích qua `ClassIds.code` |\n| `ID_CONFLICT` làm gói tạm dừng, không tự gửi lại | Đạt | `src/app.js:179` đặt `error.permanent` cho `ID_CONFLICT` và `INVALID_RECORD`; `src/app.js:198` gán `item.paused` |\n| Không đổi ID để né xung đột | Đạt | Đường nộp giữ nguyên `draft.id`; `src/learning.js:144` chỉ cấp ID mới khi người học chủ động chọn \"giữ bản trên máy\" thành lượt mới |\n| Gói tạm dừng vẫn xuất được bản sao | Đạt | Hàng đợi nằm trong `localStorage` và được đưa vào bản sao toàn bộ |\n\nCòn mở: chủ dự án xác nhận có hay không có gói 2.1; nếu có, nhóm nghiên cứu phải chốt quy tắc xử lý trước khi nâng bản.\n", "docs/BACKEND_REVIEW.md": "# Đối chiếu góp ý Backend và trạng thái thực hiện\n\nNguồn: tài liệu Word “Góp ý chốt Backend – Xoay Chiều 2.2.0”, tham chiếu commit 2999a66. Tài liệu là nguồn góp ý; các quyết định nghiên cứu/chấp thuận triển khai không được suy ra chỉ từ việc sửa mã.\n\nThứ tự: #3 → #2 → #4 → #1. Thử thiết bị làm song song; xử lý gói 2.1 tách khỏi kiểm thử mã. Chưa có người phụ trách/hạn được nhóm nghiên cứu chốt.\n\n| Góp ý | Đã thực hiện | Còn phải kiểm chứng/quyết định |\n|---|---|---|\n| Hai đường đọc/ghi | Submit đọc/append cùng Sheets API, giữ khóa | Kiểm tra visibility của request kế tiếp trên Sheet thử |\n| String() so sánh | UNFORMATTED_VALUE, so sánh số/boolean đúng kiểu; ô rỗng bị lược được chuẩn hóa; không trim chuỗi | Retry với dấu nháy, newline, khoảng trắng trên Google thật |\n| Giới hạn ô | Build chặn field/prefix/tổng hợp vượt 13.000 UTF-16 code units; server chặn quá mức | Đối chiếu nguồn Google hiện hành, ghi ở mức max trên Sheet thử |\n| Khóa PIN lớp | RATE_LIMITED + số giây còn lại; lần nhấn tiếp không kéo dài hạn | Phương án mặc định chờ cần chủ dự án duyệt; nguy cơ cố tình khóa lớp vẫn tồn tại |\n| Cache rớt sớm | Điều phối nhập lại PIN trên cùng DOM; giữ phiếu, đồng hồ, hàng đợi. Giáo viên giữ lựa chọn lớp | Thử cache eviction trên deployment thử |\n| Quyền Google | Checklist cấu hình tách khỏi test mã | Chủ tài khoản xác minh Drive/deployment/Script Properties |\n| Đo tải | Có kịch bản 40/80 bài và đăng nhập + bài, mẫu báo cáo và nguồn cần rà | Chưa được duyệt, chưa đo tải Google |\n| Roster | Tạm dừng code | Quyết định tự nguyện/đồng thuận và bảng mã–họ tên ngoài hệ thống |\n| Điện thoại | Issue và hướng dẫn một trang | Chưa thử thiết bị vật lý |\n| Gói 2.1 | Issue vận hành riêng | Nhóm nghiên cứu quyết định; không tự sửa dữ liệu cũ |\n\n## Các quyết định đang chờ\n\n1. GVCN có được xem mã chưa nộp không, khớp phiếu đồng thuận?\n2. Ai giữ bảng mã–họ tên, lưu ở đâu ngoài hệ thống?\n3. Sĩ số thực tế và lịch các lớp có trùng giờ?\n4. Duyệt cách chờ khi PIN bị khóa hay cần phương án dự phòng?\n5. Quy tắc chọn lượt khi một mã có nhiều lần nộp?\n6. Người phụ trách, ngày chạy thử/bắt đầu/kết thúc?\n\nPhản hồi “ok” chưa cung cấp các quyết định này, nên không tự thêm roster, PIN dự phòng, assignee hoặc deadline.\n", "docs/DEPLOYMENT_CHECKLIST.md": "# Checklist cấu hình deployment thử\n\nĐây là các thao tác chủ tài khoản Google phải xác nhận, tách khỏi test mã. Chỉ dùng Sheet thử/dữ liệu giả. Chưa mục nào được coi là đạt trong phiên lập trình này.\n\n- [ ] Sheet để Hạn chế; học sinh và GVCN chỉ cần tiến độ không có quyền mở Sheet nguồn.\n- [ ] Nhóm nghiên cứu/GV hướng dẫn có quyền đúng phạm vi; ghi người có quyền sửa và người chỉ đọc bằng vai trò trong báo cáo, không đưa tài khoản cá nhân lên Git.\n- [ ] Web app Execute as: tài khoản chủ dự án; Who has access đúng đối tượng được duyệt (Anyone nếu chính sách cho phép).\n- [ ] `TEACHER_PINS`/`COORDINATOR_PINS` ở Script Properties, tách vai trò và đúng trường/lớp; không có PIN trong JSON/HTML/source/log.\n- [ ] Ghi rõ ai có quyền chỉnh Apps Script/Script Properties; quyền editor là quyền nhạy cảm, không chỉ là quyền xem tiến độ.\n- [ ] Google Sheets API bật; Code.gs, Accounts.gs, Learning.gs, Schema.gs, Index.html cùng phiên bản; deploy New version và thử `/exec` bằng cửa sổ riêng.\n- [ ] Thử PIN sai/đúng, thời gian chờ, hết cache, đăng nhập lại và đăng xuất; giữ phiếu/đồng hồ khi hết phiên.\n- [ ] Tài liệu hóa trường hợp Google không cho phép Anyone; không tự đổi tài khoản/quyền thay chủ dự án.\n- [ ] Có ảnh hoặc mô tả cấu hình đã che email, Sheet ID, project ID, PIN, token và URL quản trị.\n- [ ] Chủ dự án chốt lịch chạy, người hỗ trợ, cách giữ mã và cách xử lý dữ liệu thử trước triển khai thật.\n\nĐính kèm báo cáo đã loại thông tin nhận diện vào issue #2. Không ghi giá trị credential vào repo hoặc chat.\n\n- [ ] Tài khoản thử được cấp PIN riêng bằng `provisionStudentAccounts_`; không có PIN rõ trong Sheet. Giữ `STUDENT_PIN_SECRET` trong Script Properties; thử cấp lại không đổi PIN và đặt lại/khóa mã thu hồi phiên cũ.\n- [ ] Học sinh mã khác/lớp khác/đổi vai trò không nộp hoặc xem tiến độ thay mã khác. Bài bị che trước ghi; `tien_do` đúng các tuần đã nhận kể cả sau lỗi cập nhật tiến độ và gửi lại cùng ID.\n- [ ] Đăng nhập thiết bị mới nhận tiến độ; không nhầm tiến độ với nháp/bài gốc chỉ ở thiết bị cũ. Hết phiên khi viết vẫn giữ nháp/DOM; đăng xuất giữ hàng đợi và chỉ gửi khi đúng mã đăng nhập lại.\n\n- [ ] Ba lớp đúng workbook triển khai; nhập CSV qua `nhap_tai_khoan`, chạy lại không nhân đôi hoặc đổi mật khẩu cũ. File CSV tài khoản/mật khẩu chỉ do người phụ trách giữ, không lưu trong Sheet nguồn hoặc Git.\n- [ ] Dùng đúng `apps-script/Index.html` có `authRequired: true`; khi thiếu bridge Google không có đường vào demo. Thử mật khẩu chữ/số, mã trùng khác lớp, Enter, hiện/ẩn mật khẩu và chặn mở tuần khi hết phiên.\n\n- [ ] Chạy setup_ thêm nhap_hoc_tap; kiểm tra vào lại đúng bước, đổi thiết bị, tuần sau còn bài tuần trước, tuần 4 dùng được sản phẩm cũ. Chỉ học sinh có token đúng tài khoản đọc được nháp/Sổ; token giáo viên/điều phối bị từ chối.\n- [ ] Gửi nháp lặp không tạo thêm dòng; hai thiết bị sửa có xung đột rõ ràng và giữ bản sao; đóng khi offline không được báo đã đồng bộ. Nháp không xuất hiện trong số tuần hoàn thành hay dữ liệu bài nộp nghiên cứu.\n- [ ] Thêm tài khoản theo CSV mới không đổi mật khẩu cũ. Giữ nhóm Chi Lăng cũ; chưa bật NT-10A6/NT-10A7 trước khi có quyết định bốc thăm.\n\n- [ ] Cập nhật Management.gs, chạy setupManagement_ và kiểm tra hai bảng quan_ly_hoc_sinh/quan_ly_hoc_tap: mã/trường/lớp đúng, câu trả lời an toàn hiện theo tuần; không có PIN/hash/token.\n- [ ] Gõ liên tục qua mốc 60 giây; xác nhận nội dung mới nhất, offline vẫn giữ trên máy, không có ghi nháp khi không đổi, đăng xuất dừng timer.\n- [ ] Kiểm tra công thức ba vùng nguồn, locale, vùng bung mảng và quyền Sheet; thử quota/thời gian tính lại theo kế hoạch tải #4 trước dùng cả đợt.\n", "docs/LOAD_TEST_PLAN.md": "# Kế hoạch đo tải đề xuất — chưa được duyệt/chưa chạy\n\nPhụ thuộc #3 (đúng dữ liệu/không trùng) và #2 (đúng quyền) đạt trên deployment thử. Phải có chủ dự án duyệt sĩ số, lịch trùng giờ, người chạy, thời gian chạy và mức dừng. Không chạy lên hệ thống chính thức.\n\n| Kịch bản | Tải | Mục tiêu đề xuất |\n|---|---|---|\n| Một lớp cuối buổi | 40 bài trong 60 giây | ACK đủ ID trong 5 phút; không mất/trùng |\n| Hai lớp cùng giờ | 80 bài trong 60 giây | ACK đủ ID trong 10 phút; không mất/trùng |\n| Đầu buổi điều phối | 4 đăng nhập + 40 bài cùng lúc | đăng nhập đủ trong 30 giây; đo riêng thời gian ACK bài |\n| Chống trùng | 20 request cùng ID trong 2 giây | 1 dòng, còn lại duplicate:true/BUSY; báo riêng timeout/quota |\n\nTrước chạy: dùng mã giả, ID duy nhất, nội dung không nhạy cảm; ghi thời điểm bấm gửi, lần retry và ACK. Dùng nhịp retry/backoff của app, không vô hiệu hóa giới hạn. Dừng nếu quota liên tục, lỗi quyền, sai dữ liệu hoặc vượt mức đã duyệt. Không chạy một batch 150 request chỉ để suy ra năng lực 150 học sinh.\n\nBáo cáo từng kịch bản: số ID dự kiến, số ACK, ID thiếu/trùng, p50/p95 từ bấm đến ACK, số BUSY/quota/timeout, số retry và thời gian xử lý hết hàng đợi. Đối chiếu ID với Sheet thử. Nếu chưa đạt, đề xuất nộp lệch nhóm 1–2 phút và chạy lại kịch bản đã duyệt.\n\n## Nguồn cần đối chiếu trước chạy\n\n- Apps Script quotas: https://developers.google.com/apps-script/guides/services/quotas\n- Sheets API usage limits: https://developers.google.com/workspace/sheets/api/limits\n- Values.get và UNFORMATTED_VALUE: https://developers.google.com/workspace/sheets/api/reference/rest/v4/spreadsheets.values/get\n- Giới hạn tệp Google Sheets: https://support.google.com/drive/answer/37603\n\nNgày rà nguồn trong môi trường này: 19/10/2026. Các trang Google trả lỗi mạng proxy 403, nên chưa xác minh được hạn mức hiện hành. Không coi con số 30 lượt thực thi/tài khoản hoặc 50.000 ký tự/ô trong góp ý là số đã xác minh. Mã áp giới hạn nội bộ bảo thủ 13.000 UTF-16 code units, không phụ thuộc việc mặc định hạn mức Google. `login*` và submit vẫn dùng chung script lock với tryLock 1,5 giây; phải ghi tác động này trong báo cáo.\n\n## Mẫu kết quả\n\nTrạng thái: UNRUN. Người chạy: chờ phân công. Deployment/Sheet thử: ghi trong hồ sơ riêng. Kịch bản được duyệt: chờ. Số liệu ACK/độ trễ/lỗi/ID: chưa có. Kết luận: chưa được tuyên bố đạt tải dự kiến.\n", "docs/QUAN_LY_SHEET.md": "# Quản lý học sinh và đồng bộ 1 phút — 2.8.0\n\nGoogle Sheet đã cấu hình trong SPREADSHEET_ID tiếp tục là nơi lưu dữ liệu trung tâm. Bản này thêm hai trang quản lý đọc trực tiếp dữ liệu nguồn, không tạo một Sheet công khai hoặc sao chép mật khẩu sang báo cáo.\n\n## Hai trang quản lý\n\n**quan_ly_hoc_sinh**: một dòng mỗi tài khoản, gồm mã học sinh, trường, mã lớp, trạng thái tài khoản, các tuần đã nộp, số tuần nộp/4, phần trăm hoàn thành chương trình, các tuần đang làm, lần cập nhật gần nhất và số bài đã nộp. Tài khoản chưa bắt đầu cũng có dòng nếu đã đăng ký trong tai_khoan. Mã giống nhau khác lớp không bị ghép chung.\n\n**quan_ly_hoc_tap**: một dòng mỗi tài khoản/tuần. Hiện trạng thái chưa bắt đầu/đang làm/đã nộp/đang làm lượt mới; bước hiện tại/tổng bước; số ô đã điền/tổng ô; phần trăm ô đã điền; tiến độ chương trình; ID và thời điểm cập nhật; từng câu trả lời Thử, Nghĩ 1–3, Nối, sản phẩm, chia sẻ, tự đánh giá và các trường riêng của tuần 3–4.\n\nBảng chi tiết thể hiện trạng thái mới nhất phù hợp với thời điểm máy chủ nhận. Bài đã nộp không biến thành nháp vì một lần gửi lại cũ. Lượt mới đang viết vẫn hiển thị riêng trạng thái đang làm lượt mới, còn tuần đó vẫn được tính là đã nộp. Bài/lượt cũ giữ nguyên trong chu_trinh; hai bảng quản lý không phải nơi sửa bài gốc.\n\n“Phần trăm ô đã điền” chỉ đếm ô có nội dung, không chứng minh nội dung đã đạt yêu cầu nộp. “Tiến độ chương trình” chỉ tính các tuần đã được máy chủ nhận bài, không tính nháp và không phải điểm năng lực hoặc điểm nghiên cứu. Không có chỉ số khẳng định 100% đồng bộ của một học sinh đang offline: máy chủ chưa biết phần chưa gửi của thiết bị đó.\n\n## Chu kỳ đồng bộ\n\n- Nháp lưu trên thiết bị trước. Khi trang đang mở, đã đăng nhập và tải tiến trình thành công, app kiểm tra nội dung mỗi **60.000ms**; chỉ gửi khi có thay đổi. Chu kỳ không bị dời lại mỗi lần gõ, nên người đang viết liên tục vẫn được lưu bản mới tại kỳ đồng bộ.\n- Tại kỳ gửi, app lấy nội dung hiện tại trong ô viết, kể cả phần chưa kịp debounce. Nháp và gói chờ được giữ trên máy trước khi gọi mạng. Lần xác nhận gần nhất hiện trên màn hình.\n- Nộp bài, chuyển bước, rời màn hình hoặc đăng xuất vẫn có checkpoint lưu ngay; không đợi hết phút. Đây là các lần lưu bổ sung để tránh mất phần đang làm, không phải một giới hạn cấm gửi trong vòng một phút.\n- Mất mạng/Google trả lỗi/hết phiên: giữ nháp trên máy; gửi lại khi mạng và xác thực cho phép. Mutation ID/revision chống trùng và chống ghi đè giữa thiết bị. Đăng xuất dừng timer của tài khoản cũ.\n- Đồng hồ trình duyệt có thể chạy chậm khi thiết bị ngủ hoặc tab bị hạn chế; không thể cam kết lưu khi trang đã đóng hoặc chưa có mạng. Chỉ đổi thiết bị sau trạng thái đã đồng bộ nếu muốn có toàn bộ phần mới trên máy khác.\n\nHai trang quản lý dùng custom functions XOAY_STUDENTS và XOAY_MANAGEMENT, nhận **trực tiếp ba vùng nguồn** tai_khoan!A2:D, nhap_hoc_tap!A2:X, chu_trinh!A2:Z. Khi nháp/bài thay đổi, Google Sheets tính lại báo cáo theo các vùng phụ thuộc; không cần trigger quét/ghi thêm từng học sinh mỗi phút. Google có thể cần thời gian tính lại sau khi nhận dữ liệu. Việc tính lại không truy cập API bên ngoài và không sửa bảng nguồn.\n\nMốc cập nhật trên Sheet là chuỗi ISO UTC (đuôi Z); trạng thái trên trình duyệt hiển thị giờ thiết bị. PIN/salt/hash/token không được đưa vào báo cáo hoặc HTML. Nội dung từ nháp/bài được kiểm tra an toàn lại trước hiển thị. Bản gốc trước khi che vẫn chỉ trên thiết bị đã viết/bản sao riêng. Các công thức không phân tích AI hay tự chấm câu trả lời.\n\n## Bật trên dự án Apps Script\n\n1. Thử trên Sheet riêng với tài khoản và dữ liệu giả trước. Giữ cấu hình, mật khẩu và bảng dữ liệu hiện có do chủ dự án quản lý.\n2. Cập nhật đủ **Code.gs, Accounts.gs, Learning.gs, Management.gs, Schema.gs, Index.html** từ cùng bộ 2.8.0. Management.gs là tệp Script mới; manifest không thêm quyền mới.\n3. Chạy setup_ để tạo các bảng còn thiếu và hai trang quản lý. Nếu đã có các bảng nguồn, có thể chạy riêng setupManagement_. Hàm chỉ đặt công thức trong hai trang do ứng dụng quản lý; gặp trang cùng tên có nội dung riêng thì dừng, không xóa/ghi đè dữ liệu đó.\n4. Trang chi tiết có 27 cột; hàm tự thêm cột/hàng khi cần, cố định tiêu đề và tạo bộ lọc. Đừng gõ vào vùng kết quả công thức. Nếu báo #REF vì có ô cản vùng bung mảng, giữ bản sao nội dung riêng rồi xử lý trên đúng trang báo cáo, không xóa dữ liệu nguồn.\n5. Công thức được chọn dấu phân cách theo locale Sheet (vi_VN dùng dấu chấm phẩy; en_US dùng dấu phẩy). Nếu tài khoản có locale đặc biệt và Sheets báo lỗi phân tích, kiểm tra dấu phân cách trong A1; dùng đủ ba vùng nguồn ở trên. Nếu báo không tìm thấy custom function, kiểm tra đã lưu Management.gs trong đúng dự án **gắn với Sheet**.\n6. Deploy → Manage deployments → Edit → **New version**. Học sinh dùng link /exec; HTML/GitHub Pages xem thử không ghi vào Sheet.\n7. Mở Sheet bằng tài khoản được cấp quyền quản lý: lọc theo lớp, mã hoặc tuần; gõ bài ở trình duyệt thử và chờ một chu kỳ 60 giây để kiểm tra câu trả lời và thời điểm cập nhật. Thử nộp tuần 1 rồi vào tuần 2; dữ liệu và tiến độ tuần 1 vẫn còn.\n\nGiữ Sheet ở chế độ Hạn chế. Cấp quyền mở Sheet cho chủ dự án/nhóm nghiên cứu/GV hướng dẫn đúng phạm vi; một tab báo cáo trong cùng tệp không phải cơ chế che các tab nguồn. GVCN chỉ được xem tiến độ lớp vẫn dùng API/màn hình Tiến độ lớp hiện có; không vì có bảng quản lý mà được đọc toàn bộ câu trả lời hoặc nháp. Không cung cấp link Sheet nguồn cho học sinh.\n\n## Kiểm chứng\n\nTest giả lập đã kiểm tra mốc 59.999/60.000ms, nội dung mới nhất khi đang gõ, chu kỳ sau, không ghi lại dữ liệu không đổi, offline/reconnect, dừng timer khi đăng xuất; bảng quản lý kiểm tra hai tài khoản, mã trùng khác lớp, mã lớp cũ, nội dung bị che, bài/lượt mới, công thức và setup không xóa dữ liệu.\n\nChưa chạy trên Sheet thật; cần nghiệm thu custom functions/locale/quyền Google, quota ghi và thời gian tính lại với nhóm nhỏ rồi quy mô dự kiến theo kế hoạch tải #4. Đặt timer 60 giây không tự chứng minh cả đợt học sinh đều được phục vụ đúng mỗi phút khi Google giới hạn tài nguyên. Không có credential hoặc danh sách thật trong mã nguồn.\n", "docs/issues/be-minute-management.md": "## Yêu cầu\nChủ dự án cần Google Sheets tự hiển thị dữ liệu từng tài khoản và câu trả lời theo tuần; cập nhật định kỳ 60 giây. Nguồn hiện có đã lưu nháp an toàn và bài nộp nhưng nháp là JSON chia ô, khó theo dõi.\n\n## Phạm vi\n- App gửi nháp có thay đổi theo chu kỳ 60.000ms; nộp bài/đăng xuất/chuyển bước vẫn có checkpoint giữ dữ liệu. Giữ hàng đợi offline, mutation ID, revision và xác thực tài khoản.\n- Tạo hai trang Sheets quan_ly_hoc_sinh và quan_ly_hoc_tap qua setup riêng; tự tính từ tài khoản A:D, nháp và bài đã nộp, không trả PIN/hash/token.\n- Custom functions chỉ xử lý các mảng ô được truyền vào, không tự đọc Sheet/Properties bằng RPC. Theo dõi mã/trường/lớp, tuần, trạng thái, số tuần nộp/%, bước, số ô đã điền/%, từng câu trả lời và thời điểm máy chủ cập nhật. Không dùng % này làm điểm năng lực hoặc khẳng định 100% đồng bộ khi học sinh offline.\n- Giữ dữ liệu gốc và quyền GVCN hiện tại; view chỉ dành người có quyền Sheet do chủ dự án quản lý. Không truy cập Sheet thật.\n\n## Nghiệm thu\nFake timer kiểm tra chưa gửi trước 60 giây, gửi tại mốc 60 giây và lặp khi còn thay đổi, lấy nội dung mới nhất dù đang gõ, không gửi khi offline/đăng xuất. Fake Sheet kiểm tra hai tài khoản, mã trùng khác lớp, bí danh lớp cũ, nháp bị che an toàn, bài đã nộp, lượt mới/ID cũ gửi lại, bảng tổng quan đầy đủ tài khoản, nội dung không có credential. Setup không xóa dữ liệu và có thể chạy lại. Kiểm tra deployment Google/quota thật vẫn cần Sheet thử của chủ dự án.\n\n## Kiểm toán mã 2.8.0\n\nToàn bộ tiêu chí nghiệm thu kiểm được bằng mã đều đạt:\n\n| Tiêu chí | Kết quả | Bằng chứng |\n|---|---|---|\n| Chỉ gửi sau mốc 60 giây, lặp lại khi còn thay đổi | Đạt | `src/learning.js:35` `setInterval(syncMinute, 60000)` |\n| Chu kỳ không bị dời lại mỗi lần gõ | Đạt | `src/app.js:553-565` debounce 250ms chỉ gọi `remember()`; `src/learning.js:35` chỉ tạo timer khi chưa có |\n| Lấy nội dung mới nhất trong ô tại kỳ gửi | Đạt | `src/learning.js:98` gọi `collect()` đọc thẳng DOM trước khi `remember()` |\n| Không gửi khi offline; đăng xuất dừng timer | Đạt | `src/learning.js:107` chặn `!navigator.onLine`; `src/app.js:304` gọi `reset()` |\n| Không ghi nháp khi nội dung không đổi | Đạt | `src/learning.js:31` bỏ qua khi fingerprint trùng bản đã lưu và không có gói chờ |\n| Custom function không tự đọc Sheet/Properties | Đạt | `apps-script/Management.gs:67-77` chỉ nhận ba mảng tham số, không RPC |\n| Không trả PIN/salt/hash/token | Đạt | `apps-script/Management.gs:3-4` hai danh sách cột không có trường credential |\n| Mã giống nhau khác lớp không ghép chung | Đạt | `apps-script/Management.gs:8` khoá gồm `truong`, lớp đã chuẩn hoá và `ma` |\n| Tài khoản chưa bắt đầu vẫn có dòng | Đạt | `apps-script/Management.gs:41-58` duyệt theo danh sách tài khoản, không chỉ theo bài |\n| Nội dung câu trả lời được che lại trước hiển thị | Đạt | `apps-script/Management.gs:28` cho bài nộp, `:36` cho nháp |\n| `setupManagement_` không ghi đè trang có nội dung riêng, chạy lại được | Đạt | `apps-script/Management.gs:93` yêu cầu `A1` phải là công thức của chính hàm tương ứng |\n| Phần trăm chỉ là ô đã điền / tuần đã nộp | Đạt | `apps-script/Management.gs:42,51` tính từ `submitted.size` và số ô có nội dung |\n\nCòn mở: cài thật trên Google, xác nhận thời gian tính lại bung mảng và quota theo [kế hoạch tải](../LOAD_TEST_PLAN.md). Lưu ý một ràng buộc cố định: `STUDENT_MANAGEMENT_HEADERS` và `managementModel_` đều giả định đúng 4 tuần; nếu chương trình đổi số tuần thì phải sửa cả hai cùng lúc, vì `build.py` đang chặn mọi cấu hình khác 4 tuần.\n", "docs/MA_LOP.md": "# Mã lớp thống nhất — 2.7.1\n\nDữ liệu mới gửi và ghi Sheet dùng mã ngắn. Phần chú thích chỉ là nhãn hiển thị:\n\n| Giá trị lop | Nhãn giao diện / bí danh cũ được nhận |\n|---|---|\n| 10A3 | 10A3 (10 Tin) |\n| 11E1 | 11E1 (11 Văn) |\n| LB-11A | LB-11A (11A Lộc Bình) |\n| 12A2 | 12A2, nhóm Chi Lăng cũ |\n\nBản 2.7 trước đây FE và Schema đều dùng nhãn nên không tự lệch khi cùng phiên bản. Tuy nhiên, dữ liệu đó không khớp hệ thống ngoài dùng mã ngắn. Bản 2.7.1 chuẩn hóa đăng nhập, bài nộp, nháp, tiến độ, CSV và báo cáo; chỉ nhận các bí danh đã khai báo chính xác, không cắt hậu tố tùy ý hoặc bỏ kiểm tra trường.\n\nKhông cần đổi mật khẩu, xóa nháp hoặc nộp lại bài. Máy chủ ghép cả dữ liệu lớp cũ/mới về cùng mã, giữ nguyên ID chống trùng; gửi lại một bài có lớp dạng cũ được ACK nếu nội dung còn lại giống nhau. Mật khẩu cũ được kiểm tra với HMAC gắn tên lớp cũ hoặc mã chuẩn. Tài khoản trùng sau chuẩn hóa sẽ báo cấu hình lỗi thay vì ghép nhầm hai tài khoản. Bản trên trình duyệt giữ khóa lưu cũ để bài/nháp không biến mất; khóa nội bộ này không phải giá trị lop gửi lên Sheet.\n\nTEACHER_PINS và COORDINATOR_PINS ưu tiên dùng khóa Tên trường|mã lớp. Khóa tên lớp cũ vẫn được nhận nếu chưa chuyển đổi. Nếu cả hai khóa có PIN khác nhau, máy chủ yêu cầu chủ dự án sửa cấu hình thay vì tự chọn.\n\nCập nhật đồng bộ Code.gs, Accounts.gs, Learning.gs, Schema.gs, Index.html từ cùng bộ 2.7.1, rồi Deploy New version. ClassIds được build sẵn trong Schema.gs và HTML, không cần thêm file Script riêng. Không dán đè hoặc đổi hàng loạt các cột trên Sheet thật để nâng cấp. Các bảng cũ được đọc tương thích; bản ghi mới dùng mã chuẩn. Nếu xuất dữ liệu cũ sang hệ thống nghiên cứu bên ngoài, chuẩn hóa cột lớp trong bản xuất riêng theo bảng trên, không sửa ID hoặc bản gốc.\n\nĐã kiểm thử bằng dữ liệu giả: mật khẩu theo HMAC cũ, ô lớp đã đổi sang mã, phiên/PIN giáo viên, tiến độ và Sổ/nháp cũ, gửi lại cùng ID, dữ liệu mới chỉ ghi mã, giá trị select khác nhãn hiển thị, CSV không có chú thích. Chưa kiểm chứng triển khai Google hoặc truy cập Sheet thật. Tham chiếu issue #11.\n", "docs/TIEN_TRINH_HOC_TAP.md": "# Tiếp tục hành trình qua các tuần — 2.7.0\n\nHọc sinh đăng nhập bằng đúng mã, trường/lớp và mật khẩu. App tải tiến độ đã nộp, nháp đã đồng bộ và bài cũ của chính tài khoản; không tải bài học sinh khác. Có thể tiếp tục đúng bước đang viết vào tuần sau hoặc trên thiết bị khác khi nháp đã được Sheet xác nhận.\n\n## Những gì được giữ\n\n- `chu_trinh`: bài đã nộp, giữ nguyên ID và nội dung đã xử lý an toàn. Chỉ bài có trong bảng này mới được tính là hoàn thành tuần.\n- `tien_do`: các tuần đã nhận. Nháp, thời gian hoạt động và số gợi ý không trở thành điểm nghiên cứu.\n- `nhap_hoc_tap`: một trạng thái theo mã/trường/lớp/tuần, gồm ID nháp, bước, câu trả lời chưa hoàn tất, thời gian hoạt động, gợi ý và sản phẩm gốc nếu có. Nội dung có từ khóa an toàn được che cả trước RPC và tại máy chủ. JSON chia thành các ô tối đa 10.000 ký tự, ghi RAW.\n- Trình duyệt: nháp và bài gốc trước khi che; hàng đợi gửi; bản sao khi giải quyết hai nháp khác nhau. Không gửi toàn bộ bản sao trình duyệt lên máy chủ, không chứa PIN/token trong bản sao.\n\nNháp trên Sheet là bản đã che an toàn. Nếu dùng thiết bị mới, phần đã che không thể tự phục hồi nguyên văn; bản gốc vẫn trên thiết bị đã viết hoặc bản sao riêng. Sổ hiển thị bài cũ đã nộp sau khi đăng nhập, dùng được làm sản phẩm gốc ở tuần 4.\n\n## Cách lưu và tiếp tục\n\n1. Đăng nhập khi có mạng, chờ “Đang khôi phục…” hoàn tất trước khi mở tuần. Hệ thống đối chiếu dữ liệu trên máy và Sheet trước khi tự gửi nháp để tránh một thiết bị cũ ghi đè dữ liệu mới.\n2. Khi viết, nháp lưu trên máy trước, rồi tự đồng bộ sau một khoảng ngắn khi có mạng; chuyển bước, rời màn hình hoặc đăng xuất cũng thử lưu. Trạng thái “chờ đồng bộ” chưa phải đã lưu lên Sheet. Không dựng lại ô đang viết khi nhận phản hồi mạng.\n3. Lần sau đăng nhập cùng tài khoản, nút Hành trình ghi **Viết tiếp tuần…** nếu có nháp; nếu tuần trước đã nộp thành công thì gợi ý tuần tiếp theo. Mỗi tuần có nháp riêng, không bắt làm lại tuần cũ.\n4. Mất mạng hoặc hết phiên: nháp vẫn trên máy; khi mạng trở lại/xác thực lại sẽ tiếp tục gửi. Nếu đóng trang trước khi nháp được xác nhận lên Sheet thì thiết bị khác chưa có phần mới đó. Giữ thiết bị/bản sao khi còn trạng thái chờ.\n5. Hai thiết bị cùng sửa một tuần: máy chủ kiểm tra revision. Bản cũ bị từ chối ghi đè và app giữ cả hai. Người học chọn dùng bản trên Sheet hoặc giữ bản trên máy thành lượt mới. Các bản trước khi chọn được giữ trong bản sao JSON của thiết bị; bài đã nộp không bị thay đổi.\n6. Cùng một lần gửi nháp được nhận lại sau timeout không làm tăng revision hay tạo thêm dòng. Nháp có ID đã nộp không xuất hiện lại như bài chưa hoàn thành.\n\nKhông dùng chung phiên của một mã cho nhiều học sinh. Mã giống nhau ở hai lớp là hai tài khoản; bài, nháp và phiên được cách ly theo bộ ba mã/trường/lớp.\n\n## Cập nhật danh sách lớp\n\nTheo xác nhận của chủ dự án, danh sách đang mở gồm 10A3 (10 Tin), 11E1 (11 Văn) ở THPT Chuyên Chu Văn An và LB-11A (11A Lộc Bình) ở Trường PTDTNT THCS & THPT Lộc Bình. Giữ Chi Lăng / 12A2 trong nhóm lớp cũ để đăng nhập, xem bài và tiếp tục dữ liệu đã có; không đổi danh tính của học sinh Chi Lăng thành Lộc Bình.\n\nNT-10A6 và NT-10A7 còn chờ bốc thăm, chưa kích hoạt cả hai. Công cụ nhập workbook chỉ xuất các lớp đang mở; không tự đăng ký lớp ứng viên. Danh sách CSV riêng được nhập qua `nhap_tai_khoan` → `importStudentRoster_`; chỉ thêm mã mới, không xóa mã vắng trong workbook và không đổi mật khẩu cũ. `provisionStudentAccounts_` chỉ cấp mật khẩu cho mã mới chưa được cấp. Nhận diện tài khoản dựa trên danh sách được đăng ký + mật khẩu, không chặn một mã chỉ vì giống ví dụ trong tài liệu cũ.\n\n## Nâng cấp Apps Script\n\n1. Thử trên Sheet riêng với dữ liệu giả trước; giữ bản sao Sheet và Script Properties do chủ dự án quản lý.\n2. Cập nhật **Code.gs, Accounts.gs, Learning.gs, Schema.gs, Index.html** từ cùng phiên bản. `Learning.gs` là tệp Script mới; dùng đúng Index trong thư mục `apps-script`, không dùng HTML demo trong `dist`.\n3. Chạy `setup_`. Hàm thêm `nhap_hoc_tap` khi chưa có, kiểm tra header và dừng khi không khớp; không xóa bảng bài/tài khoản/tiến độ cũ. Không chạy hàm xóa hoặc đổi ID để sửa lỗi nâng cấp.\n4. Nhập CSV danh sách riêng rồi chạy `importStudentRoster_`, sau đó `provisionStudentAccounts_` để nhận file mật khẩu **chỉ của các mã mới**. Giữ nguyên `STUDENT_PIN_SECRET`, `TEACHER_PINS`, `COORDINATOR_PINS`; bổ sung PIN giáo viên/điều phối riêng cho lớp mới nếu cần, không dùng chung PIN học sinh.\n5. Deploy → Manage deployments → Edit → **New version**. Kiểm tra trên link `/exec` bằng hai trình duyệt thử: viết nửa tuần, đăng xuất/vào lại, đổi thiết bị, hoàn tất tuần, vào tuần tiếp theo, sửa sản phẩm tuần 4, mất mạng và hai thiết bị cùng sửa.\n\nAPI `getStudentLearning`/`saveStudentDraft` chỉ dành cho phiên học sinh của chính tài khoản. Giáo viên vẫn chỉ xem mã đã nộp + tuần trong lớp được cấp; không đọc nháp hoặc bài riêng qua phiên giáo viên. Bảng nháp không được tự động gộp vào dữ liệu nghiên cứu bài đã nộp. Chủ dự án quản lý quyền Google với Sheet nguồn.\n\nUnit/DOM/Chromium dùng dữ liệu giả; không phải bằng chứng Google deployment, quota hoặc tải cả đợt đã đạt. Các phép gọi mới cần nghiệm thu trong kế hoạch tải #4. Môi trường phát triển không truy cập/ghi vào Sheet thật.\n", "docs/HUONG_DAN_HOC_SINH.md": "# Xoay Chiều — hướng dẫn nhanh cho học sinh\n\n1. Mở đúng link do giáo viên cung cấp bằng Chrome hoặc Safari. Nếu mở từ Zalo/Facebook mà không lưu được, chọn mở bằng trình duyệt ngoài. Không dùng chế độ ẩn danh cho bài cần giữ.\n2. Dùng đúng mã trên phiếu khảo sát, chọn trường/lớp và nhập mật khẩu riêng được cấp; nếu quên mật khẩu, nhờ người phụ trách đặt lại. Cần mạng để đăng nhập mới. Không chia sẻ mật khẩu; không nhập họ tên, số điện thoại, địa chỉ hoặc ảnh. Giữ mã riêng, dùng cùng mã trong cả bốn tuần.\n3. Làm theo từng bước. Gợi ý và câu hỏi đào sâu giúp bạn tự suy nghĩ; app không chấm đúng/sai. Tuần 4 chọn sản phẩm cũ của chính bạn rồi tạo bản sửa; bài gốc vẫn còn.\n4. Dùng cùng thiết bị, trình duyệt và link trong bốn tuần. Đừng xóa dữ liệu trình duyệt, dọn bộ nhớ app, đổi trình duyệt hoặc đóng chế độ ẩn danh khi còn bài chưa gửi.\n5. Mất mạng khi trang đã tải: tiếp tục làm nếu trạng thái lưu không báo lỗi. “Chờ gửi” chưa phải đã nộp thành công; chờ “Máy chủ đã xác nhận”. Không bấm Làm lượt mới chỉ để thử gửi lại bài cũ.\n6. Nếu máy báo không lưu được: dừng nhập thêm, giữ trang mở và tải bản sao trong Cài đặt/Sổ của mình nếu trình duyệt cho phép; nhờ giáo viên hỗ trợ. “Xem thử không lưu” chỉ để thử giao diện, mất bài khi đóng/tải lại, không dùng cho bài thật.\n7. Khi xong, bấm **Đăng xuất** ở thanh thông tin phiên để trở về màn hình nhập mã. Nháp/bài cũ vẫn còn; lần sau nhập đúng mã, trường, lớp và mật khẩu để tiếp tục. Đăng nhập lại hoặc đổi thiết bị tải được tiến độ đã nộp, nháp đã đồng bộ và bài cũ được khôi phục từ Sheet; bản gốc trước khi che và phần còn chờ đồng bộ vẫn trên thiết bị đã viết/bản sao riêng. Trên máy chung, chọn đúng mã của mình; đổi mã không xóa dữ liệu người trước. Người được dùng trình duyệt có thể xem dữ liệu trên máy, nên không ghi thông tin riêng tư. Không khôi phục bản sao của bạn lên trình duyệt đang có dữ liệu người khác.\n8. Nội dung có từ khóa an toàn sẽ được che trước khi gửi, nhưng bản gốc/bản sao vẫn có trên máy. Nếu đang gặp chuyện cần hỗ trợ, nói với thầy cô hoặc người lớn tin cậy; app không tự thông báo thay bạn.\n\nTrước buổi học, giáo viên cần thử trên điện thoại thực tế. Hướng dẫn này chưa thay thế kiểm tra Zalo/Facebook, tiết kiệm pin, tắt màn hình và 4G mất/kết nối lại.\n\nKhi vào lại, chờ khôi phục tiến trình, chọn **Viết tiếp tuần…**. “Nháp trên máy/chờ đồng bộ” chưa có trên thiết bị khác; chỉ đóng trang sau khi trạng thái báo đã đồng bộ nếu muốn đổi máy. Nếu có hai bản nháp, chọn bản muốn tiếp tục; app giữ bản sao của cả hai trên máy. Nháp chưa được tính là tuần đã nộp.\n\nTừ 2.8, nháp có thay đổi tự đồng bộ mỗi 60 giây khi trang mở và có mạng. Màn hình có lần xác nhận gần nhất. Nộp/thoát vẫn thử lưu ngay; phần còn chờ chỉ ở máy nguồn.\n", "docs/TAI_KHOAN_HOC_SINH.md": "# Nhập tài khoản từ Excel và cấp mật khẩu — 2.7.0\n\nBản mới dùng mã học sinh trong danh sách riêng làm tài khoản, mật khẩu ngẫu nhiên do chủ dự án cấp. Giao diện thật gửi `password` đến `loginStudent`, chỉ mở bài sau khi máy chủ xác nhận. Biết mã chưa đủ để vào học. Mật khẩu mới 8–64 ký tự; PIN số cũ 6–12 chữ số đã cấp vẫn dùng được, không tự đổi hash/PIN cũ.\n\n## Cách làm nhanh với danh sách đã chuẩn bị\n\n1. Dùng **Sheet thử/dữ liệu giả trước**. Cập nhật đủ `Code.gs`, `Accounts.gs`, **`Learning.gs`**, `Schema.gs`, `Index.html`, giữ nguyên Script Properties. Chạy `setup_` nếu chưa có bảng tài khoản. Các hàm quản trị tên kết thúc `_` chỉ chạy từ editor.\n2. Chạy **prepareStudentImport_** để tạo bảng `nhap_tai_khoan` ba cột `ma, truong, lop`. Mở CSV danh sách riêng đã xuất, chép toàn bộ A:C (gồm dòng tiêu đề) vào A1 của **riêng bảng nhập này**. Không dán workbook khảo sát vào bảng tài khoản/bài làm, không thay thế toàn bộ Sheet.\n3. Chạy **importStudentRoster_**. Máy chủ kiểm tra toàn bộ danh sách rồi thêm tài khoản mới, giữ nguyên mã/mật khẩu đã có; chạy lại không nhân đôi. Mã trùng giữa các lớp được giữ thành tài khoản khác theo bộ ba mã/trường/lớp. Mã trùng trong cùng lớp hoặc lớp ngoài cấu hình bị từ chối trước khi ghi.\n4. Chạy **provisionStudentAccounts_**. Máy chủ sinh mật khẩu riêng cho mã mới chưa cấp, lưu salt + HMAC; `STUDENT_PIN_SECRET` nằm trong Script Properties và phải giữ nguyên. Quay về Sheet, hộp thoại có liên kết **Tải file tài khoản và mật khẩu (CSV)** và bảng để sao chép. Mật khẩu rõ chỉ hiện trong lần cấp này; file tải về do người phụ trách giữ và cấp riêng từng em. Không đăng file lên Git, nhóm lớp hoặc dữ liệu nghiên cứu. Nếu hộp thoại bị mất, chọn đúng dòng và chạy **resetSelectedStudentPin_** để cấp mật khẩu mới.\n5. Deploy → Manage deployments → Edit → **New version** → Deploy. Cho học sinh dùng link `/exec`: nhập mã, chọn đúng trường/lớp, nhập mật khẩu. HTML độc lập chỉ là demo, ô mật khẩu vô hiệu hóa và nút ghi rõ **Vào bản xem thử**; không dùng bản đó để kiểm tra tài khoản thật.\n\n## Tự chuẩn bị CSV từ workbook\n\nChạy `python tools/import_student_roster.py /đường/dẫn/danh_sach.xlsx --output /thư/mục/riêng/tai_khoan.csv`. Công cụ dùng thư viện chuẩn Python, chỉ nhận các sheet lớp khớp cấu hình; chỉ xuất `ma,truong,lop`, bỏ toàn bộ cột khảo sát và sheet hướng dẫn/tổng hợp. Không sửa mã, không sinh mật khẩu cục bộ, không ghi đè file đích đã có; đầu ra phải bên ngoài thư mục mã nguồn. Không đưa workbook, CSV hay mật khẩu thật vào repo/gói source.\n\nCấu hình lớp mới: **10A3 (10 Tin), 11E1 (11 Văn)** thuộc THPT Chuyên Chu Văn An và **LB-11A (11A Lộc Bình)** thuộc Trường PTDTNT THCS & THPT Lộc Bình. Giữ Chi Lăng / 12A2 trong nhóm lớp cũ; NT-10A6/NT-10A7 còn chờ chốt, chưa kích hoạt. Mã sinh viên/học sinh lấy đúng cột MÃ HS, không dùng STT làm tài khoản. Danh sách lớp đã đổi theo đợt triển khai mới; không tự đổi trường/lớp trong bài hoặc nháp cũ để chuyển danh tính. Chủ dự án xử lý dữ liệu lớp cũ riêng trước khi nâng bản nếu còn bài chờ gửi.\n\n## Khóa tài khoản và đặt lại mật khẩu\n\nChọn một dòng học sinh trong `tai_khoan`, chạy `resetSelectedStudentPin_` từ editor. Hàm giữ tên cũ để tương thích, nhưng tạo mật khẩu chữ/số mới. Mật khẩu cũ và phiên cũ mất hiệu lực khi gọi máy chủ tiếp theo. Đổi cột `trang_thai` thành `khoa` để dừng tài khoản, `hoat_dong` để mở. Không sửa các cột `pin_salt`, `pin_hash`, `ngay_cap` bằng tay hoặc nhập mật khẩu rõ vào Sheet. Tên cột/khóa còn chữ PIN để giữ tương thích dữ liệu hiện có.\n\nKhông tự thay mã, trường/lớp trên dòng đang dùng để di chuyển học sinh: đó là danh tính khác, cần quyết định cách liên kết dữ liệu trước. Nếu mất kết nối trong lúc cấp mật khẩu, lệnh có thể đã ghi; chọn đúng dòng để đặt lại, không xóa bảng hoặc cấp lại toàn bộ.\n\n## Dữ liệu được lưu\n\n- `chu_trinh`: bài đã xử lý an toàn, mã/trường/lớp, tuần, ID, thời gian và phiên bản. Không chứa PIN/token. Bản gốc trước khi che và nháp giữ trên thiết bị đã viết.\n- `tien_do`: `ma, truong, lop, tuan_1, tuan_2, tuan_3, tuan_4, so_tuan_da_nop, cap_nhat`. Cờ tuần là TRUE/FALSE; số tuần là số đếm hoàn thành, **không phải điểm năng lực/nghiên cứu**. Được máy chủ tổng hợp từ bài đã nhận; không tin dữ liệu tiến độ client. Bảng có dòng khi học sinh đăng nhập/tải tiến độ hoặc nộp bài. Tài khoản chưa dùng có thể chưa có dòng tiến độ.\n- Gửi lại cùng ID/nội dung không thêm bài. Nếu ghi bài thành công nhưng cập nhật tiến độ lỗi, lần gửi lại cùng ID phục hồi tiến độ trước khi xác nhận.\n- Đăng nhập trên thiết bị mới tải lại các tuần đã nộp từ Sheet. Khôi phục nháp/bài đã xử lý an toàn từ Sheet; phần chưa đồng bộ và bản gốc trước khi che vẫn cần thiết bị cũ/bản sao. Không coi thiếu bài trong Sổ là bài đã mất trên Sheet.\n- GVCN vẫn chỉ thấy mã đã nộp và tuần trong đúng lớp qua API tiến độ giáo viên. Không trả danh sách tài khoản chưa nộp, hash hay bài riêng tư; quyết định roster ở #1 vẫn tạm dừng. Người có quyền trực tiếp với Sheet phải do chủ dự án kiểm soát.\n\n## Đăng nhập, mất mạng và đăng xuất\n\nMã + trường/lớp + mật khẩu được xác thực trên máy chủ; biết đúng định dạng mã chưa đủ để nộp. Phiên tối đa 6 giờ, có thể hết sớm khi cache bị Google loại bỏ. Sau 8 lần mật khẩu sai, mã tạm khóa đăng nhập 10 phút; thử tiếp không kéo dài hạn đó. Đổi PIN/khóa mã/đăng xuất thu hồi quyền gọi API. Mật khẩu/PIN và token chỉ ở bộ nhớ của trang, không nằm trong localStorage hoặc bản sao.\n\nĐăng nhập mới/tải lại trang cần mạng và PIN. Khi trang đang mở, mất mạng hoặc hết phiên vẫn có thể viết, lưu nháp và xếp bài chờ trên thiết bị nếu trình duyệt cho lưu. Xác thực lại ngay trên trang không dựng lại ô viết. Chỉ gửi hàng đợi của đúng tài khoản đang xác thực. Đăng xuất giữ nháp, bài cũ, hàng đợi và đưa về màn hình nhập mã; bài chờ của mã khác phải đăng nhập đúng mã mới gửi được.\n\nKhông dùng máy chung cho nội dung riêng tư: dữ liệu cục bộ/bản sao không được mã hóa; đăng xuất không xóa chúng. Giáo viên hỗ trợ học sinh giữ bản sao khi cần đổi máy, không gom bản sao có bài gốc vào nhóm chung.\n\n## Chuyển bản đang dùng\n\nSao lưu cấu hình và dữ liệu do chủ dự án quản lý; thử trên Sheet riêng trước. Chủ dự án tự thêm bảng tài khoản và cấp PIN cho mã đã có, rồi cập nhật đủ năm tệp gồm Learning.gs và New version. Chỉ triển khai khi các học sinh cần sử dụng đã nhận PIN; bản mới từ chối bài chưa xác thực. Bài đang chờ vẫn giữ ID, đăng nhập đúng tài khoản để gửi lại. Không thay ID để vượt xung đột hoặc tự nhập lại bài cũ.\n\nMôi trường phát triển không đọc/ghi Sheet có dữ liệu thật đã cung cấp. Unit/DOM/browser test dùng dữ liệu giả; chưa phải bằng chứng Google deployment, quota hoặc điện thoại thật đã đạt. Checklist trên Sheet thử: cấp PIN hai mã, đăng nhập sai/đúng, nộp bốn tuần, mất mạng/gửi lại, thử token sai mã/lớp/vai trò, đổi PIN, khóa mã, đăng xuất, dùng thiết bị khác xem tiến độ và kiểm tra quyền GVCN. Chỉ chủ dự án thực hiện bước chuyển sang Sheet thật theo quyền đã quản lý.\n\nBản Apps Script được build với `authRequired: true`: nếu bridge Google chưa có, màn hình báo chưa kết nối máy chủ và chặn mở bài, không chuyển sang demo. Khi triển khai phải dùng đúng `apps-script/Index.html`, không dùng `dist/index.html`.\n\nChi tiết tiến trình, lớp cũ và lớp chờ chọn: [tiếp tục hành trình qua các tuần](TIEN_TRINH_HOC_TAP.md). Không tự đổi mật khẩu tài khoản đã có hoặc chuyển mã Chi Lăng sang Lộc Bình.\n\n## Đổi chế độ đăng nhập: chỉ cần mã (29/10/2026)\n\nChủ dự án quyết định học sinh đăng nhập bằng **mã + trường/lớp**, không cần mật khẩu. Thay đổi này đảo ngược yêu cầu chính của issue #9 (\"biết mã chưa đủ để vào học\").\n\n- Máy chủ đọc Script Property `STUDENT_LOGIN_MODE`. Giá trị `ma` (**mặc định**) bỏ hoàn toàn bước kiểm tra mật khẩu; giá trị `mat_khau` quay lại hành vi cũ.\n- Ở chế độ `ma`, dòng trong `tai_khoan` là **không bắt buộc**. Nếu có dòng và `trang_thai = khoa` thì vẫn bị từ chối.\n- Frontend điều khiển bằng cờ `requireStudentPassword` trong `src/config.js`. **Đổi một phía mà không đổi phía kia sẽ khoá toàn bộ học sinh**, vì frontend gửi mật khẩu rỗng còn máy chủ lại đòi mật khẩu.\n\nHệ quả cần chấp nhận: mã học sinh thường in trên phiếu khảo sát và học sinh cùng lớp biết mã của nhau. Ai biết mã đều nộp bài thay được và đọc được nháp, tiến độ của mã đó. Nếu dùng cho dữ liệu thật, nên bật lại `mat_khau` trước buổi chính thức.\n\nBật lại mật khẩu: đặt `STUDENT_LOGIN_MODE = mat_khau`, đặt `requireStudentPassword: true` trong `src/config.js`, chạy `python build.py`, dán lại `apps-script/Index.html`, rồi Deploy New version.\n\n## Sửa lỗi cú pháp `||=` (29/10/2026)\n\nApps Script V8 trả `ParseError: Unexpected token =` và chặn **toàn bộ** tệp `.gs` khi gặp toán tử gán logic `||=` (ES2021). Đã thay cả 8 chỗ dùng `||=`, `&&=`, `??=` trong `Accounts.gs`, `Code.gs`, `Management.gs`, `src/app.js`, `src/learning.js` bằng cấu trúc `if`. Các toán tử ES2020 như `??` và `?.` vẫn dùng được.\n"};
    const select = document.getElementById('file');
    const feedback = document.getElementById('feedback');
    for (const name of Object.keys(FILES)) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.append(option);
    }
    function show() {
      const source = FILES[select.value];
      document.getElementById('code').textContent = source;
      document.getElementById('info').textContent = source.split('\n').length + ' dòng';
      feedback.textContent = '';
    }
    select.onchange = show;
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(FILES[select.value]);
        feedback.textContent = 'Đã sao chép ' + select.value;
      } catch {
        const selection = getSelection();
        const range = document.createRange();
        range.selectNodeContents(document.getElementById('code'));
        selection.removeAllRanges(); selection.addRange(range);
        feedback.textContent = 'Trình duyệt không cho tự sao chép. Nội dung đã được chọn; nhấn Ctrl+C hoặc Cmd+C.';
      }
    };
    document.getElementById('download').onclick = () => {
      const url = URL.createObjectURL(new Blob([FILES[select.value]], {type:'text/plain;charset=utf-8'}));
      const link = document.createElement('a'); link.href=url; link.download=select.value.split('/').pop(); link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    show();
  </script>
