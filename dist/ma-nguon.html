-enter .4s ease-out backwards\n  }\n\n  .cards > .card:nth-child(2) { animation-delay: .06s }\n  .cards > .card:nth-child(3) { animation-delay: .12s }\n  .cards > .card:nth-child(4) { animation-delay: .18s }\n\n  button,\n  .card,\n  .rating label {\n    transition: transform .2s ease, box-shadow .2s ease,\n      border-color .2s ease, background-color .2s ease, color .2s ease\n  }\n\n  input,\n  select,\n  textarea {\n    transition: border-color .2s ease, background-color .2s ease\n  }\n\n  .progress i {\n    transition: width .35s ease\n  }\n\n  .compass:after {\n    animation: compass-turn 1.2s ease-out both\n  }\n\n  .toast:not(.hidden) {\n    animation: toast-enter .22s ease-out\n  }\n\n  dialog[open] {\n    animation: page-enter .25s ease-out\n  }\n\n  button:not(:disabled):active {\n    transform: scale(.98)\n  }\n}\n\n@media(hover:hover) and (prefers-reduced-motion:no-preference) {\n  .card:hover {\n    transform: translateY(-4px);\n    box-shadow: 0 16px 36px #222c4b14\n  }\n\n  button:not(:disabled):hover {\n    transform: translateY(-2px)\n  }\n\n  .rating label:hover {\n    border-color: var(--gold)\n  }\n}\n\n/* Nhóm tự đánh giá có legend đọc được bằng trình đọc màn hình. */\n.ratingfield {\n  border: 0;\n  padding: 0;\n  min-width: 0;\n}\n\n.ratingfield legend {\n  margin-bottom: 12px;\n  font-weight: 600;\n}\n\n/* Lớp trang trí đứng sau nội dung, không nhận thao tác. */\n.main {\n  position: relative;\n  isolation: isolate\n}\n\n.main::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n  pointer-events: none;\n  background:\n    radial-gradient(ellipse at 85% 4%, var(--dream-gold), transparent 35%),\n    radial-gradient(ellipse at 98% 24%, var(--dream-lilac), transparent 36%),\n    radial-gradient(ellipse at 5% 48%, var(--dream-rose), transparent 38%),\n    radial-gradient(ellipse at 80% 85%, var(--dream-sage), transparent 40%);\n  border-radius: 0 0 45% 10%\n}\n\nbutton {\n  position: relative;\n  overflow: hidden\n}\n\n.button-ripple {\n  position: absolute;\n  width: 24px;\n  height: 24px;\n  margin: -12px;\n  border-radius: 50%;\n  background: currentColor;\n  opacity: 0;\n  pointer-events: none\n}\n\n.nav button.on {\n  box-shadow: inset 3px 0 var(--gold)\n}\n\n.field:focus-within > span {\n  color: var(--accent)\n}\n\n@keyframes ripple-out {\n  from { opacity: .2; transform: scale(0) }\n  to { opacity: 0; transform: scale(var(--ripple-scale, 20)) }\n}\n\n@keyframes ambient-drift {\n  from { opacity: .5; transform: translateY(-8px) }\n  to { opacity: 1; transform: translateY(8px) }\n}\n\n@keyframes compass-orbit {\n  from { transform: rotate(45deg) }\n  to { transform: rotate(135deg) }\n}\n\n@keyframes progress-reveal {\n  from { transform: scaleX(0) }\n  to { transform: scaleX(1) }\n}\n\n@keyframes hint-enter {\n  from { opacity: 0; transform: translateX(-8px) }\n  to { opacity: 1; transform: translateX(0) }\n}\n\n@media(prefers-reduced-motion:no-preference) {\n  .main::before {\n    animation: ambient-drift 5s ease-in-out 2 alternate\n  }\n\n  .logo-orbit {\n    transform-origin: 32px 32px;\n    transition: transform .6s cubic-bezier(.2, .7, .2, 1)\n  }\n\n  .brand:hover .logo-orbit,\n  .brand:focus-visible .logo-orbit {\n    transform: rotate(90deg)\n  }\n\n  .compass:before {\n    animation: compass-orbit 8s ease-in-out 2 alternate\n  }\n\n  .button-ripple {\n    animation: ripple-out .6s ease-out forwards\n  }\n\n  .progress i {\n    transform-origin: left;\n    animation: progress-reveal .7s cubic-bezier(.2, .7, .2, 1) backwards\n  }\n\n  .welcome > *,\n  .hero > div:first-child > *,\n  .work .panel,\n  .five > div {\n    animation: page-enter .45s ease-out backwards\n  }\n\n  .welcome > :nth-child(2),\n  .hero > div:first-child > :nth-child(2),\n  .five > :nth-child(2) { animation-delay: .06s }\n\n  .welcome > :nth-child(3),\n  .hero > div:first-child > :nth-child(3),\n  .five > :nth-child(3) { animation-delay: .12s }\n\n  .welcome > :nth-child(4),\n  .five > :nth-child(4) { animation-delay: .18s }\n\n  .five > :nth-child(5) { animation-delay: .24s }\n\n  .hint,\n  .notice:not(.hidden),\n  .safety:not(.hidden),\n  details[open] > :not(summary) {\n    animation: hint-enter .25s ease-out backwards\n  }\n\n  .field > span,\n  .nav button,\n  .tag {\n    transition: color .2s ease, background-color .2s ease, box-shadow .2s ease\n  }\n\n  .nav button.on span {\n    animation: page-enter .3s ease-out\n  }\n\n  #theme {\n    transition: transform .3s ease, background-color .2s ease\n  }\n}\n\n@media(hover:hover) and (prefers-reduced-motion:no-preference) {\n  .nav button:not(.on):hover {\n    background: var(--soft);\n    color: var(--ink);\n    transform: translateX(3px)\n  }\n\n  button.primary:hover {\n    box-shadow: 0 5px 16px #1e2a5e24\n  }\n\n  #theme:hover {\n    transform: rotate(15deg)\n  }\n\n  .card:hover .tag {\n    background: var(--soft)\n  }\n}\n\n\n/* Giấy cổ, sương màu và những ngôi sao nhỏ chìm dưới nội dung. */\n.main::after {\n  content: '';\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n  pointer-events: none;\n  background-image:\n    radial-gradient(ellipse 1px 5px at 80% 75px, var(--star) 95%, transparent),\n    radial-gradient(ellipse 5px 1px at 80% 75px, var(--star) 95%, transparent),\n    radial-gradient(ellipse 1px 4px at 94% 190px, var(--star) 95%, transparent),\n    radial-gradient(ellipse 4px 1px at 94% 190px, var(--star) 95%, transparent),\n    radial-gradient(circle 2px at 13% 320px, var(--star) 95%, transparent),\n    radial-gradient(circle 1px at 68% 245px, var(--star) 95%, transparent);\n  background-size: 100% 540px\n}\n\n.side {\n  background: linear-gradient(165deg, var(--paper), var(--soft));\n  box-shadow: 5px 0 30px #69503805\n}\n\n.top {\n  background: linear-gradient(90deg, transparent, var(--dream-gold));\n  border-bottom-color: var(--line)\n}\n\n.card,\n.panel {\n  background: linear-gradient(135deg, var(--paper), var(--paper) 65%, var(--soft));\n  box-shadow: var(--shadow), inset 0 0 0 3px var(--paper)\n}\n\n.compass {\n  border: 1px solid var(--gold);\n  outline: 1px solid var(--line);\n  outline-offset: 9px;\n  box-shadow: 0 0 55px 12px var(--dream-gold), inset 0 0 35px var(--dream-rose);\n  background-color: var(--paper)\n}\n\n.compass .n,\n.compass .s {\n  max-width: 85%;\n  text-align: center\n}\n\n.stripe {\n  opacity: .85\n}\n\n\n/* Dùng chung đường cong và trạng thái tương tác cho mọi biểu mẫu. */\ninput:not([type=radio]):not([type=checkbox]),\nselect,\ntextarea {\n  box-shadow: inset 0 1px 2px #69503808\n}\n\ninput:not([type=radio]):not([type=checkbox]):focus,\nselect:focus,\ntextarea:focus {\n  border-color: var(--gold);\n  box-shadow: 0 0 0 4px var(--dream-gold), inset 0 1px 2px #69503808\n}\n\nselect {\n  cursor: pointer;\n  padding-right: 36px\n}\n\nselect:disabled {\n  cursor: default;\n  opacity: .6\n}\n\n@media(hover:hover) {\n  input:not([type=radio]):not([type=checkbox]):not(:disabled):hover,\n  select:not(:disabled):hover,\n  textarea:not(:disabled):hover {\n    border-color: var(--gold)\n  }\n}\n\n@media(prefers-reduced-motion:no-preference) {\n  input,\n  select,\n  textarea {\n    transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease\n  }\n\n  .panel {\n    transition: box-shadow .25s ease, border-color .25s ease\n  }\n\n  .panel:focus-within {\n    border-color: var(--gold);\n    box-shadow: var(--shadow), 0 0 0 3px var(--dream-gold)\n  }\n}\n\n/* Giữ select gốc và bàn phím/trình đọc màn hình; nâng cấp picker nếu có hỗ trợ. */\n@supports (appearance: base-select) {\n  select,\n  select::picker(select) {\n    appearance: base-select\n  }\n\n  select {\n    align-items: center;\n    padding-right: 14px\n  }\n\n  select::picker(select) {\n    margin-block: 8px;\n    padding: 6px;\n    border: 1px solid var(--line);\n    border-radius: var(--radius-control);\n    background: var(--paper);\n    color: var(--ink);\n    box-shadow: 0 12px 32px #202b4b24;\n    font: inherit;\n    max-height: min(320px, 50vh);\n    overflow-y: auto\n  }\n\n  select::picker-icon {\n    color: var(--accent)\n  }\n\n  select option {\n    min-height: 44px;\n    padding: 10px 14px;\n    border-radius: 11px;\n    white-space: normal;\n    overflow-wrap: anywhere\n  }\n\n  select option:checked {\n    background: var(--soft);\n    color: var(--accent);\n    font-weight: 650\n  }\n\n  select option:hover,\n  select option:focus-visible {\n    background: var(--soft);\n    outline: 2px solid var(--gold);\n    outline-offset: -2px\n  }\n\n  @media(prefers-reduced-motion:no-preference) {\n    select::picker(select) {\n      animation: page-enter .18s ease-out\n    }\n\n    select::picker-icon {\n      transition: rotate .2s ease\n    }\n\n    select:open::picker-icon {\n      rotate: 180deg\n    }\n\n    select option {\n      transition: background-color .15s ease, color .15s ease\n    }\n  }\n}\n\n@media(min-width:641px) and (max-width:900px) {\n  .brand { gap: 8px }\n  .brand .logo { width: 36px; height: 36px; flex-basis: 36px }\n  .brand strong { font-size: 18px }\n  .brand small { font-size: 9px; letter-spacing: .6px }\n}\n\n\n.probing { margin: 20px 0; padding: 16px; background: var(--soft); border-radius: var(--radius-control) }\n.probing summary { cursor: pointer; font-weight: 650 }\n.probing p { margin: 12px 0 0 }\n.table-scroll { overflow-x: auto; margin-top: 18px }\n.progress-table { width: 100%; border-collapse: collapse; font-size: 14px }\n.progress-table caption { text-align: left; color: var(--muted); padding-bottom: 12px }\n.progress-table th, .progress-table td { padding: 12px 8px; border-bottom: 1px solid var(--line); text-align: left }\n@media(max-width:640px) {\n  .welcome h1 { font-size: 34px; overflow-wrap: anywhere }\n  .card .tag { max-width: 100%; white-space: normal }\n  .actions { flex-wrap: wrap }\n  .actions button { flex: 1 1 120px }\n  .top .row { gap: 6px; min-width: 0 }\n  .status { overflow-wrap: anywhere }\n  .progress-table { font-size: 12px }\n  .progress-table th, .progress-table td { padding: 10px 5px }\n}\n\n@media(max-width:640px) {\n  .nav button { flex-shrink: 0 }\n  .top > .row { flex-wrap: nowrap; justify-content: flex-end }\n  #theme { flex-shrink: 0 }\n}\n\n\n.sync-summary { margin: 12px 0 }\n.journey-continue { margin-top: 4px }\n.week-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted) }\n.week-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0 }\n.week-status.sent { color: var(--green) }\n.week-status.pending, .week-status.draft { color: var(--accent); font-weight: 650 }\n.workflow-steps { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 0; margin: 20px 0 0; list-style: none }\n.workflow-steps li { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px }\n.workflow-steps li > span { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 50%; background: var(--paper) }\n.workflow-steps li.current { color: var(--ink); font-weight: 700 }\n.workflow-steps li.current > span { border-color: var(--gold); box-shadow: 0 0 0 3px var(--dream-gold) }\n.workflow-steps li.done > span { background: var(--soft); color: var(--green) }\n.revision-note { padding-left: 12px; border-left: 2px solid var(--gold) }\n@media(max-width:640px) {\n  .card > .row:last-child { gap: 12px; align-items: flex-start }\n  .week-status { flex: 1 1 110px }\n  .workflow-steps { gap: 10px; margin-top: 16px }\n  .workflow-steps li { font-size: 11px }\n}\n\n.preview-notice { margin: 16px 24px 0; border: 1px solid var(--gold) }\n#previewFallback { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line) }\n#previewFallback .caption { margin-bottom: 10px }\n@media(max-width:640px) { .preview-notice { margin: 16px 16px 0 } }\n\n\n.session-bar {\n  position: sticky;\n  top: 0;\n  z-index: 5;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 12px 42px;\n  border-bottom: 1px solid var(--line);\n  background: var(--paper);\n  font-size: 13px\n}\n#sessionIdentity { min-width: 0; overflow-wrap: anywhere; color: var(--muted) }\n#logout { flex-shrink: 0; border-color: var(--gold) }\n@media(max-width:900px) { .session-bar { padding-inline: 28px } }\n@media(max-width:640px) { .session-bar { padding: 10px 16px; font-size: 12px } }\n\n\n/* ---------------------------------------------------------------\n   Lớp hoàn thiện giao diện: độ nổi, bảng, nhãn trạng thái, chuyển động.\n   Giữ nguyên bảng màu chàm – kem; tôn trọng prefers-reduced-motion.\n   --------------------------------------------------------------- */\n\n.session-bar {\n  background: color-mix(in srgb, var(--paper) 88%, transparent);\n  -webkit-backdrop-filter: saturate(140%) blur(8px);\n  backdrop-filter: saturate(140%) blur(8px)\n}\n\n.progress-table {\n  font-variant-numeric: tabular-nums\n}\n\n.progress-table thead th {\n  position: sticky;\n  top: 0;\n  background: var(--paper);\n  color: var(--muted);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: .04em;\n  text-transform: uppercase\n}\n\n.progress-table tbody tr:nth-child(even) {\n  background: color-mix(in srgb, var(--soft) 55%, transparent)\n}\n\n.tag,\n.badge {\n  border-radius: var(--radius-pill);\n  font-weight: 600\n}\n\n.eyebrow {\n  letter-spacing: 2.4px\n}\n\n@media(hover:hover) {\n  .card {\n    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease\n  }\n\n  .card:hover {\n    transform: translateY(-3px);\n    box-shadow: var(--shadow-lift);\n    border-color: color-mix(in srgb, var(--gold) 45%, var(--line))\n  }\n}\n\n@media(prefers-reduced-motion:reduce) {\n  .card,\n  .card:hover {\n    transition: none;\n    transform: none\n  }\n\n  button {\n    transition: none\n  }\n}\n\n\n/* Màn hình hẹp: gợi ý thanh điều hướng còn cuộn được, và gọn thanh trên. */\n@media(max-width:640px) {\n  .nav {\n    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);\n    mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);\n    padding-right: 30px\n  }\n\n  /* Nhãn này lặp lại thông tin đã có ở đầu trang; bỏ để thanh trên cao một dòng. */\n  .top > .caption {\n    display: none\n  }\n\n  .top {\n    padding: 8px 16px\n  }\n\n  .top .status {\n    flex: 1 1 auto;\n    min-width: 0;\n    text-align: right\n  }\n}\n", "src/shell.html": "\u003c!doctype html>\n\u003chtml lang=\"vi\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#1e2a5e\">\n  \u003ctitle>Xoay Chiều — Hành trình 4 tuần\u003c/title>\n  \u003cmeta name=\"description\" content=\"Thử, nghĩ, nối và chia sẻ. Một cuốn sổ trải nghiệm học tập trong bốn tuần.\">\n  \u003cstyle>/*CSS*/\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"stripe\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv id=\"app\">\u003c/div>\n  \u003cnoscript>Hãy bật JavaScript trong trình duyệt để mở hoạt động và lưu bản nháp.\u003c/noscript>\n  \u003cdiv id=\"toast\" class=\"toast hidden\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cdialog id=\"letterDialog\" aria-label=\"Lá thư mở đầu\">\u003c/dialog>\n  \u003c!-- build.py ghép theo thứ tự phụ thuộc; không cần CDN hay thư viện. -->\n  \u003cscript>/*CONFIG*/\u003c/script>\n  \u003cscript>/*DATA*/\u003c/script>\n  \u003cscript>/*SAFETY*/\u003c/script>\n  \u003cscript>/*CLASSES*/\n/*CORE*/\u003c/script>\n  \u003cscript>/*BACKUP*/\u003c/script>\n  \u003cscript>/*LEARNING*/\n/*APP*/\u003c/script>\n\u003c/body>\n\u003c/html>\n", "apps-script/Code.gs": "/**\n * XOAY CHIỀU — MÁY CHỦ GOOGLE APPS SCRIPT, phiên bản 2.8.0.\n *\n * Các điểm vào từ trình duyệt:\n *   doGet()                  → phục vụ giao diện Index.html.\n *   submitRecord(payload)    → kiểm tra, chống trùng và ghi vào Google Sheets.\n *   loginCoordinator(input)  → xác thực PIN của đúng trường/lớp.\n *\n * Các hàm kết thúc bằng '_' là hàm nội bộ, không gọi được qua google.script.run.\n * API tiến độ chỉ trả mã và tuần, xác thực bằng phiên giáo viên của đúng lớp. Phiên giáo viên không đọc bài/nháp riêng; Learning.gs chỉ trả bài của chính học sinh đã xác thực.\n */\nconst SERVER_VERSION = '2.8.0';\n\nconst HEADERS = {\n  chu_trinh: [\n    'id', 'thoi_gian_nhan', 'thoi_gian', 'bat_dau', 'ma', 'truong', 'lop', 'tuan',\n    'thu_lam', 'nghi_1', 'nghi_2', 'nghi_3', 'noi', 'dang_san_pham', 'san_pham',\n    'chia_se', 'tu_danh_gia', 'thoi_luong_giay', 'thoi_gian_troi_giay', 'phe',\n    'doi_hay_giu', 'kiem_soat', 'ngoai_kiem_soat', 'ban_goc_id',\n    'phien_ban_app', 'phien_ban_noi_dung',\n  ],\n  phieu_buoi: [\n    'id', 'thoi_gian_nhan', 'thoi_gian', 'truong', 'lop', 'tuan', 'ngay', 'khung_gio',\n    'thoi_luong_thuc_te_phut', 'si_so', 'so_tham_gia', 'da_lam_mo_thu', 'da_lam_thu',\n    'da_lam_nghi', 'da_lam_noi', 'da_lam_chia_se', 'dung_app_hay_giay',\n    'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat', 'phien_ban_app',\n  ],\n  doi_y: [\n    'id', 'thoi_gian_nhan', 'thoi_gian', 'truong', 'lop', 'tuan', 'nhom',\n    'doi_hay_giu', 'vi_sao', 'phien_ban_app',\n  ],\n};\n\n/** Chạy MỘT LẦN trong editor, từ dự án Apps Script gắn với Sheet mới. */\nfunction setup_() {\n  const spreadsheet = SpreadsheetApp.getActiveSpreadsheet();\n  if (!spreadsheet) throw new Error('Hãy mở Apps Script từ Google Sheet mới.');\n\n  // Kiểm tra dịch vụ trước khi sửa cấu hình. Cần Services → Google Sheets API.\n  Sheets.Spreadsheets.get(spreadsheet.getId(), {\n    fields: 'spreadsheetId'\n  });\n  for (const name of Object.keys(HEADERS)) {\n    const sheet = spreadsheet.getSheetByName(name) || spreadsheet.insertSheet(name);\n    const columns = HEADERS[name];\n    if (sheet.getLastRow() === 0) {\n      sheet.getRange(1, 1, 1, columns.length).setValues([columns]);\n      sheet.setFrozenRows(1);\n      sheet.getRange(1, 1, 1, columns.length)\n        .setFontWeight('bold').setBackground('#1e2a5e').setFontColor('#ffffff');\n    } else if (!headersMatch_(sheet, columns)) {\n      throw new Error('Cột ' + name + ' không khớp. Dùng Sheet mới; không ghi đè dữ liệu cũ.');\n    }\n  }\n  setupStudentStorage_(spreadsheet);\n  setupManagement_(spreadsheet);\n  PropertiesService.getScriptProperties()\n    .setProperty('SPREADSHEET_ID', spreadsheet.getId());\n}\n\n/** HTML Service hỗ trợ google.script.run và tự thực thi trong iframe bảo vệ. */\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('Xoay Chiều — Hành trình 4 tuần')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\nfunction headersMatch_(sheet, columns) {\n  return JSON.stringify(sheet.getRange(1, 1, 1, columns.length).getValues()[0]) ===\n    JSON.stringify(columns);\n}\n\nfunction schoolOK_(data) {\n  return SCHEMA.schools.some(s => s.truong === data.truong && s.lop.includes(ClassIds.code(data.lop)));\n}\n\nfunction count_(value) {\n  return String(value ?? '').trim().split(/\\s+/).filter(Boolean).length;\n}\n\nfunction fail_(message, code = 'INVALID_RECORD') {\n  const error = new Error(message);\n  error.code = code;\n  throw error;\n}\n\n/** Chỉ kiểm tra, không trim và không cắt văn bản sẽ được lưu. */\nfunction text_(value, name, minWords, maxLength) {\n  if (typeof value !== 'string' || (value !== Safety.hidden && count_(value) \u003c minWords) || value.length > maxLength) {\n    fail_('Phần ' + name + ' cần ít nhất ' + minWords + ' từ, tối đa ' + maxLength + ' ký tự.');\n  }\n}\n\nfunction num_(value, min, max) {\n  return typeof value === 'number' && isFinite(value) && value >= min && value \u003c= max;\n}\n\nfunction valid_(data) {\n  if (SCHEMA.cellMax !== 13000) fail_('Schema không cùng phiên bản. Hãy cập nhật đồng bộ Code.gs, Schema.gs và Index.html.', 'SETUP_REQUIRED');\n  if (!data || typeof data !== 'object' || Array.isArray(data) ||\n    JSON.stringify(data).length > 100000) fail_('Bản ghi không hợp lệ hoặc quá lớn.');\n  if (!Object.prototype.hasOwnProperty.call(HEADERS, data.loai)) fail_(\n    'Loại bản ghi không hợp lệ.');\n  if (typeof data.id !== 'string' || !/^[a-zA-Z0-9-]{12,80}$/.test(data.id)) fail_(\n    'ID bản ghi không hợp lệ.');\n  if (!schoolOK_(data)) fail_('Trường/lớp không thuộc danh sách.');\n  if (!Number.isInteger(data.tuan) || data.tuan \u003c 1 || data.tuan > SCHEMA.weeks.length) {\n    fail_('Tuần không hợp lệ.');\n  }\n  if (typeof data.thoi_gian !== 'string' || !isFinite(Date.parse(data.thoi_gian))) fail_(\n    'Thời gian không hợp lệ.');\n\n  // Mỗi ô chỉ được là kiểu đơn giản; từ chối đối tượng lồng nhau bất thường.\n  Object.entries(data).forEach(([name, value]) => {\n    if (!HEADERS[data.loai].includes(name) && name !== 'loai') fail_(\n      'Trường dữ liệu không được hỗ trợ: ' + name);\n    if (!['string', 'number', 'boolean'].includes(typeof value)) fail_(\n      'Kiểu dữ liệu không hợp lệ: ' + name);\n    if (typeof value === 'string' && value.length > SCHEMA.cellMax) fail_('Giá trị quá dài: ' + name);\n  });\n\n  if (data.loai === 'chu_trinh') validateStudent_(data);\n  else if (data.loai === 'phieu_buoi') validateSession_(data);\n  else validateDebate_(data);\n}\n\nfunction validateStudent_(data) {\n  if (typeof data.ma !== 'string' || !/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(data.ma)) {\n    fail_('Mã học sinh không hợp lệ.');\n  }\n  // Schema sinh từ cùng content.json với giao diện, tránh lệch quy tắc hai phía.\n  SCHEMA.weeks[data.tuan - 1].forEach(field => {\n    const value = data[field.key];\n    if (field.kind === 'rating') {\n      if (![1, 2, 3].includes(value)) fail_('Chưa chọn mức tự đánh giá.');\n    } else if (field.options) {\n      if (!field.options.includes(value)) fail_('Lựa chọn ' + field.key + ' không hợp lệ.');\n    } else {\n      // Chỉ đếm phần học sinh viết, không tính phần tiền tố do app thêm.\n      let raw = value;\n      if (data.tuan === 3 && field.key === 'nghi_1') raw = String(value ?? '').replace(\n        /^Phe [AB]: /, '');\n      if (data.tuan === 3 && field.key === 'chia_se') raw = String(value ?? '').replace(\n        /^(Đổi ý|Giữ ý): /, '');\n      text_(raw, field.key, field.min, field.max);\n    }\n  });\n  if (data.tuan === 3) {\n    if (!data.nghi_1.startsWith(data.phe.startsWith('A') ? 'Phe A: ' : 'Phe B: ')) fail_(\n      'Phe không khớp câu trả lời.');\n    if (!data.chia_se.startsWith(data.doi_hay_giu + ': ')) fail_('Lựa chọn đổi/giữ không khớp.');\n  }\n  if (data.tuan === 4) {\n    const expected = 'Phần mình thay đổi được:\\n' + data.kiem_soat +\n      '\\n\\nPhần mình không thay đổi được:\\n' + data.ngoai_kiem_soat;\n    if (data.thu_lam !== expected) fail_('Hai phần của bước Thử không khớp.');\n  }\n  if (!num_(data.thoi_luong_giay, 0, 604800) ||\n    !num_(data.thoi_gian_troi_giay, 0, 31536000) ||\n    !isFinite(Date.parse(data.bat_dau))) fail_('Thời lượng không hợp lệ.');\n}\n\nfunction validateSession_(data) {\n  ['khung_gio', 'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat'].forEach(key => {\n    text_(data[key], key, 1, key === 'dieu_phoi_vien_viet_tat' ? 30 : 6000);\n  });\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(data.ngay) || !isFinite(Date.parse(data.ngay))) fail_(\n    'Ngày không hợp lệ.');\n  if (!num_(data.si_so, 1, 200) || !Number.isInteger(data.si_so) ||\n    !num_(data.so_tham_gia, 0, data.si_so) || !Number.isInteger(data.so_tham_gia) ||\n    !num_(data.thoi_luong_thuc_te_phut, 1, 240)) fail_('Sĩ số/thời lượng không hợp lệ.');\n  if (!['App', 'Giấy', 'Kết hợp'].includes(data.dung_app_hay_giay)) fail_(\n    'Hình thức không hợp lệ.');\n  ['mo_thu', 'thu', 'nghi', 'noi', 'chia_se'].forEach(key => {\n    if (typeof data['da_lam_' + key] !== 'boolean') fail_('Thiếu trạng thái bước ' + key);\n  });\n}\n\nfunction validateDebate_(data) {\n  if (data.tuan !== 3 || !['doi', 'giu'].includes(data.doi_hay_giu)) fail_(\n    'Phiếu đổi ý chỉ dành cho tuần 3.');\n  text_(data.nhom, 'nhóm', 1, 60);\n  text_(data.vi_sao, 'vì sao', 5, 6000);\n}\n\n/** RAW + UNFORMATTED_VALUE: bỏ ô trống cuối hàng là bình thường; chuỗi giữ nguyên từng ký tự. */\nfunction sameCell_(stored, expected) {\n  if (expected === undefined || expected === null || expected === '') return stored === undefined || stored === null || stored === '';\n  if (typeof expected === 'number') return typeof stored === 'number' && Number.isFinite(stored) && stored === expected;\n  if (typeof expected === 'boolean') return stored === expected;\n  return typeof stored === 'string' && stored === expected;\n}\n\n/**\n * Đảm bảo tính idempotent:\n * - Cùng ID + cùng nội dung → ACK lại, không tạo dòng mới.\n * - Cùng ID + khác nội dung → báo xung đột, không ghi đè.\n * - ID mới → thêm đúng một dòng bằng API RAW.\n *\n * Khóa bao trùm thao tác tìm ID và ghi. Chờ khóa ngắn để nhiều yêu cầu không\n * giữ các slot thực thi quá lâu. Client tự giãn lần thử sau nếu máy chủ bận.\n */\nfunction submitRecord(payload) {\n  let lock;\n  try {\n    valid_(payload && payload.record);\n    const data = Safety.redactRecord(payload.record, SCHEMA.safety);\n    valid_(data);\n    data.lop = ClassIds.code(data.lop);\n    if (data.loai !== 'chu_trinh') authorizeCoordinator_(payload.token, data);\n\n    const spreadsheetId = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n    if (!spreadsheetId) fail_('Máy chủ chưa chạy setup_.', 'SETUP_REQUIRED');\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) return {\n      ok: false,\n      code: 'BUSY',\n      error: 'Máy chủ đang bận; bài được giữ để gửi lại.'\n    };\n\n    const student = data.loai === 'chu_trinh' ? authorizeStudent_(payload.token, data, spreadsheetId) : null;\n    // Đọc ID, đọc bản ghi và append qua cùng Sheets API; khóa giữ đến khi append trả về.\n    const columns = HEADERS[data.loai], range = \"'\" + data.loai + \"'!\";\n    const readOptions = { valueRenderOption: 'UNFORMATTED_VALUE', dateTimeRenderOption: 'SERIAL_NUMBER' };\n    const headers = Sheets.Spreadsheets.Values.get(spreadsheetId, range + '1:1', readOptions).values || [];\n    if (JSON.stringify(headers[0] || []) !== JSON.stringify(columns)) fail_(\n      'Cấu trúc Sheet không khớp; liên hệ người quản lý.', 'SETUP_REQUIRED');\n    const ids = Sheets.Spreadsheets.Values.get(spreadsheetId, range + 'A2:A', readOptions).values || [];\n    const found = ids.findIndex(row => row[0] === data.id);\n    if (found >= 0) {\n      const rowNumber = found + 2;\n      const existing = (Sheets.Spreadsheets.Values.get(spreadsheetId,\n        range + rowNumber + ':' + rowNumber, readOptions).values || [])[0] || [];\n      const identical = columns.every((key, index) => key === 'thoi_gian_nhan' ||\n        (key === 'lop' ? ClassIds.code(existing[index]) === data.lop : sameCell_(existing[index], data[key])));\n      if (!identical) fail_('ID đã tồn tại với nội dung khác. Không ghi đè.', 'ID_CONFLICT');\n      if (student) projectStudentProgress_(spreadsheetId, student);\n      return { ok: true, id: data.id, duplicate: true };\n    }\n\n    const row = columns.map(key => key === 'thoi_gian_nhan' ?\n      new Date().toISOString() : (data[key] ?? ''));\n    // RAW giữ cả =, +, -, @, dấu nháy và xuống dòng như văn bản, không chạy công thức.\n    Sheets.Spreadsheets.Values.append({\n      values: [row]\n    }, spreadsheetId, \"'\" + data.loai + \"'!A1\", {\n      valueInputOption: 'RAW',\n      insertDataOption: 'INSERT_ROWS'\n    }, );\n    if (student) projectStudentProgress_(spreadsheetId, student);\n    return {\n      ok: true,\n      id: data.id,\n      duplicate: false\n    };\n  } catch (error) {\n    // Lỗi do Google/quota: log phía chủ dự án, không log câu trả lời học sinh.\n    if (!error.code) console.error('submitRecord: ' + String(error.message));\n    return {\n      ok: false,\n      code: error.code || 'SERVER_ERROR',\n      error: error.code ? error.message :\n        'Chưa ghi được vào Google Sheets. Bài vẫn chờ gửi; kiểm tra dịch vụ và quyền của dự án.',\n    };\n  } finally {\n    if (lock && lock.hasLock()) lock.releaseLock();\n  }\n}\n\nfunction authorizeRole_(token, data, role) {\n  if (typeof token !== 'string' || token.length \u003c 20 || token.length > 160 || !schoolOK_(data)) {\n    fail_('Phiên truy cập không hợp lệ. Hãy đăng nhập lại.', 'AUTH_REQUIRED');\n  }\n  let auth;\n  try {\n    auth = JSON.parse(CacheService.getScriptCache().get(role + ':' + token) || 'null');\n  } catch { auth = null; }\n  if (!auth || !Number.isFinite(auth.expires) || auth.expires \u003c= Date.now() ||\n      auth.truong !== data.truong || ClassIds.code(auth.lop) !== ClassIds.code(data.lop)) {\n    fail_('Phiên hết hạn hoặc không có quyền với lớp này. Hãy đăng nhập lại.', 'AUTH_REQUIRED');\n  }\n}\n\nfunction authorizeCoordinator_(token, data) {\n  authorizeRole_(token, data, 'coord');\n}\n\nfunction loginCoordinator(input) {\n  return loginRole_(input, 'coord', 'COORDINATOR_PINS');\n}\n\nfunction loginTeacher(input) {\n  return loginRole_(input, 'teacher', 'TEACHER_PINS');\n}\n\n/** Giáo viên chỉ được đọc phép chiếu mã + tuần đã xác nhận của đúng lớp. */\nfunction getClassProgress(input) {\n  try {\n    if (!input) fail_('Thiếu thông tin lớp.', 'AUTH_REQUIRED');\n    authorizeRole_(input.token, input, 'teacher');\n    const spreadsheetId = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n    if (!spreadsheetId) fail_('Chưa cấu hình Sheet.', 'SETUP_REQUIRED');\n    const sheet = SpreadsheetApp.openById(spreadsheetId).getSheetByName('chu_trinh');\n    const columns = HEADERS.chu_trinh;\n    if (!sheet || !headersMatch_(sheet, columns)) fail_('Cấu trúc Sheet không khớp.', 'SETUP_REQUIRED');\n    const byCode = new Map();\n    const rows = sheet.getLastRow() > 1 ? sheet.getRange(2, 1, sheet.getLastRow() - 1, columns.length).getValues() : [];\n    const index = key => columns.indexOf(key);\n    rows.forEach(row => {\n      if (row[index('truong')] !== input.truong || ClassIds.code(row[index('lop')]) !== ClassIds.code(input.lop)) return;\n      const code = row[index('ma')], week = Number(row[index('tuan')]);\n      if (!/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(String(code)) || !Number.isInteger(week) || week \u003c 1 || week > 4) return;\n      if (!byCode.has(code)) byCode.set(code, new Set());\n      byCode.get(code).add(week);\n    });\n    return { ok: true, students: Array.from(byCode, ([ma, weeks]) => ({ ma, weeks: [...weeks].sort() }))\n      .sort((a, b) => a.ma.localeCompare(b.ma)) };\n  } catch (error) {\n    return { ok: false, code: error.code || 'SERVER_ERROR',\n      error: error.code ? error.message : 'Chưa tải được tiến độ lớp. Vui lòng thử lại.' };\n  }\n}\n\nfunction logoutTeacher(token) {\n  return logoutRole_(token, 'teacher');\n}\n\nfunction logoutCoordinator(token) {\n  return logoutRole_(token, 'coord');\n}\n\nfunction logoutRole_(token, role) {\n  if (typeof token === 'string' && token.length >= 20 && token.length \u003c= 160) {\n    CacheService.getScriptCache().remove(role + ':' + token);\n  }\n  return { ok: true };\n}\n\n/** PIN ở Script Properties, không nằm trong HTML/JSON người học tải về. */\nfunction loginRole_(input, role, property) {\n  let lock;\n  try {\n    if (!input || !schoolOK_(input)) fail_('Lớp không hợp lệ.', 'AUTH_REQUIRED');\n    input = ClassIds.profile(input);\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau vài giây.', 'BUSY');\n    const cache = CacheService.getScriptCache();\n    const key = 'login:' + role + ':' + input.truong + '|' + input.lop;\n    let state;\n    try { state = JSON.parse(cache.get(key) || 'null'); } catch { state = null; }\n    // Đọc cả bộ đếm cũ khi nâng cấp; không vô tình bỏ qua thời gian khóa còn lại.\n    if (typeof state === 'number') state = { attempts: state, blockedUntil: state >= 8 ? Date.now() + 600000 : 0 };\n    if (!state) state = { attempts: 0, blockedUntil: 0 };\n    if (state.blockedUntil > Date.now()) {\n      const seconds = Math.max(1, Math.ceil((state.blockedUntil - Date.now()) / 1000));\n      cache.put(key, JSON.stringify(state), seconds);\n      const error = new Error('Lớp đang tạm khóa đăng nhập. Thử lại sau ' + seconds + ' giây; liên hệ chủ dự án nếu cần hỗ trợ.');\n      error.code = 'RATE_LIMITED'; error.retryAfterSeconds = seconds; throw error;\n    }\n    if (state.blockedUntil) state = { attempts: 0, blockedUntil: 0 };\n    const raw = PropertiesService.getScriptProperties().getProperty(property) || '{}';\n    const pins = JSON.parse(raw);\n    const keys = [...new Set([input.lop,ClassIds.label(input.lop)])];\n    const configured = keys.map(lop=>pins[input.truong+'|'+lop]).filter(value=>value!==undefined);\n    if (new Set(configured.map(String)).size > 1) fail_('PIN mã lớp và tên lớp cũ không khớp; chủ dự án cần kiểm tra cấu hình.', 'SETUP_REQUIRED');\n    const expected = configured[0];\n    if (!expected || !/^\\d{6,12}$/.test(String(expected)) || String(input.pin) !== String(\n        expected)) {\n      state.attempts++;\n      if (state.attempts >= 8) state.blockedUntil = Date.now() + 600000;\n      cache.put(key, JSON.stringify(state), 600);\n      if (state.blockedUntil) {\n        const error = new Error('Đã nhập sai PIN 8 lần. Lớp tạm khóa trong 600 giây; liên hệ chủ dự án nếu cần hỗ trợ.');\n        error.code = 'RATE_LIMITED'; error.retryAfterSeconds = 600; throw error;\n      }\n      fail_('PIN chưa được cấu hình hoặc không đúng. Còn ' + (8 - state.attempts) + ' lần thử trước khi tạm khóa.', 'AUTH_REQUIRED');\n    }\n    cache.remove(key);\n    const token = Utilities.getUuid() + Utilities.getUuid();\n    const expires = Date.now() + 21600000;\n    cache.put(role + ':' + token, JSON.stringify({\n      truong: input.truong,\n      lop: input.lop,\n      expires\n    }), 21600);\n    return {\n      ok: true,\n      token,\n      expires\n    };\n  } catch (error) {\n    return {\n      ok: false,\n      code: error.code || 'SERVER_ERROR',\n      error: error.code ? error.message : 'Chưa xác thực được quyền truy cập.',\n      ...(error.retryAfterSeconds ? { retryAfterSeconds: error.retryAfterSeconds } : {})\n    };\n  } finally {\n    if (lock && lock.hasLock()) lock.releaseLock();\n  }\n}\n", "apps-script/Accounts.gs": "/** Tài khoản theo mã có sẵn. Hàm quản trị kết thúc '_' chỉ chạy bởi chủ dự án trong editor. */\nconst ACCOUNT_HEADERS = ['ma', 'truong', 'lop', 'trang_thai', 'pin_salt', 'pin_hash', 'ngay_cap'];\nconst PROGRESS_HEADERS = ['ma', 'truong', 'lop', 'tuan_1', 'tuan_2', 'tuan_3', 'tuan_4', 'so_tuan_da_nop', 'cap_nhat'];\n\nfunction setupStudentStorage_(spreadsheet) {\n  for (const [name, headers] of [['tai_khoan', ACCOUNT_HEADERS], ['tien_do', PROGRESS_HEADERS], ['nhap_hoc_tap', LEARNING_HEADERS]]) {\n    const sheet = spreadsheet.getSheetByName(name) || spreadsheet.insertSheet(name);\n    if (sheet.getLastRow() === 0) {\n      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);\n      sheet.setFrozenRows(1);\n    } else if (!headersMatch_(sheet, headers)) {\n      fail_('Cột ' + name + ' không khớp. Không ghi đè dữ liệu hiện có.', 'SETUP_REQUIRED');\n    }\n  }\n}\n\nfunction accountSheetId_() {\n  const id = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n  if (!id) fail_('Chủ dự án cần chạy setup_ từ Sheet đã chọn.', 'SETUP_REQUIRED');\n  return id;\n}\n\nfunction readSystemTable_(id, name, headers) {\n  const end = String.fromCharCode(64 + headers.length);\n  const rows = Sheets.Spreadsheets.Values.get(id, \"'\" + name + \"'!A1:\" + end, {\n    valueRenderOption: 'UNFORMATTED_VALUE', dateTimeRenderOption: 'SERIAL_NUMBER'\n  }).values || [];\n  if (JSON.stringify(rows[0] || []) !== JSON.stringify(headers)) fail_('Cần chuẩn bị đúng cấu trúc bảng ' + name + '.', 'SETUP_REQUIRED');\n  return rows.slice(1);\n}\n\nfunction accountKey_(account) {\n  return JSON.stringify([account.truong, ClassIds.code(account.lop), account.ma]);\n}\n\nfunction normalizeAccounts_(rows) {\n  const seen = new Set(), result = [];\n  rows.forEach((row, index) => {\n    if (!row.some(value => value !== '' && value !== null && value !== undefined)) return;\n    const ma = String(row[0] || '').toUpperCase().replace(/\\s/g, '');\n    const account = { ma, truong: String(row[1] || '').trim(), lop: String(row[2] || '').trim(),\n      status: String(row[3] || 'hoat_dong'), salt: String(row[4] || ''), pinHash: String(row[5] || ''),\n      issuedAt: String(row[6] || ''), rowNumber: index + 2, credentialClass: String(row[2] || '').trim() };\n    if (!/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(ma) || !schoolOK_(account) ||\n        !['hoat_dong', 'khoa'].includes(account.status)) fail_('Kiểm tra mã, trường/lớp và trạng thái ở dòng ' + (index + 2) + ' của tai_khoan.', 'SETUP_REQUIRED');\n    if (!!account.salt !== !!account.pinHash || (account.pinHash && !/^[a-f0-9]{64}$/.test(account.pinHash))) {\n      fail_('Dữ liệu PIN không hoàn chỉnh ở dòng ' + (index + 2) + '. Dùng chức năng đặt lại PIN, không nhập PIN vào bảng này.', 'SETUP_REQUIRED');\n    }\n    account.lop = ClassIds.code(account.lop);\n    const key = accountKey_(account);\n    if (seen.has(key)) fail_('Mã trùng trong cùng trường/lớp ở dòng ' + (index + 2) + '.', 'SETUP_REQUIRED');\n    seen.add(key); result.push(account);\n  });\n  return result;\n}\n\nfunction studentAccounts_(id) {\n  return normalizeAccounts_(readSystemTable_(id, 'tai_khoan', ACCOUNT_HEADERS));\n}\n\nfunction pinDigest_(pin, account) {\n  const secret = PropertiesService.getScriptProperties().getProperty('STUDENT_PIN_SECRET');\n  if (!secret) fail_('Chủ dự án cần cấp mật khẩu trước khi đăng nhập học sinh.', 'SETUP_REQUIRED');\n  const message = JSON.stringify([JSON.stringify([account.truong, account.credentialClass || account.lop, account.ma]), account.salt, pin]);\n  return Utilities.computeHmacSha256Signature(message, secret, Utilities.Charset.UTF_8)\n    .map(byte => ((byte + 256) % 256).toString(16).padStart(2, '0')).join('');\n}\n\nfunction constantTimeEqual_(left, right) {\n  if (typeof left !== 'string' || typeof right !== 'string' || left.length !== right.length) return false;\n  let difference = 0;\n  for (let i = 0; i \u003c left.length; i++) difference |= left.charCodeAt(i) ^ right.charCodeAt(i);\n  return difference === 0;\n}\n\n/** Mật khẩu mới là chuỗi 8–64 ký tự; PIN số 6–12 đã cấp vẫn dùng được. */\nfunction studentPassword_(input) {\n  const value = Object.prototype.hasOwnProperty.call(input, 'password') ? input.password : input.pin;\n  return typeof value === 'string' && (/^[0-9]{6,12}$/.test(value) ||\n    (value.length >= 8 && value.length \u003c= 64 && !/[\\x00-\\x20\\x7f]/.test(value))) ? value : '';\n}\n\n/**\n * Chế độ đăng nhập của học sinh:\n *   'ma' (mặc định) — chỉ cần mã + trường/lớp, không kiểm tra mật khẩu.\n *   'mat_khau'      — bắt buộc mật khẩu đã cấp; phải khớp cờ requireStudentPassword ở frontend.\n */\nfunction studentLoginMode_() {\n  return String(PropertiesService.getScriptProperties()\n    .getProperty('STUDENT_LOGIN_MODE') || 'ma').toLowerCase() === 'mat_khau' ? 'mat_khau' : 'ma';\n}\n\nfunction loginStudent(input) {\n  let lock;\n  try {\n    if (!input || !schoolOK_(input) || typeof input.ma !== 'string' || !/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(input.ma)) fail_('Mã, trường/lớp hoặc mật khẩu không đúng.', 'AUTH_REQUIRED');\n    input = ClassIds.profile(input);\n    const id = accountSheetId_();\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau vài giây.', 'BUSY');\n    const cache = CacheService.getScriptCache(), key = 'login:student:' + accountKey_(input);\n    let state;\n    try { state = JSON.parse(cache.get(key) || 'null'); } catch { state = null; }\n    if (!state) state = { attempts: 0, blockedUntil: 0 };\n    if (state.blockedUntil > Date.now()) return { ok: false, code: 'RATE_LIMITED',\n      retryAfterSeconds: Math.max(1, Math.ceil((state.blockedUntil - Date.now()) / 1000)),\n      error: 'Mã này đang tạm khóa đăng nhập. Thử lại sau ' + Math.max(1, Math.ceil((state.blockedUntil - Date.now()) / 1000)) + ' giây.' };\n    if (state.blockedUntil) state = { attempts: 0, blockedUntil: 0 };\n    const account = studentAccounts_(id).find(item => accountKey_(item) === accountKey_(input));\n    // Chế độ chỉ cần mã: bỏ kiểm tra mật khẩu. Dòng tai_khoan (nếu có) chỉ dùng để biết mã bị khóa.\n    if (studentLoginMode_() === 'ma') {\n      if (account && account.status !== 'hoat_dong') fail_('Tài khoản này đang bị khóa. Liên hệ người phụ trách.', 'AUTH_REQUIRED');\n      cache.remove(key);\n      const codeToken = Utilities.getUuid() + Utilities.getUuid(), codeExpires = Date.now() + 21600000;\n      cache.put('student:' + codeToken, JSON.stringify({\n        ma: account ? account.ma : input.ma,\n        truong: account ? account.truong : input.truong,\n        lop: account ? account.lop : ClassIds.code(input.lop),\n        expires: codeExpires,\n        credentialVersion: account ? account.pinHash : ''\n      }), 21600);\n      return { ok: true, token: codeToken, expires: codeExpires };\n    }\n    // Tính digest cả với tài khoản không tồn tại để không trả thông tin danh sách mã.\n    const candidate = account || { ...input, salt: 'unregistered' };\n    const suppliedPin = studentPassword_(input);\n    const digest = pinDigest_(suppliedPin, candidate);\n    const alternateClass = (candidate.credentialClass || candidate.lop) === ClassIds.code(candidate.lop) ? ClassIds.label(candidate.lop) : ClassIds.code(candidate.lop);\n    const alternateDigest = pinDigest_(suppliedPin, {...candidate,credentialClass:alternateClass});\n    if (!account || account.status !== 'hoat_dong' || !account.pinHash ||\n        !suppliedPin || !(constantTimeEqual_(digest, account.pinHash) || constantTimeEqual_(alternateDigest, account.pinHash))) {\n      state.attempts++;\n      if (state.attempts >= 8) state.blockedUntil = Date.now() + 600000;\n      cache.put(key, JSON.stringify(state), 600);\n      return { ok: false, code: state.blockedUntil ? 'RATE_LIMITED' : 'AUTH_REQUIRED',\n        ...(state.blockedUntil ? { retryAfterSeconds: 600 } : {}),\n        error: state.blockedUntil ? 'Đã thử sai 8 lần. Mã này tạm khóa 600 giây.' : 'Mã, trường/lớp hoặc mật khẩu không đúng.' };\n    }\n    cache.remove(key);\n    const token = Utilities.getUuid() + Utilities.getUuid(), expires = Date.now() + 21600000;\n    cache.put('student:' + token, JSON.stringify({ ma: account.ma, truong: account.truong, lop: account.lop,\n      expires, credentialVersion: account.pinHash }), 21600);\n    return { ok: true, token, expires };\n  } catch (error) {\n    return { ok: false, code: error.code || 'SERVER_ERROR', error: error.code ? error.message : 'Chưa đăng nhập được. Bài cũ trên máy vẫn được giữ.' };\n  } finally { if (lock && lock.hasLock()) lock.releaseLock(); }\n}\n\nfunction authorizeStudent_(token, data, id) {\n  if (typeof token !== 'string' || token.length \u003c 20 || token.length > 160) fail_('Hãy đăng nhập lại bằng mã và mật khẩu để đồng bộ.', 'AUTH_REQUIRED');\n  let auth;\n  try { auth = JSON.parse(CacheService.getScriptCache().get('student:' + token) || 'null'); } catch { auth = null; }\n  if (!auth || !Number.isFinite(auth.expires) || auth.expires \u003c= Date.now() || accountKey_(auth) !== accountKey_(data)) fail_('Phiên học sinh hết hạn hoặc không đúng mã/trường/lớp.', 'AUTH_REQUIRED');\n  const account = studentAccounts_(id).find(item => accountKey_(item) === accountKey_(data));\n  if (studentLoginMode_() === 'ma') {\n    if (account && account.status !== 'hoat_dong') fail_('Tài khoản đã khóa. Hãy đăng nhập lại.', 'AUTH_REQUIRED');\n    return account || { ma: data.ma, truong: data.truong, lop: ClassIds.code(data.lop), status: 'hoat_dong' };\n  }\n  if (!account || account.status !== 'hoat_dong' || !account.pinHash || account.pinHash !== auth.credentialVersion) fail_('Tài khoản đã khóa hoặc PIN đã thay đổi. Hãy đăng nhập lại.', 'AUTH_REQUIRED');\n  return account;\n}\n\nfunction logoutStudent(token) {\n  return logoutRole_(token, 'student');\n}\n\n/** Chỉ tổng hợp từ bài đã ghi vào chu_trinh; không tin tiến độ do client gửi lên. */\nfunction projectStudentProgress_(id, account) {\n  const raw = Sheets.Spreadsheets.Values.get(id, \"'chu_trinh'!E2:H\", {\n    valueRenderOption: 'UNFORMATTED_VALUE', dateTimeRenderOption: 'SERIAL_NUMBER'\n  }).values || [];\n  const weeks = [...new Set(raw.filter(row => row[0] === account.ma && row[1] === account.truong && ClassIds.code(row[2]) === account.lop)\n    .map(row => Number(row[3])).filter(week => Number.isInteger(week) && week >= 1 && week \u003c= 4))].sort();\n  const rows = readSystemTable_(id, 'tien_do', PROGRESS_HEADERS), matches = [];\n  rows.forEach((row, index) => { if (row[0] === account.ma && row[1] === account.truong && ClassIds.code(row[2]) === account.lop) matches.push(index); });\n  if (matches.length > 1) fail_('Bảng tien_do có mã trùng trong cùng trường/lớp. Chủ dự án cần kiểm tra.', 'SETUP_REQUIRED');\n  const updatedAt = new Date().toISOString();\n  const values = [account.ma, account.truong, account.lop, ...[1,2,3,4].map(week => weeks.includes(week)), weeks.length, updatedAt];\n  if (matches.length) {\n    const rowNumber = matches[0] + 2;\n    Sheets.Spreadsheets.Values.update({ values: [values] }, id, \"'tien_do'!A\" + rowNumber + ':I' + rowNumber, { valueInputOption: 'RAW' });\n  } else {\n    Sheets.Spreadsheets.Values.append({ values: [values] }, id, \"'tien_do'!A1\", { valueInputOption: 'RAW', insertDataOption: 'INSERT_ROWS' });\n  }\n  return { ma: account.ma, truong: account.truong, lop: account.lop, weeks, updatedAt };\n}\n\nfunction getStudentProgress(input) {\n  let lock;\n  try {\n    if (!input) fail_('Hãy đăng nhập để xem tiến độ.', 'AUTH_REQUIRED');\n    const id = accountSheetId_();\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau vài giây.', 'BUSY');\n    const account = authorizeStudent_(input.token, input, id);\n    return { ok: true, ...projectStudentProgress_(id, account) };\n  } catch (error) {\n    return { ok: false, code: error.code || 'SERVER_ERROR', error: error.code ? error.message : 'Chưa tải được tiến độ. Hãy thử lại.' };\n  } finally { if (lock && lock.hasLock()) lock.releaseLock(); }\n}\n\nfunction newStudentPassword_() {\n  // Sinh từ UUID ngẫu nhiên; không lấy mã học sinh hoặc dùng chung cho cả lớp.\n  return 'Xc' + Utilities.getUuid().replace(/-/g, '').slice(0, 24);\n}\n\nfunction newStudentPin_() { return newStudentPassword_(); }\n\nfunction accountRow_(account) {\n  return [account.ma, account.truong, account.lop, account.status, account.salt, account.pinHash, account.issuedAt];\n}\n\nfunction showIssuedPins_(ui, issued, note = '') {\n  const quote = value => '\"' + String(value).replace(/\"/g, '\"\"') + '\"';\n  const csv = [['ma','truong','lop','mat_khau'], ...issued.map(item => [item.ma,item.truong,item.lop,item.pin])].map(row => row.map(quote).join(',')).join('\\n');\n  const download = '\u003cp>\u003ca download=\"Tai_khoan_mat_khau.csv\" href=\"data:text/csv;charset=utf-8,' + encodeURIComponent('\\uFEFF' + csv) + '\">Tải file tài khoản và mật khẩu (CSV)\u003c/a>\u003c/p>';\n  const escape = value => String(value).replace(/[&\u003c>\\\"]/g, char => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[char]));\n  ui.showModalDialog(HtmlService.createHtmlOutput('\u003ch2>Mật khẩu mới — chỉ hiện ở lần cấp này\u003c/h2>\u003cp>Sao chép và giao riêng cho từng học sinh. Không đăng Git, nhóm lớp hoặc lưu chung với dữ liệu nghiên cứu. Giữ mật khẩu nguyên chữ hoa/thường, không thêm khoảng trắng.\u003c/p>\u003cp>' + escape(note) + '\u003c/p>' + download + '\u003ctextarea readonly style=\"width:100%;height:300px\">' + escape(csv) + '\u003c/textarea>').setWidth(650).setHeight(470), 'Cấp mật khẩu học sinh');\n}\n\n/** Chạy sau khi chép mã có sẵn vào A:C của tai_khoan. Không sinh lại mã, không đổi PIN đã cấp. */\nfunction provisionStudentAccounts_() {\n  const ui = SpreadsheetApp.getUi();\n  let lock, issued = [];\n  try {\n    const id = accountSheetId_();\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau.', 'BUSY');\n    const accounts = studentAccounts_(id);\n    if (!accounts.length) fail_('Chép danh sách mã, trường, lớp vào A:C của tai_khoan trước.', 'SETUP_REQUIRED');\n    const props = PropertiesService.getScriptProperties();\n    if (!props.getProperty('STUDENT_PIN_SECRET')) {\n      if (accounts.some(account => account.pinHash)) fail_('Thiếu bí mật PIN của tài khoản đã cấp. Khôi phục Script Properties trước; không tự đổi khóa.', 'SETUP_REQUIRED');\n      props.setProperty('STUDENT_PIN_SECRET', Utilities.getUuid() + Utilities.getUuid());\n    }\n    const pending = [], data = [];\n    for (const account of accounts) {\n      if (account.pinHash || account.status !== 'hoat_dong') continue;\n      const pin = newStudentPin_(); delete account.credentialClass; account.salt = Utilities.getUuid();\n      account.pinHash = pinDigest_(pin, account); account.issuedAt = new Date().toISOString();\n      data.push({ range: \"'tai_khoan'!A\" + account.rowNumber + ':G' + account.rowNumber, values: [accountRow_(account)] });\n      pending.push({ ma: account.ma, truong: account.truong, lop: account.lop, pin });\n    }\n    if (data.length) {\n      // Một yêu cầu cho cả đợt, tránh 150 lệnh ghi riêng vượt quota theo phút.\n      Sheets.Spreadsheets.Values.batchUpdate({ valueInputOption: 'RAW', data }, id);\n      issued = pending;\n    }\n  } finally {\n    if (lock && lock.hasLock()) lock.releaseLock();\n    if (issued.length) showIssuedPins_(ui, issued);\n  }\n  if (!issued.length) ui.alert('Không có mã đang hoạt động mới cần cấp PIN. PIN đã cấp được giữ nguyên.');\n  return { created: issued.length };\n}\n\n/** Chọn đúng dòng tai_khoan trong Sheet rồi chạy; PIN cũ và mọi token cũ của mã đó bị vô hiệu hóa. */\nfunction resetSelectedStudentPin_() {\n  const spreadsheet = SpreadsheetApp.getActiveSpreadsheet(), sheet = spreadsheet && spreadsheet.getActiveSheet();\n  if (!sheet || sheet.getName() !== 'tai_khoan') fail_('Chọn một dòng học sinh trong bảng tai_khoan trước.', 'SETUP_REQUIRED');\n  const range = sheet.getActiveRange();\n  if (!range || range.getNumRows() !== 1 || range.getRow() \u003c 2) fail_('Chỉ chọn một dòng học sinh.', 'INVALID_RECORD');\n  const ui = SpreadsheetApp.getUi();\n  let lock, issued;\n  try {\n    const id = accountSheetId_();\n    if (id !== spreadsheet.getId()) fail_('Sheet đang mở không khớp cấu hình dự án.', 'SETUP_REQUIRED');\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau.', 'BUSY');\n    const account = studentAccounts_(id).find(item => item.rowNumber === range.getRow());\n    if (!account) fail_('Dòng được chọn chưa có tài khoản hợp lệ.', 'INVALID_RECORD');\n    const pin = newStudentPin_(); delete account.credentialClass; account.salt = Utilities.getUuid();\n    account.pinHash = pinDigest_(pin, account); account.issuedAt = new Date().toISOString();\n    Sheets.Spreadsheets.Values.update({ values: [accountRow_(account)] }, id,\n      \"'tai_khoan'!A\" + account.rowNumber + ':G' + account.rowNumber, { valueInputOption: 'RAW' });\n    issued = { ma: account.ma, truong: account.truong, lop: account.lop, pin };\n  } finally { if (lock && lock.hasLock()) lock.releaseLock(); }\n  showIssuedPins_(ui, [issued], 'Các phiên cũ của mã này phải nhập lại mật khẩu.');\n  return { reset: true };\n}\n\n/** Chuẩn bị bảng trung gian chỉ 3 cột, không nhập dữ liệu khảo sát vào hệ thống. */\nfunction prepareStudentImport_() {\n  const spreadsheet = SpreadsheetApp.getActiveSpreadsheet();\n  if (!spreadsheet || spreadsheet.getId() !== accountSheetId_()) fail_('Mở đúng Sheet đã cấu hình.', 'SETUP_REQUIRED');\n  const headers = ['ma', 'truong', 'lop'];\n  const sheet = spreadsheet.getSheetByName('nhap_tai_khoan') || spreadsheet.insertSheet('nhap_tai_khoan');\n  if (sheet.getLastRow() === 0) {\n    sheet.getRange(1, 1, 1, 3).setValues([headers]); sheet.setFrozenRows(1);\n  } else if (!headersMatch_(sheet, headers)) fail_('Bảng nhập cần đúng ba cột ma, truong, lop. Không ghi đè dữ liệu cũ.', 'SETUP_REQUIRED');\n  SpreadsheetApp.getUi().alert('Dán dữ liệu CSV mã/trường/lớp vào nhap_tai_khoan, không dán các cột khảo sát. Sau đó chạy importStudentRoster_.');\n}\n\n/** Chỉ chạy từ editor; kiểm tra cả danh sách trước khi ghi, thêm mới và giữ mật khẩu cũ. */\nfunction importStudentRoster_() {\n  const ui = SpreadsheetApp.getUi();\n  let lock, result;\n  try {\n    const id = accountSheetId_();\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau.', 'BUSY');\n    const incoming = normalizeAccounts_(readSystemTable_(id, 'nhap_tai_khoan', ['ma', 'truong', 'lop']).map(row => row.slice(0, 3)));\n    if (!incoming.length) fail_('Bảng nhập chưa có mã học sinh.', 'SETUP_REQUIRED');\n    const existing = new Set(studentAccounts_(id).map(accountKey_));\n    const fresh = incoming.filter(account => !existing.has(accountKey_(account)));\n    if (fresh.length) Sheets.Spreadsheets.Values.append({values: fresh.map(accountRow_)}, id,\n      \"'tai_khoan'!A1\", {valueInputOption:'RAW', insertDataOption:'INSERT_ROWS'});\n    result = {created: fresh.length, existing: incoming.length - fresh.length};\n  } finally { if (lock && lock.hasLock()) lock.releaseLock(); }\n  // Ui.alert tạm dừng server: phải thả khóa trước khi chờ người dùng.\n  ui.alert('Đã thêm ' + result.created + ' tài khoản; giữ nguyên ' + result.existing + ' tài khoản đã có. Chạy provisionStudentAccounts_ để cấp mật khẩu cho mã mới.');\n  return result;\n}\n", "apps-script/Learning.gs": "/** Nháp riêng theo tài khoản/tuần. Không dùng nháp làm bài nộp hoặc điểm nghiên cứu. */\nconst LEARNING_HEADERS = ['ma','truong','lop','tuan','draft_id','revision','mutation_id','cap_nhat',\n  ...Array.from({length:16},(_,index)=>'noi_dung_'+(index+1))];\n\nfunction cleanStudentDraft_(draft, week) {\n  const plain = value => value && typeof value === 'object' && !Array.isArray(value);\n  const spec = SCHEMA.workflow && SCHEMA.workflow[week - 1];\n  if (!spec) fail_('Cần cập nhật Schema.gs và Learning.gs cùng phiên bản.', 'SETUP_REQUIRED');\n  if (!plain(draft) || Object.keys(draft).some(key => !['id','version','step','answers','started','activeMs','stageTimes','hints','sourceId'].includes(key)) ||\n      typeof draft.id !== 'string' || !/^[a-zA-Z0-9-]{12,80}$/.test(draft.id) ||\n      typeof draft.version !== 'string' || draft.version.length > 40 ||\n      !Number.isInteger(draft.step) || draft.step \u003c 0 || draft.step >= spec.length ||\n      typeof draft.started !== 'string' || !isFinite(Date.parse(draft.started)) ||\n      !num_(draft.activeMs, 0, 604800000) || !plain(draft.answers) || !plain(draft.stageTimes) || !plain(draft.hints)) fail_('Cấu trúc nháp không hợp lệ.');\n  const fields = SCHEMA.weeks[week - 1], answers = {};\n  if (Object.keys(draft.answers).some(key => !fields.some(field => field.key === key))) fail_('Nháp chứa câu trả lời ngoài nhiệm vụ.');\n  for (const field of fields) {\n    if (!Object.prototype.hasOwnProperty.call(draft.answers, field.key)) continue;\n    const value = draft.answers[field.key];\n    if (field.kind === 'rating') {\n      if (![1,2,3].includes(value)) fail_('Mức tự đánh giá không hợp lệ.');\n    } else if (typeof value !== 'string' || value.length > field.max || (field.options && value !== '' && !field.options.includes(value))) fail_('Câu trả lời nháp vượt giới hạn hoặc sai lựa chọn.');\n    answers[field.key] = typeof value === 'string' && !field.options && Safety.matches(value, SCHEMA.safety) ? Safety.hidden : value;\n  }\n  const stageTimes = {}, hints = {};\n  for (const key of Object.keys(draft.stageTimes).sort()) {\n    if (!spec.some(step => step.stage === key) || !num_(draft.stageTimes[key], 0, 604800000)) fail_('Thời gian chặng không hợp lệ.');\n    stageTimes[key] = draft.stageTimes[key];\n  }\n  for (const key of Object.keys(draft.hints).sort()) {\n    if (!/^(0|[1-9][0-9]*)$/.test(key) || !spec[Number(key)] || !Number.isInteger(draft.hints[key]) || draft.hints[key] \u003c 0 || draft.hints[key] > spec[Number(key)].hints) fail_('Gợi ý không hợp lệ.');\n    hints[key] = draft.hints[key];\n  }\n  const result = {id:draft.id,version:draft.version,step:draft.step,answers,started:draft.started,activeMs:draft.activeMs,stageTimes,hints};\n  if (draft.sourceId !== undefined) {\n    if (typeof draft.sourceId !== 'string' || !/^[a-zA-Z0-9-]{12,80}$/.test(draft.sourceId)) fail_('Liên kết sản phẩm gốc không hợp lệ.');\n    result.sourceId = draft.sourceId;\n  }\n  if (JSON.stringify(result).length > 159000) fail_('Nháp quá lớn. Hãy tải bản sao trước khi tiếp tục.');\n  return result;\n}\n\nfunction learningRows_(id) { return readSystemTable_(id, 'nhap_hoc_tap', LEARNING_HEADERS); }\nfunction ownLearningRows_(rows, account) {\n  const found = new Set();\n  return rows.map((row,index) => ({row,index})).filter(item => {\n    const row = item.row;\n    if (row[0] !== account.ma || row[1] !== account.truong || ClassIds.code(row[2]) !== account.lop) return false;\n    if (!Number.isInteger(row[3]) || row[3] \u003c 1 || row[3] > 4 || found.has(row[3]) || !Number.isSafeInteger(row[5]) || row[5] \u003c 1) fail_('Bảng nháp có tuần hoặc revision không hợp lệ/trùng. Chủ dự án cần kiểm tra.', 'SETUP_REQUIRED');\n    found.add(row[3]); return true;\n  });\n}\nfunction decodeLearningRow_(row) {\n  let draft;\n  try { draft = JSON.parse(row.slice(8).join('')); } catch { fail_('Không đọc được nháp trên Sheet; dữ liệu trên máy vẫn được giữ.', 'SETUP_REQUIRED'); }\n  return cleanStudentDraft_(draft, row[3]);\n}\nfunction learningChunks_(value) {\n  const chunks = [];\n  while (value.length) {\n    let size = Math.min(10000, value.length);\n    if (size \u003c value.length && /[\\uD800-\\uDBFF]/.test(value[size - 1])) size--;\n    chunks.push(value.slice(0,size)); value = value.slice(size);\n  }\n  if (chunks.length > 16) fail_('Nháp quá lớn.');\n  while (chunks.length \u003c 16) chunks.push('');\n  return chunks;\n}\n\n/** Đọc chỉ các dòng bài thuộc người đang xác thực; không trả bài của học sinh khác. */\nfunction studentRecords_(id, account) {\n  const options = {valueRenderOption:'UNFORMATTED_VALUE',dateTimeRenderOption:'SERIAL_NUMBER'};\n  const metadata = Sheets.Spreadsheets.Values.get(id,\"'chu_trinh'!E2:H\",options).values || [];\n  const ranges = [];\n  metadata.forEach((row,index) => {\n    if (row[0] === account.ma && row[1] === account.truong && ClassIds.code(row[2]) === account.lop) ranges.push(\"'chu_trinh'!\" + (index + 2) + ':' + (index + 2));\n  });\n  const records = [];\n  for (let offset = 0; offset \u003c ranges.length; offset += 50) {\n    const result = Sheets.Spreadsheets.Values.batchGet(id,{...options,ranges:ranges.slice(offset,offset+50)});\n    for (const range of result.valueRanges || []) {\n      const row = (range.values || [])[0];\n      if (!row) continue;\n      const record = {loai:'chu_trinh'};\n      HEADERS.chu_trinh.forEach((key,index) => {record[key] = row[index] ?? '';});\n      // Kiểm tra lần nữa trước khi trả, kể cả khi bảng nguồn bị chỉnh thủ công.\n      if (record.ma === account.ma && record.truong === account.truong && ClassIds.code(record.lop) === account.lop) records.push(Safety.redactRecord(ClassIds.profile(record),SCHEMA.safety));\n    }\n  }\n  return records;\n}\n\nfunction getStudentLearning(input) {\n  let lock;\n  try {\n    if (!input) fail_('Cần đăng nhập để tải tiến trình.', 'AUTH_REQUIRED');\n    const id = accountSheetId_(); lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Nháp trên máy vẫn được giữ.', 'BUSY');\n    const account = authorizeStudent_(input.token,input,id), records = studentRecords_(id,account);\n    const submitted = new Set(records.map(record => record.id));\n    const states = ownLearningRows_(learningRows_(id),account).map(({row}) => ({week:row[3],revision:row[5],mutationId:row[6],updatedAt:row[7],\n      draft:submitted.has(row[4]) ? null : decodeLearningRow_(row)}));\n    return {ok:true,states,records};\n  } catch (error) {\n    return {ok:false,code:error.code || 'SERVER_ERROR',error:error.code ? error.message : 'Chưa tải được tiến trình. Bài và nháp trên máy vẫn được giữ.'};\n  } finally {if (lock && lock.hasLock()) lock.releaseLock();}\n}\n\nfunction saveStudentDraft(input) {\n  let lock;\n  try {\n    if (!input || !Number.isInteger(input.week) || input.week \u003c 1 || input.week > 4 ||\n        !Number.isSafeInteger(input.expectedRevision) || input.expectedRevision \u003c 0 ||\n        typeof input.mutationId !== 'string' || !/^[a-zA-Z0-9-]{12,80}$/.test(input.mutationId)) fail_('Yêu cầu lưu nháp không hợp lệ.');\n    const id = accountSheetId_(); lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Nháp sẽ được gửi lại.', 'BUSY');\n    const account = authorizeStudent_(input.token,input,id), draft = cleanStudentDraft_(input.draft,input.week);\n    const json = JSON.stringify(draft), current = ownLearningRows_(learningRows_(id),account).find(item => item.row[3] === input.week);\n    const revision = current ? current.row[5] : 0;\n    const ids = Sheets.Spreadsheets.Values.get(id,\"'chu_trinh'!A2:A\",{valueRenderOption:'UNFORMATTED_VALUE',dateTimeRenderOption:'SERIAL_NUMBER'}).values || [];\n    if (ids.some(row => row[0] === draft.id)) return {ok:false,code:'ALREADY_SUBMITTED',error:'Bài này đã nộp. Tải lại tiến trình trước khi làm lượt mới.'};\n    if (current && current.row[6] === input.mutationId) {\n      if (JSON.stringify(decodeLearningRow_(current.row)) !== json) fail_('Lần gửi nháp đã tồn tại với nội dung khác.', 'ID_CONFLICT');\n      return {ok:true,week:input.week,revision,mutationId:input.mutationId,updatedAt:current.row[7],duplicate:true};\n    }\n    if (input.expectedRevision !== revision) return {ok:false,code:'STATE_CONFLICT',error:'Nháp đã thay đổi trên thiết bị khác. Cả hai bản được giữ để bạn chọn.',week:input.week,revision,draft:current && !ids.some(row=>row[0]===current.row[4]) ? decodeLearningRow_(current.row) : null};\n\n    const values = [account.ma,account.truong,account.lop,input.week,draft.id,revision+1,input.mutationId,new Date().toISOString(),...learningChunks_(json)];\n    if (current) {\n      const number = current.index + 2;\n      Sheets.Spreadsheets.Values.update({values:[values]},id,\"'nhap_hoc_tap'!A\"+number+':X'+number,{valueInputOption:'RAW'});\n    } else Sheets.Spreadsheets.Values.append({values:[values]},id,\"'nhap_hoc_tap'!A1\",{valueInputOption:'RAW',insertDataOption:'INSERT_ROWS'});\n    return {ok:true,week:input.week,revision:revision+1,mutationId:input.mutationId,updatedAt:values[7],duplicate:false};\n  } catch (error) {\n    return {ok:false,code:error.code || 'SERVER_ERROR',error:error.code ? error.message : 'Chưa lưu được nháp lên Sheet. Bản trên máy vẫn được giữ.'};\n  } finally {if (lock && lock.hasLock()) lock.releaseLock();}\n}\n", "apps-script/Management.gs": "/** Bảng quản lý chỉ tính từ các mảng ô được truyền vào. Không đọc Sheet/Properties trong custom function. */\nconst MANAGEMENT_FIELDS = ['thu_lam','nghi_1','nghi_2','nghi_3','noi','dang_san_pham','san_pham','chia_se','tu_danh_gia','phe','doi_hay_giu','kiem_soat','ngoai_kiem_soat'];\nconst MANAGEMENT_HEADERS = ['ma','truong','lop','tuan','trang_thai','buoc_hien_tai','tong_so_buoc','so_o_da_dien','tong_so_o','ti_le_o_da_dien_pct','so_tuan_da_nop','tien_do_chuong_trinh_pct','draft_hoac_bai_id','cap_nhat',...MANAGEMENT_FIELDS];\nconst STUDENT_MANAGEMENT_HEADERS = ['ma','truong','lop','trang_thai_tai_khoan','tuan_1_da_nop','tuan_2_da_nop','tuan_3_da_nop','tuan_4_da_nop','so_tuan_da_nop','tien_do_chuong_trinh_pct','cac_tuan_dang_lam','cap_nhat_cuoi','so_bai_da_nop'];\n\nfunction managementModel_(accountValues, draftValues, recordValues) {\n  if (![accountValues,draftValues,recordValues].every(Array.isArray)) throw Error('Cần truyền đủ ba vùng tài khoản, nháp và bài nộp.');\n  const key = value => JSON.stringify([value.truong,ClassIds.code(value.lop),value.ma]);\n  const stamp = value => value instanceof Date ? value.toISOString() : typeof value === 'string' && isFinite(Date.parse(value)) ? new Date(value).toISOString() : '';\n  const accounts = new Map();\n  accountValues.forEach((row,index) => {\n    if (!Array.isArray(row) || !row.some(value=>value!=='' && value!==null && value!==undefined)) return;\n    const account={ma:String(row[0] || '').trim().toUpperCase().replace(/\\s/g,''),truong:String(row[1] || '').trim(),lop:ClassIds.code(String(row[2] || '').trim()),status:String(row[3] || 'hoat_dong')};\n    if (!/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(account.ma) || !schoolOK_(account) || !['hoat_dong','khoa'].includes(account.status)) throw Error('Kiểm tra dòng '+(index+2)+' của tai_khoan.');\n    const id=key(account);\n    if(accounts.has(id))throw Error('Trùng mã/trường/lớp trong tai_khoan ở dòng '+(index+2)+'.');\n    accounts.set(id,{...account,drafts:new Map(),records:[],submitted:new Set(),ids:new Set()});\n  });\n  recordValues.forEach(row => {\n    if (!Array.isArray(row) || !row[0]) return;\n    const record={loai:'chu_trinh'};\n    HEADERS.chu_trinh.forEach((name,index)=>{record[name]=row[index] ?? '';});\n    record.lop=ClassIds.code(record.lop);\n    const account=accounts.get(key(record));\n    if(!account || !Number.isInteger(record.tuan) || record.tuan\u003c1 || record.tuan>SCHEMA.weeks.length)return;\n    if(account.ids.has(record.id))return;\n    account.ids.add(record.id);account.submitted.add(record.tuan);\n    account.records.push({record:Safety.redactRecord(record,SCHEMA.safety),updatedAt:stamp(record.thoi_gian_nhan)||stamp(record.thoi_gian)});\n  });\n  draftValues.forEach((row,index) => {\n    if(!Array.isArray(row) || !row[0])return;\n    const account=accounts.get(key({ma:row[0],truong:row[1],lop:row[2]}));\n    if(!account)return;\n    const week=row[3];\n    if(!Number.isInteger(week)||week\u003c1||week>SCHEMA.weeks.length||account.drafts.has(week))throw Error('Kiểm tra tuần/trùng nháp ở dòng '+(index+2)+' của nhap_hoc_tap.');\n    const draft=decodeLearningRow_(row); // Kiểm tra và che an toàn lại, không đọc nguồn bên ngoài.\n    if(draft.id!==row[4])throw Error('ID nháp không khớp ở dòng '+(index+2)+'.');\n    account.drafts.set(week,{draft,updatedAt:stamp(row[7])});\n  });\n  const details=[],students=[];\n  for(const account of accounts.values()) {\n    const completed=account.submitted.size, programPct=Math.round(completed/SCHEMA.weeks.length*100), active=[];\n    let lastUpdate='';\n    for(let week=1;week\u003c=SCHEMA.weeks.length;week++) {\n      const submitted=account.records.filter(item=>item.record.tuan===week).sort((a,b)=>a.updatedAt.localeCompare(b.updatedAt));\n      const latest=submitted[submitted.length-1], saved=account.drafts.get(week);\n      // Gửi lại bài cũ không được làm mất lượt mới; nháp đã nộp không hiện lại như chưa xong.\n      const current=saved && !account.ids.has(saved.draft.id) && (!latest || saved.updatedAt>=latest.updatedAt) ? saved : null;\n      const values=current ? current.draft.answers : latest ? latest.record : {};\n      const fields=SCHEMA.weeks[week-1], total=fields.length;\n      const filled=fields.filter(field=>typeof values[field.key]==='number' || typeof values[field.key]==='string'&&values[field.key].trim()!=='').length;\n      const status=current ? account.submitted.has(week)?'dang_lam_luot_moi':'dang_lam' : latest?'da_nop':'chua_bat_dau';\n      const updatedAt=current ? current.updatedAt : latest?.updatedAt || '';\n      if(updatedAt>lastUpdate)lastUpdate=updatedAt;\n      if(current)active.push(week);\n      details.push([account.ma,account.truong,account.lop,week,status,current?current.draft.step+1:latest?SCHEMA.workflow[week-1].length:0,SCHEMA.workflow[week-1].length,filled,total,Math.round(filled/total*100),completed,programPct,current?current.draft.id:latest?.record.id||'',updatedAt,...MANAGEMENT_FIELDS.map(name=>values[name] ?? '')]);\n    }\n    students.push([account.ma,account.truong,account.lop,account.status,...[1,2,3,4].map(week=>account.submitted.has(week)),completed,programPct,active.join(', '),lastUpdate,account.ids.size]);\n  }\n  return {details,students};\n}\n\n/**\n * Câu trả lời an toàn từng tài khoản/tuần; tự tính lại khi các vùng nguồn đổi.\n * @customfunction\n */\nfunction XOAY_MANAGEMENT(accounts, drafts, records) {\n  return [MANAGEMENT_HEADERS,...managementModel_(accounts,drafts,records).details];\n}\n\n/**\n * Tổng quan tài khoản; không có PIN/hash/token, không phải điểm năng lực.\n * @customfunction\n */\nfunction XOAY_STUDENTS(accounts, drafts, records) {\n  return [STUDENT_MANAGEMENT_HEADERS,...managementModel_(accounts,drafts,records).students];\n}\n\n/** Chỉ chủ dự án chạy từ editor; không xóa bảng nguồn hay nội dung có sẵn. */\nfunction setupManagement_(spreadsheet) {\n  const supplied=!!spreadsheet;\n  if(!spreadsheet)spreadsheet = SpreadsheetApp.getActiveSpreadsheet();\n  if(!spreadsheet)fail_('Mở Apps Script từ Sheet của dự án.', 'SETUP_REQUIRED');\n  const configured=PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n  if(!supplied && (!configured || configured!==spreadsheet.getId()))fail_('Sheet không khớp cấu hình. Chạy setup_ trên đúng dự án trước.', 'SETUP_REQUIRED');\n  for(const name of ['tai_khoan','nhap_hoc_tap','chu_trinh'])if(!spreadsheet.getSheetByName(name))fail_('Thiếu bảng nguồn '+name+'. Chạy setup_ trước.', 'SETUP_REQUIRED');\n  const locale=spreadsheet.getSpreadsheetLocale() || 'en_US';\n  const separator=/^(vi|de|fr|it|es|pt|ru|pl|nl|da|fi|sv|tr|uk|cs|sk|hu|ro|el|id)(_|-|$)/i.test(locale)?';':',';\n  const sources=['tai_khoan!A2:D','nhap_hoc_tap!A2:X','chu_trinh!A2:Z'].join(separator);\n  const count=Math.max(0,spreadsheet.getSheetByName('tai_khoan').getLastRow()-1);\n  const targets=[['quan_ly_hoc_sinh','XOAY_STUDENTS',STUDENT_MANAGEMENT_HEADERS,count+1],['quan_ly_hoc_tap','XOAY_MANAGEMENT',MANAGEMENT_HEADERS,count*4+1]];\n  // Kiểm tra tất cả bảng trước, tránh sửa một bảng rồi mới phát hiện bảng kia có dữ liệu riêng.\n  for(const [name,fn] of targets){const sheet=spreadsheet.getSheetByName(name);if(sheet&&sheet.getLastRow()>0&&!sheet.getRange('A1').getFormula().startsWith('='+fn+'('))fail_('Bảng '+name+' đã có nội dung riêng; không ghi đè.', 'SETUP_REQUIRED');}\n  for(const [name,fn,headers,needed] of targets) {\n    const sheet=spreadsheet.getSheetByName(name)||spreadsheet.insertSheet(name);\n    if(sheet.getMaxColumns()\u003cheaders.length)sheet.insertColumnsAfter(sheet.getMaxColumns(),headers.length-sheet.getMaxColumns());\n    if(sheet.getMaxRows()\u003cMath.max(2,needed))sheet.insertRowsAfter(sheet.getMaxRows(),Math.max(2,needed)-sheet.getMaxRows());\n    sheet.getRange('A1').setFormula('='+fn+'('+sources+')');\n    sheet.setFrozenRows(1);sheet.setFrozenColumns(3);\n    sheet.getRange(1,1,1,headers.length).setFontWeight('bold').setBackground('#1e2a5e').setFontColor('#ffffff');\n    sheet.getRange(1,1,sheet.getMaxRows(),headers.length).setVerticalAlignment('top').setWrap(true);\n    if(!sheet.getFilter())sheet.getRange(1,1,sheet.getMaxRows(),headers.length).createFilter();\n  }\n  return {ok:true,tabs:targets.map(item=>item[0]),intervalSeconds:60};\n}\n", "apps-script/Schema.gs": "// Tự sinh bởi build.py; không sửa trực tiếp.\n/** Chính sách dùng chung trước khi gửi và trước khi ghi Sheet. Không sửa bản gốc trên máy. */\nconst Safety = (() => {\n  const hidden = '[đã ẩn – an toàn]';\n  const normalize = value => String(value ?? '').normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '').replace(/đ/gi, 'd')\n    .replace(/[\\u200b-\\u200d\\ufeff]/g, '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  function matches(value, config) {\n    const text = normalize(value);\n    return (config?.tu_khoa || []).some(word => normalize(word) && text.includes(normalize(word)));\n  }\n  function redactRecord(record, config) {\n    const result = { ...record };\n    const fields = record.loai === 'chu_trinh' ?\n      ['thu_lam', 'nghi_1', 'nghi_2', 'nghi_3', 'noi', 'san_pham', 'chia_se', 'kiem_soat', 'ngoai_kiem_soat'] :\n      record.loai === 'phieu_buoi' ? ['khung_gio', 'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat'] :\n      ['nhom', 'vi_sao'];\n    fields.forEach(key => {\n      if (typeof result[key] === 'string' && matches(result[key], config)) result[key] = hidden;\n    });\n    // Giữ quy tắc ánh xạ, đồng thời tránh rò nội dung qua cột tổng hợp.\n    if (record.loai === 'chu_trinh' && record.tuan === 3) {\n      if (result.nghi_1 === hidden) result.nghi_1 = (String(record.phe).startsWith('A') ? 'Phe A: ' : 'Phe B: ') + hidden;\n      if (result.chia_se === hidden) result.chia_se = record.doi_hay_giu + ': ' + hidden;\n    }\n    if (record.loai === 'chu_trinh' && record.tuan === 4) {\n      result.thu_lam = 'Phần mình thay đổi được:\\n' + result.kiem_soat +\n        '\\n\\nPhần mình không thay đổi được:\\n' + result.ngoai_kiem_soat;\n    }\n    return result;\n  }\n  return { hidden, matches, redactRecord };\n})();\nif (typeof module !== 'undefined') module.exports = Safety;\n\n/** Mã dữ liệu và nhãn hiển thị. Chỉ các bí danh liệt kê chính xác mới được quy đổi. */\nconst ClassIds = (() => {\n  const labels = {'10A3':'10A3 (10 Tin)','11E1':'11E1 (11 Văn)','LB-11A':'LB-11A (11A Lộc Bình)'};\n  const code = value => Object.keys(labels).find(key => labels[key] === value) || value;\n  const label = value => labels[code(value)] || value;\n  const profile = value => value && typeof value === 'object' ? {...value,lop:code(value.lop)} : value;\n  // Khóa trên máy giữ nguyên để không tách hồ sơ đã lưu trước 2.7.1. Không gửi khóa này lên Sheet.\n  const storageKey = value => JSON.stringify([value.truong,label(value.lop),value.ma]);\n  return {code,label,profile,storageKey};\n})();\nif (typeof module !== 'undefined') module.exports = ClassIds;\n\nconst SCHEMA = {\n  \"cellMax\": 13000,\n  \"schools\": [\n    {\n      \"truong\": \"THPT Chuyên Chu Văn An\",\n      \"lop\": [\n        \"10A3\",\n        \"11E1\"\n      ]\n    },\n    {\n      \"truong\": \"Trường PTDTNT THCS & THPT Lộc Bình\",\n      \"lop\": [\n        \"LB-11A\"\n      ]\n    },\n    {\n      \"truong\": \"THPT Chi Lăng\",\n      \"lop\": [\n        \"12A2\"\n      ]\n    }\n  ],\n  \"safety\": {\n    \"tu_khoa\": [\n      \"muốn chết\",\n      \"tự tử\",\n      \"không muốn sống\",\n      \"tự làm đau\",\n      \"tự làm hại\",\n      \"bị đánh\",\n      \"bị bắt nạt\",\n      \"bị đe dọa\"\n    ],\n    \"loi_nhan\": \"Cảm ơn bạn đã chia sẻ. Điều bạn đang gặp rất quan trọng. Hãy nói chuyện ngay với thầy cô chủ nhiệm hoặc cán bộ tư vấn học đường của trường – bạn không phải tự mình vượt qua một mình. Phần trả lời có từ khóa sẽ được thay bằng “[đã ẩn – an toàn]” khi gửi; bản gốc vẫn nằm trên máy và trong bản sao bạn tải về.\",\n    \"lien_he\": \"\"\n  },\n  \"workflow\": [\n    [\n      {\n        \"stage\": \"Mở thư\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Thử\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Nghĩ\",\n        \"hints\": 3\n      },\n      {\n        \"stage\": \"Nghĩ\",\n        \"hints\": 3\n      },\n      {\n        \"stage\": \"Nghĩ\",\n        \"hints\": 3\n      },\n      {\n        \"stage\": \"Nối\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Nối\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Chia sẻ\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Tự đánh giá\",\n        \"hints\": 0\n      }\n    ],\n    [\n      {\n        \"stage\": \"Mở thư\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Thử\",\n        \"hints\": 0\n      },\n      {\n        \"stage\": \"Nghĩ\",\n        \"hints\": 3\n      },\n      {\n        \"st >= field[\"min\"] >= 0, \"Giới hạn ô vượt mức nội bộ\"\n                for option in field.get(\"options\", []):\n                    assert utf16_length(option) \u003c= field[\"max\"], \"Lựa chọn vượt giới hạn ô\"\n        assert sum(stages.values()) == week[\"duration\"], (week[\"tuan\"], stages)\n        assert week[\"duration\"] == (15 if week[\"tuan\"] \u003c= 2 else 45)\n        assert len(fields) == len(set(fields)), \"Trùng khóa câu trả lời\"\n        assert fields.count(\"tu_danh_gia\") == 1, \"Mỗi tuần cần một tự đánh giá\"\n        limits = {field[\"key\"]: field[\"max\"] for step in week[\"steps\"] for field in step[\"fields\"]}\n        if week[\"tuan\"] == 3:\n            assert limits[\"nghi_1\"] + utf16_length(\"Phe A: \") \u003c= MAX_CELL_CHARS\n            assert limits[\"chia_se\"] + max(map(utf16_length, [\"Đổi ý: \", \"Giữ ý: \"])) \u003c= MAX_CELL_CHARS\n        if week[\"tuan\"] == 4:\n            total = limits[\"kiem_soat\"] + limits[\"ngoai_kiem_soat\"] + utf16_length(\"Phần mình thay đổi được:\\n\\n\\nPhần mình không thay đổi được:\\n\")\n            assert total \u003c= MAX_CELL_CHARS, \"Cột tổng hợp tuần 4 vượt giới hạn ô\"\n\n\n\ndef build():\n    content = json.loads(read(SRC / \"content.json\"))\n    validate_content(content)\n    DIST.mkdir(exist_ok=True)\n    SERVER.mkdir(exist_ok=True)\n\n    # Escape '\u003c' trong JSON để một lá thư có \u003c/script> không đóng thẻ script.\n    data_js = \"const CONTENT = \" + json.dumps(content, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\") + \";\"\n    sections = {\n        \"CSS\": read(SRC / \"style.css\"),\n        \"CONFIG\": read(SRC / \"config.js\"),\n        \"DATA\": data_js,\n        \"SAFETY\": read(SRC / \"safety.js\"),\n        \"CLASSES\": read(SRC / \"classes.js\"),\n        \"CORE\": read(SRC / \"core.js\"),\n        \"BACKUP\": read(SRC / \"backup.js\"),\n        \"LEARNING\": read(SRC / \"learning.js\"),\n        \"APP\": read(SRC / \"app.js\"),\n    }\n    html = read(SRC / \"shell.html\")\n    for name, source in sections.items():\n        marker = \"/*\" + name + \"*/\"\n        assert html.count(marker) == 1, \"Sai placeholder \" + name\n        html = html.replace(marker, source)\n    (DIST / \"index.html\").write_text(html, encoding=\"utf-8\")\n    assert html.count(\"authRequired: false\") == 1, \"Thiếu cấu hình xác thực riêng cho bản thật\"\n    (SERVER / \"Index.html\").write_text(html.replace(\"authRequired: false\", \"authRequired: true\"), encoding=\"utf-8\")\n\n    # Cùng định nghĩa ô nhập cho kiểm tra cả phía học sinh và máy chủ.\n    schema = {\n        \"cellMax\": MAX_CELL_CHARS,\n        \"schools\": content[\"truong_lop\"] + content.get(\"truong_lop_cu\", []),\n        \"safety\": content[\"an_toan\"],\n        \"workflow\": [[{\"stage\": step[\"stage\"], \"hints\": len(step[\"hints\"])} for step in week[\"steps\"]] for week in content[\"weeks\"]],\n        \"weeks\": [[field for step in week[\"steps\"] for field in step[\"fields\"]]\n                  for week in content[\"weeks\"]],\n    }\n    (SERVER / \"Schema.gs\").write_text(\n        \"// Tự sinh bởi build.py; không sửa trực tiếp.\\n\"\n        + read(SRC / \"safety.js\") + \"\\n\" + read(SRC / \"classes.js\") + \"\\n\"\n        + \"const SCHEMA = \" + json.dumps(schema, ensure_ascii=False, indent=2) + \";\\n\",\n        encoding=\"utf-8\",\n    )\n    version = hashlib.sha256(html.encode()).hexdigest()[:12]\n    # Cache shell cho bản tĩnh HTTP(S). Apps Script không dùng service worker này.\n    sw = \"const CACHE = 'xc-\" + version + \"';\\n\" + \"\"\"\nself.addEventListener('install', event => {\n  event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(['./', './index.html'])));\n});\nself.addEventListener('activate', event => {\n  event.waitUntil(caches.keys().then(keys => Promise.all(\n    keys.filter(key => key.startsWith('xc-') && key !== CACHE).map(key => caches.delete(key))\n  )));\n});\nself.addEventListener('fetch', event => {\n  if (e
