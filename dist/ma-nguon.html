`:''}${w.quy_trinh==='trien_lam_45'&&s.fields.some(f=>f.key==='san_pham')?oldProductHTML():''}${s.fields.map(f=>fieldHTML(f,a)).join('')}${s.dao_sau?.length?`\u003cdetails class=\"probing\">\u003csummary>Thử nghĩ sâu hơn\u003c/summary>${s.dao_sau.map(q=>`\u003cp>${E(q)}\u003c/p>`).join('')}\u003cp class=\"caption\">Câu hỏi gợi mở, không phải bài kiểm tra hay câu trả lời mẫu.\u003c/p>\u003c/details>`:''}\u003cdiv id=\"safety\" class=\"hidden safety\" role=\"status\">${E(CONTENT.an_toan.loi_nhan)}${CONTENT.an_toan.lien_he?'\u003cbr>'+E(CONTENT.an_toan.lien_he):''}\u003c/div>${s.hints.length?`\u003cbutton id=\"hint\" class=\"small\">Mình chưa biết bắt đầu thế nào\u003c/button>\u003cdiv id=\"hints\">${s.hints.slice(0,d.hints[d.step]||0).map(h=>`\u003cp class=\"hint\">${E(h)}\u003c/p>`).join('')}\u003c/div>`:''}\u003cdiv class=\"actions\">\u003cbutton id=\"prev\" ${d.step===0?'disabled':''}>← Quay lại\u003c/button>\u003cbutton id=\"next\" class=\"primary\">${d.step===w.steps.length-1?'Lưu & nộp bài ✓':'Tiếp tục →'}\u003c/button>\u003c/div>\u003cp class=\"caption\" style=\"margin:18px 0 0\" id=\"draftStatus\">${previewOnly?'Bản nháp tạm trong phiên — không lưu sau khi đóng trang':'Bản nháp lưu trên máy'} · Đồng hồ chỉ gợi ý, không khóa bài\u003c/p>\u003c/section>\u003c/div>`;\n  $('leave').onclick = () => go('home');\n  $('prev').onclick = () => {\n    flushDraft();\n    d.step--;\n    persist();\n    cloudSync()?.remember();\n    render();\n  };\n  $('next').onclick = () => nextStep(w, s, d);\n  document.querySelectorAll('[data-field]').forEach(el => {\n    if (el.type !== 'radio') el.value = a[el.dataset.field] ?? '';\n  });\n  document.querySelectorAll('[data-field]').forEach(el => el.addEventListener('input', () => {\n    d.answers[el.dataset.field] = el.type === 'radio' ? Number(el.value) : el.value;\n    const f = s.fields.find(f => f.key === el.dataset.field);\n    if ($('count_' + f.key)) $('count_' + f.key).textContent =\n      `${Core.words(el.value)} từ · tối thiểu ${f.min} từ · tối đa ${f.max} ký tự`;\n    $('err_' + f.key).textContent = '';\n    safety();\n    clearTimeout(saveTimer);\n    saveTimer = setTimeout(() => {\n      if (persist() && $('draftStatus')) $('draftStatus').textContent =\n        'Đã lưu nháp trên máy · Đồng hồ chỉ gợi ý';\n      cloudSync()?.remember();\n    }, 250);\n  }));\n  if ($('hint')) $('hint').onclick = () => {\n    d.hints[d.step] = Math.min(s.hints.length, (d.hints[d.step] || 0) + 1);\n    persist();\n    cloudSync()?.remember();\n    $('hints').innerHTML = s.hints.slice(0, d.hints[d.step]).map(h =>\n      `\u003cp class=\"hint\">${E(h)}\u003c/p>`).join('');\n    $('hint').disabled = d.hints[d.step] >= s.hints.length;\n  };\n  if ($('reuse')) $('reuse').onclick = () => {\n    const h = person().history.find(h => h.record.id === $('oldProduct').value);\n    if (!h) {\n      toast('Hãy chọn một sản phẩm trước.');\n      return;\n    }\n    if (a.san_pham && !confirm('Thay nội dung đang sửa bằng sản phẩm đã chọn?')) return;\n    d.sourceId = h.record.id;\n    a.dang_san_pham = h.record.dang_san_pham;\n    a.san_pham = h.record.san_pham;\n    persist();\n    cloudSync()?.remember();\n    render();\n  };\n  safety();\n  updateClock();\n}\n\nfunction safety() {\n  const d = current();\n  if (!$('safety') || !d) return;\n  const text = Object.values(d.answers).join(' ');\n  $('safety').classList.toggle('hidden', !Core.safetyMatches(text, CONTENT.an_toan));\n}\n\nfunction oldProductHTML() {\n  const hs = person().history.filter(h => h.record.tuan \u003c 4);\n  return `\u003cdiv class=\"notice\">\u003clabel for=\"oldProduct\">Sản phẩm tuần 1–3 của mình\u003c/label>\u003cselect id=\"oldProduct\">\u003coption value=\"\">${hs.length?'Chọn sản phẩm để sửa':'Chưa có sản phẩm cũ đã lưu'}\u003c/option>${hs.map(h=>`\u003coption value=\"${E(h.record.id)}\">Tuần ${h.record.tuan} · ${new Date(h.record.thoi_gian).toLocaleString('vi-VN')}\u003c/option>`).join('')}\u003c/select>\u003cbutton id=\"reuse\" class=\"small\" style=\"margin-top:10px\">Dùng làm bản gốc\u003c/button>\u003cp class=\"caption\" style=\"margin:8px 0 0\">Bài gốc vẫn được giữ nguyên. Nếu đổi máy, tải lại tiến trình để khôi phục sản phẩm đã nộp; nội dung an toàn đã được che sẽ giữ nguyên trạng thái che.\u003c/p>\u003c/div>`;\n}\n\nfunction collect() {\n  if (tab !== 'work' || !current()) return;\n  document.querySelectorAll('[data-field]').forEach(el => {\n    if (el.type === 'radio' && !el.checked) return;\n    current().answers[el.dataset.field] = el.type === 'radio' ? +el.value : el.value;\n  });\n}\n\nfunction flushDraft() {\n  collect();\n  clearTimeout(saveTimer);\n  if (profile && persist()) { cloudSync()?.remember(); cloudSync()?.flush(); }\n}\n\n/** Kiểm tra màn hình hiện tại; nộp chỉ khi mọi trường của cả tuần hợp lệ. */\nfunction nextStep(w, s, d) {\n  if (storageConflict || loadBroken) {\n    showStorageConflict();\n    return;\n  }\n  collect();\n  let bad = false;\n  s.fields.forEach(f => {\n    const err = Core.validate(f, d.answers[f.key]);\n    $('err_' + f.key).textContent = err;\n    if (err) bad = true;\n  });\n  if (bad) {\n    document.querySelector('.error:not(:empty)')?.scrollIntoView({\n      block: 'center'\n    });\n    return;\n  }\n  if (d.step \u003c w.steps.length - 1) {\n    d.step++;\n    persist();\n    cloudSync()?.remember();\n    cloudSync()?.flush();\n    render();\n    window.scrollTo({\n      top: 0\n    });\n    return;\n  }\n  for (let i = 0; i \u003c w.steps.length; i++)\n    if (w.steps[i].fields.some(f => Core.validate(f, d.answers[f.key]))) {\n      d.step = i;\n      render();\n      toast('Hãy hoàn thành phần còn thiếu trước khi nộp.');\n      return;\n    }\n  const record = Core.record(d, profile, w, APP_CONFIG.version),\n    p = person();\n  $('next').disabled = true;\n  p.history.push({\n    record,\n    sent: false\n  });\n  db.queue.push({\n    record\n  });\n  delete p.drafts[w.tuan];\n  if (!persist()) {\n    p.drafts[w.tuan] = d;\n    p.history = p.history.filter(h => h.record.id !== record.id);\n    db.queue = db.queue.filter(q => q.record.id !== record.id);\n    $('next').disabled = false;\n    return;\n  }\n  cloudSync()?.remember();\n  tab = 'notebook';\n  render();\n  toast(LIVE ? 'Đã lưu trên máy. Đang chờ xác nhận gửi từ máy chủ.' :\n    previewOnly ? 'Bài chỉ giữ tạm trong phiên xem thử. Hãy tải bản sao trước khi đóng trang.' : 'Đã lưu bài trên máy. Bản xem thử chưa gửi Google Sheets.');\n  sync();\n}\n\nfunction updateClock() {\n  if (tab !== 'work' || !current()) return;\n  const w = CONTENT.weeks.find(w => w.tuan === activeWeek),\n    d = current(),\n    s = w.steps[d.step];\n  if (!$('stepTimer')) return;\n  const left = Math.max(0, s.minutes * 60 - Math.floor((d.stageTimes[s.stage] || 0) / 1000));\n  $('stepTimer').textContent = s.minutes ?\n    `${s.stage} · ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} gợi ý` :\n    'Tự đánh giá theo nhịp của bạn';\n}\nsetInterval(() => {\n  const now = Date.now(),\n    dt = Math.min(now - lastTick, 2000);\n  lastTick = now;\n  if (tab === 'work' && current() && !document.hidden && !storageConflict && !loadBroken) {\n    const d = current(),\n      w = CONTENT.weeks.find(w => w.tuan === activeWeek),\n      s = w.steps[d.step];\n    d.activeMs += dt;\n    d.stageTimes[s.stage] = (d.stageTimes[s.stage] || 0) + dt;\n    updateClock();\n    if (Math.floor(d.activeMs / 1000) % 5 === 0) persist();\n  }\n}, 1000);\n\nfunction notebook() {\n  const h = person().history.slice().reverse();\n  $('page').innerHTML =\n    `\u003cp class=\"eyebrow\">NHỮNG ĐIỀU BẠN ĐÃ NHẬN RA\u003c/p>\u003cdiv class=\"row between\">\u003ch1>Sổ của mình\u003c/h1>\u003cbutton id=\"exportMine\">Tải bản sao JSON ↓\u003c/button>\u003c/div>\u003cp class=\"muted\">Bài đã nộp được giữ nguyên. Làm lượt mới tạo ID mới; bản 2 tuần 4 giữ liên kết với sản phẩm gốc. Dữ liệu ở đây thuộc tài khoản đang đăng nhập. Bài đã đồng bộ được khôi phục từ Sheet; bản gốc chưa che vẫn ở thiết bị đã viết.\u003c/p>${h.length?h.map(x=>`\u003carticle class=\"panel\" style=\"margin:18px 0\">\u003cdiv class=\"row between\">\u003cspan class=\"tag\">TUẦN ${x.record.tuan}${x.record.ban_goc_id ? ' · BẢN 2' : ''}\u003c/span>\u003cspan class=\"caption\">${new Date(x.record.thoi_gian).toLocaleString('vi-VN')}\u003c/span>\u003c/div>\u003ch2 style=\"margin:15px 0\">${E(CONTENT.weeks.find(w=>w.tuan===x.record.tuan)?.title)}\u003c/h2>${x.record.ban_goc_id ? '\u003cp class=\"caption revision-note\">Bản chỉnh sửa liên kết với sản phẩm gốc trên máy. Bài gốc được giữ nguyên.\u003c/p>' : ''}\u003cp class=\"badge\">${x.sent?'✓ Máy chủ đã xác nhận':LIVE?'◌ Chờ gửi — bài còn trên máy':previewOnly?'◌ Chỉ giữ tạm trong phiên xem thử':'◌ Chỉ lưu trên máy ở bản xem thử'}\u003c/p>\u003cp class=\"caption\">${Math.floor(x.record.thoi_luong_giay/60)} phút ${x.record.thoi_luong_giay%60} giây hoạt động · Tự đánh giá mức ${x.record.tu_danh_gia}\u003c/p>\u003cdetails class=\"historydetails\">\u003csummary>Xem câu trả lời và sản phẩm\u003c/summary>${['thu_lam','nghi_1','nghi_2','nghi_3','noi','san_pham','chia_se'].map(k=>`\u003cdiv class=\"entry\">\u003cstrong>${({thu_lam:'Thử',nghi_1:'Nghĩ 1',nghi_2:'Nghĩ 2 / Thư gửi mình',nghi_3:'Nghĩ 3',noi:'Nối',san_pham:'Sản phẩm',chia_se:'Chia sẻ / Đổi hoặc giữ ý'})[k]}\u003c/strong>\u003cpre class=\"text\">${E(x.record[k])}\u003c/pre>\u003c/div>`).join('')}\u003c/details>\u003c/article>`).join(''):'\u003cdiv class=\"panel empty\">\u003ch2>Trang đầu đang chờ bạn.\u003c/h2>\u003cp>Hoàn thành một tuần để lưu trải nghiệm của mình ở đây.\u003c/p>\u003cbutton id=\"first\" class=\"primary\">Bắt đầu tuần 1 →\u003c/button>\u003c/div>'}`;\n  $('exportMine').onclick = () => download('XoayChieu-' + profile.ma + '.json', JSON.stringify({\n    profile,\n    ...person()\n  }, null, 2));\n  if ($('first')) $('first').onclick = () => start(1);\n}\n\nfunction letters() {\n  $('page').innerHTML =\n    `\u003cp class=\"eyebrow\">MỖI TUẦN, MỘT CÂU HỎI LỚN\u003c/p>\u003ch1>Hộp thư triết học\u003c/h1>\u003cp class=\"muted\">Một lá thư nhỏ để mở đầu cuộc trò chuyện với chính mình.\u003c/p>\u003cdiv class=\"cards\">${CONTENT.weeks.map(w=>`\u003carticle class=\"card\">\u003cspan class=\"eyebrow\">LÁ THƯ 0${w.tuan} · ${E(w.letter.triet_gia)}\u003c/span>\u003ch2>${E(w.letter.tieu_de)}\u003c/h2>\u003cp>${E(w.letter.cau_hoi_lon)}\u003c/p>\u003cbutton data-letter=\"${w.tuan}\">Mở thư ↗\u003c/button>\u003c/article>`).join('')}\u003c/div>\u003cdiv class=\"notice\">${E(CONTENT.noi_dung_status)}\u003c/div>`;\n  document.querySelectorAll('[data-letter]').forEach(b => b.onclick = () => {\n    const w = CONTENT.weeks.find(w => w.tuan === +b.dataset.letter);\n    $('letterDialog').innerHTML = letterHTML(w) + '\u003cbutton id=\"closeLetter\">Đóng thư\u003c/button>';\n    $('closeLetter').onclick = () => $('letterDialog').close();\n    $('letterDialog').showModal();\n  });\n}\n\nfunction download(name, text) {\n  const u = URL.createObjectURL(new Blob([text], {\n      type: 'application/json;charset=utf-8'\n    })),\n    a = document.createElement('a');\n  a.href = u;\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(u), 1000);\n}\n\nfunction settings() {\n  $('page').innerHTML =\n    `\u003ch1>Cài đặt & dữ liệu\u003c/h1>\u003csection class=\"panel\">\u003ch3>${profile?'Mã đang dùng: '+E(profile.ma):'Chưa chọn mã'}\u003c/h3>\u003cp class=\"muted\">Đổi mã không xóa bài của mã cũ trên máy. Trên máy dùng chung, người khác có quyền truy cập trình duyệt có thể xem dữ liệu đã lưu.\u003c/p>\u003cbutton id=\"change\">${profile?'Đổi mã / trường / lớp':'Nhập mã'}\u003c/button>\u003cdiv class=\"divider\">\u003c/div>\u003ch3>${LIVE?'Kết nối Google Sheets':previewOnly?'Bản xem thử tạm thời':'Bản xem thử trên máy'}\u003c/h3>\u003cp>${LIVE?'Chỉ xóa bài khỏi hàng đợi sau khi máy chủ xác nhận đúng mã bản ghi.':'Bản này không gửi dữ liệu nghiên cứu. Hãy triển khai bộ Apps Script đi kèm để sử dụng chính thức.'}\u003c/p>\u003cp>${db.queue.length} bản ghi đang chờ.\u003c/p>\u003cbutton id=\"retry\">Thử gửi lại\u003c/button>${db.queue.filter(q=>q.error).map(q=>`\u003cp class=\"error\">${E(q.record.loai)}: ${E(q.error)}\u003c/p>`).join('')}\u003cdiv class=\"divider\">\u003c/div>\u003ch3>Bản sao trên máy\u003c/h3>\u003cp class=\"caption\">Tải bản sao trước khi đổi máy hoặc xóa dữ liệu trình duyệt. Bản sao toàn bộ có dữ liệu của mọi mã từng dùng trên máy này, hãy giữ riêng.\u003c/p>\u003cbutton id=\"backup\">Tải bản sao toàn bộ\u003c/button>\u003clabel class=\"field\">\u003cspan>Khôi phục bản sao toàn bộ trên máy mới\u003c/span>\u003cinput type=\"file\" id=\"import\" accept=\".json,application/json\">\u003c/label>\u003cp class=\"caption\">Khôi phục chỉ áp dụng trên trình duyệt chưa có dữ liệu; bài chưa gửi được giữ ở trạng thái tạm dừng. Bấm Thử gửi lại để tiếp tục.\u003c/p>\u003cdiv class=\"divider\">\u003c/div>\u003cdetails>\u003csummary>Thông tin phiên bản\u003c/summary>\u003cp>Ứng dụng ${E(APP_CONFIG.version)} · Nội dung ${E(CONTENT.phien_ban)} · ${E(CONTENT.noi_dung_status)}\u003c/p>\u003cp>Thời gian hoạt động chỉ tính khi màn hình làm bài đang mở và hiển thị; không phải thước đo mức độ tập trung. Học sinh tự giữ mã; mã không phải mật khẩu.\u003c/p>\u003c/details>\u003c/section>`;\n  $('change').onclick = () => { if (profile || teacherAuth) logout(); else go('home'); };\n  $('retry').onclick = () => LIVE ? sync(true) : toast('Bản xem thử chưa kết nối Google Sheets.');\n  $('backup').onclick = () => download('XoayChieu-backup.json', loadBroken ? (localStorage.getItem(\n    KEY) || '{}') : JSON.stringify(db, null, 2));\n  $('import').onchange = async e => {\n    try {\n      const file = e.target.files[0];\n      if (!file) return;\n      if (Object.keys(db.profiles).length || db.queue.length) throw Error(\n        'Hãy dùng trình duyệt mới chưa có dữ liệu để khôi phục, tránh ghi đè.');\n      if (file.size > APP_CONFIG.maxBackupBytes) throw Error('Tệp quá lớn.');\n      const v = Backup.restore(JSON.parse(await file.text()), CONTENT);\n      if (!confirm(\n          'Khôi phục dữ liệu? Bài chưa gửi sẽ được giữ và tạm dừng; bấm Thử gửi lại khi sẵn sàng.'\n        )) return;\n      const oldDb = db,\n        oldProfile = profile;\n      db = v;\n      profile = AUTH_REQUIRED ? null : db.current || null;\n      if (profile) { profile = {...profile,lop:Core.classCode(profile.lop)}; db.current = profile; }\n      loadBroken = false;\n      if (!persist()) {\n        db = oldDb;\n        profile = oldProfile;\n        throw Error('Không ghi được bản khôi phục. Dữ liệu hiện tại chưa bị thay.');\n      }\n      render();\n      toast('Đã khôi phục, giữ nguyên các bài chờ gửi. Chưa tự gửi lên máy chủ.');\n    } catch (err) {\n      toast(err.message);\n    }\n  };\n}\n\nfunction coord() {\n  if (LIVE && (!coordToken || Date.now() > coordUntil)) {\n    coordLogin();\n    return;\n  }\n  const p = profile;\n  $('page').innerHTML =\n    `\u003cp class=\"eyebrow\">GIỮ NHỊP · LẮNG NGHE · CÙNG SUY NGHĨ\u003c/p>\u003ch1>Góc điều phối\u003c/h1>${LIVE?'':'\u003cdiv class=\"notice\">Chế độ xem thử. Phiếu chỉ lưu trên máy; khi triển khai thật cần PIN do giáo viên cấp.\u003c/div>'}\u003csection class=\"panel\">\u003clabel class=\"field\">\u003cspan>Buổi của tuần\u003c/span>\u003cselect id=\"coordWeek\">${CONTENT.weeks.map(w=>`\u003coption value=\"${w.tuan}\">Tuần ${w.tuan} · ${w.duration} phút\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003cdiv class=\"row between\">\u003cdiv>\u003cspan id=\"stageName\" class=\"eyebrow\">\u003c/span>\u003cdiv id=\"coordTime\" class=\"timer\">00:00\u003c/div>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"timerPlay\">Bắt đầu / Tạm dừng\u003c/button>\u003cbutton id=\"timerNext\">Chặng tiếp →\u003c/button>\u003c/div>\u003c/div>\u003cp class=\"caption\">Thời gian gợi ý. Điều phối viên chủ động chuyển chặng.\u003c/p>\u003cdiv id=\"coordStages\" class=\"caption\">\u003c/div>\u003cdiv class=\"divider\">\u003c/div>\u003cdiv class=\"row between\">\u003ch3>Thẻ câu hỏi\u003c/h3>\u003cbutton id=\"draw\" class=\"small\">Rút thẻ khác\u003c/button>\u003c/div>\u003cp id=\"questionCard\">\u003c/p>\u003cdetails>\u003csummary>Vai trò & luật trao đổi\u003c/summary>${CONTENT.vai.map(v=>`\u003cp>\u003cstrong>${E(v[0])}\u003c/strong>: ${E(v[1])}\u003c/p>`).join('')}\u003cp>${CONTENT.luat_vong_tron.map(E).join(' · ')}\u003c/p>\u003c/details>\u003c/section>\u003csection class=\"panel\" style=\"margin-top:20px\">\u003ch2>Phiếu ghi buổi\u003c/h2>\u003cp class=\"caption\">${E(p.truong)} · ${E(p.lop)}. Điền sau khi buổi hoạt động kết thúc.\u003c/p>\u003cform id=\"sessionForm\">\u003cdiv class=\"cards\">\u003clabel class=\"field\">\u003cspan>Ngày\u003c/span>\u003cinput name=\"ngay\" type=\"date\" required value=\"${localDate()}\">\u003c/label>\u003clabel class=\"field\">\u003cspan>Khung giờ\u003c/span>\u003cinput name=\"khung_gio\" placeholder=\"Ví dụ 08:00–08:45\" required maxlength=\"60\">\u003c/label>\u003clabel class=\"field\">\u003cspan>Thời lượng thực tế (phút)\u003c/span>\u003cinput name=\"thoi_luong_thuc_te_phut\" type=\"number\" min=\"1\" max=\"240\" required>\u003c/label>\u003clabel class=\"field\">\u003cspan>Sĩ số\u003c/span>\u003cinput name=\"si_so\" type=\"number\" min=\"1\" max=\"200\" required>\u003c/label>\u003clabel class=\"field\">\u003cspan>Số bạn tham gia\u003c/span>\u003cinput name=\"so_tham_gia\" type=\"number\" min=\"0\" max=\"200\" required>\u003c/label>\u003clabel class=\"field\">\u003cspan>Hình thức\u003c/span>\u003cselect name=\"dung_app_hay_giay\">\u003coption>App\u003c/option>\u003coption>Giấy\u003c/option>\u003coption>Kết hợp\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"checks\">${['mo_thu','thu','nghi','noi','chia_se'].map((k,i)=>`\u003clabel>\u003cinput type=\"checkbox\" name=\"da_lam_${k}\">${['Đã mở thư','Đã Thử','Đã Nghĩ','Đã Nối','Đã Chia sẻ'][i]}\u003c/label>`).join('')}\u003c/div>\u003clabel class=\"field\">\u003cspan>Điều diễn ra tốt\u003c/span>\u003ctextarea name=\"dieu_tot\" required maxlength=\"6000\">\u003c/textarea>\u003c/label>\u003clabel class=\"field\">\u003cspan>Khó khăn (ghi “Không có” nếu không có)\u003c/span>\u003ctextarea name=\"kho_khan\" required maxlength=\"6000\">\u003c/textarea>\u003c/label>\u003clabel class=\"field\">\u003cspan>Điều phối viên — viết tắt\u003c/span>\u003cinput name=\"dieu_phoi_vien_viet_tat\" required maxlength=\"30\">\u003c/label>\u003cbutton class=\"primary\">Lưu phiếu ghi buổi\u003c/button>\u003c/form>\u003c/section>\u003csection class=\"panel\" style=\"margin-top:20px\" id=\"debatePanel\">\u003ch2>Đổi / giữ ý của nhóm — tuần 3\u003c/h2>\u003cform id=\"debateForm\">\u003clabel class=\"field\">\u003cspan>Mã hoặc tên nhóm (không ghi họ tên)\u003c/span>\u003cinput name=\"nhom\" required maxlength=\"60\">\u003c/label>\u003clabel class=\"field\">\u003cspan>Lựa chọn\u003c/span>\u003cselect name=\"doi_hay_giu\">\u003coption value=\"doi\">Đổi ý\u003c/option>\u003coption value=\"giu\">Giữ ý\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>Vì sao?\u003c/span>\u003ctextarea name=\"vi_sao\" required maxlength=\"6000\">\u003c/textarea>\u003c/label>\u003cbutton class=\"primary\">Lưu ý kiến nhóm\u003c/button>\u003c/form>\u003c/section>`;\n\n  function resetTimer() {\n    if (stageClock?.interval) clearInterval(stageClock.interval);\n    const w = CONTENT.weeks.find(w => w.tuan === +$('coordWeek').value),\n      map = new Map();\n    w.steps.forEach(s => {\n      if (s.minutes && !map.has(s.stage)) map.set(s.stage, s.minutes)\n    });\n    stageClock = {\n      stages: [...map],\n      idx: 0,\n      remaining: [...map][0][1] * 60,\n      running: false\n    };\n    $('debatePanel').classList.toggle('hidden', w.tuan !== 3);\n    $('coordStages').textContent = [...map].map(([s, m]) => `${s} ${m}′`).join(' → ');\n    paintCoord();\n  }\n  $('coordWeek').onchange = resetTimer;\n  resetTimer();\n  $('timerPlay').onclick = () => {\n    stageClock.running = !stageClock.running;\n    stageClock.last = Date.now();\n  };\n  $('timerNext').onclick = () => {\n    if (stageClock.idx >= stageClock.stages.length - 1) {\n      stageClock.running = false;\n      toast('Đã đến chặng cuối. Hãy ghi phiếu buổi.');\n      return;\n    }\n    stageClock.idx++;\n    stageClock.remaining = stageClock.stages[stageClock.idx][1] * 60;\n    stageClock.last = Date.now();\n    paintCoord();\n  };\n  const qs = Object.values(CONTENT.loai_cau_hoi_socrates).flatMap(x => x.mau_cau.map(q => x.ten +\n    ': ' + q));\n  const draw = () => {\n    $('questionCard').textContent = qs[Math.floor(Math.random() * qs.length)];\n  };\n  $('draw').onclick = draw;\n  draw();\n  $('sessionForm').onsubmit = e => {\n    e.preventDefault();\n    const form = e.target,\n      d = Object.fromEntries(new FormData(form));\n    for (const k of ['thoi_luong_thuc_te_phut', 'si_so', 'so_tham_gia']) d[k] = Number(d[k]);\n    if (d.so_tham_gia > d.si_so) {\n      toast('Số tham gia không được lớn hơn sĩ số.');\n      return;\n    } ['mo_thu', 'thu', 'nghi', 'noi', 'chia_se'].forEach(k => d['da_lam_' + k] = !!form.elements[\n      'da_lam_' + k].checked);\n    saveCoord(form, {\n      ...d,\n      loai: 'phieu_buoi',\n      tuan: +$('coordWeek').value\n    });\n  };\n  $('debateForm').onsubmit = e => {\n    e.preventDefault();\n    const form = e.target,\n      d = Object.fromEntries(new FormData(form));\n    if (Core.words(d.vi_sao) \u003c 5) {\n      toast('Hãy ghi ít nhất 5 từ giải thích.');\n      return;\n    }\n    saveCoord(form, {\n      ...d,\n      loai: 'doi_y',\n      tuan: 3\n    });\n  };\n  bindCoordinatorDrafts();\n}\n/** Lưu nháp phiếu điều phối giống bài học sinh, tách theo hồ sơ và form. */\nfunction bindCoordinatorDrafts() {\n  const p = person();\n  if (!p.coordDrafts) p.coordDrafts = {};\n  for (const formId of ['sessionForm', 'debateForm']) {\n    const form = $(formId),\n      draft = p.coordDrafts[formId];\n    if (draft) {\n      for (const [name, value] of Object.entries(draft.fields)) {\n        const el = form.elements[name];\n        if (!el) continue;\n        if (el.type === 'checkbox') el.checked = value === true;\n        else el.value = value;\n      }\n      if (formId === 'sessionForm' && draft.week) {\n        $('coordWeek').value = draft.week;\n        $('coordWeek').dispatchEvent(new Event('change'));\n      }\n    }\n    const save = () => {\n      const fields = {};\n      for (const el of form.elements) {\n        if (!el.name) continue;\n        fields[el.name] = el.type === 'checkbox' ? el.checked : el.value;\n      }\n      p.coordDrafts[formId] = {\n        fields,\n        week: Number($('coordWeek').value)\n      };\n      persist();\n    };\n    form.addEventListener('input', save);\n    form.addEventListener('change', save);\n    if (formId === 'sessionForm') $('coordWeek').addEventListener('change', save);\n  }\n}\n\nfunction localDate() {\n  const d = new Date();\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n}\n\nfunction saveCoord(form, data) {\n  if (!form.dataset.id) form.dataset.id = Core.id();\n  const record = {\n    ...data,\n    id: form.dataset.id,\n    truong: profile.truong,\n    lop: profile.lop,\n    thoi_gian: new Date().toISOString(),\n    phien_ban_app: APP_CONFIG.version\n  };\n  if (enqueue(record)) {\n    delete person().coordDrafts?.[form.id];\n    form.reset();\n    delete form.dataset.id;\n    persist();\n    toast(previewOnly ? 'Phiếu chỉ giữ tạm trong phiên, chưa lưu lâu dài hoặc gửi đi.' : 'Đã lưu phiếu trên máy. ' + (LIVE ? 'Đang chờ gửi.' : 'Bản xem thử chưa gửi.'));\n  }\n}\n\nfunction paintCoord() {\n  if (LIVE && tab === 'coord' && (!coordToken || Date.now() > coordUntil)) showCoordinatorReauth();\n  if (!$('coordTime') || !stageClock) return;\n  const t = Math.max(0, Math.ceil(stageClock.remaining));\n  $('stageName').textContent = stageClock.stages[stageClock.idx][0];\n  $('coordTime').textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');\n  $('timerPlay').textContent = stageClock.running ? 'Tạm dừng' : 'Bắt đầu / Tiếp tục';\n}\nsetInterval(() => {\n  if (stageClock?.running) {\n    const n = Date.now();\n    stageClock.remaining = Math.max(0, stageClock.remaining - (n - stageClock.last) / 1000);\n    stageClock.last = n;\n    if (!stageClock.remaining) {\n      stageClock.running = false;\n      toast('Hết thời gian gợi ý của chặng.');\n    }\n  }\n  paintCoord();\n}, 500);\n\n/** Tiến độ lớp không tải câu trả lời hay điểm tự đánh giá về trình duyệt. */\nfunction teacher() {\n  const page = $('page');\n  const active = teacherAuth && Date.now() \u003c teacherAuth.expires;\n  if (!active) {\n    if (teacherAuth) teacherSelection = { truong: teacherAuth.truong, lop: teacherAuth.lop };\n    teacherAuth = null;\n  }\n  updateSessionControls();\n  page.innerHTML = `\u003cp class=\"eyebrow\">DÀNH CHO GIÁO VIÊN CHỦ NHIỆM\u003c/p>\u003ch1>Tiến độ lớp\u003c/h1>\u003cp class=\"muted\">Chỉ xem mã và tuần đã được máy chủ xác nhận. Không đọc câu trả lời, sản phẩm hay mức tự đánh giá.\u003c/p>${!LIVE ? '\u003cdiv class=\"notice\">Bản xem thử chưa kết nối Sheet. Bảng dưới đây chỉ dùng dữ liệu giả để minh họa.\u003c/div>' : ''}${active ? `\u003csection class=\"panel\">\u003cdiv class=\"row between\">\u003ch2>${E(teacherAuth.lop)}\u003c/h2>\u003cbutton id=\"teacherLogout\">Đăng xuất\u003c/button>\u003c/div>\u003cp>${E(teacherAuth.truong)}\u003c/p>\u003cbutton id=\"teacherRefresh\">Làm mới tiến độ\u003c/button>\u003cdiv id=\"teacherResult\" aria-live=\"polite\">\u003c/div>\u003c/section>` : `\u003cform id=\"teacherLogin\" class=\"panel\">\u003clabel class=\"field\">\u003cspan>Trường phụ trách\u003c/span>\u003cselect id=\"teacherSchool\">${Core.schools(CONTENT).map(s => `\u003coption>${E(s.truong)}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>Lớp phụ trách\u003c/span>\u003cselect id=\"teacherClass\">\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>PIN giáo viên\u003c/span>\u003cinput id=\"teacherPin\" type=\"password\" inputmode=\"numeric\" pattern=\"[0-9]{6,12}\" required autocomplete=\"off\" ${LIVE ? '' : 'disabled'}>\u003c/label>\u003cbutton class=\"primary\" ${LIVE ? '' : 'disabled'}>Xem tiến độ lớp\u003c/button>\u003cp id=\"teacherError\" class=\"error\" role=\"alert\">\u003c/p>\u003c/form>${!LIVE ? '\u003csection class=\"panel\" style=\"margin-top:20px\">\u003ch2>Minh họa bằng dữ liệu giả\u003c/h2>\u003cdiv id=\"teacherResult\">\u003c/div>\u003c/section>' : ''}`}\u003cp class=\"caption\">Bảng chỉ liệt kê mã đã có ít nhất một bài được xác nhận. Chưa có danh sách mã được cấp để kết luận các mã chưa xuất hiện là chưa làm bài. Giáo viên không được chia sẻ PIN hoặc dùng chung thiết bị đang mở Sổ của mình với học sinh.\u003c/p>`;\n  function showStudents(students) {\n    const result = $('teacherResult');\n    if (!result || $('page') !== page) return;\n    result.innerHTML = students.length ? `\u003cdiv class=\"table-scroll\">\u003ctable class=\"progress-table\">\u003ccaption>Tuần đã nộp — ${LIVE ? 'dữ liệu được xác nhận' : 'dữ liệu giả'}\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Mã\u003c/th>${[1,2,3,4].map(w => `\u003cth scope=\"col\">Tuần ${w}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${students.map(student => `\u003ctr>\u003cth scope=\"row\">${E(student.ma)}\u003c/th>${[1,2,3,4].map(w => `\u003ctd>${student.weeks.includes(w) ? '\u003cspan class=\"badge\">Đã nộp\u003c/span>' : '—'}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>` : '\u003cp class=\"notice\">Chưa có bài được máy chủ xác nhận cho lớp này.\u003c/p>';\n  }\n  async function refresh() {\n    const auth = teacherAuth;\n    const button = $('teacherRefresh');\n    button.disabled = true;\n    $('teacherResult').textContent = 'Đang tải tiến độ…';\n    try {\n      const response = await rpc('getClassProgress', { token: auth.token, truong: auth.truong, lop: auth.lop });\n      if ($('page') !== page || teacherAuth !== auth) return;\n      if (!response?.ok) {\n        if (response?.code === 'AUTH_REQUIRED') { teacherSelection = { truong: auth.truong, lop: auth.lop }; teacherAuth = null; teacher(); toast('Phiên giáo viên hết hạn. Hãy đăng nhập lại.'); return; }\n        throw Error(response?.error || 'Chưa tải được tiến độ.');\n      }\n      showStudents(response.students);\n    } catch (error) {\n      if ($('page') === page && $('teacherResult')) $('teacherResult').textContent = error.message;\n    } finally { if (button.isConnected) button.disabled = false; }\n  }\n  if (active) {\n    $('teacherRefresh').onclick = refresh;\n    $('teacherLogout').onclick = () => {\n      const token = teacherAuth.token;\n      teacherAuth = null;\n      teacher();\n      rpc('logoutTeacher', token).catch(() => {});\n    };\n    refresh();\n  } else {\n    const school = $('teacherSchool'), klass = $('teacherClass');\n    const choose = () => {\n      klass.innerHTML = Core.schools(CONTENT).find(s => s.truong === school.value).lop.map(lop => `\u003coption value=\"${E(lop)}\">${E(Core.classLabel(lop))}\u003c/option>`).join('');\n    };\n    school.onchange = choose;\n    if (teacherSelection && Core.schools(CONTENT).some(s => s.truong === teacherSelection.truong)) school.value = teacherSelection.truong;\n    choose();\n    if (teacherSelection && [...klass.options].some(o => o.value === teacherSelection.lop)) klass.value = teacherSelection.lop;\n    $('teacherLogin').onsubmit = async event => {\n      event.preventDefault();\n      if (!LIVE) return;\n      const button = event.target.querySelector('button');\n      button.disabled = true;\n      const input = { truong: school.value, lop: klass.value, pin: $('teacherPin').value };\n      teacherSelection = { truong: input.truong, lop: input.lop };\n      $('teacherPin').value = '';\n      $('teacherError').textContent = '';\n      try {\n        const response = await rpc('loginTeacher', input);\n        if ($('page') !== page) return;\n        if (!response?.ok) throw Error(response?.error || 'Chưa đăng nhập được.');\n        teacherAuth = { token: response.token, expires: response.expires, truong: input.truong, lop: input.lop };\n        teacher();\n      } catch (error) { if ($('page') === page) $('teacherError').textContent = error.message; }\n      finally { if (button.isConnected) button.disabled = false; }\n    };\n    if (!LIVE) showStudents([{ ma: 'ZZ01-A', weeks: [1, 2] }, { ma: 'ZZ02-B', weeks: [1] }]);\n  }\n}\n\n/** Phiên chỉ ở bộ nhớ; bản sao/nháp không chứa PIN hoặc token. */\nfunction validStudentPassword(value) {\n  return typeof value === 'string' && (/^[0-9]{6,12}$/.test(value) ||\n    (value.length >= 8 && value.length \u003c= 64 && !/[\\x00-\\x20\\x7f]/.test(value)));\n}\n\nfunction studentAuthorized(record) {\n  return !!(profile && record && studentAuth && studentAuth.expires > Date.now() &&\n    Core.key(studentAuth) === Core.key(record) && Core.key(profile) === Core.key(record));\n}\n\nasync function refreshStudentProgress() {\n  if (!LIVE || !studentAuthorized(profile)) { showStudentReauth(); return; }\n  const auth = studentAuth, owner = { ...profile };\n  try {\n    const result = await rpc('getStudentProgress', { ...owner, token: auth.token });\n    if (studentAuth !== auth || !profile || Core.key(profile) !== Core.key(owner)) return;\n    if (!result?.ok) {\n      if (result?.code === 'AUTH_REQUIRED') { studentAuth = null; showStudentReauth(); }\n      throw Error(result?.error || 'Chưa tải được tiến độ.');\n    }\n    studentProgress = { ...owner, weeks: result.weeks.filter(n => Number.isInteger(n) && n >= 1 && n \u003c= 4) };\n    studentProgressError = '';\n  } catch (error) {\n    if (!profile || Core.key(profile) !== Core.key(owner) || (studentAuth && studentAuth !== auth)) return;\n    studentProgressError = error.message + ' Tiến độ trên máy và nháp vẫn được giữ.';\n  }\n  if (profile && Core.key(profile) === Core.key(owner) && studentAuthorized(profile)) await cloudSync()?.load();\n  if (profile && Core.key(profile) === Core.key(owner) && tab === 'home') home();\n}\n\nfunction showStudentReauth() {\n  if (!LIVE || !profile || !$('page') || $('studentReauth')) return;\n  const notice = document.createElement('section'), owner = { ...profile };\n  notice.id = 'studentReauth'; notice.className = 'notice';\n  notice.innerHTML = `\u003cp role=\"status\">Đăng nhập lại để đồng bộ mã ${E(owner.ma)}. Bạn vẫn có thể viết; nháp và bài chờ gửi được giữ trên máy.\u003c/p>\u003cform id=\"studentReauthForm\">\u003clabel class=\"field\">\u003cspan>Mật khẩu của bạn\u003c/span>\u003cinput id=\"studentReauthPin\" type=\"password\" minlength=\"6\" maxlength=\"64\" autocomplete=\"current-password\"${NEEDS_PASSWORD?' required':''}>\u003c/label>\u003cbutton type=\"submit\" class=\"primary\">Xác thực lại\u003c/button>\u003cp id=\"studentReauthError\" class=\"error\" role=\"alert\">\u003c/p>\u003c/form>`;\n  $('page').prepend(notice);\n  const form = $('studentReauthForm');\n  form.onsubmit = async event => {\n    event.preventDefault();\n    const button = form.querySelector('button'), input = $('studentReauthPin'), errorBox = $('studentReauthError');\n    if (button.disabled) return;\n    const pin = input.value; input.value = ''; errorBox.textContent = '';\n    if (NEEDS_PASSWORD && !validStudentPassword(pin)) { errorBox.textContent = 'Nhập đúng mật khẩu được cấp.'; return; }\n    button.disabled = true;\n    try {\n      const result = await rpc('loginStudent', { ...owner, password: pin });\n      if (!notice.isConnected || !profile || Core.key(profile) !== Core.key(owner)) {\n        if (result?.ok) rpc('logoutStudent', result.token).catch(() => {});\n        return;\n      }\n      if (!result?.ok) throw Error(result?.error || 'Chưa xác thực được.');\n      studentAuth = { ...owner, token: result.token, expires: result.expires };\n      notice.remove();\n      refreshStudentProgress(); sync(true);\n    } catch (error) { if (notice.isConnected) errorBox.textContent = error.message; }\n    finally { if (button.isConnected) button.disabled = false; }\n  };\n}\n\n/** Cache có thể mất sớm: yêu cầu PIN ngay trên màn hình, giữ nguyên DOM và phiếu. */\nfunction showCoordinatorReauth() {\n  if (!LIVE || !$('sessionForm') || $('coordReauth')) return;\n  const notice = document.createElement('section');\n  notice.id = 'coordReauth';\n  notice.className = 'notice';\n  notice.innerHTML = `\u003cp role=\"status\">Phiên điều phối hết hạn. Phiếu đang điền vẫn được giữ; nhập lại PIN để gửi tiếp.\u003c/p>\u003cform id=\"coordReauthForm\">\u003clabel class=\"field\">\u003cspan>PIN điều phối của lớp ${E(profile.lop)}\u003c/span>\u003cinput id=\"coordReauthPin\" type=\"password\" inputmode=\"numeric\" pattern=\"[0-9]{6,12}\" required autocomplete=\"off\">\u003c/label>\u003cbutton class=\"primary\">Xác thực lại\u003c/button>\u003cp id=\"coordReauthError\" class=\"error\" role=\"alert\">\u003c/p>\u003c/form>`;\n  $('page').prepend(notice);\n  bindCoordinatorLogin('coordReauthForm', 'coordReauthPin', 'coordReauthError', () => {\n    notice.remove();\n    toast('Đã xác thực lại. Phiếu và đồng hồ được giữ nguyên.');\n    sync(true);\n  });\n}\n\nfunction bindCoordinatorLogin(formId, pinId, errorId, onSuccess) {\n  const form = $(formId), page = $('page');\n  form.onsubmit = async event => {\n    event.preventDefault();\n    const button = form.querySelector('button'), owner = Core.key(profile);\n    button.disabled = true;\n    const input = { truong: profile.truong, lop: profile.lop, pin: $(pinId).value };\n    $(pinId).value = '';\n    $(errorId).textContent = '';\n    try {\n      const response = await rpc('loginCoordinator', input);\n      if ($('page') !== page || !form.isConnected || !profile || Core.key(profile) !== owner) return;\n      if (!response?.ok) throw Error(response?.error || 'Chưa xác thực được PIN.');\n      coordToken = response.token;\n      coordUntil =     if(result?.code==='AUTH_REQUIRED'){studentAuth=null;showStudentReauth();}\n        throw Error(result?.error || 'Chưa tải được nháp từ Sheet.');\n      }\n      if(!Array.isArray(result.states)||!Array.isArray(result.records)) throw Error('Máy chủ chưa hỗ trợ khôi phục nháp. Hãy cập nhật Learning.gs.');\n      const cloud=store(p), changedWhileLoading=JSON.stringify(p.drafts)!==before;\n      for (const record of result.records) {\n        if (Core.key(record)!==owner || record.loai!=='chu_trinh') continue;\n        const old=p.history.find(item=>item.record.id===record.id);\n        if (!old) p.history.push({record,sent:true,remoteCopy:true});\n        else if (Object.entries(record).every(([key,value])=>key==='thoi_gian_nhan' || (Core.safeRecord(old.record,CONTENT.an_toan)[key] ?? '')===value)) old.sent=true;\n      }\n      p.history.sort((a,b)=>String(a.record.thoi_gian).localeCompare(String(b.record.thoi_gian)));\n      const states=new Map(result.states.filter(state=>Number.isInteger(state.week)&&state.week>=1&&state.week\u003c=4&&Number.isInteger(state.revision)).map(state=>[String(state.week),state]));\n      for(let number=1;number\u003c=4;number++) {\n        const week=String(number), state=states.get(week)||{week:number,revision:0,draft:null}, local=p.drafts[week], pending=cloud.pending[week];\n        const previousVersion=cloud.versions[week];\n        let acknowledgedPending=false;\n        if (pending && state.mutationId===pending.mutationId && state.draft && fingerprint(state.draft)===fingerprint(pending.draft)) {\n          cloud.saved[week]=fingerprint(pending.draft);delete cloud.pending[week];acknowledgedPending=true;\n        }\n        if (local && p.history.some(item=>item.sent&&item.record.id===local.id)) {\n          if(tab==='work' && activeWeek===number) conflict(cloud,week,null,state.revision);\n          else {cloud.backups.push({week:number,draft:local,reason:'Bài đã được xác nhận trên Sheet'});delete p.drafts[week];delete cloud.pen ay đổi'+confirmed;\n    if($('draftStatus'))$('draftStatus').textContent=detail;\n    let status=$('learningStatus');\n    if(!status){status=document.createElement('p');status.id='learningStatus';status.className='notice';status.setAttribute('role','status');$('page').prepend(status);}\n    status.textContent=detail;\n    $('learningNotice')?.remove();\n    const conflicts=Object.entries(cloud.conflicts);\n    if(!conflicts.length)return;\n    const notice=document.createElement('section');notice.id='learningNotice';notice.className='notice';\n    notice.innerHTML=`\u003cp role=\"status\">Có hai bản nháp. Cả hai được giữ trong bản sao của thiết bị; chọn bản bạn muốn tiếp tục.\u003c/p>${conflicts.map(([week])=>`\u003cp>Tuần ${E(week)}\u003c/p>\u003cdiv class=\"row\">\u003cbutton type=\"button\" data-cloud-local=\"${E(week)}\">Giữ bản trên máy thành lượt mới\u003c/button>\u003cbutton type=\"button\" data-cloud-remote=\"${E(week)}\">Dùng bản trên Sheet\u003c/button>\u003c/div>`).join('')}`;\n    $('page').prepend(notice);\n    notice.querySelectorAll('[data-cloud-local]').forEach(button=>button.onclick=()=>resolve(button.dataset.cloudLocal,false));\n    notice.querySelectorAll('[data-cloud-remote]').forEach(button=>button.onclick=()=>resolve(button.dataset.cloudRemote,true));\n  }\n  return {begin,reset,load,remember,flush,flushBeforeLogout,view,get loading(){return loading;},get ready(){return !!profile&&loadedOwner===Core.key(profile);},get pending(){return !!profile&&Object.keys(store(person()).pending).length>0;}};\n})();\n", "src/core.js": "/**\n * LOGIC THUẦN — dùng trên trình duyệt và trong các kiểm thử Node.js.\n *\n * Không chỉnh sửa văn bản đầu vào. trim() chỉ phục vụ kiểm tra độ dài.\n * Bản ghi giữ nguyên khoảng trắng, dấu câu và xuống dòng của học sinh.\n */\nconst Core = (() => {\n  const classes = typeof module !== 'undefined' ? require('./classes.js') : ClassIds;\n  const words = value => String(value ?? '').trim().split(/\\s+/u).filter(Boolean).length;\n  const normalize = value => String(value ?? '').toUpperCase().replace(/\\s/g, '');\n  const validCode = value => /^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(value);\n\n  // Mọi văn bản tự do đều được escape trước khi chèn vào HTML.\n  const esc = value => String(value ?? '').replace(/[&\u003c>\"']/g, char => ({\n    '&': '&amp;',\n    '\u003c': '&lt;',\n    '>': '&gt;',\n    '\"': '&quot;',\n    \"'\": '&#39;'\n  } [char]));\n\n  function validate(field, value) {\n    if (field.kind === 'rating') {\n      return [1, 2, 3].includes(Number(value)) ? '' : 'Hãy chọn một mức tự đánh giá.';\n    }\n    if (field.options) {\n      return field.options.includes(value) ? '' : 'Hãy chọn một phương án.';\n    }\n    if (!String(value ?? '').trim()) return 'Bạn chưa viết phần này.';\n    if (String(value).length > field.max) {\n      return `Tối đa ${field.max} ký tự. Nội dung của bạn chưa bị cắt.`;\n    }\n    return words(value) \u003c field.min ?\n      `Hãy viết ít nhất ${field.min} từ (hiện có ${words(value)}).` :\n      '';\n  }\n\n  // Cùng một mã ở hai lớp khác nhau không trộn bản nháp và sản phẩm.\n  const key = classes.storageKey;\n  const id = () => globalThis.crypto?.randomUUID?.() ||\n    'xc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);\n\n  /** Tạo gói bất biến cho một lần nộp. Không tạo lại gói khi gửi lại vì lỗi mạng. */\n  function record(draft, profile, week, appVersion = '2.4.0') {\n    const answers = draft.answers;\n    const result = {\n      id: draft.id,\n      loai: 'chu_trinh',\n      thoi_gian: new Date().toISOString(),\n      bat_dau: draft.started,\n      ma: profile.ma,\n      truong: profile.truong,\n      lop: classes.code(profile.lop),\n      tuan: week.tuan,\n      phien_ban_app: appVersion,\n      phien_ban_noi_dung: draft.version,\n      thoi_luong_giay: Math.round(draft.activeMs / 1000),\n      thoi_gian_troi_giay: Math.max(0, Math.round((Date.now() - Date.parse(draft.started)) /\n        1000)),\n      ban_goc_id: draft.sourceId || '',\n    };\n    const fields = [\n      'thu_lam', 'nghi_1', 'nghi_2', 'nghi_3', 'noi', 'dang_san_pham',\n      'san_pham', 'chia_se', 'tu_danh_gia', 'phe', 'doi_hay_giu',\n      'kiem_soat', 'ngoai_kiem_soat',\n    ];\n    fields.forEach(field => {\n      result[field] = answers[field] ?? '';\n    });\n\n    // Tuần 3: tiền tố được quy định trong yêu cầu DOCX; phần học sinh viết\n    // vẫn giữ nguyên. Không sửa chính tả, tóm tắt hoặc đánh giá nội dung.\n    if (week.quy_trinh === 'tranh_luan_45') {\n      result.nghi_1 = (answers.phe.startsWith('A') ? 'Phe A: ' : 'Phe B: ') + answers.nghi_1;\n      result.chia_se = answers.doi_hay_giu + ': ' + answers.chia_se;\n    }\n    // Tuần 4: giữ cả hai ô gốc và một cột thu_lam để nhóm phân tích cùng schema.\n    if (week.quy_trinh === 'trien_lam_45') {\n      result.thu_lam = 'Phần mình thay đổi được:\\n' + answers.kiem_soat +\n        '\\n\\nPhần mình không thay đổi được:\\n' + answers.ngoai_kiem_soat;\n    }\n    result.tu_danh_gia = Number(result.tu_danh_gia);\n    return result;\n  }\n\n  /** Giãn lần thử sau khi lỗi, thêm jitter để các máy không thử cùng một lúc. */\n  function retryDelay(attempt, random = Math.random, config = {}) {\n    const base = config.retryBaseMs || 5000;\n    const maximum = config.retryMaxMs || 120000;\n    return Math.min(maximum, base * 2 ** Math.min(5, Math.max(0, attempt - 1))) +\n      Math.floor(random() * 2000);\n  }\n\n  const safety = typeof module !== 'undefined' ? require('./safety.js') : Safety;\n  return {\n    classCode: classes.code,\n    classLabel: classes.label,\n    schools: content => [...content.truong_lop, ...(content.truong_lop_cu || [])],\n    safeRecord: safety.redactRecord,\n    safetyMatches: safety.matches,\n    words,\n    normalize,\n    validCode,\n    esc,\n    validate,\n    key,\n    id,\n    record,\n    retryDelay\n  };\n})();\nif (typeof module !== 'undefined') module.exports = Core;\n", "src/classes.js": "/** Mã dữ liệu và nhãn hiển thị. Chỉ các bí danh liệt kê chính xác mới được quy đổi. */\nconst ClassIds = (() => {\n  const labels = {'10A3':'10A3 (10 Tin)','11E1':'11E1 (11 Văn)','LB-11A':'LB-11A (11A Lộc Bình)'};\n  const code = value => Object.keys(labels).find(key => labels[key] === value) || value;\n  const label = value => labels[code(value)] || value;\n  const profile = value => value && typeof value === 'object' ? {...value,lop:code(value.lop)} : value;\n  // Khóa trên máy giữ nguyên để không tách hồ sơ đã lưu trước 2.7.1. Không gửi khóa này lên Sheet.\n  const storageKey = value => JSON.stringify([value.truong,label(value.lop),value.ma]);\n  return {code,label,profile,storageKey};\n})();\nif (typeof module !== 'undefined') module.exports = ClassIds;\n", "src/safety.js": "/** Chính sách dùng chung trước khi gửi và trước khi ghi Sheet. Không sửa bản gốc trên máy. */\nconst Safety = (() => {\n  const hidden = '[đã ẩn – an toàn]';\n  const normalize = value => String(value ?? '').normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '').replace(/đ/gi, 'd')\n    .replace(/[\\u200b-\\u200d\\ufeff]/g, '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  function matches(value, config) {\n    const text = normalize(value);\n    return (config?.tu_khoa || []).some(word => normalize(word) && text.includes(normalize(word)));\n  }\n  function redactRecord(record, config) {\n    const result = { ...record };\n    const fields = record.loai === 'chu_trinh' ?\n      ['thu_lam', 'nghi_1', 'nghi_2', 'nghi_3', 'noi', 'san_pham', 'chia_se', 'kiem_soat', 'ngoai_kiem_soat'] :\n      record.loai === 'phieu_buoi' ? ['khung_gio', 'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat'] :\n      ['nhom', 'vi_sao'];\n    fields.forEach(key => {\n      if (typeof result[key] === 'string' && matches(result[key], config)) result[key] = hidden;\n    });\n    // Giữ quy tắc ánh xạ, đồng thời tránh rò nội dung qua cột tổng hợp.\n    if (record.loai === 'chu_trinh' && record.tuan === 3) {\n      if (result.nghi_1 === hidden) result.nghi_1 = (String(record.phe).startsWith('A') ? 'Phe A: ' : 'Phe B: ') + hidden;\n      if (result.chia_se === hidden) result.chia_se = record.doi_hay_giu + ': ' + hidden;\n    }\n    if (record.loai === 'chu_trinh' && record.tuan === 4) {\n      result.thu_lam = 'Phần mình thay đổi được:\\n' + result.kiem_soat +\n        '\\n\\nPhần mình không thay đổi được:\\n' + result.ngoai_kiem_soat;\n    }\n    return result;\n  }\n  return { hidden, matches, redactRecord };\n})();\nif (typeof module !== 'undefined') module.exports = Safety;\n", "src/backup.js": "/**\n * KIỂM TRA BẢN SAO TRƯỚC KHI KHÔI PHỤC\n * Không bỏ hàng đợi chưa gửi, không tự gửi dữ liệu vừa nhập lại.\n * Khôi phục chỉ được phép khi máy đích chưa có dữ liệu ứng dụng.\n */\nconst Backup = (() => {\n  const core = typeof module !== 'undefined' ? require('./core.js') : Core;\n  const plain = value => value && typeof value === 'object' && !Array.isArray(value);\n  const string = value => typeof value === 'string';\n  const fail = message => {\n    throw new Error(message);\n  };\n\n  function restore(value, content) {\n    if (!plain(value) || !plain(value.profiles) || !Array.isArray(value.queue)) {\n      fail('Không đúng bản sao toàn bộ Xoay Chiều.');\n    }\n    // Chỉ nhận cấu trúc dữ liệu thuần, không cho khóa prototype chen vào đối tượng.\n    const clean = JSON.parse(JSON.stringify(value, (key, val) => {\n      if (['__proto__', 'prototype', 'constructor'].includes(key)) fail(\n        'Tệp có khóa không hợp lệ.');\n      return val;\n    }));\n    const validProfile = p => plain(p) && core.validCode(p.ma) &&\n      core.schools(content).some(s => s.truong === p.truong && s.lop.includes(core.classCode(p.lop)));\n    const validRecord = record => {\n      if (!plain(record) || !string(record.id) || !/^[a-zA-Z0-9-]{12,80}$/.test(record.id)) {\n        fail('Bản ghi trong bản sao thiếu ID hợp lệ.');\n      }\n      if (!['chu_trinh', 'phieu_buoi', 'doi_y'].includes(record.loai)) fail(\n        'Loại bản ghi không hợp lệ.');\n      if (!Number.isInteger(record.tuan) || !content.weeks.some(w => w.tuan === record.tuan))\n        fail('Tuần không hợp lệ.');\n      if (record.loai === 'chu_trinh' && !validProfile(record)) fail(\n        'Mã/trường/lớp không hợp lệ.');\n      // Bản ghi máy chủ là đối tượng phẳng; không nhận HTML hay hàm để thực thi.\n      Object.values(record).forEach(v => {\n        if (!['string', 'number', 'boolean'].includes(typeof v)) fail(\n          'Kiểu giá trị bản ghi không hợp lệ.');\n      });\n    };\n    for (const [key, profile] of Object.entries(clean.profiles)) {\n      let parts;\n      try {\n        parts = JSON.parse(key);\n      } catch {\n        fail('Khóa hồ sơ không hợp lệ.');\n      }\n      if (!Array.isArray(parts) || parts.length !== 3) fail('Khóa hồ sơ không hợp lệ.');\n      const owner = {\n        truong: parts[0],\n        lop: parts[1],\n        ma: parts[2]\n      };\n      if (!validProfile(owner) || !plain(profile) || !plain(profile.drafts) || !Array.isArray(\n          profile.history)) {\n        fail('Hồ sơ trong bản sao không hợp lệ.');\n      }\n      profile.history.forEach(item => {\n        validRecord(item.record);\n        if (core.key(item.record) !== key) fail('Bài không khớp hồ sơ sở hữu.');\n        item.sent = item.sent === true;\n      });\n      for (const [weekId, draft] of Object.entries(profile.drafts)) {\n        const week = content.weeks.find(w => w.tuan === Number(weekId));\n        if (!week || !plain(draft) || !plain(draft.answers) || !string(draft.id) ||\n          !/^[a-zA-Z0-9-]{12,80}$/.test(draft.id) || !isFinite(Date.parse(draft.started)) ||\n          !Number.isInteger(draft.step) || draft.step \u003c 0 || draft.step >= week.steps.length ||\n          !Number.isFinite(draft.activeMs) || draft.activeMs \u003c 0) fail(\n          'Bản nháp không hợp lệ.');\n        Object.values(draft.answers).forEach(v => {\n          if (!['string', 'number'].includes(typeof v)) fail(\n            'Câu trả lời nháp không hợp lệ.');\n        });\n        draft.stageTimes = plain(draft.stageTimes) ? draft.stageTimes : {};\n        draft.hints = plain(draft.hints) ? draft.hints : {};\n      }\n    }\n    const ids = new Set();\n    clean.queue.forEach(item => {\n      validRecord(item.record);\n      if (ids.has(item.record.id)) fail('Hàng đợi có ID lặp.');\n      ids.add(item.record.id);\n      item.paused = true;\n      item.attempts = 0;\n      item.nextTryAt = 0;\n      item.error = 'Được khôi phục từ bản sao. Bấm Gửi lại để tiếp tục.';\n    });\n    if (clean.current && !validProfile(clean.current)) fail('Mã hiện tại không hợp lệ.');\n    clean.theme = clean.theme === 'dark' ? 'dark' : 'light';\n    return clean;\n  }\n  return {\n    restore\n  };\n})();\nif (typeof module !== 'undefined') module.exports = Backup;\n", "src/config.js": "/**\n * CẤU HÌNH ỨNG DỤNG\n *\n * HTML/CSS/JavaScript chạy trên trình duyệt. Khi Index.html được phục vụ bởi\n * Google Apps Script, app tự dùng google.script.run để gọi máy chủ Code.gs.\n * Bản HTML độc lập không tự gửi dữ liệu vào một Sheet không xác định.\n * Nội dung giáo dục được sửa riêng trong content.json.\n */\nconst APP_CONFIG = Object.freeze({\n  version: '2.8.0',\n  authRequired: false, // build.py đặt true riêng cho bản Apps Script; mất bridge phải chặn đăng nhập.\n  // Học sinh chỉ cần mã + trường/lớp, không cần mật khẩu. Đặt true để bắt buộc mật khẩu;\n  // khi đó phải đặt Script Property STUDENT_LOGIN_MODE = mat_khau cho khớp với máy chủ.\n  requireStudentPassword: false,\n  storageKey: 'xoaychieu_v2', // Giữ khóa cũ để không mất bài phiên bản 2.0.\n  rpcTimeoutMs: 30000,\n  syncIntervalMs: 60000, // Tự đồng bộ nháp có thay đổi mỗi phút khi trang đang mở.\n  retryBaseMs: 5000,\n  retryMaxMs: 120000,\n  maxBackupBytes: 10000000,\n});\n", "src/content.json": "{\n  \"truong_lop\": [\n    {\n      \"truong\": \"THPT Chuyên Chu Văn An\",\n      \"lop\": [\n        \"10A3\",\n        \"11E1\"\n      ]\n    },\n    {\n      \"truong\": \"Trường PTDTNT THCS & THPT Lộc Bình\",\n      \"lop\": [\n        \"LB-11A\"\n      ]\n    }\n  ],\n  \"huong_dan_ma\": {\n    \"buoc\": [\n      \"Hai chữ cái đầu trong tên của mẹ (viết HOA, không dấu; Đ viết là D). Nếu không ghi được tên mẹ, dùng tên người chăm sóc chính – và lần sau cũng dùng người đó. Ví dụ: Mẹ tên Hoa → HO.\",\n      \"Ngày sinh của bạn (2 chữ số, chỉ ghi ngày). Ví dụ: sinh ngày 7 → 07.\",\n      \"Chữ cái đầu của tên đệm của bạn (viết HOA, không dấu); không có tên đệm thì ghi X. Ví dụ: Nguyễn Thị Mai → T.\"\n    ],\n    \"mau\": \"^[A-Z]{2}[0-9]{2}-[A-Z]$\",\n    \"nhac\": \"Dùng đúng mã bạn đã ghi ở phiếu khảo sát.\"\n  },\n  \"mat_nang_luc\": [\n    {\n      \"k\": \"tnt\",\n      \"ten\": \"Tự nhận thức\",\n      \"mau\": \"#B7791F\",\n      \"mau_toi\": \"#F2B44C\",\n      \"mo_ta\": \"Biết mình đang hiểu đến đâu, chủ động tìm trải nghiệm mới.\"\n    },\n    {\n      \"k\": \"td\",\n      \"ten\": \"Linh hoạt tư duy\",\n      \"mau\": \"#4C51BF\",\n      \"mau_toi\": \"#8C93F5\",\n      \"mo_ta\": \"Nối kiến thức giữa các môn và với đời sống.\"\n    },\n    {\n      \"k\": \"tt\",\n      \"ten\": \"Linh hoạt con người\",\n      \"mau\": \"#C53F6B\",\n      \"mau_toi\": \"#F07CA3\",\n      \"mo_ta\": \"Lắng nghe và dùng góc nhìn khác mình.\"\n    },\n    {\n      \"k\": \"tdg\",\n      \"ten\": \"Linh hoạt thay đổi\",\n      \"mau\": \"#0F7C70\",\n      \"mau_toi\": \"#48C9B5\",\n      \"mo_ta\": \"Dám đổi cách học khi cách cũ không hiệu quả.\"\n    },\n    {\n      \"k\": \"kq\",\n      \"ten\": \"Linh hoạt kết quả\",\n      \"mau\": \"#5F7A1E\",\n      \"mau_toi\": \"#A8C85A\",\n      \"mo_ta\": \"Tìm cách hoàn thành dù điều kiện hạn chế.\"\n    }\n  ],\n  \"tieu_chi_san_pham\": [\n    [\n      1,\n      \"Mới nhắc lại điều đã học\"\n    ],\n    [\n      2,\n      \"Có nối sang môn khác hoặc đời sống\"\n    ],\n    [\n      3,\n      \"Nối được và nói lên điều mình tự nhận ra về cách học\"\n    ]\n  ],\n  \"dang_san_pham\": [\n    \"Thơ 4 câu\",\n    \"Tranh 4 khung\",\n    \"Sơ đồ hình ảnh\",\n    \"Nhịp đọc / rap ngắn\",\n    \"Tiểu phẩm 1 phút\",\n    \"Lời then / sli / lượn\",\n    \"Họa tiết thổ cẩm\",\n    \"Ảnh có chú thích\"\n  ],\n  \"an_toan\": {\n    \"tu_khoa\": [\n      \"muốn chết\",\n      \"tự tử\",\n      \"không muốn sống\",\n      \"tự làm đau\",\n      \"tự làm hại\",\n      \"bị đánh\",\n      \"bị bắt nạt\",\n      \"bị đe dọa\"\n    ],\n    \"loi_nhan\": \"Cảm ơn bạn đã chia sẻ. Điều bạn đang gặp rất quan trọng. Hãy nói chuyện ngay với thầy cô chủ nhiệm hoặc cán bộ tư vấn học đường của trường – bạn không phải tự mình vượt qua một mình. Phần trả lời có từ khóa sẽ được thay bằng “[đã ẩn – an toàn]” khi gửi; bản gốc vẫn nằm trên máy và trong bản sao bạn tải về.\",\n    \"lien_he\": \"\"\n  },\n  \"vai\": [\n    [\n      \"Người dẫn nhịp\",\n      \"Giữ thời gian, mời lần lượt từng bạn nói, nhắc luật “không chê, chỉ hỏi”.\"\n    ],\n    [\n      \"Người hỏi\",\n      \"Sau mỗi bạn chia sẻ, đặt ít nhất một câu hỏi từ thẻ câu hỏi.\"\n    ],\n    [\n      \"Người ghi chép\",\n      \"Ghi lại 3 ý hay nhất và 1 câu hỏi còn bỏ ngỏ.\"\n    ],\n    [\n      \"Người phản biện thiện chí\",\n      \"Tìm một góc nhìn khác hoặc điều chưa chắc chắn – nói nhẹ nhàng, có lý do.\"\n    ]\n  ],\n  \"loai_cau_hoi_socrates\": {\n    \"lr\": {\n      \"ten\": \"Làm rõ\",\n      \"mau_cau\": [\n        \"Bạn có thể nói rõ hơn ý … là gì không?\",\n        \"Bạn có thể cho một ví dụ cụ thể không?\"\n      ]\n    },\n    \"gd\": {\n      \"ten\": \"Giả định\",\n      \"mau_cau\": [\n        \"Bạn đang cho rằng điều gì là đúng?\",\n        \"Điều đó có luôn đúng với mọi người không?\"\n      ]\n    },\n    \"bc\": {\n      \"ten\": \"Bằng chứng\",\n      \"mau_cau\": [\n        \"Bạn dựa vào đâu để nói vậy?\",\n        \"Có dấu hiệu nào cho thấy điều ngược lại không?\"\n      ]\n    },\n    \"gn\": {\n      \"ten\": \"Góc nhìn khác\",\n      \"mau_cau\": [\n        \"Nếu là thầy cô, họ sẽ nhìn việc này thế nào?\",\n        \"Ai có thể không đồng ý, và vì sao?\"\n      ]\n    },\n    \"hq\": {\n      \"ten\": \"Hệ quả\",\n      \"mau_cau\": [\n        \"Nếu tiếp tục như vậy, điều gì sẽ xảy ra?\",\n        \"Điều đó ảnh hưởng thế nào đến việc học của bạn?\"\n      ]\n    },\n    \"ch\": {\n      \"ten\": \"Về câu hỏi\",\n      \"mau_cau\": [\n        \"Vì sao câu hỏi này lại quan trọng?\",\n        \"Chúng ta nên hỏi câu gì tiếp theo?\"\n      ]\n    }\n  },\n  \"luat_vong_tron\": [\n    \"Không chê, chỉ hỏi\",\n    \"Nói ngắn, có ví dụ\",\n    \"Bắt đầu bằng “Mình nghĩ… vì…”\",\n    \"Ai không muốn nói được làm người ghi chép\"\n  ],\n  \"phien_ban\": \"2.2.3\",\n  \"so_tuan\": 4,\n  \"ngay_bat_dau\": \"\",\n  \"noi_dung_status\": \"Bản thử nghiệm — nhóm nghiên cứu cần duyệt nội dung trước khi dùng chính thức.\",\n  \"weeks\": [\n    {\n      \"tuan\": 1,\n      \"title\": \"Mình đã thật sự hiểu chưa?\",\n      \"focus\": \"Tự nhận thức\",\n      \"duration\": 15,\n      \"quy_trinh\": \"chu_trinh_15\",\n      \"letter\": {\n        \"tuan\": 1,\n        \"trang_thai\": \"da_co\",\n        \"triet_gia\": \"Socrates\",\n        \"tieu_de\": \"Người biết mình không biết\",\n        \"mat\": \"tnt\",\n        \"doan\": [\n          \"Bạn thân mến,\",\n          \"Bạn có chắc mình biết những điều mình nghĩ là đã biết?\",\n          \"Khoảng 2.400 năm trước, ở thành Athens (Hy Lạp), có một người đàn ông mũi tẹt, hay đi chân đất, suốt ngày đứng ở quảng trường hỏi chuyện người qua đường. Ông tên là Socrates. Ông không viết cuốn sách nào; điều ta biết về ông chủ yếu do học trò là Plato ghi lại.\",\n          \"Chuyện kể rằng một người bạn của ông đến đền Delphi hỏi: “Có ai khôn ngoan hơn Socrates không?”. Lời sấm đáp: không có ai. Socrates rất ngạc nhiên, vì ông thấy mình chẳng biết bao nhiêu. Ông bèn đi trò chuyện với những người nổi tiếng là hiểu biết: chính khách, nhà thơ, thợ thủ công. Sau mỗi cuộc trò chuyện, ông nhận ra họ tưởng mình biết nhiều điều mà thật ra không biết. Còn ông, ít ra cũng không tưởng mình biết điều mình không biết. Có lẽ ông hơn họ đúng ở một điểm nhỏ ấy.\",\n          \"Người ta hay tóm chuyện này thành câu “Tôi chỉ biết một điều là tôi không biết gì”. Câu ấy không có nguyên văn trong sách của Plato, nhưng ý thì gần đúng.\",\n          \"Điều thú vị là Socrates không coi “không biết” là xấu hổ. Ông coi đó là điểm xuất phát. Ai tưởng mình đã biết thì thôi không hỏi nữa. Ai biết mình chưa biết thì mới bắt đầu học.\",\n          \"P.S. Một câu đố nhỏ: nếu không ai biết hết mọi thứ, thì ai nên là thầy của ai?\"\n        ],\n        \"cau_hoi_lon\": \"Có điều gì bạn tưởng mình đã biết, nhưng thật ra chưa biết?\",\n        \"nguoi_gui\": \"Hộp thư Xoay Chiều\",\n        \"nguon\": \"Plato, Biện hộ của Socrates (Apology), 21a–23b.\",\n        \"nguoi_viet\": \"Bản mẫu có AI hỗ trợ — nhóm nghiên cứu cần đọc duyệt, chỉnh sửa và ghi nhận đóng góp.\"\n      },\n      \"steps\": [\n        {\n          \"title\": \"Một lá thư gửi bạn\",\n          \"stage\": \"Mở thư\",\n          \"minutes\": 2,\n          \"body\": \"\",\n          \"fields\": [],\n          \"hints\": []\n        },\n        {\n          \"title\": \"Thử giải thích không nhìn vở\",\n          \"stage\": \"Thử\",\n          \"minutes\": 3,\n          \"body\": \"Chọn một khái niệm trong bài học tuần này mà bạn nghĩ là đã hiểu. Giải thích nó cho một bạn trong 1 phút, không nhìn vở. Bạn vấp ở chỗ nào?\",\n          \"fields\": [\n            {\n              \"key\": \"thu_lam\",\n              \"label\": \"Mình đã thử thế nào?\",\n              \"min\": 5,\n              \"kind\": \"text\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": [],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Bạn vấp ở chỗ nào khi giải thích?\",\n          \"stage\": \"Nghĩ\",\n          \"minutes\": 4,\n          \"body\": \"\",\n          \"fields\": [\n            {\n              \"key\": \"nghi_1\",\n              \"label\": \"Câu trả lời của mình\",\n              \"min\": 5,\n              \"kind\": \"text\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": [\n            \"Nhớ lại một tình huống cụ thể trong lần thử vừa rồi.\",\n            \"Bạn đã quan sát hoặc làm điều gì trong tình huống đó?\",\n            \"Kể bằng lời của bạn; không cần trả lời giống người khác.\"\n          ],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Vì sao trước đó bạn tin là mình đã hiểu? Dấu hiệu nào khiến bạn tưởng như vậy?\",\n          \"stage\": \"Nghĩ\",\n          \"minutes\": 4,\n          \"body\": \"\",\n          \"fields\": [\n            {\n              \"key\": \"nghi_2\",\n              \"label\": \"Câu trả lời của mình\",\n              \"min\": 5,\n              \"kind\": \"text\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": [\n            \"Nhớ lại một tình huống cụ thể trong lần thử vừa rồi.\",\n            \"Bạn đã quan sát hoặc làm điều gì trong tình huống đó?\",\n            \"Kể bằng lời của bạn; không cần trả lời giống người khác.\"\n          ],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Lần sau, bạn sẽ làm gì để biết chắc mình đã hiểu?\",\n          \"stage\": \"Nghĩ\",\n          \"minutes\": 4,\n          \"body\": \"\",\n          \"fields\": [\n            {\n              \"key\": \"nghi_3\",\n              \"label\": \"Câu trả lời của mình\",\n              \"min\": 5,\n              \"kind\": \"text\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": [\n            \"Nhớ lại một tình huống cụ thể trong lần thử vừa rồi.\",\n            \"Bạn đã quan sát hoặc làm điều gì trong tình huống đó?\",\n            \"Kể bằng lời của bạn; không cần trả lời giống người khác.\"\n          ],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Nối sang một trải nghiệm khác\",\n          \"stage\": \"Nối\",\n          \"minutes\": 4,\n          \"body\": \"Ở môn khác hoặc ngoài đời, bạn đã từng “tưởng biết” như thế chưa? Kể một lần.\",\n          \"fields\": [\n            {\n              \"key\": \"noi\",\n              \"label\": \"Điều mình liên hệ được\",\n              \"min\": 5,\n              \"kind\": \"text\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": [],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Biến suy nghĩ thành sản phẩm\",\n          \"stage\": \"Nối\",\n          \"minutes\": 4,\n          \"body\": \"Thơ 4 câu bắt đầu bằng “Mình tưởng…” và kết bằng “hóa ra…”\",\n          \"fields\": [\n            {\n              \"key\": \"dang_san_pham\",\n              \"label\": \"Chọn dạng sản phẩm\",\n              \"min\": 0,\n              \"kind\": \"select\",\n              \"max\": 6000,\n              \"options\": [\n                \"Thơ 4 câu\",\n                \"Tranh 4 khung\",\n                \"Sơ đồ hình ảnh\",\n                \"Nhịp đọc / rap ngắn\",\n                \"Tiểu phẩm 1 phút\",\n                \"Lời then / sli / lượn\",\ tter\": {\n        \"tieu_de\": \"Không ai tắm hai lần trên cùng một dòng sông\",\n        \"triet_gia\": \"Heraclitus\",\n        \"doan\": [\n          \"Bạn thân mến,\",\n          \"Hãy tưởng tượng một dòng sông: hôm nay bạn đứng ở bờ quen thuộc, nhưng dòng nước vẫn đang chảy. Hình ảnh dòng sông thường được dùng để gợi nhắc tư tưởng về sự thay đổi của Heraclitus. Lá thư này diễn giải ý tưởng ấy, không phải lời trích nguyên văn của ông.\",\n          \"Bài học mới, môi trường mới hay thời gian ít hơn có thể khiến một cách học quen thuộc không còn phù hợp. Điều đó không có nghĩa cách cũ luôn sai. Bạn có thể thử một cách khác, quan sát kết quả rồi quyết định giữ hay điều chỉnh.\",\n          \"Tuần này, hãy thử thay đổi một việc nhỏ. Đừng vội chọn cách nghe có vẻ hay nhất; hãy xem điều gì thực sự giúp bạn hiểu bài.\"\n        ],\n        \"cau_hoi_lon\": \"Khi bài học và hoàn cảnh thay đổi, cách học của mình có cần đổi không?\",\n        \"nguon\": \"Diễn giải giáo dục từ hình ảnh dòng sông trong tư tưởng Heraclitus; nhóm cần duyệt nguồn trước khi sử dụng.\",\n        \"nguoi_viet\": \"Bản mẫu có AI hỗ trợ — nhóm nghiên cứu cần đọc duyệt, chỉnh sửa và ghi nhận đóng góp.\"\n      },\n      \"steps\": [\n        {\n          \"title\": \"Một lá thư gửi bạn\",\n          \"stage\": \"Mở thư\",\n          \"minutes\": 2,\n          \"body\": \"\",\n          \"fields\": [],\n          \"hints\": []\n        },\n        {\n          \"title\": \"Thử hai cách học\",\n          \"stage\": \"Thử\",\n          \"minutes\": 3,\n          \"body\": \"Chọn một đoạn kiến thức ngắn của môn Sử hoặc Địa tuần này. Học 1 phút bằng cách quen thuộc (đọc lại), rồi 1 phút bằng cách khác: vẽ sơ đồ hoặc tự đặt 3 câu hỏi “vì sao”. Gấp vở: cách nào giúp bạn nhớ và hiểu hơn?\",\n          \"fields\": [\n            {\n              \"key\": \"thu_lam\",\n              \"label\": \"Mình đã thử hai cách như thế nào?\",\n              \"min\": 5,\n              \"kind\": \"text\",\n         \"minutes\": 0,\n          \"body\": \"Chọn mức phù hợp với sản phẩm của bạn. Đây là tự đánh giá, không phải điểm số.\",\n          \"fields\": [\n            {\n              \"key\": \"tu_danh_gia\",\n              \"label\": \"Mức tự đánh giá\",\n              \"min\": 0,\n              \"kind\": \"rating\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": []\n        }\n      ]\n    }\n  ],\n  \"scope\": {\n    \"muc_tieu\": \"Rèn luyện năng lực linh hoạt trong học tập của học sinh THPT qua hoạt động bốn tuần.\",\n    \"giai_doan\": \"Bản bắt buộc: chu trình tuần 1–2, tranh luận tuần 3, chỉnh sửa sản phẩm tuần 4.\",\n    \"trien_lam\": \"App chỉ cho xem và chỉnh sửa sản phẩm của chính mình. Hình thức triển lãm chờ chốt với nhóm nghiên cứu; không hiển thị bài của học sinh khác.\",\n    \"quy_mo_du_kien\": \"3 lớp đang triển khai; lớp thứ tư chưa chốt. Giữ tài khoản và dữ liệu lớp Chi Lăng cũ.\",\n    \"ngoai_pham_vi\": [\n      \"Tuần 5–8\",\n      \"Ứng dụng Android/iOS riêng\",\n      \"Phân tích nghiên cứu tự động\",\n      \"Chatbot AI tạo sinh\"\n    ],\n    \"lam_sau\": [\n      \"La bàn cá nhân trên máy, không gửi điểm lên Sheet\",\n      \"Bản ghi thanh_to\",\n      \"Chatbot kịch bản\"\n    ]\n  },\n  \"truong_lop_cu\": [\n    {\n      \"truong\": \"THPT Chi Lăng\",\n      \"lop\": [\n        \"12A2\"\n      ]\n    }\n  ],\n  \"lop_cho_chot\": [\n    {\n      \"truong\": \"THPT Dân tộc nội trú tỉnh\",\n      \"lop\": [\n        \"NT-10A6\",\n        \"NT-10A7\"\n      ],\n      \"trang_thai\": \"Chưa bốc thăm; chưa kích hoạt tài khoản\"\n    }\n  ]\n}\n", "src/style.css": ":root {\n  --radius-control: 14px;\n  --radius-panel: 24px;\n  --radius-pill: 999px;\n  --font-ui: 'Segoe UI', system-ui, -apple-system, sans-serif;\n  --bg: #ece3d3;\n  --paper: #fffdf7;\n  --ink: #1d2745;\n  --muted: #616879;\n  --line: #ded2bf;\n  --accent: #1e2a5e;\n  --gold: #c08b2a;\n  --rose: #a83f53;\n  --green: #277f6b;\n  --soft: #f2ebdd us {\n  outline: 3px solid var(--gold);\n  outline-offset: 3px\n}\n\nbutton {\n  border: 1px solid var(--line);\n  border-radius: var(--radius-control);\n  background: var(--paper);\n  color: var(--ink);\n  padding: 10px 17px;\n  min-height: 44px;\n  font-weight: 600;\n  transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease, transform .12s ease\n}\n\nbutton:hover {\n  border-color: var(--gold);\n  box-shadow: 0 3px 12px #c08b2a24\n}\n\nbutton:active {\n  transform: translateY(1px)\n}\n\nbutton.primary {\n  background: linear-gradient(180deg, var(--primary-top) 0%, var(--primary-bottom) 100%);\n  color: var(--primary-text);\n  border-color: var(--primary-edge);\n  box-shadow: inset 0 1px 0 #ffffff2b, 0 8px 20px var(--primary-shadow)\n}\n\nbutton.primary:hover {\n  border-color: var(--primary-edge);\n  box-shadow: inset 0 1px 0 #ffffff33, 0 12px 26px var(--primary-shadow)\n}\n\nbutton.ghost {\n  background: transparent\n}\n\nbutton.small {\n  font-size: 13px;\n  padding: 5px 12px\n}\n\na {\n  color: var(--accent)\n}\n\nh1,\nh2,\nh3,\np {\n  margin-top: 0\n}\n\nh1,\nh2,\n.serif {\n  font-family: var(--font-ui);\n  font-weight: 650;\n  line-height: 1.3;\n  text-wrap: balance\n}\n\nh1 {\n  font-size: clamp(34px, 4.6vw, 58px);\n  letter-spacing: -1.5px;\n  margin-bottom: 18px\n}\n\nh2 {\n  font-size: 30px\n}\n\nh3 {\n  font-size: 18px\n}\n\nsmall,\n.muted {\n  color: var(--muted)\n}\n\n.eyebrow {\n  text-transform: uppercase;\n  font-size: 11px;\n  letter-spacing: 2px;\n  font-weight: 750;\n  color: var(--muted)\n}\n\n.stripe {\n  height: 7px;\n  background: repeating-linear-gradient(135deg, #1e2a5e 0 15px, #b4233c 15px 22px, #d39b14 22px 28px, #1e2a5e 28px 43px)\n}\n\n.shell {\n  display: grid;\n  grid-template-columns: 240px 1fr;\n  min-height: 100vh\n}\n\n.side {\n  padding: 34px 23px;\n  border-right: 1px solid var(--line);\n  position: sticky;\n  top: 0;\n  height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: var(--paper)\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 38px\n}\n\n.brand strong {\n  font-size: 23px;\n  font-family: var(--font-ui)\n}\n\n.brand small {\n  display: block;\n  font-size: 10px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase\n}\n\n.logo {\n  display: block;\n  width: 48px;\n  height: 48px;\n  flex: 0 0 48px;\n  filter: drop-shadow(0 3px 5px #69503814)\n}\n\n.brand {\n  color: var(--ink);\n  text-decoration: none;\n  border-radius: var(--radius-control)\n}\n\n.brand > div {\n  min-width: 0\n}\n\n.brand strong {\n  display: block;\n  white-space: nowrap\n}\n\n.brand:focus-visible {\n  outline: 3px solid var(--gold);\n  outline-offset: 6px\n}\n\n.nav {\n  display: grid;\n  gap: 8px\n}\n\n.nav button {\n  text-align: left;\n  border: 0;\n  background: none;\n  color: var(--muted);\n  font-size: 14px;\n  display: flex;\n  gap: 12px\n}\n\n.nav button.on {\n  background: var(--soft);\n  color: var(--ink);\n  font-weight: 700;\n  box-shadow: inset 3px 0 0 var(--gold)\n}\n\n.nav span {\n  width: 20px\n}\n\n.sidefoot {\n  margin-top: auto;\n  padding-top: 24px;\n  font-size: 12px\n}\n\n.profile {\n  padding: 16px 0;\n  border-top: 1px solid var(--line)\n}\n\n.main {\n  min-width: 0\n}\n\n.top {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 20px 42px;\n  border-bottom: 1px solid var(--line);\n  gap: 12px\n}\n\n.status {\n  font-size: 12px;\n  color: var(--muted)\n}\n\n.page {\n  max-width: 1120px;\n  padding: 42px;\n  margin: auto\n}\n\n.hero {\n  display: grid;\n  grid-template-columns: 1.55fr 1fr;\n  gap: 30px;\n  align-items: center;\n  margin-bottom: 35px\n}\n\n.hero p {\n  max-width: 510px;\n  color: var(--muted)\n}\n\n.compass {\n  position: relative;\n  aspect-ratio: 1;\n  max-width: 260px;\n  width: 100%;\n  margin: auto;\n  border: 1px solid var(--line);\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  background: radial-gradient(circle, var(--paper) 0 27%, transparent 28% 47%, var(--line) 47% 47.4%, transparent 48%)\n}\n\n.compass:before {\n  content: '';\n  position: absolute;\n  width: 56%;\n  height: 56%;\n  border: 1px solid var(--gold);\n  transform: rotate(45deg);\n  border-radius: var(--radius-control)\n}\n\n.compass:after {\n  content: '✦';\n  font: 100px/1 var(--font-ui);\n  color: var(--accent);\n  transform: rotate(12deg)\n}\n\n.compass .n {\n  position: absolute;\n  top: 10px;\n  font-size: 11px;\n  letter-spacing: 2px\n}\n\n.compass .s {\n  position: absolute;\n  bottom: 10px;\n  font-size: 11px;\n  color: var(--muted)\n}\n\n.progress {\n  height: 6px;\n  background: var(--line);\n  border-radius: 8px;\n  overflow: hidden\n}\n\n.progress i {\n  display: block;\n  background: var(--green);\n  height: 100%\n}\n\n.row {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  flex-wrap: wrap\n}\n\n.between {\n  justify-content: space-between\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 18px\n}\n\n.card,\n.panel {\n  background-color: var(--paper);\n  background-image: linear-gradient(180deg, var(--sheet) 0%, transparent 130px);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-panel);\n  padding: 26px;\n  box-shadow: var(--shadow)\n}\n\n.card {\n  position: relative;\n  overflow: hidden\n}\n\n.card:before {\n  content: '';\n  position: absolute;\n  left: 0;\n  top: 24px;\n  bottom: 24px;\n  width: 4px;\n  background: var(--cardcolor, var(--gold))\n}\n\n.card h2 {\n  font-size: 26px;\n  margin: 16px 0 12px\n}\n\n.card p {\n  font-size: 14px;\n  color: var(--muted)\n}\n\n.card .num {\n  font: 600 36px/1.2 var(--font-ui);\n  color: var(--cardcolor, var(--gold))\n}\n\n.tag {\n  display: inline-block;\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  padding: 3px 10px;\n  font-size: 11px\n}\n\n.caption {\n  font-size: 12px;\n  color: var(--muted)\n}\n\n.notice {\n  padding: 13px 18px;\n  background: var(--soft);\n  border-radius: var(--radius-control);\n  border-left: 3px solid var(--gold);\n  font-size: 13px;\n  margin: 16px 0\n}\n\n.five {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 12px;\n  margin-top: 26px\n}\n\n.five div {\n  font-size: 12px;\n  color: var(--muted);\n  border-top: 2px solid var(--gold);\n  padding-top: 12px\n}\n\n.welcome {\n  max-width: 560px;\n  margin: 28px auto\n}\n\n.welcome h1 {\n  font-size: 42px\n}\n\n.field {\n  display: block;\n  margin: 19px 0\n}\n\n.field>span {\n  display: block;\n  font-size: 14px;\n  font-weight: 650;\n  margin-bottom: 8px\n}\n\ninput:not([type=radio]):not([type=checkbox]),\nselect,\ntextarea {\n  width: 100%;\n  border: 1px solid var(--line);\n  border-radius: var(--radius-control);\n  padding: 12px 14px;\n  background-color: var(--paper);\n  color: var(--ink);\n  min-height: 48px;\n  box-shadow: inset 0 1px 2px #4a341c0f;\n  transition: border-color .18s ease, box-shadow .18s ease\n}\n\ntextarea {\n  min-height: 160px;\n  resize: vertical;\n  line-height: 1.7\n}\n\ninput[type=checkbox],\ninput[type=radio] {\n  accent-color: var(--accent)\n}\n\n.field small {\n  display: block;\n  margin-top: 5px\n}\n\n.error {\n  color: var(--rose);\n  font-size: 13px\n}\n\n.work {\n  max-width: 800px;\n  margin: auto\n}\n\n.workhead {\n  margin-bottom: 25px\n}\n\n.workhead h1 {\n  font-size: 36px\n}\n\n.stepmeta {\n  margin: 18px 0;\n  color: var(--muted);\n  font-size: 12px\n}\n\n.work .panel {\n  padding: 34px\n}\n\n.letter {\n  font-family: var(--font-ui);\n  font-size: 19px;\n  line-height: 1.85\n}\n\n.letter h2 {\n  font-size: 32px\n}\n\n.letter p {\n  white-space: pre-wrap\n}\n\n.letter .signature {\n  font-size: 14px;\n  color: var(--muted)\n}\n\n.actions {\n  display: flex;\n  justify-content: space-between;\n  gap: 12px;\n  margin-top: 24px\n}\n\n.rating {\n  display: grid;\n  gap: 10px\n}\n\n.rating label {\n  padding: 16px;\n  border: 1px solid var(--line);\n  border-radius: var(--radius-control);\n  cursor: pointer;\n  display: flex;\n  gap: 12px;\n  align-items: flex-start\n}\n\n.rating label:has(input:checked) {\n  border-color: var(--green);\n  background: var(--soft)\n}\n\n.hint {\n  border-left: 3px solid var(--gold);\n  padding: 7px 15px;\n  margin-top: 12px;\n  font-size: 14px\n}\n\n.safety {\n  padding: 18px;\n  border: 1px solid var(--rose);\n  border-radius: var(--radius-control);\n  margin: 15px 0\n}\n\n.entry {\n  border-top: 1px solid var(--line);\n  padding: 18px 0\n}\n\n.entry pre,\npre.text {\n  font: inherit;\n  white-space: pre-wrap;\n  overflow-wrap: anywhere;\n  font-size: 14px\n}\n\n.timer {\n  font: 600 46px/1.2 var(--font-ui);\n  font-variant-numeric: tabular-nums\n}\n\n.checks {\n  display: grid;\n  gap: 10px\n}\n\n.checks label {\n  display: flex;\n  gap: 10px\n}\n\n.toast {\n  position: fixed;\n  bottom: 25px;\n  left: 50%;\n  transform: translateX(-50%);\n  max-width: min(90vw, 600px);\n  background: var(--ink);\n  color: var(--paper);\n  padding: 13px 22px;\n  border-radius: 12px;\n  z-index: 20;\n  font-size: 14px\n}\n\n.hidden {\n  display: none !important\n}\n\n.divider {\n  height: 1px;\n  background: var(--line);\n  margin: 28px 0\n}\n\n.empty {\n  text-align: center;\n  padding: 45px 15px\n}\n\n.mobilebrand {\n  display: none\n}\n\nfooter {\n  margin-top: 30px;\n  font-size: 11px;\n  color: var(--muted);\n  text-align: center\n}\n\n.backlink {\n  border: 0;\n  background: transparent;\n  padding-left: 0\n}\n\n.titleline {\n  margin-bottom: 22px\n}\n\n.badge {\n  color: var(--green);\n  font-size: 12px\n}\n\n.historydetails summary {\n  cursor: pointer;\n  padding: 10px 0;\n  font-weight: 650\n}\n\ndialog {\n  background: var(--paper);\n  color: var(--ink);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-panel);\n  max-width: 620px;\n  width: 92%;\n  padding: 28px\n}\n\ndialog::backdrop {\n  background: #14203c88\n}\n\n@media(max-width:900px) {\n  .shell {\n    grid-template-columns: 190px 1fr\n  }\n\n  .side {\n    padding: 25px 15px\n  }\n\n  .page {\n    padding: 28px\n  }\n\n  .top {\n    padding: 16px 28px\n  }\n\n  .hero {\n    grid-template-columns: 1fr\n  }\n\n  .compass {\n    display: none\n  }\n\n  .five {\n    grid-template-columns: repeat(3, 1fr)\n  }\n}\n\n@media(max-width:640px) {\n  .shell {\n    display: block\n  }\n\n  .side {\n    position: static;\n    height: auto;\n    padding: 14px 16px;\n    border-right: 0;\n    border-bottom: 1px solid var(--line)\n  }\n\n  .brand {\n    margin: 0 0 12px\n  }\n\n  .brand strong {\n    font-size: 21px\n  }\n\n  .nav {\n    display: flex;\n    overflow-x: auto;\n    gap: 3px\n  }\n\n  .nav button {\n    font-size: 12px;\n    white-space: nowrap;\n    padding: 8px 10px;\n    min-height: 44px\n  }\n\n  .nav span {\n    display: none\n  }\n\n  .sidefoot {\n    display: none\n  }\n\n  .page {\n    padding: 24px 16px\n  }\n\n  .top {\n    padding: 10px 16px\n  }\n\n  .cards {\n    grid-template-columns: 1fr\n  }\n\n  .hero {\n    margin-bottom: 25px;\n    gap: 0\n  }\n\n  .hero h1 {\n    font-size: 38px\n  }\n\n  .card,\n  .panel {\n    padding: 22px\n  }\n\n  .work .panel {\n    padding: 22px 18px\n  }\n\n  .five {\n    grid-template-columns: repeat(2, 1fr)\n  }\n\n  .workhead h1 {\n    font-size: 29px\n  }\n\n  .letter {\n    font-size: 18px\n  }\n\n  .welcome {\n    margin-top: 0\n  }\n\n  .actions button {\n    font-size: 14px\n  }\n\n  .top .caption {\n    max-width: 200px\n  }\n\n  .timer {\n    font-size: 36px\n  }\n}\n\n/* Chuyển động nhẹ; chỉ bật khi người dùng cho phép hiệu ứng. */\n@keyframes page-enter {\n  from { opacity: 0; transform: translateY(12px) }\n  to { opacity: 1; transform: translateY(0) }\n}\n\n@keyframes compass-turn {\n  from { transform: rotate(-18deg) }\n  to { transform: rotate(12deg) }\n}\n\n@keyframes toast-enter {\n  from { opacity: 0; translate: 0 10px }\n  to { opacity: 1; translate: 0 0 }\n}\n\n@media(prefers-reduced-motion:no-preference) {\n  .page > *,\n  .cards > .card {\n    animation: page
