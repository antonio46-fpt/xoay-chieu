 thực tế (phút)\u003c/span>\u003cinput name=\"thoi_luong_thuc_te_phut\" type=\"number\" min=\"1\" max=\"240\" required>\u003c/label>\u003clabel class=\"field\">\u003cspan>Sĩ số\u003c/span>\u003cinput name=\"si_so\" type=\"number\" min=\"1\" max=\"200\" required>\u003c/label>\u003clabel class=\"field\">\u003cspan>Số bạn tham gia\u003c/span>\u003cinput name=\"so_tham_gia\" type=\"number\" min=\"0\" max=\"200\" required>\u003c/label>\u003clabel class=\"field\">\u003cspan>Hình thức\u003c/span>\u003cselect name=\"dung_app_hay_giay\">\u003coption>App\u003c/option>\u003coption>Giấy\u003c/option>\u003coption>Kết hợp\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"checks\">${['mo_thu','thu','nghi','noi','chia_se'].map((k,i)=>`\u003clabel>\u003cinput type=\"checkbox\" name=\"da_lam_${k}\">${['Đã mở thư','Đã Thử','Đã Nghĩ','Đã Nối','Đã Chia sẻ'][i]}\u003c/label>`).join('')}\u003c/div>\u003clabel class=\"field\">\u003cspan>Điều diễn ra tốt\u003c/span>\u003ctextarea name=\"dieu_tot\" required maxlength=\"6000\">\u003c/textarea>\u003c/label>\u003clabel class=\"field\">\u003cspan>Khó khăn (ghi “Không có” nếu không có)\u003c/span>\u003ctextarea name=\"kho_khan\" required maxlength=\"6000\">\u003c/textarea>\u003c/label>\u003clabel class=\"field\">\u003cspan>Điều phối viên — viết tắt\u003c/span>\u003cinput name=\"dieu_phoi_vien_viet_tat\" required maxlength=\"30\">\u003c/label>\u003cbutton class=\"primary\">Lưu phiếu ghi buổi\u003c/button>\u003c/form>\u003c/section>\u003csection class=\"panel\" style=\"margin-top:20px\" id=\"debatePanel\">\u003ch2>Đổi / giữ ý của nhóm — tuần 3\u003c/h2>\u003cform id=\"debateForm\">\u003clabel class=\"field\">\u003cspan>Mã hoặc tên nhóm (không ghi họ tên)\u003c/span>\u003cinput name=\"nhom\" required maxlength=\"60\">\u003c/label>\u003clabel class=\"field\">\u003cspan>Lựa chọn\u003c/span>\u003cselect name=\"doi_hay_giu\">\u003coption value=\"doi\">Đổi ý\u003c/option>\u003coption value=\"giu\">Giữ ý\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>Vì sao?\u003c/span>\u003ctextarea name=\"vi_sao\" required maxlength=\"6000\">\u003c/textarea>\u003c/label>\u003cbutton class=\"primary\">Lưu ý kiến nhóm\u003c/button>\u003c/form>\u003c/section>`;\n\n  function resetTimer() {\n    if (stageClock?.interval) clearInterval(stageClock.interval);\n    const w = CONTENT.weeks.find(w => w.tuan === +$('coordWeek').value),\n      map = new Map();\n    w.steps.forEach(s => {\n      if (s.minutes && !map.has(s.stage)) map.set(s.stage, s.minutes)\n    });\n    stageClock = {\n      stages: [...map],\n      idx: 0,\n      remaining: [...map][0][1] * 60,\n      running: false\n    };\n    $('debatePanel').classList.toggle('hidden', w.tuan !== 3);\n    $('coordStages').textContent = [...map].map(([s, m]) => `${s} ${m}′`).join(' → ');\n    paintCoord();\n  }\n  $('coordWeek').onchange = resetTimer;\n  resetTimer();\n  $('timerPlay').onclick = () => {\n    stageClock.running = !stageClock.running;\n    stageClock.last = Date.now();\n  };\n  $('timerNext').onclick = () => {\n    if (stageClock.idx >= stageClock.stages.length - 1) {\n      stageClock.running = false;\n      toast('Đã đến chặng cuối. Hãy ghi phiếu buổi.');\n      return;\n    }\n    stageClock.idx++;\n    stageClock.remaining = stageClock.stages[stageClock.idx][1] * 60;\n    stageClock.last = Date.now();\n    paintCoord();\n  };\n  const qs = Object.values(CONTENT.loai_cau_hoi_socrates).flatMap(x => x.mau_cau.map(q => x.ten +\n    ': ' + q));\n  const draw = () => {\n    $('questionCard').textContent = qs[Math.floor(Math.random() * qs.length)];\n  };\n  $('draw').onclick = draw;\n  draw();\n  $('sessionForm').onsubmit = e => {\n    e.preventDefault();\n    const form = e.target,\n      d = Object.fromEntries(new FormData(form));\n    for (const k of ['thoi_luong_thuc_te_phut', 'si_so', 'so_tham_gia']) d[k] = Number(d[k]);\n    if (d.so_tham_gia > d.si_so) {\n      toast('Số tham gia không được lớn hơn sĩ số.');\n      return;\n    } ['mo_thu', 'thu', 'nghi', 'noi', 'chia_se'].forEach(k => d['da_lam_' + k] = !!form.elements[\n      'da_lam_' + k].checked);\n    saveCoord(form, {\n      ...d,\n      loai: 'phieu_buoi',\n      tuan: +$('coordWeek').value\n    });\n  };\n  $('debateForm').onsubmit = e => {\n    e.preventDefault();\n    const form = e.target,\n      d = Object.fromEntries(new FormData(form));\n    if (Core.words(d.vi_sao) \u003c 5) {\n      toast('Hãy ghi ít nhất 5 từ giải thích.');\n      return;\n    }\n    saveCoord(form, {\n      ...d,\n      loai: 'doi_y',\n      tuan: 3\n    });\n  };\n  bindCoordinatorDrafts();\n}\n/** Lưu nháp phiếu điều phối giống bài học sinh, tách theo hồ sơ và form. */\nfunction bindCoordinatorDrafts() {\n  const p = person();\n  p.coordDrafts ||= {};\n  for (const formId of ['sessionForm', 'debateForm']) {\n    const form = $(formId),\n      draft = p.coordDrafts[formId];\n    if (draft) {\n      for (const [name, value] of Object.entries(draft.fields)) {\n        const el = form.elements[name];\n        if (!el) continue;\n        if (el.type === 'checkbox') el.checked = value === true;\n        else el.value = value;\n      }\n      if (formId === 'sessionForm' && draft.week) {\n        $('coordWeek').value = draft.week;\n        $('coordWeek').dispatchEvent(new Event('change'));\n      }\n    }\n    const save = () => {\n      const fields = {};\n      for (const el of form.elements) {\n        if (!el.name) continue;\n        fields[el.name] = el.type === 'checkbox' ? el.checked : el.value;\n      }\n      p.coordDrafts[formId] = {\n        fields,\n        week: Number($('coordWeek').value)\n      };\n      persist();\n    };\n    form.addEventListener('input', save);\n    form.addEventListener('change', save);\n    if (formId === 'sessionForm') $('coordWeek').addEventListener('change', save);\n  }\n}\n\nfunction localDate() {\n  const d = new Date();\n  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n}\n\nfunction saveCoord(form, data) {\n  form.dataset.id ||= Core.id();\n  const record = {\n    ...data,\n    id: form.dataset.id,\n    truong: profile.truong,\n    lop: profile.lop,\n    thoi_gian: new Date().toISOString(),\n    phien_ban_app: APP_CONFIG.version\n  };\n  if (enqueue(record)) {\n    delete person().coordDrafts?.[form.id];\n    form.reset();\n    delete form.dataset.id;\n    persist();\n    toast(previewOnly ? 'Phiếu chỉ giữ tạm trong phiên, chưa lưu lâu dài hoặc gửi đi.' : 'Đã lưu phiếu trên máy. ' + (LIVE ? 'Đang chờ gửi.' : 'Bản xem thử chưa gửi.'));\n  }\n}\n\nfunction paintCoord() {\n  if (!$('coordTime') || !stageClock) return;\n  const t = Math.max(0, Math.ceil(stageClock.remaining));\n  $('stageName').textContent = stageClock.stages[stageClock.idx][0];\n  $('coordTime').textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');\n  $('timerPlay').textContent = stageClock.running ? 'Tạm dừng' : 'Bắt đầu / Tiếp tục';\n}\nsetInterval(() => {\n  if (stageClock?.running) {\n    const n = Date.now();\n    stageClock.remaining = Math.max(0, stageClock.remaining - (n - stageClock.last) / 1000);\n    stageClock.last = n;\n    if (!stageClock.remaining) {\n      stageClock.running = false;\n      toast('Hết thời gian gợi ý của chặng.');\n    }\n  }\n  paintCoord();\n}, 500);\n\n/** Tiến độ lớp không tải câu trả lời hay điểm tự đánh giá về trình duyệt. */\nfunction teacher() {\n  const page = $('page');\n  const active = teacherAuth && Date.now() \u003c teacherAuth.expires;\n  if (!active) teacherAuth = null;\n  page.innerHTML = `\u003cp class=\"eyebrow\">DÀNH CHO GIÁO VIÊN CHỦ NHIỆM\u003c/p>\u003ch1>Tiến độ lớp\u003c/h1>\u003cp class=\"muted\">Chỉ xem mã và tuần đã được máy chủ xác nhận. Không đọc câu trả lời, sản phẩm hay mức tự đánh giá.\u003c/p>${!LIVE ? '\u003cdiv class=\"notice\">Bản xem thử chưa kết nối Sheet. Bảng dưới đây chỉ dùng dữ liệu giả để minh họa.\u003c/div>' : ''}${active ? `\u003csection class=\"panel\">\u003cdiv class=\"row between\">\u003ch2>${E(teacherAuth.lop)}\u003c/h2>\u003cbutton id=\"teacherLogout\">Đăng xuất\u003c/button>\u003c/div>\u003cp>${E(teacherAuth.truong)}\u003c/p>\u003cbutton id=\"teacherRefresh\">Làm mới tiến độ\u003c/button>\u003cdiv id=\"teacherResult\" aria-live=\"polite\">\u003c/div>\u003c/section>` : `\u003cform id=\"teacherLogin\" class=\"panel\">\u003clabel class=\"field\">\u003cspan>Trường phụ trách\u003c/span>\u003cselect id=\"teacherSchool\">${CONTENT.truong_lop.map(s => `\u003coption>${E(s.truong)}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>Lớp phụ trách\u003c/span>\u003cselect id=\"teacherClass\">\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>PIN giáo viên\u003c/span>\u003cinput id=\"teacherPin\" type=\"password\" inputmode=\"numeric\" pattern=\"[0-9]{6,12}\" required autocomplete=\"off\" ${LIVE ? '' : 'disabled'}>\u003c/label>\u003cbutton class=\"primary\" ${LIVE ? '' : 'disabled'}>Xem tiến độ lớp\u003c/button>\u003cp id=\"teacherError\" class=\"error\" role=\"alert\">\u003c/p>\u003c/form>${!LIVE ? '\u003csection class=\"panel\" style=\"margin-top:20px\">\u003ch2>Minh họa bằng dữ liệu giả\u003c/h2>\u003cdiv id=\"teacherResult\">\u003c/div>\u003c/section>' : ''}`}\u003cp class=\"caption\">Bảng chỉ liệt kê mã đã có ít nhất một bài được xác nhận. Chưa có danh sách mã được cấp để kết luận các mã chưa xuất hiện là chưa làm bài. Giáo viên không được chia sẻ PIN hoặc dùng chung thiết bị đang mở Sổ của mình với học sinh.\u003c/p>`;\n  function showStudents(students) {\n    const result = $('teacherResult');\n    if (!result || $('page') !== page) return;\n    result.innerHTML = students.length ? `\u003cdiv class=\"table-scroll\">\u003ctable class=\"progress-table\">\u003ccaption>Tuần đã nộp — ${LIVE ? 'dữ liệu được xác nhận' : 'dữ liệu giả'}\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Mã\u003c/th>${[1,2,3,4].map(w => `\u003cth scope=\"col\">Tuần ${w}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${students.map(student => `\u003ctr>\u003cth scope=\"row\">${E(student.ma)}\u003c/th>${[1,2,3,4].map(w => `\u003ctd>${student.weeks.includes(w) ? '\u003cspan class=\"badge\">Đã nộp\u003c/span>' : '—'}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>` : '\u003cp class=\"notice\">Chưa có bài được máy chủ xác nhận cho lớp này.\u003c/p>';\n  }\n  async function refresh() {\n    const auth = teacherAuth;\n    const button = $('teacherRefresh');\n    button.disabled = true;\n    $('teacherResult').textContent = 'Đang tải tiến độ…';\n    try {\n      const response = await rpc('getClassProgress', { token: auth.token, truong: auth.truong, lop: auth.lop });\n      if ($('page') !== page || teacherAuth !== auth) return;\n      if (!response?.ok) {\n        if (response?.code === 'AUTH_REQUIRED') { teacherAuth = null; teacher(); toast('Phiên giáo viên hết hạn. Hãy đăng nhập lại.'); return; }\n        throw Error(response?.error || 'Chưa tải được tiến độ.');\n      }\n      showStudents(response.students);\n    } catch (error) {\n      if ($('page') === page && $('teacherResult')) $('teacherResult').textContent = error.message;\n    } finally { if (button.isConnected) button.disabled = false; }\n  }\n  if (active) {\n    $('teacherRefresh').onclick = refresh;\n    $('teacherLogout').onclick = () => {\n      const token = teacherAuth.token;\n      teacherAuth = null;\n      teacher();\n      rpc('logoutTeacher', token).catch(() => {});\n    };\n    refresh();\n  } else {\n    const school = $('teacherSchool'), klass = $('teacherClass');\n    const choose = () => {\n      klass.innerHTML = CONTENT.truong_lop.find(s => s.truong === school.value).lop.map(lop => `\u003coption>${E(lop)}\u003c/option>`).join('');\n    };\n    school.onchange = choose;\n    choose();\n    $('teacherLogin').onsubmit = async event => {\n      event.preventDefault();\n      if (!LIVE) return;\n      const button = even fail(\n          'Kiểu giá trị bản ghi không hợp lệ.');\n      });\n    };\n    for (const [key, profile] of Object.entries(clean.profiles)) {\n      let parts;\n      try {\n        parts = JSON.parse(key);\n      } catch {\n        fail('Khóa hồ sơ không hợp lệ.');\n      }\n      if (!Array.isArray(parts) || parts.length !== 3) fail('Khóa hồ sơ không hợp lệ.');\n      const owner = {\n        truong: parts[0],\n        lop: parts[1],\n        ma: parts[2]\n      };\n      if (!validProfile(owner) || !plain(profile) || !plain(profile.drafts) || !Array.isArray(\n          profile.history)) {\n        fail('Hồ sơ trong bản sao không hợp lệ.');\n      }\n      profile.history.forEach(item => {\n        validRecord(item.record);\n        if (core.key(item.record) !== key) fail('Bài không khớp hồ sơ sở hữu.');\n        item.sent = item.sent === true;\n      });\n      for (const [weekId, draft] of Object.entries(profile.drafts)) {\n        const week = content.weeks.find(w => w.tuan === Number(weekId));\n        if (!week || !plain(draft) || !plain(draft.answers) || !string(draft.id) ||\n          !/^[a-zA-Z0-9-]{12,80}$/.test(draft.id) || !isFinite(Date.parse(draft.started)) ||\n          !Number.isInteger(draft.step) || draft.step \u003c 0 || draft.step >= week.steps.length ||\n          !Number.isFinite(draft.activeMs) || draft.activeMs \u003c 0) fail(\n          'Bản nháp không hợp lệ.');\n        Object.values(draft.answers).forEach(v => {\n          if (!['string', 'number'].includes(typeof v)) fail(\n            'Câu trả lời nháp không hợp lệ.');\n        });\n        draft.stageTimes = plain(draft.stageTimes) ? draft.stageTimes : {};\n        draft.hints = plain(draft.hints) ? draft.hints : {};\n      }\n    }\n    const ids = new Set();\n    clean.queue.forEach(item => {\n      validRecord(item.record);\n      if (ids.has(item.record.id)) fail('Hàng đợi có ID lặp.');\n      ids.add(item.record.id);\n      item.paused = true;\n      item.attempts = 0;\n      it rước khi dùng chính thức.\",\n  \"weeks\": [\n    {\n      \"tuan\": 1,\n      \"title\": \"Mình đã thật sự hiểu chưa?\",\n      \"focus\": \"Tự nhận thức\",\n      \"duration\": 15,\n      \"quy_trinh\": \"chu_trinh_15\",\n      \"letter\": {\n        \"tuan\": 1,\n        \"trang_thai\": \"da_co\",\n        \"triet_gia\": \"Socrates\",\n        \"tieu_de\": \"Người biết mình không biết\",\n        \"mat\": \"tnt\",\n        \"doan\": [\n          \"Bạn thân mến,\",\n          \"Bạn có chắc mình biết những điều mình nghĩ là đã biết?\",\n          \"Khoảng 2.400 năm trước, ở thành Athens (Hy Lạp), có một người đàn ông mũi tẹt, hay đi chân đất, suốt ngày đứng ở quảng trường hỏi chuyện người qua đường. Ông tên là Socrates. Ông không viết cuốn sách nào; điều ta biết về ông chủ yếu do học trò là Plato ghi lại.\",\n          \"Chuyện kể rằng một người bạn của ông đến đền Delphi hỏi: “Có ai khôn ngoan hơn Socrates không?”. Lời sấm đáp: không có ai. Socrates rất ngạc nhiên, vì ông thấy mình chẳng biết bao nhiêu. Ông bèn đi trò chuyện với những người nổi tiếng là hiểu biết: chính khách, nhà thơ, thợ thủ công. Sau mỗi cuộc trò chuyện, ông nhận ra họ tưởng mình biết nhiều điều mà thật ra không biết. Còn ông, ít ra cũng không tưởng mình biết điều mình không biết. Có lẽ ông hơn họ đúng ở một điểm nhỏ ấy.\",\n          \"Người ta hay tóm chuyện này thành câu “Tôi chỉ biết một điều là tôi không biết gì”. Câu ấy không có nguyên văn trong sách của Plato, nhưng ý thì gần đúng.\",\n          \"Điều thú vị là Socrates không coi “không biết” là xấu hổ. Ông coi đó là điểm xuất phát. Ai tưởng mình đã biết thì thôi không hỏi nữa. Ai biết mình chưa biết thì mới bắt đầu học.\",\n          \"P.S. Một câu đố nhỏ: nếu không ai biết hết mọi thứ, thì ai nên là thầy của ai?\"\n        ],\n        \"cau_hoi_lon\": \"Có điều gì bạn tưởng mình đã biết, nhưng thật ra chưa biết?\",\n        \"nguoi_gui\": \"Hộp thư Xoay Chiều\",\n        \"nguon\": \"Plato, Biện hộ của Socrates (Apology), 21a–23b.\",\     \"Nêu điều bạn quan sát được hoặc một ví dụ của chính mình.\",\n            \"Viết điều mình nhận ra và điều còn chưa chắc; không cần giống bạn khác.\"\n          ],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Mang thói quen sang nơi khác\",\n          \"stage\": \"Tổng kết\",\n          \"minutes\": 5,\n          \"body\": \"Thói quen đó có thể dùng ở môn khác hoặc việc gì ngoài trường học?\",\n          \"fields\": [\n            {\n              \"key\": \"noi\",\n              \"label\": \"Mình sẽ áp dụng ở đâu và như thế nào?\",\n              \"min\": 5,\n              \"kind\": \"text\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": [],\n          \"dao_sau\": [\n            \"Điều gì trong trải nghiệm của bạn khiến bạn nghĩ như vậy?\",\n            \"Nếu thử một góc nhìn khác, bạn sẽ giữ hoặc thay đổi điều gì?\"\n          ]\n        },\n        {\n          \"title\": \"Nhìn lại sản phẩm\",\n          \"stage\": \"Tự đánh giá\",\n          \"minutes\": 0,\n          \"body\": \"Chọn mức phù hợp với sản phẩm của bạn. Đây là tự đánh giá, không phải điểm số.\",\n          \"fields\": [\n            {\n              \"key\": \"tu_danh_gia\",\n              \"label\": \"Mức tự đánh giá\",\n              \"min\": 0,\n              \"kind\": \"rating\",\n              \"max\": 6000\n            }\n          ],\n          \"hints\": []\n        }\n      ]\n    }\n  ],\n  \"scope\": {\n    \"muc_tieu\": \"Rèn luyện năng lực linh hoạt trong học tập của học sinh THPT qua hoạt động bốn tuần.\",\n    \"giai_doan\": \"Bản bắt buộc: chu trình tuần 1–2, tranh luận tuần 3, chỉnh sửa sản phẩm tuần 4.\",\n    \"trien_lam\": \"App chỉ cho xem và chỉnh sửa sản phẩm của chính mình. Hình thức triển lãm chờ chốt với nhóm nghiên cứu; không hiển thị bài rea:focus,\nselect:focus {\n  outline: 3px solid #c6943280;\n  outline-offset: 3px\n}\n\nbutton {\n  border: 1px solid var(--line);\n  border-radius: var(--radius-control);\n  background: var(--paper);\n  color: var(--ink);\n  padding: 10px 17px;\n  min-height: 44px\n}\n\nbutton:hover {\n  border-color: var(--gold)\n}\n\nbutton.primary {\n  background: var(--ink);\n  color: var(--paper);\n  border-color: var(--ink)\n}\n\nbutton.ghost {\n  background: transparent\n}\n\nbutton.small {\n  font-size: 13px;\n  padding: 5px 12px\n}\n\na {\n  color: var(--accent)\n}\n\nh1,\nh2,\nh3,\np {\n  margin-top: 0\n}\n\nh1,\nh2,\n.serif {\n  font-family: var(--font-ui);\n  font-weight: 650;\n  line-height: 1.3\n}\n\nh1 {\n  font-size: clamp(34px, 4.6vw, 58px);\n  letter-spacing: -1.5px;\n  margin-bottom: 18px\n}\n\nh2 {\n  font-size: 30px\n}\n\nh3 {\n  font-size: 18px\n}\n\nsmall,\n.muted {\n  color: var(--muted)\n}\n\n.eyebrow {\n  text-transform: uppercase;\n  font-size: 11px;\n  letter-spacing: 2px;\n  font-weight: 750;\n  color: var(--muted)\n}\n\n.stripe {\n  height: 7px;\n  background: repeating-linear-gradient(135deg, #1e2a5e 0 15px, #b4233c 15px 22px, #d39b14 22px 28px, #1e2a5e 28px 43px)\n}\n\n.shell {\n  display: grid;\n  grid-template-columns: 240px 1fr;\n  min-height: 100vh\n}\n\n.side {\n  padding: 34px 23px;\n  border-right: 1px solid var(--line);\n  position: sticky;\n  top: 0;\n  height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: var(--paper)\n}\n\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 38px\n}\n\n.brand strong {\n  font-size: 23px;\n  font-family: var(--font-ui)\n}\n\n.brand small {\n  display: block;\n  font-size: 10px;\n  letter-spacing: 1.2px;\n  text-transform: uppercase\n}\n\n.logo {\n  display: block;\n  width: 48px;\n  height: 48px;\n  flex: 0 0 48px;\n  filter: drop-shadow(0 3px 5px #69503814)\n}\n\n.brand {\n  color: var(--ink);\n  text-decoration: none;\n  border-radius: var(--radius-contr   font-size: 11px;\n  color: var(--muted)\n}\n\n.progress {\n  height: 6px;\n  background: var(--line);\n  border-radius: 8px;\n  overflow: hidden\n}\n\n.progress i {\n  display: block;\n  background: var(--green);\n  height: 100%\n}\n\n.row {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  flex-wrap: wrap\n}\n\n.between {\n  justify-content: space-between\n}\n\n.cards {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 18px\n}\n\n.card,\n.panel {\n  background: var(--paper);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-panel);\n  padding: 26px;\n  box-shadow: var(--shadow)\n}\n\n.card {\n  position: relative;\n  overflow: hidden\n}\n\n.card:before {\n  content: '';\n  position: absolute;\n  left: 0;\n  top: 24px;\n  bottom: 24px;\n  width: 4px;\n  background: var(--cardcolor, var(--gold))\n}\n\n.card h2 {\n  font-size: 26px;\n  margin: 16px 0 12px\n}\n\n.card p {\n  font-size: 14px;\n  color: var(--muted)\n}\n\n.card .num {\n  font: 600 36px/1.2 var(--font-ui);\n  color: var(--cardcolor, var(--gold))\n}\n\n.tag {\n  display: inline-block;\n  border: 1px solid var(--line);\n  border-radius: 20px;\n  padding: 3px 10px;\n  font-size: 11px\n}\n\n.caption {\n  font-size: 12px;\n  color: var(--muted)\n}\n\n.notice {\n  padding: 13px 18px;\n  background: var(--soft);\n  border-radius: var(--radius-control);\n  font-size: 13px;\n  margin: 16px 0\n}\n\n.five {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: 12px;\n  margin-top: 26px\n}\n\n.five div {\n  font-size: 12px;\n  color: var(--muted);\n  border-top: 2px solid var(--gold);\n  padding-top: 12px\n}\n\n.welcome {\n  max-width: 560px;\n  margin: 28px auto\n}\n\n.welcome h1 {\n  font-size: 42px\n}\n\n.field {\n  display: block;\n  margin: 19px 0\n}\n\n.field>span {\n  display: block;\n  font-size: 14px;\n  font-weight: 650;\n  margin-bottom: 8px\n}\n\ninput:not([type=radio]):not([type=checkbox]),\nselect,\ntextarea {\n  width: 100%;\n  border gn-items: center; gap: 7px; color: var(--muted); font-size: 12px }\n.workflow-steps li > span { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 50%; background: var(--paper) }\n.workflow-steps li.current { color: var(--ink); font-weight: 700 }\n.workflow-steps li.current > span { border-color: var(--gold); box-shadow: 0 0 0 3px var(--dream-gold) }\n.workflow-steps li.done > span { background: var(--soft); color: var(--green) }\n.revision-note { padding-left: 12px; border-left: 2px solid var(--gold) }\n@media(max-width:640px) {\n  .card > .row:last-child { gap: 12px; align-items: flex-start }\n  .week-status { flex: 1 1 110px }\n  .workflow-steps { gap: 10px; margin-top: 16px }\n  .workflow-steps li { font-size: 11px }\n}\n\n.preview-notice { margin: 16px 24px 0; border: 1px solid var(--gold) }\n#previewFallback { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line) }\n#previewFallback .caption { margin-bottom: 10px }\n@media(max-width:640px) { .preview-notice { margin: 16px 16px 0 } }\n", "src/shell.html": "\u003c!doctype html>\n\u003chtml lang=\"vi\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#1e2a5e\">\n  \u003ctitle>Xoay Chiều — Hành trình 4 tuần\u003c/title>\n  \u003cmeta name=\"description\" content=\"Thử, nghĩ, nối và chia sẻ. Một cuốn sổ trải nghiệm học tập trong bốn tuần.\">\n  \u003cstyle>/*CSS*/\u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"stripe\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv id=\"app\">\u003c/div>\n  \u003cnoscript>Hãy bật JavaScript trong trình duyệt để mở hoạt động và lưu bản nháp.\u003c/noscript>\n  \u003cdiv id=\"toast\" class=\"toast hidden\" role=\"status\" aria-live=\"polite\">\u003c/div>\n  \u003cdialog id=\"letterDialog\" aria-label=\"Lá thư mở đầu\">\u003c/dialog>\n  \u003c!-- build.py ghép theo thứ tự phụ thuộc; không cần CDN hay thư viện. -->\n  \u003cscript>/*CONFIG*/\u003c/script>\n  \u003cscript>/*DATA*/\u003c/script>\n  \u003cscript>/*SAFETY*/\u003c/script>\n  \u003cscript>/*CORE*/\u003c/script>\n  \u003cscript>/*BACKUP*/\u003c/script>\n  \u003cscript>/*APP*/\u003c/script>\n\u003c/body>\n\u003c/html>\n", "apps-script/Code.gs": "/**\n * XOAY CHIỀU — MÁY CHỦ GOOGLE APPS SCRIPT, phiên bản 2.2.0.\n *\n * Các điểm vào từ trình duyệt:\n *   doGet()                  → phục vụ giao diện Index.html.\n *   submitRecord(payload)    → kiểm tra, chống trùng và ghi vào Google Sheets.\n *   loginCoordinator(input)  → xác thực PIN của đúng trường/lớp.\n *\n * Các hàm kết thúc bằng '_' là hàm nội bộ, không gọi được qua google.script.run.\n * API tiến độ chỉ trả mã và tuần, xác thực bằng phiên giáo viên của đúng lớp. Không có API đọc bài riêng tư.\n */\nconst SERVER_VERSION = '2.2.0';\n\nconst HEADERS = {\n  chu_trinh: [\n    'id', 'thoi_gian_nhan', 'thoi_gian', 'bat_dau', 'ma', 'truong', 'lop', 'tuan',\n    'thu_lam', 'nghi_1', 'nghi_2', 'nghi_3', 'noi', 'dang_san_pham', 'san_pham',\n    'chia_se', 'tu_danh_gia', 'thoi_luong_giay', 'thoi_gian_troi_giay', 'phe',\n    'doi_hay_giu', 'kiem_soat', 'ngoai_kiem_soat', 'ban_goc_id',\n    'phien_ban_app', 'phien_ban_noi_dung',\n  ],\n  phieu_buoi: [\n    'id', 'thoi_gian_nhan', 'thoi_gian', 'truong', 'lop', 'tuan', 'ngay', 'khung_gio',\n    'thoi_luong_thuc_te_phut', 'si_so', 'so_tham_gia', 'da_lam_mo_thu', 'da_lam_thu',\n    'da_lam_nghi', 'da_lam_noi', 'da_lam_chia_se', 'dung_app_hay_giay',\n    'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat', 'phien_ban_app',\n  ],\n  doi_y: [\n    'id', 'thoi_gian_nhan', 'thoi_gian', 'truong', 'lop', 'tuan', 'nhom',\n    'doi_hay_giu', 'vi_sao', 'phien_ban_app',\n  ],\n};\n\n/** Chạy MỘT LẦN trong editor, từ dự án Apps Script gắn với Sheet mới. */\nfunction setup_() {\n  const spreadsheet = SpreadsheetApp.getActiveSpreadsheet();\n  if (!spreadsheet) throw new Error('Hãy mở Apps Script từ Google Sheet mới.');\n\n  // Kiểm tra dịch vụ trước khi sửa cấu hình. Cần Services → Google Sheets API.\n  Sheets.Spreadsheets.get(spreadsheet.getId(), {\n    fields: 'spreadsheetId'\n  });\n  for (const name of Object.keys(HEADERS)) {\n    const sheet = spreadsheet.getSheetByName(name) || spreadsheet.insertSheet(name);\n    const columns = HEADERS[name];\n    if (sheet.getLastRow() === 0) {\n      sheet.getRange(1, 1, 1, columns.length).setValues([columns]);\n      sheet.setFrozenRows(1);\n      sheet.getRange(1, 1, 1, columns.length)\n        .setFontWeight('bold').setBackground('#1e2a5e').setFontColor('#ffffff');\n    } else if (!headersMatch_(sheet, columns)) {\n      throw new Error('Cột ' + name + ' không khớp. Dùng Sheet mới; không ghi đè dữ liệu cũ.');\n    }\n  }\n  PropertiesService.getScriptProperties()\n    .setProperty('SPREADSHEET_ID', spreadsheet.getId());\n}\n\n/** HTML Service hỗ trợ google.script.run và tự thực thi trong iframe bảo vệ. */\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('Xoay Chiều — Hành trình 4 tuần')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\nfunction headersMatch_(sheet, columns) {\n  return JSON.stringify(sheet.getRange(1, 1, 1, columns.length).getValues()[0]) ===\n    JSON.stringify(columns);\n}\n\nfunction schoolOK_(data) {\n  return SCHEMA.schools.some(s => s.truong === data.truong && s.lop.includes(data.lop));\n}\n\nfunction count_(value) {\n  return String(value ?? '').trim().split(/\\s+/).filter(Boolean).length;\n}\n\nfunction fail_(message, code = 'INVALID_RECORD') {\n  const error = new Error(message);\n  error.code = code;\n  throw error;\n}\n\n/** Chỉ kiểm tra, không trim và không cắt văn bản sẽ được lưu. */\nfunction text_(value, name, minWords, maxLength) {\n  if (typeof value !== 'string' || (value !== Safety.hidden && count_(value) \u003c minWords) || value.length > maxLength) {\n    fail_('Phần ' + name + ' cần ít nhất ' + minWords + ' từ, tối đa ' + maxLength + ' ký tự.');\n  }\n}\n\nfunction num_(value, min, max) {\n  return typeof value === 'number' && isFinite(value) && value >= min && value \u003c= max;\n}\n\nfunction valid_(data) {\n  if (!data || typeof data !== 'object' || Array.isArray(data) ||\n    JSON.stringify(data).length > 100000) fail_('Bản ghi không hợp lệ hoặc quá lớn.');\n  if (!Object.prototype.hasOwnProperty.call(HEADERS, data.loai)) fail_(\n    'Loại bản ghi không hợp lệ.');\n  if (typeof data.id !== 'string' || !/^[a-zA-Z0-9-]{12,80}$/.test(data.id)) fail_(\n    'ID bản ghi không hợp lệ.');\n  if (!schoolOK_(data)) fail_('Trường/lớp không thuộc danh sách.');\n  if (!Number.isInteger(data.tuan) || data.tuan \u003c 1 || data.tuan > SCHEMA.weeks.length) {\n    fail_('Tuần không hợp lệ.');\n  }\n  if (typeof data.thoi_gian !== 'string' || !isFinite(Date.parse(data.thoi_gian))) fail_(\n    'Thời gian không hợp lệ.');\n\n  // Mỗi ô chỉ được là kiểu đơn giản; từ chối đối tượng lồng nhau bất thường.\n  Object.entries(data).forEach(([name, value]) => {\n    if (!HEADERS[data.loai].includes(name) && name !== 'loai') fail_(\n      'Trường dữ liệu không được hỗ trợ: ' + name);\n    if (!['string', 'number', 'boolean'].includes(typeof value)) fail_(\n      'Kiểu dữ liệu không hợp lệ: ' + name);\n    if (typeof value === 'string' && value.length > 13000) fail_('Giá trị quá dài: ' + name);\n  });\n\n  if (data.loai === 'chu_trinh') validateStudent_(data);\n  else if (data.loai === 'phieu_buoi') validateSession_(data);\n  else validateDebate_(data);\n}\n\nfunction validateStudent_(data) {\n  if (typeof data.ma !== 'string' || !/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(data.ma) || data.ma ===\n    'HO07-T') {\n    fail_('Mã học sinh không hợp lệ.');\n  }\n  // Schema sinh từ cùng content.json với giao diện, tránh lệch quy tắc hai phía.\n  SCHEMA.weeks[data.tuan - 1].forEach(field => {\n    const value = data[field.key];\n    if (field.kind === 'rating') {\n      if (![1, 2, 3].includes(value)) fail_('Chưa chọn mức tự đánh giá.');\n    } else if (field.options) {\n      if (!field.options.includes(value)) fail_('Lựa chọn ' + field.key + ' không hợp lệ.');\n    } else {\n      // Chỉ đếm phần học sinh viết, không tính phần tiền tố do app thêm.\n      let raw = value;\n      if (data.tuan === 3 && field.key === 'nghi_1') raw = String(value ?? '').replace(\n        /^Phe [AB]: /, '');\n      if (data.tuan === 3 && field.key === 'chia_se') raw = String(value ?? '').replace(\n        /^(Đổi ý|Giữ ý): /, '');\n      text_(raw, field.key, field.min, field.max);\n    }\n  });\n  if (data.tuan === 3) {\n    if (!data.nghi_1.startsWith(data.phe.startsWith('A') ? 'Phe A: ' : 'Phe B: ')) fail_(\n      'Phe không khớp câu trả lời.');\n    if (!data.chia_se.startsWith(data.doi_hay_giu + ': ')) fail_('Lựa chọn đổi/giữ không khớp.');\n  }\n  if (data.tuan === 4) {\n    const expected = 'Phần mình thay đổi được:\\n' + data.kiem_soat +\n      '\\n\\nPhần mình không thay đổi được:\\n' + data.ngoai_kiem_soat;\n    if (data.thu_lam !== expected) fail_('Hai phần của bước Thử không khớp.');\n  }\n  if (!num_(data.thoi_luong_giay, 0, 604800) ||\n    !num_(data.thoi_gian_troi_giay, 0, 31536000) ||\n    !isFinite(Date.parse(data.bat_dau))) fail_('Thời lượng không hợp lệ.');\n}\n\nfunction validateSession_(data) {\n  ['khung_gio', 'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat'].forEach(key => {\n    text_(data[key], key, 1, key === 'dieu_phoi_vien_viet_tat' ? 30 : 6000);\n  });\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(data.ngay) || !isFinite(Date.parse(data.ngay))) fail_(\n    'Ngày không hợp lệ.');\n  if (!num_(data.si_so, 1, 200) || !Number.isInteger(data.si_so) ||\n    !num_(data.so_tham_gia, 0, data.si_so) || !Number.isInteger(data.so_tham_gia) ||\n    !num_(data.thoi_luong_thuc_te_phut, 1, 240)) fail_('Sĩ số/thời lượng không hợp lệ.');\n  if (!['App', 'Giấy', 'Kết hợp'].includes(data.dung_app_hay_giay)) fail_(\n    'Hình thức không hợp lệ.');\n  ['mo_thu', 'thu', 'nghi', 'noi', 'chia_se'].forEach(key => {\n    if (typeof data['da_lam_' + key] !== 'boolean') fail_('Thiếu trạng thái bước ' + key);\n  });\n}\n\nfunction validateDebate_(data) {\n  if (data.tuan !== 3 || !['doi', 'giu'].includes(data.doi_hay_giu)) fail_(\n    'Phiếu đổi ý chỉ dành cho tuần 3.');\n  text_(data.nhom, 'nhóm', 1, 60);\n  text_(data.vi_sao, 'vì sao', 5, 6000);\n}\n\n/**\n * Đảm bảo tính idempotent:\n * - Cùng ID + cùng nội dung → ACK lại, không tạo dòng mới.\n * - Cùng ID + khác nội dung → báo xung đột, không ghi đè.\n * - ID mới → thêm đúng một dòng bằng API RAW.\n *\n * Khóa bao trùm thao tác tìm ID và ghi. Chờ khóa ngắn để nhiều yêu cầu không\n * giữ các slot thực thi quá lâu. Client tự giãn lần thử sau nếu máy chủ bận.\n */\nfunction submitRecord(payload) {\n  let lock;\n  try {\n    valid_(payload && payload.record);\n    const data = Safety.redactRecord(payload.record, SCHEMA.safety);\n    valid_(data);\n    if (data.loai !== 'chu_trinh') authorizeCoordinator_(payload.token, data);\n\n    const spreadsheetId = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n    if (!spreadsheetId) fail_('Máy chủ chưa chạy setup_.', 'SETUP_REQUIRED');\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) return {\n      ok: false,\n      code: 'BUSY',\n      error: 'Máy chủ đang bận; bài được giữ để gửi lại.'\n    };\n\n    const spreadsheet = SpreadsheetApp.openById(spreadsheetId);\n    const sheet = spreadsheet.getSheetByName(data.loai);\n    const columns = HEADERS[data.loai];\n    if (!sheet || !headersMatch_(sheet, columns)) fail_(\n      'Cấu trúc Sheet không khớp; liên hệ người quản lý.', 'SETUP_REQUIRED');\n\n    if (sheet.getLastRow() > 1) {\n      const match = sheet.getRange(2, 1, sheet.getLastRow() - 1, 1)\n        .createTextFinder(data.id).matchEntireCell(true).findNext();\n      if (match) {\n        const existing = sheet.getRange(match.getRow(), 1, 1, columns.length).getValues()[0];\n        const identical = columns.every((key, index) => key === 'thoi_gian_nhan' ||\n          String(existing[index] ?? '') === String(data[key] ?? ''));\n        if (!identical) fail_('ID đã tồn tại với nội dung khác. Không ghi đè.', 'ID_CONFLICT');\n        return {\n          ok: true,\n          id: data.id,\n          duplicate: true\n        };\n      }\n    }\n\n    const row = columns.map(key => key === 'thoi_gian_nhan' ?\n      new Date().toISOString() : (data[key] ?? ''));\n    // RAW giữ cả =, +, -, @, dấu nháy và xuống dòng như văn bản, không chạy công thức.\n    Sheets.Spreadsheets.Values.append({\n      values: [row]\n    }, spreadsheetId, \"'\" + data.loai + \"'!A1\", {\n      valueInputOption: 'RAW',\n      insertDataOption: 'INSERT_ROWS'\n    }, );\n    return {\n      ok: true,\n      id: data.id,\n      duplicate: false\n    };\n  } catch (error) {\n    // Lỗi do Google/quota: log phía chủ dự án, không log câu trả lời học sinh.\n    if (!error.code) console.error('submitRecord: ' + String(error.message));\n    return {\n      ok: false,\n      code: error.code || 'SERVER_ERROR',\n      error: error.code ? error.message :\n        'Chưa ghi được vào Google Sheets. Bài vẫn chờ gửi; kiểm tra dịch vụ và quyền của dự án.',\n    };\n  } finally {\n    if (lock && lock.hasLock()) lock.releaseLock();\n  }\n}\n\nfunction authorizeRole_(token, data, role) {\n  if (typeof token !== 'string' || token.length \u003c 20 || token.length > 160 || !schoolOK_(data)) {\n    fail_('Phiên truy cập không hợp lệ. Hãy đăng nhập lại.', 'AUTH_REQUIRED');\n  }\n  let auth;\n  try {\n    auth = JSON.parse(CacheService.getScriptCache().get(role + ':' + token) || 'null');\n  } catch { auth = null; }\n  if (!auth || !Number.isFinite(auth.expires) || auth.expires \u003c= Date.now() ||\n      auth.truong !== data.truong || auth.lop !== data.lop) {\n    fail_('Phiên hết hạn hoặc không có quyền với lớp này. Hãy đăng nhập lại.', 'AUTH_REQUIRED');\n  }\n}\n\nfunction authorizeCoordinator_(token, data) {\n  authorizeRole_(token, data, 'coord');\n}\n\nfunction loginCoordinator(input) {\n  return loginRole_(input, 'coord', 'COORDINATOR_PINS');\n}\n\nfunction loginTeacher(input) {\n  return loginRole_(input, 'teacher', 'TEACHER_PINS');\n}\n\n/** Giáo viên chỉ được đọc phép chiếu mã + tuần đã xác nhận của đúng lớp. */\nfunction getClassProgress(input) {\n  try {\n    if (!input) fail_('Thiếu thông tin lớp.', 'AUTH_REQUIRED');\n    authorizeRole_(input.token, input, 'teacher');\n    const spreadsheetId = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n    if (!spreadsheetId) fail_('Chưa cấu hình Sheet.', 'SETUP_REQUIRED');\n    const sheet = SpreadsheetApp.openById(spreadsheetId).getSheetByName('chu_trinh');\n    const columns = HEADERS.chu_trinh;\n    if (!sheet || !headersMatch_(sheet, columns)) fail_('Cấu trúc Sheet không khớp.', 'SETUP_REQUIRED');\n    const byCode = new Map();\n    const rows = sheet.getLastRow() > 1 ? sheet.getRange(2, 1, sheet.getLastRow() - 1, columns.length).getValues() : [];\n    const index = key => columns.indexOf(key);\n    rows.forEach(row => {\n      if (row[index('truong')] !== input.truong || row[index('lop')] !== input.lop) return;\n      const code = row[index('ma')], week = Number(row[index('tuan')]);\n      if (!/^[A-Z]{2}[0-9]{2}-[A-Z]$/.test(String(code)) || !Number.isInteger(week) || week \u003c 1 || week > 4) return;\n      if (!byCode.has(code)) byCode.set(code, new Set());\n      byCode.get(code).add(week);\n    });\n    return { ok: true, students: Array.from(byCode, ([ma, weeks]) => ({ ma, weeks: [...weeks].sort() }))\n      .sort((a, b) => a.ma.localeCompare(b.ma)) };\n  } catch (error) {\n    return { ok: false, code: error.code || 'SERVER_ERROR',\n      error: error.code ? error.message : 'Chưa tải được tiến độ lớp. Vui lòng thử lại.' };\n  }\n}\n\nfunction logoutTeacher(token) {\n  if (typeof token === 'string' && token.length >= 20 && token.length \u003c= 160) {\n    CacheService.getScriptCache().remove('teacher:' + token);\n  }\n  return { ok: true };\n}\n\n/** PIN ở Script Properties, không nằm trong HTML/JSON người học tải về. */\nfunction loginRole_(input, role, property) {\n  let lock;\n  try {\n    if (!input || !schoolOK_(input)) fail_('Lớp không hợp lệ.', 'AUTH_REQUIRED');\n    lock = LockService.getScriptLock();\n    if (!lock.tryLock(1500)) fail_('Máy chủ đang bận. Thử lại sau vài giây.', 'BUSY');\n    const cache = CacheService.getScriptCache();\n    const key = 'login:' + role + ':' + input.truong + '|' + input.lop;\n    const attempts = Number(cache.get(key) || 0);\n    if (attempts >= 8) fail_('Đã thử nhiều lần. Vui lòng đợi 10 phút.', 'AUTH_REQUIRED');\n    const raw = PropertiesService.getScriptProperties().getProperty(property) || '{}';\n    const pins = JSON.parse(raw);\n    const expected = pins[input.truong + '|' + input.lop];\n    if (!expected || !/^\\d{6,12}$/.test(String(expected)) || String(input.pin) !== String(\n        expected)) {\n      cache.put(key, String(attempts + 1), 600);\n      fail_('PIN chưa được cấu hình hoặc không đúng.', 'AUTH_REQUIRED');\n    }\n    cache.remove(key);\n    const token = Utilities.getUuid() + Utilities.getUuid();\n    const expires = Date.now() + 21600000;\n    cache.put(role + ':' + token, JSON.stringify({\n      truong: input.truong,\n      lop: input.lop,\n      expires\n    }), 21600);\n    return {\n      ok: true,\n      token,\n      expires\n    };\n  } catch (error) {\n    return {\n      ok: false,\n      code: error.code || 'SERVER_ERROR',\n      error: error.code ? error.message : 'Chưa xác thực được quyền truy cập.'\n    };\n  } finally {\n    if (lock && lock.hasLock()) lock.releaseLock();\n  }\n}\n", "apps-script/Schema.gs": "// Tự sinh bởi build.py; không sửa trực tiếp.\n/** Chính sách dùng chung trước khi gửi và trước khi ghi Sheet. Không sửa bản gốc trên máy. */\nconst Safety = (() => {\n  const hidden = '[đã ẩn – an toàn]';\n  const normalize = value => String(value ?? '').normalize('NFD')\n    .replace(/[\\u0300-\\u036f]/g, '').replace(/đ/gi, 'd')\n    .replace(/[\\u200b-\\u200d\\ufeff]/g, '').toLowerCase().replace(/\\s+/g, ' ').trim();\n  function matches(value, config) {\n    const text = normalize(value);\n    return (config?.tu_khoa || []).some(word => normalize(word) && text.includes(normalize(word)));\n  }\n  function redactRecord(record, config) {\n    const result = { ...record };\n    const fields = record.loai === 'chu_trinh' ?\n      ['thu_lam', 'nghi_1', 'nghi_2', 'nghi_3', 'noi', 'san_pham', 'chia_se', 'kiem_soat', 'ngoai_kiem_soat'] :\n      record.loai === 'phieu_buoi' ? ['khung_gio', 'dieu_tot', 'kho_khan', 'dieu_phoi_vien_viet_tat'] :\n      ['nhom', 'vi_sao'];\n    fields.forEach(key => {\n      if (typeof result[key] === 'string' && matches(result[key], config)) result[key] = hidden;\n    });\n    // Giữ quy tắc ánh xạ, đồng thời tránh rò nội dung qua cột tổng hợp.\n    if (record.loai === 'chu_trinh' && record.tuan === 3) {\n      if (result.nghi_1 === hidden) result.nghi_1 = (String(record.phe).startsWith('A') ? 'Phe A: ' : 'Phe B: ') + hidden;\n      if (result.chia_se === hidden) result.chia_se = record.doi_hay_giu + ': ' + hidden;\n    }\n    if (record.loai === 'chu_trinh' && record.tuan === 4) {\n      result.thu_lam = 'Phần mình thay đổi được:\\n' + result.kiem_soat +\n        '\\n\\nPhần mình không thay đổi được:\\n' + result.ngoai_kiem_soat;\n    }\n    return result;\n  }\n  return { hidden, matches, redactRecord };\n})();\nif (typeof module !== 'undefined') module.exports = Safety;\n\nconst SCHEMA = {\n  \"schools\": [\n    {\n      \"truong\": \"THPT Chuyên Chu Văn An\",\n      \"lop\": [\n        \"10 Trung\",\n        \"10D2\"\n      ]\n    },\n    {\n      \"truong\": \"THPT Dân tộc nội trú tỉnh\",\n      \"lop\": [\n        \"10A6\",\n        \"10A7\"\n      ]\n    }\n  ],\n  \"safety\": {\n    \"tu_khoa\": [\n      \"muốn chết\",\n      \"tự tử\",\n      \"không muốn sống\",\n      \"tự làm đau\",\n      \"tự làm hại\",\n      \"bị đánh\       {\n        \"key\": \"tu_danh_gia\",\n        \"label\": \"Mức tự đánh giá\",\n        \"min\": 0,\n        \"kind\": \"rating\",\n        \"max\": 6000\n      }\n    ],\n    [\n      {\n        \"key\": \"thu_lam\",\n        \"label\": \"Bạn đoán đúng đến đâu? Điều gì làm bạn đoán sai?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"phe\",\n        \"label\": \"Phe của mình\",\n        \"min\": 0,\n        \"kind\": \"select\",\n        \"max\": 6000,\n        \"options\": [\n          \"A — Đồng ý\",\n          \"B — Không đồng ý\"\n        ]\n      },\n      {\n        \"key\": \"nghi_1\",\n        \"label\": \"Hai lý do và ví dụ của mình\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"nghi_2\",\n        \"label\": \"Lý lẽ mạnh nhất của họ là gì? Viết bằng lời của bạn.\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"nghi_3\",\n        \"label\": \"Hai phe đồng ý ở đâu? Điều gì bạn vẫn chưa chắc?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"doi_hay_giu\",\n        \"label\": \"Lựa chọn của mình\",\n        \"min\": 0,\n        \"kind\": \"select\",\n        \"max\": 6000,\n        \"options\": [\n          \"Đổi ý\",\n          \"Giữ ý\"\n        ]\n      },\n      {\n        \"key\": \"chia_se\",\n        \"label\": \"Vì sao mình đổi hoặc giữ ý?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"noi\",\n        \"label\": \"Liên hệ với môn học hoặc đời sống\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"dang_san_pham\",\n        \"label\": \"Chọn dạng sản phẩm\",\n        \"min\": 0,\n        \"kind\": \"select\",\n        \"max\": 6000,\n        \"options\": [\n          \"Thơ 4 câu\",\n          \"Tranh 4 khung\",\n          \"Sơ đồ hình ảnh\",\n          \"Nhịp đọc / rap ngắn\",\n          \"Tiểu phẩm 1 phút\",\n          \"Lời then / sli / lượn\",\n          \"Họa tiết thổ cẩm\",\n          \"Ảnh có chú thích\"\n        ]\n      },\n      {\n        \"key\": \"san_pham\",\n        \"label\": \"Nội dung sản phẩm của mình\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"tu_danh_gia\",\n        \"label\": \"Mức tự đánh giá\",\n        \"min\": 0,\n        \"kind\": \"rating\",\n        \"max\": 6000\n      }\n    ],\n    [\n      {\n        \"key\": \"kiem_soat\",\n        \"label\": \"Phần mình thay đổi hoặc tác động được\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"ngoai_kiem_soat\",\n        \"label\": \"Phần mình không tự quyết định được\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"nghi_1\",\n        \"label\": \"Mình sẽ bắt đầu bằng việc gì?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"dang_san_pham\",\n        \"label\": \"Chọn dạng sản phẩm\",\n        \"min\": 0,\n        \"kind\": \"select\",\n        \"max\": 6000,\n        \"options\": [\n          \"Thơ 4 câu\",\n          \"Tranh 4 khung\",\n          \"Sơ đồ hình ảnh\",\n          \"Nhịp đọc / rap ngắn\",\n          \"Tiểu phẩm 1 phút\",\n          \"Lời then / sli / lượn\",\n          \"Họa tiết thổ cẩm\",\n          \"Ảnh có chú thích\"\n        ]\n      },\n      {\n        \"key\": \"san_pham\",\n        \"label\": \"Viết phiên bản đã sửa của sản phẩm\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"chia_se\",\n        \"label\": \"Một sản phẩm của bạn khác khiến mình học được gì?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"nghi_2\",\n        \"label\": \"Lá thư của mình\",\n        \"min\": 30,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"nghi_3\",\n        \"label\": \"Thói quen học mình muốn giữ lại là gì? Vì sao?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"noi\",\n        \"label\": \"Mình sẽ áp dụng ở đâu và như thế nào?\",\n        \"min\": 5,\n        \"kind\": \"text\",\n        \"max\": 6000\n      },\n      {\n        \"key\": \"tu_danh_gia\",\n        \"label\": \"Mức tự đánh giá\",\n        \"min\": 0,\n        \"kind\": \"rating\",\n        \"max\": 6000\n      }\n    ]\n  ]\n};\n", "apps-script/appsscript.json": "{\n  \"timeZone\": \"Asia/Bangkok\",\n  \"dependencies\": {\n    \"enabledAdvancedServices\": [\n      { \"userSymbol\": \"Sheets\", \"serviceId\": \"sheets\", \"version\": \"v4\" }\n    ]\n  },\n  \"exceptionLogging\": \"STACKDRIVER\",\n  \"runtimeVersion\": \"V8\",\n  \"oauthScopes\": [\"https://www.googleapis.com/auth/spreadsheets\"]\n}\n", "build.py": "\"\"\"Ghép app HTML độc lập và schema Google Apps Script từ cùng nội dung JSON.\n\nChỉ dùng Python standard library; không cần npm để build hoặc chạy app.\nSửa trong src/, không sửa trực tiếp các tệp đầu ra.\n\"\"\"\nfrom pathlib import Path\nimport hashlib\nimport json\n\nROOT = Path(__file__).resolve().parent\nSRC = ROOT / \"src\"\nDIST = ROOT / \"dist\"\nSERVER = ROOT / \"apps-script\"\n\n\ndef read(path):\n    return path.read_text(encoding=\"utf-8\")\n\n\ndef validate_content(content):\n    \"\"\"Bắt lỗi cấu hình trước khi tạo hai bản frontend/backend.\"\"\"\n    assert content[\"so_tuan\"] == len(content[\"weeks\"]) == 4, \"Cần đủ 4 tuần\"\n    assert [week[\"tuan\"] for week in content[\"weeks\"]] == [1, 2, 3, 4]\n    for week in content[\"weeks\"]:\n        stages = {}\n        fields = []\n        for step in week[\"steps\"]:\n            if step[\"stage\"] in stages:\n                assert stages[step[\"stage\"]] == step[\"minutes\"], \"Thời lượng chặng bị lệch\"\n            stages[step[\"stage\"]] = step[\"minutes\"]\n            for field in step[\"fields\"]:\n                fields.append(field[\"key\"])\n                assert field[\"max\"] >= field[\"min\"] >= 0\n        assert sum(stages.values()) == week[\"duration\"], (week[\"tuan\"], stages)\n        assert week[\"duration\"] == (15 if week[\"tuan\"] \u003c= 2 else 45)\n        assert len(fields) == len(set(fields)), \"Trùng khóa câu trả lời\"\n        assert fields.count(\"tu_danh_gia\") == 1, \"Mỗi tuần cần một tự đánh giá\"\n\n\ndef build():\n    content = json.loads(read(SRC / \"content.json\"))\n    validate_content(content)\n    DIST.mkdir(exist_ok=True)\n    SERVER.mkdir(exist_ok=True)\n\n    # Escape '\u003c' trong JSON để một lá thư có \u003c/script> không đóng thẻ script.\n    data_js = \"const CONTENT = \" + json.dumps(content, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\") + \";\"\n    sections = {\n        \"CSS\": read(SRC / \"style.css\"),\n        \"CONFIG\": read(SRC / \"config.js\"),\n        \"DATA\": data_js,\n        \"SAFETY\": read(SRC / \"safety.js\"),\n        \"CORE\": read(SRC / \"core.js\"),\n        \"BACKUP\": read(SRC / \"backup.js\"),\n        \"APP\": read(SRC / \"app.js\"),\n    }\n    html = read(SRC / \"shell.html\")\n    for name, source in sections.items():\n        marker = \"/*\" + name + \"*/\"\n        assert html.count(marker) == 1, \"Sai placeholder \" + name\n        html = html.replace(marker, source)\n    (DIST / \"index.html\").write_text(html, encoding=\"utf-8\")\n    (SERVER / \"Index.html\").write_text(html, encoding=\"utf-8\")\n\n    # Cùng định nghĩa ô nhập cho kiểm tra cả phía học sinh và máy chủ.\n    schema = {\n        \"schools\": content[\"truong_lop\"],\n        \"safety\": content[\"an_toan\"],\n        \"weeks\": [[field for step in week[\"steps\"] for field in step[\"fields\"]]\n                  for week in content[\"weeks\"]],\n    }\n    (SERVER / \"Schema.gs\").write_text(\n        \"// Tự sinh bởi build.py; không sửa trực tiếp.\\n\"\n        + read(SRC / \"safety.js\") + \"\\n\"\n        + \"const SCHEMA = \" + json.dumps(schema, ensure_ascii=False, indent=2) + \";\\n\",\n        encoding=\"utf-8\",\n    )\n    version = hashlib.sha256(html.encode()).hexdigest()[:12]\n    # Cache shell cho bản tĩnh HTTP(S). Apps Script không dùng service worker này.\n    sw = \"const CACHE = 'xc-\" + version + \"';\\n\" + \"\"\"\nself.addEventListener('install', event => {\n  event.waitUntil(caches.open(CACHE).then(cache => cache.addAll(['./', './index.html'])));\n});\nself.addEventListener('activate', event => {\n  event.waitUntil(caches.keys().then(keys => Promise.all(\n    keys.filter(key => key.startsWith('xc-') && key !== CACHE).map(key => caches.delete(key))\n  )));\n});\nself.addEventListener('fetch', event => {\n  if (event.request.method !== 'GET' || new URL(event.request.url).origin !== self.location.origin) return;\n  event.respondWith(fetch(event.request).catch(() => caches.match(event.request).then(\n    response => response || (event.request.mode === 'navigate' ? caches.match('./index.html') : Response.error())\n  )));\n});\n\"\"\"\n    (DIST / \"sw.js\").write_text(sw, encoding=\"utf-8\")\n    print(\"Đã build HTML, schema và cache:\", version)\n\n\nif __name__ == \"__main__\":\n    build()\n", "package_source.py": "\"\"\"Tạo trang đọc mã và ZIP bàn giao từ tệp đã build; không đóng gói dữ liệu cá nhân.\n\nChạy python build.py và các kiểm thử trước lệnh này.\nChỉ các tệp trong allowlist bên dưới được đưa vào ZIP, không có .git hay credential.\n\"\"\"\nfrom pathlib import Path\nimport hashlib\nimport json\nimport zipfile\n\nROOT = Path(__file__).resolve().parent\nDIST = ROOT / \"dist\"\n\n\ndef package():\n    paths = [\n        \"CONTRIBUTING.md\", \"SCOPE.md\", \"README.md\", \"MA_NGUON_CHI_TIET.md\", \"HUONG_DAN_TRIEN_KHAI.md\", \"DU_LIEU_VA_TAP_HUAN.md\",\n        \"src/app.js\", \"src/core.js\", \"src/safety.js\", \"src/backup.js\", \"src/config.js\", \"src/content.json\",\n        \"src/style.css\", \"src/shell.html\", \"apps-script/Code.gs\", \"apps-script/Schema.gs\",\n        \"apps-script/appsscript.json\", \"build.py\", \"package_source.py\", \"package.json\",\n        \"tests/preview.cjs\", \"tests/fe.cjs\", \"tests/scope.cjs\", \"tests/test.cjs\", \"tests/queue.cjs\", \"tests/recovery.cjs\", \"tests/ui.cjs\", \"tests/run.cjs\",\n        \"tools/source-reader.html\",\n        \".github/ISSUE_TEMPLATE/backend_task.yml\", \"docs/issues/README.md\",\n        \"docs/issues/be-class-roster.md\", \"docs/issues/be-progress-permissions.md\",\n        \"docs/issues/be-submission-integrity.md\", \"docs/issues/be-capacity.md\",\n    ]\n    files = {name: (ROOT / name).read_text(encoding=\"utf-8\") for name in paths}\n    data = json.dumps(files, ensure_ascii=False).replace(\"\u003c\", \"\\\\u003c\")\n    reader = (ROOT / \"tools/source-reader.html\").read_text(encoding=\"utf-8\")\n    (DIST / \"ma-nguon.html\").write_text(reader.replace(\"/*FILES*/\", data), encoding=\"utf-8\")\n\n    paths += [\"package-lock.json\", \"apps-script/Index.html\", \"dist/index.html\", \"dist/sw.js\", \"dist/ma-nguon.html\"]\n    # Fixed metadata keeps the package reproducible for an unchanged source tree.\n    payloads = {name: (ROOT / name).read_bytes() for name in paths}\n    payloads[\"SHA256SUMS.txt\"] = (\"\\n\".join(\n        hashlib.sha256(data).hexdigest() + \"  \" + name for name, data in payloads.items()\n    ) + \"\\n\").encode()\n    target = DIST / \"XoayChieu_Source.zip\"\n    with zipfile.ZipFile(target, \"w\", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:\n        for name, data in payloads.items():\n            info = zipfile.ZipInfo(name, date_time=(2026, 10, 16, 0, 0, 0))\n            info.compress_type = zipfile.ZIP_DEFLATED\n            info.external_attr = 0o644 \u003c\u003c 16\n            archive.writestr(info, data)\n    print(f\"Đã đóng gói {len(payloads)} tệp: {target.name} ({target.stat().st_size:,} bytes)\")\n\n\nif __name__ == \"__main__\":\n    package()\n", "package.json": "{\n  \"devDependencies\": {\n    \"jsdom\": \"30.1.3\"\n  },\n  \"name\": \"xoay-chieu\",\n  \"version\": \"2.2.0\",\n  \"private\": true,\n  \"description\": \"Công cụ hoạt động và thu dữ liệu nghiên cứu học tập trong bốn tuần\",\n  \"engines\": {\n    \"node\": \"^22.22.2 || ^24.15.0 || >=26.0.0\"\n  },\n  \"scripts\": {\n    \"build\": \"python build.py\",\n    \"test\": \"node tests/run.cjs\",\n    \"package\": \"python package_source.py\"\n  }\n}\n", "tests/preview.cjs": "const assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst { JSDOM } = require('jsdom');\nconst content = require('../src/content.json');\nconst html = fs.readFileSync('dist/index.html','utf8');\nfunction open(mode,live=false) {\n  const dom = new JSDOM(html,{url:'https://xoaychieu.test/',runScripts:'dangerously',beforeParse(w){\n    w.setInterval=()=>0;w.scrollTo=()=>{};\n    Object.defineProperty(w,'localStorage',{value:{\n      getItem(){if(mode==='blocked')throw new w.DOMException('Storage denied','SecurityError');return mode==='corrupt'?'{':null;},\n      setItem(){throw new w.DOMException('Storage unavailable','QuotaExceededError');}\n    }});\n    if(live)w.google={script:{run:{}}};\n  }});\n  const w=dom.window,$=id=>w.document.getElementById(id);\n  $('code').value='ZZ01-A';$('school').value=content.truong_lop[0].truong;\n  $('school').dispatchEvent(new w.Event('change'));\n  $('class').value=content.truong_lop[0].lop[0];\n  return {dom,w,$};\n}\nfor(const mode of ['blocked','quota']) {\n  const {dom,w,$}=open(mode);\n  try {\n    $('loginStart').click();\n    assert($('login'),'No silent switch to temporary mode');\n    assert.match($('loginErr').textContent,/chặn lưu dữ liệu/);\n    assert(!$('previewFallback').classList.contains('hidden'));\n    assert.equal(w.eval('loadBroken'),false,'Storage access denied is distinct from corrupted data');\n    $('code').value='bad';\n    $('code').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));\n    assert.match($('loginErr').textContent,/Mã cần có dạng/);\n    $('code').value='ZZ01-A';\n    $('previewStart').click();\n    assert(w.document.querySelector('.cards'),'Explicit temporary preview enters the journey');\n    assert.match(w.document.querySelector('.preview-notice').textContent,/mất khi tải lại hoặc đóng trang/);\n    $('continueJourney').click();\n    const week=content.weeks[0];\n    for(const step of week.steps) {\n      for(const f of step.fields) {\n        if(f.kind==='rating') w.document.querySelector(`[data-field=\"${f.key}\"][value=\"2\"]`).click();\n        else {\n          const el=w.document.querySelector(`[data-field=\"${f.key}\"]`);\n          el.value=f.options?f.options[0]:'Mình thử một cách học mới và nhận ra điều cần thay đổi. '.repeat(5);\n          el.dispatchEvent(new w.Event('input',{bubbles:true}));\n        }\n      }\n      $('next').click();\n    }\n    assert.equal(w.eval('tab'),'notebook');\n    assert.match($('page').textContent,/Chỉ giữ tạm trong phiên xem thử/);\n    assert.equal(w.eval('person().history.length'),1);\n  } finally {dom.window.close();}\n}\nfor(const [mode,live] of [['blocked',true],['corrupt',false]]) {\n  const {dom,w,$}=open(mode,live);\n  try {\n    $('login').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));\n    assert($('previewFallback').classList.contains('hidden'));\n    $('previewStart').click();\n    assert($('login'));\n    assert.equal(w.eval('previewOnly'),false,'No temporary mode for LIVE or corrupt data');\n  } finally {dom.window.close();}\n}\nconsole.log('PASS preview: blocked reads/writes, explicit opt-in, complete week flow, accurate temporary labels, no LIVE/corrupt-data bypass');\n", "tests/fe.cjs": "const assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst { JSDOM } = require('jsdom');\nconst content = require('../src/content.json');\nfunction open(live) {\n  const dom = new JSDOM(fs.readFileSync('dist/index.html', 'utf8'), {url:'https://xoaychieu.test/',runScripts:'dangerously',beforeParse(w){\n    w.setInterval=()=>0;w.scrollTo=()=>{};w.confirm=()=>true;\n    if(live) w.google={script:{run:{}}};\n  }});\n  const w=dom.window;\n  w.fixture={ma:'ZZ01-A',truong:content.truong_lop[0].truong,lop:content.truong_lop[0].lop[0]};\n  w.eval('profile=fixture;person();tab=\"home\";render()');\n  return {dom,w,$:id=>w.document.getElementById(id)};\n}\nfor(const live of [false,true]) {\n  const {dom,w,$}=open(live);\n  try {\n    assert.match($('continueJourney').textContent,/Khám phá tuần 1/);\n    $('continueJourney').click();\n    assert.equal(w.document.querySelectorAll('.workflow-steps [aria-current=\"step\"]').length,1);\n    const stages=content.weeks[0].steps.map(s=>s.stage);\n    assert.equal(w.document.querySelectorAll('.workflow-steps li').length,new Set(stages).size);\n    $('brandHome').click();\n    assert.match($('continueJourney').textContent,/Viết tiếp tuần 1/);\n    assert.match(w.document.querySelector('.week-status.draft').textContent,/Đang viết/);\n    w.eval(`delete person().drafts[1];person().history=[{record:{tuan:1,id:'fixture-record-123456',thoi_gian:new Date().toISOString(),thoi_luong_giay:1,tu_danh_gia:2},sent:false}];render()`);\n    assert.match(w.document.querySelector('.week-status').textContent,live?/chờ gửi/:/lưu trên máy/);\n    assert(!w.document.querySelector('.week-status.sent'));\n    assert.match($('continueJourney').textContent,/Khám phá tuần 2/);\n    w.eval('person().history[0].sent=true;render()');\n    assert.match(w.document.querySelector('.week-status.sent').textContent,/Máy chủ đã xác nhận/);\n    assert(w.document.querySelector('.nav [aria-current=\"page\"][data-tab=\"home\"]'));\n    w.eval('person().history[0].record.tuan=4;person().history[0].record.ban_goc_id=\"original-record-123456\";go(\"notebook\")');\n    assert.match(w.document.querySelector('.tag').textContent,/BẢN 2/);\n    assert.match(w.document.querySelector('.revision-note').textContent,/Bài gốc được giữ nguyên/);\n  } finally {dom.window.close();}\n}\nconsole.log('PASS FE: resume CTA, stage indicator, local/pending/confirmed states, current navigation, revision provenance');\n", "tests/scope.cjs": "const assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst vm = require('node:vm');\nconst crypto = require('node:crypto');\nconst Core = require('../src/core.js');\nconst Safety = require('../src/safety.js');\nconst content = require('../src/content.json');\nconst { JSDOM } = require('jsdom');\nconst school = content.truong_lop[0].truong, klass = content.truong_lop[0].lop[0];\nconst records = [];\nconst cache = new Map();\nconst props = { SPREADSHEET_ID: 'test-sheet-only', TEACHER_PINS: JSON.stringify({ [school + '|' + klass]: '123456' }), COORDINATOR_PINS: JSON.stringify({ [school + '|' + klass]: '654321' }) };\nlet locked = false, c;\nconst context = {\n  Date, console,\n  PropertiesService: { getScriptProperties: () => ({ getProperty: key => props[key] }) },\n  CacheService: { getScriptCache: () => ({ get: key => cache.get(key) || null, put: (k,v) => cache.set(k,v), remove: k => cache.delete(k) }) },\n  LockService: { getScriptLock: () => ({ tryLock: () => locked = true, hasLock: () => locked, releaseLock: () => locked = false }) },\n  Utilities: { getUuid: () => crypto.randomUUID() },\n  Sheets: { Spreadsheets: { Values: { append: body => records.push(body.values[0]) } } },\n  SpreadsheetApp: { openById: () => ({ getSheetByName: () => ({\n    getLastRow: () => records.length + 1,\n    getRange: (start, column, count) => ({\n      getValues: () => start === 1 ? [vm.runInContext('HEADERS.chu_trinh', c)] : records.slice(start - 2, start - 2 + count),\n      createTextFinder: id => ({ matchEntireCell: () => ({ findNext: () => {\n        const index = records.findIndex(row => row[0] === id);\n        return index \u003c 0 ? null : { getRow: () => index + 2 };\n      } }) })\n    })\n  }) }) }\n};\nc = vm.createContext(context);\nvm.runInContext(fs.readFileSync('apps-script/Schema.gs','utf8') + '\\n' + fs.readFileSync('apps-script/Code.gs','utf8'),c);\nfunction call(name, payload) { c.input = payload; return vm.runInContext(`${name}(input)`, c); }\nfunction record(week) {\n  const answers = Object.fromEntries(week.steps.flatMap(s => s.fields).map(f => [f.key, f.kind === 'rating' ? 2 : f.options ? f.options[0] : 'Mình đã thử thay đổi cách học để hiểu bài rõ hơn. '.repeat(5)]));\n  // Bất kỳ ô văn bản nào cũng có thể chứa nội dung cần che, kể cả cột dẫn xuất.\n  week.steps.flatMap(s => s.fields).filter(f => f.kind !== 'rating' && !f.options).forEach(f => { answers[f.key] += ' Mình bị bắt nạt.'; });\n  return Core.record({ id: crypto.randomUUID(), started: new Date().toISOString(), activeMs: 1000, version: content.phien_ban, answers }, { ma: 'ZZ01-A', truong: school, lop: klass }, week);\n}\nfor (const week of content.weeks) {\n  const original = record(week), copy = JSON.stringify(original);\n  const safe = Core.safeRecord(original, content.an_toan);\n  assert.equal(JSON.stringify(original), copy, 'Local original stays intact');\n  assert(!JSON.stringify(safe).includes('bắt nạt'), 'No keyword-containing field reaches the wire');\n  assert.deepEqual(Core.safeRecord(safe, content.an_toan), safe, 'Redaction is repeatable');\n  c.record = safe;\n  vm.runInContext('valid_(record)', c);\n  const result = call('submitRecord', { record: original });\n  assert(result.ok, result.error);\n  assert(call('submitRecord', { record: original }).duplicate, 'Redacted retry does not create a new row');\n}\nassert.equal(records.length,4);\nassert(!JSON.stringify(records).includes('bắt nạt'), 'Server redacts even when client is bypassed');\nassert(Safety.matches('BI BAT NAT', content.an_toan), 'Unaccented uppercase keyword matches');\nassert(Safety.matches('bị\\u200b bắt\\n nạt', content.an_toan), 'Invisible characters and line breaks match');\nassert(!Safety.matches('Mình thích học theo nhóm', content.an_toan));\nassert.equal(Core.safeRecord({loai:'doi_y',vi_sao:'bị đánh',nhom:'Nhóm thử'},content.an_toan).vi_sao,Safety.hidden);\nassert.equal(Core.safeRecord({loai:'phieu_buoi',kho_khan:'bị đánh'},content.an_toan).kho_khan,Safety.hidden);\nconsole.log('PASS scope safety: four weeks, derived fields, immutable local text, server defense, retry deduplication, coordinator notes');\nconst login = input => call('loginTeacher', {truong:school,lop:klass,...input});\nassert(!login({pin:'wrong'}).ok);\nconst teacher = login({pin:'123456'}); assert(teacher.ok);\nconst coord = call('loginCoordinator',{truong:school,lop:klass,pin:'654321'}); assert(coord.ok);\nconst input = {truong:school,lop:klass,token:teacher.token};\nassert(!call('getClassProgress',{...input,token:coord.token}).ok, 'Coordinator cannot read class progress');\nassert(!call('getClassProgress',{...input,token:'invalid-token-1234567890'}).ok);\nassert(!call('getClassProgress',{...input,lop:content.truong_lop[0].lop[1]}).ok, 'No access to another class');\nconst headers = vm.runInContext('HEADERS.chu_trinh',c);\nconst other = [...records[0]]; other[headers.indexOf('lop')] = content.truong_lop[0].lop[1]; other[headers.indexOf('ma')] = 'ZZ99-C'; records.push(other);\nconst result = call('getClassProgress',input);\nassert(result.ok);\nassert.deepEqual(JSON.parse(JSON.stringify(result.students)),[{ma:'ZZ01-A',weeks:[1,2,3,4]}]);\nassert.deepEqual(Object.keys(result.students[0]).sort(), ['ma','weeks']);\nconst forbidden = { id:'coord-test-123456', loai:'doi_y',truong:school,lop:klass,tuan:3,thoi_gian:new Date().toISOString(),nhom:'Nhóm thử',doi_hay_giu:'doi',vi_sao:'Chúng mình nghe được một lý lẽ mới' };\nassert(!call('submitRecord',{record:forbidden,token:teacher.token}).ok, 'Teacher cannot submit coordinator forms');\nconst expiredSession = login({pin:'123456'});\nconst sessionKey = 'teacher:' + expiredSession.token;\ncache.set(sessionKey, JSON.stringify({truong:school,lop:klass,expires:Date.now()-1}));\nassert(!call('getClassProgress',{...input,token:expiredSession.token}).ok, 'Server rejects an expired session even if cached');\ncall('logoutTeacher',teacher.token);\nassert(!call('getClassProgress',input).ok,'Logged out teacher session is rejected');\nfor(let i=0;i\u003c8;i++) assert(!login({pin:'wrong'}).ok);\nassert(!login({pin:'123456'}).ok,'Throttling blocks repeated incorrect PIN attempts');\nconsole.log('PASS scope permissions: role separation, wrong class, filtered response, invalid/revoked sessions, PIN throttling');\nconst dom = new JSDOM(fs.readFileSync('dist/index.html','utf8'),{url:'https://xoaychieu.test/',runScripts:'dangerously',beforeParse(w){w.setInterval=()=>0;w.scrollTo=()=>{};}});\ntry {\n  dom.window.document.querySelector('[data-tab=\"teacher\"]').click();\n  assert(dom.window.document.querySelector('#teacherLogin'));\n  assert.equal(dom.window.document.querySelector('#teacherPin').disabled,true);\n  assert(dom.window.document.querySelector('.progress-table').textContent.includes('ZZ01-A'));\n  assert(!dom.window.localStorage.getItem('xoaychieu_v2'), 'Teacher demo stores no credential or student data');\n} finally {dom.window.close();}\nconsole.log('PASS scope teacher demo: accessible without student profile, fake data clearly labeled, no credentials stored');\n", "tests/test.cjs": "const assert = require('node:assert/strict'),\n  fs = require('node:fs'),\n  vm = require('node:vm'),\n  path = require('node:path');\nconst root = path.resolve(__dirname, '..'),\n  Core = require('../src/core.js'),\n  D = JSON.parse(fs.readFileSync(root + '/src/content.json'));\nlet passed = 0;\n\nfunction test(n, fn) {\n  fn();\n  passed++;\n  console.log('PASS', n);\n}\n\nfunction answers(w) {\n  return Object.fromEntries(w.st xt(\n    'start(1);current().answers=a;current().step=w.steps.length-1;localStorage.setItem=()=>{throw Error(\"quota\")};nextStep(w,w.steps[current().step],current());',\n    c);\n  assert.equal(vm.runInContext('person().history.length', c), 0);\n  assert.equal(vm.runInContext('db.queue.length', c), 0);\n  assert(vm.runInContext('!!current()', c));\n});\nconsole.log('\\n' + passed +\n  ' test groups passed. Browser visual QA and live Google deployment remain manual.');\n", "tests/queue.cjs": "const fs = require('node:fs'),\n  vm = require('node:vm'),\n  assert = require('node:assert/strict');\nconst Core = require('../src/core.js'),\n  CONTENT = require('../src/content.json');\nconst raw = fs.readFileSync(__dirname + '/../src/app.js', 'utf8').replace(\"render();if(loadBroken)\",\n  \"if(loadBroken)\");\n\nfunction harness() {\n  const mem = {},\n    elements = {};\n  let respond, attempts = 0, lastPayload;\n  const c = vm.createContext({\n    __XOAY_CHIEU_TEST__: true,\n    APP_CONFIG: {\n      storageKey: \"xoaychieu_v2\",\n      version: \"2.1.0\",\n      rpcTimeoutMs: 30000\n    },\n    Backup: require(\"../src/backup.js\"),\n    Core,\n    CONTENT,\n    Date,\n    JSON,\n    console,\n    Math,\n    setInterval() {},\n    setTimeout,\n    clearTimeout,\n    google: {\n      script: {\n        run: {}\n      }\n    },\n    navigator: {\n      onLine: false\n    },\n    localStorage: {\n      getItem: k => mem[k] || null,\n      setItem: (k, v) => mem[k] = v\n    },\n    window: {\n      addEventListener() {}\n    },\n    document: {\n      hidden: false,\n      addEventListener() {},\n      getElementById: k => elements[k] ||= {\n        textContent: '',\n        classList: {\n          add() {},\n          remove() {}\n        }\n      },\n      querySelectorAll: () => []\n    },\n    location: {\n      protocol: 'file:'\n    }\n  });\n  vm.runInContext(raw, c);\n  c.testRpc = (name, payload) => {\n    lastPayload = JSON.parse(JSON.stringify(payload));\n    atte false;\n  h.c.item = {\n    id: 'coord-id-123456',\n    loai: 'phieu_buoi'\n  };\n  vm.runInContext('enqueue(item)', h.c);\n  h.c.navigator.onLine = true;\n  const n = h.attempts;\n  await vm.runInContext('sync()', h.c);\n  assert.equal(h.attempts, n);\n  assert.equal(JSON.parse(h.mem.xoaychieu_v2).queue.length, 1);\n\n  // A Google cache token can expire before the local six-hour deadline.\n  const expired = harness();\n  expired.c.item = {\n    id: 'expired-coord-12345',\n    loai: 'phieu_buoi',\n    truong: 'Trường thử',\n    lop: '10A'\n  };\n  vm.runInContext(\n    'profile={truong:item.truong,lop:item.lop,ma:\"AB12-C\"};coordToken=\"token\";coordUntil=Date.now()+60000;enqueue(item)',\n    expired.c);\n  expired.c.navigator.onLine = true;\n  const expiredRequest = vm.runInContext('sync()', expired.c);\n  expired.respond.res({\n    ok: false,\n    code: 'AUTH_REQUIRED',\n    error: 'Phiên hết hạn'\n  });\n  await expiredRequest;\n  assert.equal(vm.runInContext('coordToken', expired.c), '');\n  assert.equal(JSON.parse(expired.mem.xoaychieu_v2).queue.length, 1);\n\n  // Periodic sync must not close expanded answers or a backup file picker.\n  const idle = harness();\n  idle.c.navigator.onLine = true;\n  vm.runInContext('var renderCount=0;render=()=>{renderCount++};tab=\"settings\";', idle.c);\n  await vm.runInContext('sync()', idle.c);\n  assert.equal(vm.runInContext('renderCount', idle.c), 0);\n  console.log(\n    'PASS offline queue, in-flight durability, concurrent-send guard, failed send, mismatched ACK, success ACK, coordinator reauthentication, token expiry, idle UI (9 cases)'\n  );\n})().catch(e => {\n  console.error(e);\n  process.exitCode = 1\n});\n", "tests/recovery.cjs": "const assert = require('node:assert/strict');\nconst fs = require('node:fs');\nconst vm = require('node:vm');\nconst Core = require('../src/core.js');\nconst Backup = require('../src/backup.js');\nconst CONTENT = require('../src/content.json');\nconst profile = {\n  ma: 'BI08-T',\n  tr
