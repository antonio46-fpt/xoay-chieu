  <script>
    const FILES = {"CONTRIBUTING.md": "# Quy ước đóng góp\n\n## Phạm vi\n\nFE gồm giao diện trong `src/app.js`, `src/style.css`, `src/shell.html`, cấu hình nội dung và các kiểm thử trình duyệt/DOM. Thay đổi logic BE trong `apps-script/Code.gs`, chính sách dùng chung hoặc schema phải có issue mô tả trước. `apps-script/Index.html` là HTML frontend được build; cập nhật tệp này không có nghĩa đã sửa logic máy chủ.\n\nKhông trộn thay đổi FE và triển khai BE trong một commit. Các thay đổi BE đã có ở commit trước không được tự ý xóa hoặc coi là đã xác minh với Google chỉ vì test mock đạt.\n\n## Commit\n\nDùng Conventional Commits: `\u003ctype>(\u003cscope>): \u003cmô tả ngắn>`.\n\n- Type: `feat`, `fix`, `refactor`, `test`, `docs`, `chore`.\n- Scope: `fe`, `be`, `build`, `repo`.\n- Ví dụ: `fix(fe): distinguish pending submissions from confirmed records`.\n- Body nêu lý do, hành vi thay đổi và cách kiểm tra khi cần.\n- Chỉ ghi `Closes #123` khi đã có issue thật và commit giải quyết đủ tiêu chí. Trạng thái đăng issue và URL thật được ghi tại `docs/issues/README.md`; không suy ra đã đăng chỉ từ việc có tệp Markdown.\n\n## Issue BE\n\nTiêu đề: `\u003ctype>(be): \u003ckết quả cần đạt>`. Dùng mẫu Backend task, có bối cảnh, hiện trạng, phạm vi, API/payload, tiêu chí nghiệm thu và cách kiểm thử. Dùng số issue thật khi liên kết phụ thuộc. Không tự gán nhãn chưa tồn tại hoặc người phụ trách chưa được thống nhất.\n\nMọi kiểm thử triển khai dùng Sheet thử và dữ liệu giả. Không ghi PIN/token/Sheet ID thật vào issue, source, log hay ảnh. GVCN chỉ được xem mã + tuần của đúng lớp; nghiên cứu/GV hướng dẫn xem dữ liệu qua quyền Google do chủ dự án quản lý. Không truy cập Sheet thật sau khi chạy chính thức.\n\n## Kiểm tra FE\n\nChạy `python build.py`, `npm test`, sau đó `python package_source.py`. Tệp đầu ra phải được cập nhật cùng source. Kiểm tra 360px ở sáng/tối, bàn phím và giảm chuyển động. Bài lưu cục bộ/chờ gửi/đã được xác nhận phải hiển thị khác nhau. Không xóa nháp hay đổi ID chỉ để làm test đạt.\n\n## Theo dõi issue BE\n\nXem [danh sách issue BE](docs/issues/README.md) để mở các issue đã đăng và nội dung tham chiếu. Chỉ đánh dấu đã đăng sau khi nhận được số và URL issue từ GitHub. Nếu API bị chặn, giữ nguyên bản nháp và báo đúng blocker.\n", "SCOPE.md": "# Phạm vi Xoay Chiều 2.8.0\n\nMục tiêu: giúp học sinh THPT rèn năng lực linh hoạt trong học tập qua trải nghiệm, phản tư và điều chỉnh. Chương trình có 4 tuần; danh sách đang mở gồm THPT Chuyên Chu Văn An (10A3 / 10 Tin, 11E1 / 11 Văn) và Trường PTDTNT THCS & THPT Lộc Bình (LB-11A). Giữ THPT Chi Lăng (12A2) trong nhóm lớp cũ. Lớp thứ tư mới chưa chốt giữa NT-10A6/NT-10A7. Số người dùng đồng thời chưa được kiểm chứng trên Google thật.\n\n| Yêu cầu bắt buộc | Thực hiện |\n|---|---|\n| Vào bằng mã + trường/lớp | Không hỏi họ tên, số điện thoại; không tải ảnh/âm thanh/video |\n| Đăng xuất | Lưu nháp rồi về nhập mã, bỏ hồ sơ đang chọn, giữ bài/hàng đợi; vào lại cùng mã/trường/lớp để tiếp tục |\n| Tuần 1–2 | Thử – Nghĩ – Nối – Chia sẻ, từng bước, gợi ý và câu hỏi đào sâu cấu hình trong JSON |\n| Tuần 3 | Tranh luận, đổi góc nhìn, giữ/đổi ý và ghi lý lẽ |\n| Tuần 4 | Chọn bài của mình, tạo bản 2 có `ban_goc_id`; không sửa bản gốc |\n| Nháp và mất mạng | Lưu trên trình duyệt, giữ hàng đợi; chỉ xóa khi ACK đúng ID; retry không sinh ID mới |\n| An toàn | Lời nhắn hỗ trợ; ô có từ khóa thay bằng `[đã ẩn – an toàn]` trước RPC; máy chủ áp dụng lại trước ghi RAW |\n| Sổ của mình | Chỉ lịch sử của bộ ba mã/trường/lớp hiện tại trên máy; không tải bài người khác |\n| Điều phối | Đồng hồ, vai, thẻ hỏi, phiếu buổi, phiếu đổi ý; PIN riêng theo lớp trên máy chủ |\n| Giáo viên chủ nhiệm | PIN giáo viên riêng; chỉ `ma` và các tuần được máy chủ xác nhận của đúng lớp |\n| Nghiên cứu và GV hướng dẫn | Xem/xuất dữ liệu Sheet qua quyền Google do chủ dự án cấp; không mở Sheet cho học sinh/GVCN chỉ cần tiến độ |\n| Điện thoại và nội dung | Bố cục 360px, sáng/tối, giảm chuyển động; nhiệm vụ/gợi ý/từ khóa/lớp nằm trong `src/content.json` |\n\n## Quy tắc dữ liệu\n\n- Bài đã nộp bất biến. “Làm lượt mới” tạo ID/dòng mới; retry vẫn cùng ID. Nhóm nghiên cứu phải chốt quy tắc chọn lượt để phân tích; app không tự chọn lượt cuối.\n- Ô không có từ khóa giữ nguyên văn. Ô có từ khóa che toàn bộ; cột dẫn xuất tuần 3–4 giữ cấu trúc nhưng không chứa lại phần nhạy cảm. Bộ lọc không thay thế người hỗ trợ và không tự gửi cảnh báo.\n- Bản gốc vẫn ở nháp/lịch sử trên thiết bị, có thể nằm trong bản sao cá nhân; cần giữ riêng. Dữ liệu cũ trên Sheet không tự được làm sạch bởi bản nâng cấp này.\n- GVCN không được cấp quyền Sheet nguồn nếu chỉ có quyền xem tiến độ. Bảng tiến độ chỉ bao gồm mã có bài đã được xác nhận, chưa có roster để liệt kê mọi mã chưa nộp.\n- Không thu điểm La bàn, không tự tính điểm năng lực, không dùng tiến độ hay mức tự đánh giá làm điểm nghiên cứu. Mã chỉ liên kết khảo sát Google Forms trước/sau; phân tích Sheets/SPSS do nhóm thực hiện.\n- Chỉ phát triển với Sheet thử/dữ liệu giả. Không truy cập Sheet thật sau khi chạy chính thức. Phiên phát triển này không truy cập bất kỳ Google Sheet nào.\n\n## Giai đoạn sau và điểm chờ chốt\n\n- Để sau: La bàn cá nhân chỉ trên máy, bản ghi `thanh_to`, chatbot kịch bản. Không có chatbot AI tạo sinh. Hình la bàn trang trí không phải công cụ chấm điểm.\n- Ngoài phạm vi: tuần 5–8, app Android/iOS riêng, phân tích nghiên cứu tự động.\n- Chưa chốt ngày bắt đầu/chạy thử/kết thúc: không tự gán 19/10 hoặc 19/11, không khóa nội dung theo ngày.\n- Chưa chốt hình thức trưng bày: app chỉ cho xem bài của mình; không công khai sản phẩm người khác. Cần quyết định riêng nếu muốn thư viện có sự đồng ý.\n- Trước khi dùng thật: cấu hình `TEACHER_PINS`, `COORDINATOR_PINS` trên Apps Script; xác minh quyền trên Sheet thử, thử thiết bị thật và đo tải gần quy mô dự kiến. Không coi test mô phỏng là bằng chứng Google deployment hoặc tải đồng thời đã đạt.\n\n## Kiểm tra\n\n`python build.py` → `npm test` → `python package_source.py`.\n\n`tests/scope.cjs` kiểm tra che nội dung cả bốn tuần và cột dẫn xuất, giữ nguyên bản cục bộ, chống trùng, phân tách quyền điều phối/giáo viên, ngăn xem sang lớp khác, thu hồi phiên, giới hạn thử PIN và bản demo chỉ dùng dữ liệu giả. Các test sẵn có kiểm tra quy trình bốn tuần, hàng đợi, khôi phục và DOM.\n\nĐã kiểm tra phiên bản này bằng Chromium thật ở viewport 360×800: đăng nhập học sinh, bốn tuần, lời nhắn an toàn, sáng/tối, điều phối, cài đặt và demo tiến độ không tràn chiều ngang. Đăng nhập PIN sai/đúng, hết phiên và đăng xuất giáo viên đã được kiểm tra trong trình duyệt với RPC giả. Không có truy cập Sheet thật, đo tải 150 người đồng thời hoặc thử thiết bị điện thoại vật lý.\n\n\n## Chốt kỹ thuật theo góp ý Backend\n\nTheo dõi thứ tự #3 → #2 → #4 → #1 và hai issue bổ sung tại [danh sách issue](docs/issues/README.md). Roster chưa lập trình vì cần quyết định tự nguyện/đồng thuận. Bảng mã–họ tên phải ở ngoài hệ thống. Người phụ trách, hạn và lịch chưa được tự gán. Các sửa mã 2.3.0 đã có test cục bộ; deployment Google, tải thật và điện thoại vật lý vẫn cần thực hiện theo checklist.\n\n## Tài khoản được cấp và tiến độ (2.5.0)\n\nBản thật xác thực mã học sinh có sẵn + PIN riêng theo trường/lớp; cấp/đặt lại từ editor bởi chủ dự án. Sheet lưu hash PIN, bài đã xử lý an toàn và tiến độ tuần do máy chủ tổng hợp. Không lưu PIN rõ hoặc điểm La bàn lên Sheet. Tiến độ hoàn thành tải được trên thiết bị mới; bản gốc trước khi che vẫn cục bộ/bản sao; từ 2.7 nháp/bài an toàn đã đồng bộ được khôi phục từ Sheet. Quyền GVCN chỉ xem mã đã nộp + tuần của đúng lớp giữ nguyên; roster chưa nộp ở #1 vẫn chờ quyết định. Triển khai Google thật cần nghiệm thu trên Sheet thử; môi trường phát triển không truy cập Sheet chứa dữ liệu thật.\n\n## Cập nhật danh sách và tiến trình (2.7.0)\n\nTheo xác nhận mới: mở 10A3 (10 Tin), 11E1 (11 Văn), LB-11A (11A Lộc Bình); giữ Chi Lăng / 12A2 để truy cập dữ liệu cũ, không đổi danh tính. NT-10A6/NT-10A7 chờ bốc thăm, chưa kích hoạt cả hai. Bản này lưu/khôi phục nháp và bước đang làm của chính học sinh trên Sheet, có xử lý an toàn; Sổ trả lại bài đã nộp riêng để tuần sau/tuần 4 tiếp tục. Quyền giáo viên không mở rộng sang nội dung bài/nháp. Nháp không tính là bài hoàn thành hoặc điểm nghiên cứu.\n\n## Quản lý Sheet và chu kỳ phút (2.8.0)\n\nNháp thay đổi được kiểm tra/gửi mỗi 60 giây khi trang đang mở và đã xác thực; checkpoint nộp/thoát vẫn lưu ngay. Chủ dự án có bảng tổng quan tài khoản và chi tiết câu trả lời an toàn theo tuần trong Sheet riêng được cấp quyền. Phần trăm chỉ là tuần đã nộp/ô đã điền, không phải điểm năng lực, không gửi điểm La bàn và không đổi quyền đọc nháp của GVCN.\n", "README.md": "# Xoay Chiều — mã nguồn đầy đủ 2.8.0\n\nCông cụ hoạt động và thu dữ liệu cho đề tài “Phát triển năng lực linh hoạt trong học tập của học sinh THPT tại Lạng Sơn”. Phạm vi bản bắt buộc: 3 lớp đang triển khai theo danh sách mới, giữ lớp Chi Lăng cũ; lớp thứ tư chờ chốt, 4 tuần can thiệp. Lịch triển khai và kết thúc chưa chốt. Không chấm đúng/sai, không xếp hạng, không tự suy ra điểm năng lực.\n\nXem [SCOPE.md](SCOPE.md) để đối chiếu yêu cầu, quyền dữ liệu và những điểm còn chờ chốt.\n\n## Dùng bộ mã nguồn\n\n- Mở `dist/index.html` để xem thử. Bản này và bản Sites lưu trên máy, **chưa gửi Google Sheets**.\n- Để triển khai nhận dữ liệu thật, theo `HUONG_DAN_TRIEN_KHAI.md`; dùng các tệp đã ghép trong `apps-script/`.\n- Để đọc và sửa code, theo `MA_NGUON_CHI_TIET.md`. Mở `dist/ma-nguon.html` để xem từng tệp, sao chép hoặc tải về.\n- Nội dung bốn tuần nằm riêng tại `src/content.json`. Không cần sửa logic để thay thư/câu hỏi/ngưỡng độ dài.\n- Các sản phẩm là văn bản hoặc phần mô tả sản phẩm. Bản này không tải ảnh, âm thanh hoặc video lên Drive.\n\n## Chức năng đã lập trình\n\n| Phần | Hành vi |\n|---|---|\n| Vào app | Mã dạng AB12-C, chọn trường/lớp, không hỏi họ tên |\n| Tuần 1–2 | Mỗi tuần khoảng 15 phút; thư, Thử, từng câu Nghĩ, Nối, sản phẩm, Chia sẻ, tự đánh giá |\n| Tuần 3 | Khoảng 45 phút; tranh luận, đổi góc nhìn, ghi lý lẽ và đổi/giữ ý |\n| Tuần 4 | Khoảng 45 phút; chọn sản phẩm cũ trên máy, sửa bản mới và giữ nguyên bản gốc |\n| Kiểm tra | Bắt buộc trả lời, độ dài tối thiểu/tối đa, lựa chọn hợp lệ; mức 1–3 do học sinh tự chọn |\n| Lưu nháp | Lưu khi nhập, chuyển bước và ẩn trang; tiếp tục sau khi mở lại |\n| Chờ gửi | Lưu gói vào máy trước; mất mạng vẫn giữ gói; tự thử lại với cùng ID |\n| Chống trùng | Máy chủ khóa thao tác tìm ID và ghi; ID cũ + nội dung cũ chỉ xác nhận lại |\n| Làm lại | Học sinh chủ động tạo lượt mới → ID mới, dòng mới, không sửa bài đã nộp |\n| Khôi phục | Bản sao toàn bộ giữ bài chờ gửi; tạm dừng đến khi bấm Thử gửi lại |\n| Giáo viên chủ nhiệm | PIN riêng theo lớp; chỉ xem mã và tuần đã nộp, không đọc bài hay mức tự đánh giá |\n| Điều phối | PIN theo lớp, đồng hồ chặng, thẻ hỏi/vai, phiếu buổi, ý kiến nhóm tuần 3 |\n| Giao diện | Điện thoại, chàm–kem, họa tiết thổ cẩm bằng CSS, sáng/tối |\n\n## Cấu trúc tệp\n\n| Tệp | Trách nhiệm |\n|---|---|\n| `src/content.json` | Toàn bộ thư, hoạt động, trường/lớp và định nghĩa ô nhập |\n| `src/config.js` | Phiên bản, thời gian chờ RPC, nhịp gửi lại, khóa bộ nhớ |\n| `src/core.js` | Kiểm tra đầu vào, giữ nguyên văn, tạo ID/bản ghi, thời gian gửi lại |\n| `src/safety.js` | Chính sách che nội dung dùng chung cho trình duyệt và máy chủ |\n| `src/backup.js` | Kiểm tra và khôi phục bản sao an toàn |\n| `src/app.js` | Điều hướng, màn hình, nháp, hàng đợi, giao tiếp máy chủ |\n| `src/style.css`, `src/shell.html` | CSS và khung HTML |\n| `apps-script/Code.gs` | Máy chủ kiểm tra dữ liệu, xác thực điều phối, ghi Sheet RAW |\n| `apps-script/Management.gs` | Hai bảng quản lý tự tính từ nguồn, không xuất PIN/hash/token |\n| `apps-script/Learning.gs` | Nháp theo tuần, khôi phục Sổ riêng và chống ghi đè giữa thiết bị |\n| `apps-script/Accounts.gs` | Cấp PIN riêng, xác thực học sinh, tổng hợp tiến độ trên Sheet |\n| `apps-script/Schema.gs` | Schema kiểm tra tự sinh từ JSON; không sửa tay |\n| `apps-script/Index.html` | App đã ghép để dán vào HTML Service |\n| `apps-script/appsscript.json` | Manifest V8 và dịch vụ Google Sheets v4 |\n| `build.py` | Tạo HTML, schema và cache từ mã nguồn |\n| `package_source.py` | Tạo trang đọc mã và ZIP bàn giao |\n| `tests/` | Kiểm thử logic, máy chủ giả lập, hàng đợi, khôi phục và DOM |\n\n## Build và kiểm thử\n\nPython 3 dùng để build. App không dùng framework, CDN, khóa AI hay thư viện JavaScript bên ngoài. Node.js và jsdom **chỉ phục vụ kiểm thử**, không được ghép vào app.\n\n```bash\npython build.py\nnpm ci --ignore-scripts\nnpm test\npython package_source.py\n```\n\nTrên Windows có thể thay `python` bằng `py`. Bản build sẵn đã có trong ZIP, nên không cần cài các công cụ trên chỉ để triển khai Apps Script.\n\nNếu chỉ kiểm thử các phần không phụ thuộc thư viện DOM:\n\n```bash\nnode tests/test.cjs\nnode tests/queue.cjs\nnode tests/recovery.cjs\n```\n\nCác kiểm thử tự động không thay cho thử trên điện thoại, Google Sheet thật và tải nộp của 150 học sinh dự kiến. Phạm vi chính xác ở `DU_LIEU_VA_TAP_HUAN.md`.\n\n## Những điểm vận hành cần biết\n\nBản HTML tĩnh không thể dùng `google.script.run`; bản dùng thật phải được phục vụ từ Apps Script bằng URL `/exec`. App nhận biết môi trường và hiển thị trạng thái rõ ràng. Không có tình huống dùng `no-cors` rồi báo thành công khi chưa biết máy chủ đã ghi hay chưa.\n\nMỗi hồ sơ được tách bằng bộ ba trường/lớp/mã. Mã là mã giả danh, không phải mật khẩu. Bản ghi ứng dụng không chứa họ tên, email hay thông tin thiết bị. Các đoạn học sinh viết vẫn có thể chứa thông tin nhận diện nếu tự nhập; lời nhắc trên app yêu cầu tránh điều đó. Sheet cần để quyền Hạn chế, chỉ cấp cho nhóm nghiên cứu.\n\nĐăng nhập đúng tài khoản để khôi phục nháp đã đồng bộ, bước đang làm và bài cũ từ Sheet. Bản gốc trước khi che và phần chưa được xác nhận đồng bộ vẫn cần thiết bị đã viết hoặc bản sao riêng. Tuần 4 có thể chọn sản phẩm cũ đã được khôi phục. Trên máy chung, người có quyền vào trình duyệt có thể truy cập dữ liệu cục bộ. Phát hiện tab khác ghi dữ liệu sẽ tạm dừng lưu tab này, cho tải bản sao rồi mở lại; đây không phải cơ chế làm việc đồng thời nhiều tab.\n\nKhi trang đã tải, mất mạng vẫn có thể làm và lưu bài. Bản tĩnh HTTPS có cache sau lần mở online. Apps Script không bảo đảm tải mới/tải lại trang khi hoàn toàn offline. Không xóa dữ liệu trình duyệt trong lúc còn bài chờ. Bản sao nhập lại giữ nguyên ID và tạm dừng gửi; chỉ khôi phục trên trình duyệt chưa có dữ liệu.\n\nThời gian hoạt động chỉ tính khi màn hình làm bài hiển thị; thời gian trôi được lưu riêng. Hai số này không đo mức tập trung. Đồng hồ là gợi ý, không tự đóng bài. Tổng thời lượng chặng là 15/45 phút; tự đánh giá được làm theo nhịp lớp.\n\nTất cả tuần đang mở để thử/làm bù. Website không tự ngừng sau tám tuần; chủ dự án chủ động kết thúc triển khai theo lịch. Danh sách trường/lớp và nội dung hiện là bản cấu hình để duyệt, chưa phải xác nhận đã tuyển đủ số mã dự kiến. App không có danh sách mã được cấp riêng; nó kiểm tra định dạng mã và lớp hợp lệ.\n\nNội dung thư/gợi ý có phần AI hỗ trợ soạn từ các yêu cầu đã trao đổi. Nhóm nghiên cứu cần duyệt, chốt phiên bản và ghi nhận phần hỗ trợ trước can thiệp. Bộ app không tự chứng minh hiệu quả nghiên cứu; khảo sát trước/sau và phân tích do nhóm thực hiện.\n\nLời nhắn hỗ trợ dựa trên từ khóa là lời nhắc tìm người hỗ trợ, không chẩn đoán hay tự thông báo người khác. Trước khi gửi, toàn bộ ô văn bản có từ khóa được thay bằng `[đã ẩn – an toàn]`; bản gốc giữ riêng trên máy và trong bản sao cá nhân. Máy chủ kiểm tra và che lại trước khi ghi Sheet. Bộ lọc theo từ khóa không bảo đảm phát hiện mọi tình huống.\n\n\nNếu trình xem HTML chặn bộ nhớ, nút Bắt đầu hiển thị lỗi ngay trong biểu mẫu. Bản demo có lựa chọn **Xem thử không lưu** sau khi phát hiện lỗi lưu: cần chọn chủ động, bài chỉ ở phiên hiện tại, đóng/tải lại sẽ mất và không gửi Sheet. Bản Apps Script thật không cho bỏ qua yêu cầu lưu. Tải HTML về và mở trong Chrome/Edge cho phép lưu dữ liệu để thử lưu nháp lâu dài.\n\n\n## Rà Backend theo góp ý chốt\n\nBản 2.3.0 chuyển đường đọc/ghi chống trùng sang cùng Sheets API, kiểm tra kích thước cả cột dẫn xuất và cho nhập lại PIN điều phối ngay trên phiếu khi cache mất. Xem [đối chiếu góp ý](docs/BACKEND_REVIEW.md), [issue thật](docs/issues/README.md), [checklist cấu hình](docs/DEPLOYMENT_CHECKLIST.md), [kế hoạch tải](docs/LOAD_TEST_PLAN.md) và [hướng dẫn học sinh](docs/HUONG_DAN_HOC_SINH.md). Không coi kiểm thử mô phỏng là xác nhận đạt tải hoặc đã triển khai Google.\n\n\n## Đăng xuất (2.4.0)\n\nSau khi vào bằng mã, nút **Đăng xuất** xuất hiện trên thanh phiên ở cả máy tính và điện thoại. App thu lại nội dung đang nhập, lưu nháp và bỏ hồ sơ đang chọn trước khi về màn hình nhập mã. Nháp, lịch sử và hàng đợi không bị xóa; dùng lại đúng mã/trường/lớp để tiếp tục. Nếu không lưu được, app giữ màn hình để người dùng tải bản sao thay vì âm thầm mất bài.\n\nĐăng xuất chung xóa token điều phối/giáo viên trong trình duyệt và yêu cầu máy chủ thu hồi token khi kết nối cho phép. Mất mạng hoặc deployment cũ có thể khiến việc thu hồi chưa được xác nhận; token máy chủ còn hạn vẫn tuân theo thời gian hết phiên. Đây không phải mật khẩu bảo vệ dữ liệu cục bộ: người có quyền dùng trình duyệt và biết mã vẫn có thể vào hồ sơ trên máy. Với Xem thử không lưu, dữ liệu chỉ còn đến khi đóng/tải lại trang.\n\n## Tài khoản học sinh (2.5.0)\n\nBản Apps Script đăng nhập bằng mã có sẵn + mật khẩu riêng được cấp (giữ PIN cũ), kiểm tra đúng trường/lớp trước khi nhận bài; Sheet lưu bài đã che an toàn và bảng tiến độ bốn tuần. Đăng xuất giữ nháp/hàng đợi; đăng nhập trên máy mới tải tiến độ, Sổ khôi phục bài đã xử lý an toàn; bản gốc trước khi che vẫn trên thiết bị cũ/bản sao. Xem [cấp tài khoản và triển khai](docs/TAI_KHOAN_HOC_SINH.md), [issue #8](https://github.com/antonio46-fpt/xoay-chieu/issues/8). Chưa triển khai hay kiểm thử vào Sheet thật.\n\n## Mật khẩu theo danh sách Excel (2.6.0)\n\nCấu hình lớp được cập nhật theo đợt triển khai (xem mục 2.7 bên dưới); không chứa mã học sinh thật trong source. [Công cụ xuất CSV riêng](tools/import_student_roster.py) chỉ lấy mã/trường/lớp. Chủ dự án nhập CSV qua `importStudentRoster_`, cấp mật khẩu riêng bằng `provisionStudentAccounts_` và tải bảng tài khoản/mật khẩu trong hộp thoại Sheet. Máy chủ xác thực trước khi FE vào học, giữ tương thích PIN cũ; bản HTML ghi rõ demo. Xem [hướng dẫn](docs/TAI_KHOAN_HOC_SINH.md), [issue #9](https://github.com/antonio46-fpt/xoay-chieu/issues/9).\n\n## Tiến trình qua các tuần (2.7.0)\n\n[Hướng dẫn lưu/khôi phục tiến trình](docs/TIEN_TRINH_HOC_TAP.md): nháp và bài cũ của chính tài khoản được tải từ Sheet, tiếp tục đúng bước khi vào tuần sau; đồng bộ có revision để tránh thiết bị cũ ghi đè. Cập nhật thêm **Learning.gs** và chạy setup_ trước New version. Giữ tài khoản/tiến trình Chi Lăng cũ, thêm Lộc Bình; chưa kích hoạt NT-10A6/NT-10A7 khi chưa bốc thăm. [Issue #10](https://github.com/antonio46-fpt/xoay-chieu/issues/10).\n\n## Mã lớp 2.7.1\n\nGiá trị dữ liệu dùng 10A3, 11E1, LB-11A; chú thích chỉ hiển thị. Giữ tương thích tài khoản, mật khẩu, bài và nháp cũ. Cập nhật đồng bộ đủ 5 tệp Apps Script rồi New version, không đổi hàng loạt Sheet gốc. Xem [mã lớp và nâng cấp](docs/MA_LOP.md).\n\n## Quản lý trên Sheet và đồng bộ 1 phút (2.8.0)\n\nThêm Management.gs, cập nhật đủ sáu tệp Apps Script và chạy setup_ hoặc setupManagement_, rồi New version. Hai trang quan_ly_hoc_sinh và quan_ly_hoc_tap tự hiện tiến độ và câu trả lời an toàn của từng tài khoản. Nháp tự gửi mỗi 60 giây khi có thay đổi; checkpoint nộp/thoát vẫn lưu ngay. Xem [hướng dẫn quản lý Sheet](docs/QUAN_LY_SHEET.md).\n", "MA_NGUON_CHI_TIET.md": "# Hướng dẫn đọc và sửa mã nguồn Xoay Chiều 2.8.0\n\n## 1. Kiến trúc và nơi dữ liệu đi qua\n\nFrontend là HTML/CSS/JavaScript thuần. `build.py` ghép cấu hình, nội dung và logic thành một HTML đầy đủ. `dist/index.html` là bản xem thử độc lập; `apps-script/Index.html` có cùng nội dung nhưng khi được Google Apps Script phục vụ sẽ có cầu nối `google.script.run`.\n\nBackend gồm `Code.gs`, `Schema.gs`, `Accounts.gs` và `Learning.gs`. `Accounts.gs` quản lý mã/PIN học sinh, phiên và tiến độ đã nộp; hướng dẫn tại [tài khoản](docs/TAI_KHOAN_HOC_SINH.md). `doGet()` trả giao diện. `submitRecord()` nhận bản ghi, kiểm tra lại và ghi vào Sheet. `loginCoordinator()` cấp phiên điều phối theo trường/lớp. Các hàm tên kết thúc `_` là hàm nội bộ, không gọi được từ `google.script.run`.\n\nKhông đặt Sheet ID hoặc PIN vào frontend. `setup_()` lưu Sheet ID vào Script Properties. PIN được chủ dự án cấu hình ở thuộc tính `COORDINATOR_PINS`.\n\n| Thành phần | Lưu ở đâu | Khi nào thay đổi |\n|---|---|---|\n| Thư/câu hỏi/trường/lớp | `src/content.json` → HTML + Schema.gs | Người quản lý sửa và build lại |\n| Nháp đang viết | `localStorage.xoaychieu_v2` | Khi nhập, chuyển bước, ẩn trang |\n| Bài chờ gửi | `db.queue` trong cùng localStorage | Khi nộp, thất bại hoặc được xác nhận |\n| Bài đã nộp trên máy | `db.profiles[key].history` | Khi nộp; khi máy chủ xác nhận |\n| Dữ liệu nghiên cứu trung tâm | Google Sheets của chủ dự án | Chỉ khi backend ghi thành công |\n| Phiên điều phối | RAM của tab + Google Script Cache | Đăng nhập, hết hạn hoặc đóng trang |\n\n## 2. Nội dung bốn tuần bằng JSON\n\nMỗi phần tử `weeks` có `tuan`, `duration`, `quy_trinh`, `letter`, `steps`. Một `step` là một màn hình, có `stage`, `minutes`, `title`, `body`, `hints`, `fields`. Ba câu Nghĩ được đặt thành ba màn hình, nhưng cùng `stage` nên dùng chung thời lượng chặng.\n\nVí dụ cấu trúc một trường:\n\n```json\n{\n  \"key\": \"nghi_1\",\n  \"label\": \"Điều gì khiến bạn nghĩ cách này phù hợp?\",\n  \"kind\": \"text\",\n  \"min\": 5,\n  \"max\": 6000\n}\n```\n\n`key` là tên cột dữ liệu. `label` là câu học sinh đọc. `min` là số đơn vị ngăn bằng khoảng trắng, không phải phân tích từ vựng tiếng Việt. `max` là giới hạn ký tự JavaScript. Ô không bị cắt ngầm khi vượt giới hạn: app báo để học sinh tự chỉnh.\n\n- Có `options`: tạo ô chọn; chỉ nhận một giá trị trong danh sách.\n- `kind: \"rating\"`: tạo ba mức; không chọn sẵn mức nào.\n- Còn lại: tạo textarea, đếm độ dài khi nhập.\n- `hints`: gợi ý mở từng ý khi học sinh chủ động bấm.\n\nĐổi chữ câu hỏi, lá thư hoặc ngưỡng độ dài chỉ cần sửa JSON rồi build. Nếu thêm khóa câu trả lời mới, còn phải cập nhật `Core.record()` và `HEADERS.chu_trinh`; không tự thêm cột giữa đợt nghiên cứu. Danh sách ngưỡng và lựa chọn được tự sinh sang backend, tránh frontend cho qua mà backend từ chối vì quy tắc khác nhau.\n\n## 3. Trạng thái và các hàm frontend\n\n| Hàm / biến | Công việc |\n|---|---|\n| `db`, `person()` | Truy cập hồ sơ hiện tại, nháp, lịch sử và hàng đợi |\n| `persist()` | Ghi toàn bộ db; kiểm tra tab khác đã thay đổi; trả false nếu không lưu được |\n| `login()` | Chuẩn hóa mã, kiểm tra trường/lớp rồi chọn hồ sơ |\n| `render()`, `go()` | Dựng màn hình và chuyển trang, lưu nháp trước khi rời |\n| `start(tuan)` | Mở nháp cũ hoặc tạo lượt mới bằng ID mới |\n| `work()`, `fieldHTML()` | Dựng từng bước; gán textarea.value sau dựng để giữ dòng trống đầu |\n| `collect()`, `flushDraft()` | Đọc giá trị ô nhập về bộ nhớ rồi ghi localStorage |\n| `nextStep()` | Kiểm tra màn hình hiện tại; kiểm tra cả tuần trước khi nộp |\n| `Core.record()` | Chốt gói gửi từ nháp và thông tin hồ sơ |\n| `sync()` | Gửi tuần tự, kiểm tra ACK đúng ID, giữ gói khi lỗi |\n| `oldProductHTML()` | Liệt kê sản phẩm tuần 1–3 đang có trên máy |\n| `Backup.restore()` | Kiểm tra cấu trúc bản sao, giữ gói chờ ở trạng thái tạm dừng |\n| `coord()`, `bindCoordinatorDrafts()` | Điều phối và lưu nháp phiếu buổi/ý kiến nhóm |\n| `boot()` | Đăng ký sự kiện mở lại mạng, ẩn trang, thay đổi bộ nhớ và chu kỳ gửi |\n\nBộ ba trường/lớp/mã được JSON.stringify thành khóa. Hai lớp dùng cùng một mã sẽ không trộn hồ sơ. Khi đổi mã, dữ liệu cũ vẫn còn trên máy. App không dùng cookie đăng nhập hay mật khẩu cho học sinh.\n\n## 4. Lưu nháp, nộp và chống mất dữ liệu\n\nMột nháp có `id`, `version`, `step`, `answers`, `started`, `activeMs`, `stageTimes`, `hints`; tuần 4 có thêm `sourceId` khi chọn sản phẩm cũ.\n\nKhi bấm nộp ở bước cuối:\n\n1. Thu giá trị trên màn hình và kiểm tra tất cả trường của tuần.\n2. Tạo một bản ghi với ID đã cấp từ lúc mở nháp.\n3. Thêm cùng gói đó vào lịch sử và hàng đợi, xóa nháp trong RAM.\n4. Ghi localStorage. Nếu ghi thất bại, hoàn tác bước 3 và giữ nháp.\n5. Chuyển sang sổ bài, hiển thị chờ gửi rồi gọi mạng.\n6. Chỉ khi nhận `{ok: true, id: đúng_ID}` mới xóa gói khỏi hàng đợi.\n\nTimeout không chứng minh máy chủ chưa ghi. Vì vậy lần thử lại luôn giữ nguyên ID, thời điểm nộp và toàn bộ nội dung. Nếu máy chủ đã ghi nhưng phản hồi bị mất, lần gửi sau chỉ xác nhận lại dòng cũ.\n\nTự kiểm tra hàng đợi mỗi 5 giây, đồng thời mỗi gói có thời điểm được thử lại riêng. Sau lỗi, khoảng chờ tăng dần từ khoảng 5 giây tới 2 phút, cộng dao động ngẫu nhiên nhỏ. Điều này giảm việc nhiều máy thử lại cùng lúc. Bấm “Thử gửi lại” chủ động bỏ thời gian chờ.\n\nLỗi dữ liệu không hợp lệ hoặc ID xung đột tạm dừng gói; gói vẫn được giữ để xuất bản sao và kiểm tra. Phiếu điều phối chỉ được gửi khi đang chọn đúng trường/lớp và còn phiên hợp lệ. Phiên hết sớm ở Google Cache thì app yêu cầu đăng nhập lại.\n\n`storage` event và snapshot giúp phát hiện tab khác sửa db. Tab xung đột dừng lưu, cho xuất bản sao trước khi tải lại. Không dùng cơ chế này để cho nhiều tab cùng làm một bài; vẫn vận hành một tab cho một thiết bị.\n\n## 5. Máy chủ ghi Sheet như thế nào\n\n`setup_()` chỉ chạy trong Apps Script editor. Nó kiểm tra Sheets API, tạo ba sheet/header nếu còn trống, sau đó lưu `SPREADSHEET_ID`. Không âm thầm ghi đè header khác.\n\n`submitRecord({record, token})` thực hiện:\n\n1. Kiểm tra loại bản ghi, ID, tuần, trường/lớp, kiểu dữ liệu và kích thước.\n2. Với bài học sinh, kiểm tra toàn bộ trường theo SCHEMA, mã và tự đánh giá.\n3. Với phiếu điều phối, kiểm tra token đúng lớp trước khi chạm dữ liệu Sheet.\n4. Xin Script Lock với khoảng chờ ngắn; nếu bận thì trả `BUSY`, để client thử lại.\n5. Tìm ID bằng khớp cả ô. Nếu có, so toàn bộ dữ liệu trừ thời gian máy chủ nhận.\n6. Cùng ID + cùng nội dung → ACK lại. Cùng ID + khác nội dung → `ID_CONFLICT`.\n7. Chưa có ID → append một dòng với `valueInputOption: 'RAW'` rồi trả ACK.\n8. Luôn nhả lock trong `finally`.\n\nĐoạn ghi chính:\n\n```javascript\nSheets.Spreadsheets.Values.append(\n  { values: [row] },\n  spreadsheetId,\n  \"'\" + data.loai + \"'!A1\",\n  { valueInputOption: 'RAW', insertDataOption: 'INSERT_ROWS' }\n);\n```\n\nRAW giúp chuỗi học sinh nhập được lưu như chuỗi, kể cả khi bắt đầu bằng `=`. Code không sửa chính tả, trim, chấm điểm, tóm tắt hoặc gọi AI để xử lý bài. `trim()` chỉ xuất hiện trong bước kiểm tra độ dài, không thay giá trị đem lưu.\n\nTiền tố tuần 3 được ghép vào các cột theo quy ước hiện tại: `Phe A: ` / `Phe B: ` trong `nghi_1`, `Đổi ý: ` / `Giữ ý: ` trong `chia_se`; phần học sinh viết giữ nguyên sau tiền tố. Hai lựa chọn cũng được lưu riêng. Tuần 4 giữ riêng `kiem_soat`, `ngoai_kiem_soat` và ghép bản đọc chung vào `thu_lam`. Chi tiết mapping ở `DU_LIEU_VA_TAP_HUAN.md`.\n\nCác mã lỗi có chủ đích: `INVALID_RECORD`, `ID_CONFLICT`, `BUSY`, `SETUP_REQUIRED`, `AUTH_REQUIRED`, `SERVER_ERROR`. Lỗi không xóa bài chờ trên máy. Không có API công khai đọc danh sách câu trả lời từ Sheet.\n\n## 6. Sửa sản phẩm ở tuần 4\n\nNút “Dùng làm bản gốc” sao chép chuỗi sản phẩm từ một bản ghi cũ vào nháp tuần 4. Nó lưu ID cũ ở `sourceId`; khi nộp, chuyển thành `ban_goc_id`. Sau đó học sinh chỉnh bản sao. Bản ghi cũ trong lịch sử và Sheet không bị thay đổi. Bài tuần 4 có ID riêng.\n\nNếu đổi thiết bị, không có chức năng tra bài chỉ bằng mã vì mã không phải cơ chế xác thực. Dùng bản sao toàn bộ trên máy mới đáng tin hoặc nhập lại sản phẩm giấy; trường hợp nhập lại, `ban_goc_id` để trống.\n\n## 7. Bản sao và kiểm thử\n\nBản sao toàn bộ gồm profiles, queue, theme và hồ sơ đang chọn. `Backup.restore()` từ chối khóa prototype nguy hiểm, hồ sơ sai, ID lặp trong hàng đợi và bản nháp sai cấu trúc. Các gói pending được giữ đúng ID/nội dung nhưng chuyển `paused: true` để người quản lý chủ động gửi lại. Không ghép tự động bản sao vào máy đã có dữ liệu vì dễ ghi đè bài.\n\n| Tệp kiểm thử | Rủi ro được kiểm tra |\n|---|---|\n| `test.cjs` | Cấu hình tuần, kiểm tra đầu vào, raw text, mapping, máy chủ RAW/ID/PIN, lỗi bộ nhớ |\n| `queue.cjs` | Offline, gói tồn tại lúc đang gửi, không gửi chồng, ACK sai, retry, hết phiên |\n| `recovery.cjs` | Khôi phục giữ gói, không tự gửi, chống ID lặp, phát hiện tab khác |\n| `ui.cjs` | DOM bốn tuần, bắt buộc chọn mức, trở lại/reload nháp, dòng trống, escape HTML, sửa bản 2 |\n\nGoogle services trong test được mô phỏng. jsdom chạy DOM trong Node, không dựng giao diện điện thoại, không phải trình duyệt thật. Chưa có kiểm tra trên tài khoản Google thật hay đo 150 thiết bị đồng thời. Dùng hướng dẫn triển khai để hoàn tất hai bước này trước buổi thực nghiệm.\n\n## 8. Những thay đổi thường gặp\n\n| Muốn sửa | Sửa ở đâu |\n|---|---|\n| Thêm trường/lớp | `content.json → truong_lop`; build lại cả Index và Schema |\n| Đổi lá thư/câu hỏi | `content.json → weeks`; tăng phien_ban nội dung |\n| Đổi số từ tối thiểu | `fields[].min`; build lại |\n| Đổi màu/chữ/khoảng cách | `src/style.css` |\n| Đổi khoảng chờ khi lỗi mạng | `src/config.js` |\n| Thêm loại dữ liệu | Đồng bộ Core.record, HEADERS và backend validator |\n| Đổi PIN | Script Properties, không build lại app |\n| Đổi Google Sheet nhận | Triển khai một dự án gắn Sheet mới và chạy setup_ |\n| Giữ URL khi cập nhật | Apps Script → Manage deployments → Edit → New version |\n\nKhông đổi `storageKey` chỉ để tăng số phiên bản: sẽ làm app không nhìn thấy nháp cũ. Không xóa queue để bỏ lỗi. Không chỉnh ID khi retry. Không thêm khóa hoặc PIN vào JSON công khai.\n\nTài liệu nền tảng chính thức: [HTML Service communication](https://developers.google.com/apps-script/guides/html/communication), [Web Apps](https://developers.google.com/apps-script/guides/web), [Sheets values](https://developers.google.com/workspace/sheets/api/guides/values).\n\n\n## Chính sách và quyền trong 2.2.0\n\n`src/safety.js` là chính sách dùng chung: build nhúng vào HTML và `Schema.gs`. `sync()` thay gói hàng đợi bằng bản đã che trước khi lưu và gọi RPC; lịch sử cục bộ vẫn giữ nguyên bản gốc. Máy chủ kiểm tra cấu trúc, che nội dung và kiểm tra lại trước ghi Sheet. Ô có từ khóa thay toàn bộ bằng `[đã ẩn – an toàn]`; các mô tả giữ nguyên văn ở trên chỉ áp dụng cho ô không có từ khóa.\n\n`loginTeacher()` và `getClassProgress()` sử dụng `TEACHER_PINS`/phiên `teacher:` độc lập với `COORDINATOR_PINS`/phiên `coord:`. API tiến độ chỉ trả `ma`, `weeks` của đúng trường/lớp; không có API đọc bài nghiên cứu. Xem SCOPE.md và hướng dẫn triển khai về quyền Sheet.\n\n\n## Thay đổi 2.3.0\n\n`submitRecord` giữ script lock, dùng `Sheets.Spreadsheets.Values.get` với `UNFORMATTED_VALUE` cho tiêu đề/ID/dòng có sẵn và dùng `Values.append` RAW cho ghi. So sánh không dùng `String()` hay trim: giữ kiểu số/boolean, chuẩn hóa ô trống cuối hàng, giữ nguyên chuỗi. Không còn dùng `createTextFinder` trong đường submit.\n\n`build.py` chặn field và cột tổng hợp vượt mức nội bộ 13.000 UTF-16 code units; `Schema.gs` sinh cùng mức để server kiểm tra. `showCoordinatorReauth()` chèn form PIN mà không dựng lại phiếu điều phối. RATE_LIMITED có `retryAfterSeconds`; thời gian khóa không bị kéo dài khi người dùng nhấn lại. Roster không được triển khai trước quyết định nghiên cứu.\n\n`src/learning.js` quản lý khôi phục nháp và Sổ riêng từ Sheet; `Learning.gs` kiểm tra tài khoản và revision, xử lý an toàn trước ghi RAW. Xem [hướng dẫn tiến trình](docs/TIEN_TRINH_HOC_TAP.md).\n", "HUONG_DAN_TRIEN_KHAI.md": "# Triển khai Xoay Chiều 2.8.0 vào Google Sheets\n\nBộ `apps-script/` đã có bản build sẵn; không cần cài Python hoặc Node chỉ để dán và triển khai. Bản Sites/HTML tĩnh dành cho xem thử, không phải link thu dữ liệu Google Sheets. Không sử dụng dữ liệu thật trong bước thử.\n\n## A. Tạo nơi nhận dữ liệu\n\n1. Tạo một Google Sheet MỚI trong tài khoản người quản lý nghiên cứu. Không dán đè vào Sheet cũ đang thu dữ liệu.\n2. Trong Share / Chia sẻ, để Restricted / Hạn chế. Chỉ mời đúng tài khoản nhóm nghiên cứu cần xem/chỉnh sửa. Học sinh không cần quyền truy cập Sheet.\n3. Mở Tiện ích mở rộng → Apps Script.\n4. Thay nội dung `Code.gs` bằng `apps-script/Code.gs` của bộ này.\n5. Tạo thêm tệp Script tên `Schema` rồi dán `apps-script/Schema.gs`; tạo Script **Accounts** rồi dán `apps-script/Accounts.gs`; tạo Script **Learning** rồi dán `apps-script/Learning.gs`; tạo Script **Management** rồi dán `apps-script/Management.gs`.\n6. Tạo thêm tệp HTML tên **Index** rồi dán toàn bộ `apps-script/Index.html` (tên phải đúng chữ hoa).\n7. Bên trái, Services / Dịch vụ → dấu + → Google Sheets API → Add. Máy chủ dùng dịch vụ này để ghi RAW sau khi xử lý nội dung an toàn, không biến câu trả lời thành công thức. Nếu dự án Google Cloud riêng yêu cầu bật API, bật Google Sheets API cho chính dự án đó.\n\n   Tệp `apps-script/appsscript.json` là manifest mẫu tương ứng. Với dự án MỚI, có thể bật “Show appsscript.json manifest file in editor” trong Project Settings rồi dán tệp này để đặt V8, múi giờ GMT+7 và Sheets v4. Không dán đè manifest của dự án đang có dịch vụ khác. Nếu đã thêm Sheets API bằng giao diện, giữ manifest Google tự tạo cũng được.\n\n8. Lưu. Ở danh sách hàm trên thanh công cụ, chọn **setup_**, bấm Run và cấp quyền cho dự án do bạn quản lý. Hàm có dấu gạch dưới cuối để trình duyệt không gọi được qua google.script.run.\n9. Kiểm tra Sheet có 8 trang: `chu_trinh`, `phieu_buoi`, `doi_y`, `tai_khoan`, `tien_do`, `nhap_hoc_tap`, `quan_ly_hoc_sinh`, `quan_ly_hoc_tap`. `SPREADSHEET_ID` tự lưu trong Script Properties. Nếu báo cột không khớp, dùng Sheet mới; đừng xóa dữ liệu cũ để chữa lỗi.\n\n## A2. Cấp tài khoản học sinh trước khi triển khai\n\nLàm theo [hướng dẫn mã + PIN và tiến độ](docs/TAI_KHOAN_HOC_SINH.md): chép mã/trường/lớp vào `tai_khoan`, chạy `provisionStudentAccounts_`, nhận hộp thoại PIN và cấp riêng từng học sinh. Không nhập PIN rõ vào Sheet. Bản thật từ 2.5.0 yêu cầu tài khoản đã cấp PIN; đăng nhập mới cần mạng. `tien_do` tổng hợp từ bài đã nhận, không phải điểm năng lực. Thử Sheet giả trước; không kết nối tự động vào Sheet có dữ liệu thật.\n\n## B. PIN của điều phối viên\n\n1. Apps Script → Project Settings → Script Properties → Add script property.\n2. Tên thuộc tính: `COORDINATOR_PINS`.\n3. Giá trị là đối tượng JSON với khóa `Tên trường|Tên lớp`, giá trị là chuỗi PIN 6–12 chữ số. Mẫu cấu trúc (THAY các chữ placeholder bằng PIN số riêng trước khi lưu):\n\n```json\n{\n \"THPT Chuyên Chu Văn An|10A3 (10 Tin)\": \"PIN_RIENG_1\",\n \"THPT Chuyên Chu Văn An|11E1 (11 Văn)\": \"PIN_RIENG_2\",\n \"THPT Chi Lăng|12A2\": \"PIN_RIENG_3\"\n}\n```\n\nKhông để PIN trong content.json, không gửi vào nhóm học sinh chung. Lớp không được cấu hình PIN sẽ không mở được chế độ điều phối trên bản thật. Phiên tối đa 6 giờ, có thể hết sớm do cache Google; nhập lại PIN sẽ gửi tiếp phiếu chờ. PIN/session không lưu trong bản sao hoặc localStorage.\n\n## B2. PIN giáo viên và quyền dữ liệu\n\nTạo Script Property `TEACHER_PINS` cùng cấu trúc `Tên trường|Tên lớp` như `COORDINATOR_PINS`, nhưng dùng PIN riêng 6–12 chữ số. Không dùng chung PIN với học sinh điều phối. Không đặt PIN trong JSON nội dung, HTML hoặc Git. Trong app, giáo viên vào **Tiến độ lớp**, chọn đúng trường/lớp và nhập PIN. Phiên chỉ nằm trong bộ nhớ trình duyệt, tối đa 6 giờ theo cache máy chủ; nút Đăng xuất thu hồi phiên trên máy chủ khi có mạng. Đóng trang không tự thu hồi token còn hạn trên máy chủ.\n\nGiáo viên chỉ nhận `ma` và `weeks` của đúng lớp. Không trả câu trả lời, sản phẩm, thời lượng hay mức tự đánh giá. Bảng chỉ có mã đã nộp ít nhất một bài; không phải danh sách toàn bộ học sinh được cấp mã. Không cấp quyền Sheet nguồn cho giáo viên chủ nhiệm nếu họ chỉ được xem tiến độ: quyền chia sẻ Google Sheet cho phép đọc các trang trong tệp, không phải cơ chế hạn chế từng cột. Dùng thiết bị/hồ sơ trình duyệt riêng khi xem tiến độ; Sổ của mình là dữ liệu cục bộ, mã học sinh không phải mật khẩu.\n\nChỉ nhóm nghiên cứu và giáo viên hướng dẫn đã được chủ dự án cấp quyền mới xem/xuất dữ liệu ẩn danh từ Sheet. Trong phát triển chỉ dùng Sheet thử và dữ liệu giả. Sau khi chạy chính thức, người hỗ trợ lập trình không truy cập Sheet thật. Không đưa quyền truy cập dữ liệu thật hoặc credential vào bản bàn giao.\n\n## C. Xuất bản Web App\n\n1. Deploy → New deployment → chọn Web app.\n2. Execute as: Me / tài khoản chủ dự án.\n3. Who has access: Anyone nếu chính sách tài khoản cho phép học sinh vào không đăng nhập Google. Nếu tùy chọn không có, hỏi quản trị tài khoản hoặc dùng tài khoản được phép triển khai; không coi đó là lỗi code.\n4. Deploy, sao chép URL kết thúc `/exec`. Đó là link dùng cho học sinh. Không đưa link chỉnh sửa Sheet hoặc link `/dev`.\n5. Mở URL `/exec` trong trình duyệt riêng để thử quyền truy cập. Bản thật hiển thị trạng thái gửi, thay vì “Bản xem thử”.\n6. Dùng mã thử hợp lệ không thuộc học sinh thực nghiệm, hoàn thành một bài, đợi “Máy chủ đã xác nhận”. Mở Sheet kiểm tra nội dung, mức và thời gian.\n7. Thử từ một tài khoản/trình duyệt không được cấp quyền Sheet: app vẫn nộp được nhưng không mở được Sheet. App không có chức năng tải bài người khác từ máy chủ.\n\nTài liệu Google: https://developers.google.com/apps-script/guides/html/communication ; https://developers.google.com/apps-script/guides/web\n\n## D. Kiểm tra trước buổi đầu\n\n- Chốt danh sách lớp thực nghiệm, kiểm tra mã khảo sát không trùng trong cùng trường/lớp.\n- Duyệt cả 4 thư, nhiệm vụ, gợi ý. Mẫu có AI hỗ trợ phải được ghi nhận đúng.\n- Trên màn hình 360px và máy thật: đọc thư, các nút không tràn, sáng/tối dễ đọc, bàn phím không che thao tác.\n- Thử bài tuần 1, 2, 3, 4; phần Nối khác phần sản phẩm; tự đánh giá không chọn thì không cho nộp.\n- Gõ bài, quay lại, ẩn rồi mở lại trang: nháp còn. Với ô không có từ khóa an toàn, kiểm tra khoảng trắng và xuống dòng được giữ nguyên trong Sheet; ô có từ khóa phải chỉ còn `[đã ẩn – an toàn]` (cột dẫn xuất vẫn giữ tiền tố cấu trúc). Không làm bài đồng thời bằng nhiều tab.\n- Sau khi đã mở app, tắt mạng và nộp: hiển thị chờ; bật mạng: đúng một dòng sau xác nhận.\n- Đóng trang khi chờ gửi rồi mở lại có mạng: bài vẫn gửi; bấm gửi lại không tăng số dòng cho cùng ID.\n- Chủ động “Làm lượt mới”: tạo ID và dòng mới; không ghi đè lần trước.\n- Xuất bản sao toàn bộ khi có bài chờ; khôi phục trên trình duyệt trống: gói còn nguyên ID và ở trạng thái tạm dừng. Bấm Thử gửi lại, kiểm tra chỉ một dòng cho ID đó.\n- Thử `TEACHER_PINS`: PIN sai, phiên hết hạn, đổi lớp, đăng xuất; chỉ thấy mã và tuần, không thấy nội dung.\n- Thử từ khóa an toàn có/không dấu; bản sao cục bộ còn bản gốc nhưng request mạng và Sheet không có nội dung ô nhạy cảm.\n- Thử PIN sai, PIN đúng; phiếu nhóm chỉ dành tuần 3; số tham gia không lớn hơn sĩ số.\n- Trên thiết bị có bài tuần 1–3: tuần 4 chọn sản phẩm, sửa bản 2; kiểm tra bài gốc không đổi, `ban_goc_id` được lưu.\n- Nhập văn bản bắt đầu `=`, dấu nháy và tiếng Việt: Sheet giữ dạng văn bản, không chạy công thức.\n- Chạy thử một nhóm nhỏ, rồi kiểm tra tải nộp gần đồng thời với dữ liệu thử trong Sheet thử riêng. Chưa có xác nhận 150 người dùng đồng thời trong bản bàn giao.\n\n## E. Khi cập nhật\n\n1. Sửa nội dung trong `src/content.json` trên máy. Nên tăng `phien_ban` khi thay nội dung chính thức.\n2. Chạy `python build.py`. Lần đầu cài thư viện kiểm thử bằng `npm ci --ignore-scripts`, sau đó chạy `npm test`. Chạy `python package_source.py` nếu cần tạo lại ZIP và trang đọc mã.\n3. Dán lại `Index.html` và `Schema.gs`; cập nhật đồng bộ Code.gs, Accounts.gs, Learning.gs và Management.gs khi nâng bản máy chủ.\n4. Deploy → Manage deployments → Edit → New version → Deploy để giữ URL cũ. Chỉ Save code chưa cập nhật bản `/exec`.\n5. Không đổi cấu trúc câu hỏi/phiên bản giữa lúc học sinh đang làm. Thử trước trên bản sao.\n\n## F. Sao lưu và xử lý lỗi\n\n- Xuất bản sao JSON trong Cài đặt, hoặc từng mã trong Sổ của mình. JSON có câu trả lời, cần giữ riêng.\n- Chỉ bản sao **toàn bộ** mới được nhập lại bằng Cài đặt; tệp từng mã dùng để đọc/lưu riêng. Chỉ nhập trên trình duyệt chưa có dữ liệu; bài chờ được giữ nhưng chưa tự gửi đến khi bạn bấm Thử gửi lại.\n- Khi mất mạng, không xóa dữ liệu trình duyệt hay dùng chế độ ẩn danh. Không mở nhiều tab cùng một app trên một thiết bị khi đang làm.\n- Nếu bài ở trạng thái chờ: xem lỗi ở Cài đặt → Thử gửi lại. Kiểm tra đã bật Sheets API, chạy setup_, đúng phiên bản triển khai và đúng Sheet.\n- Dữ liệu Sheet là bản trung tâm để nghiên cứu; localStorage giữ bản gốc và phần chưa đồng bộ; nháp an toàn/bài đã được xác nhận trên Sheet có thể khôi phục khi đăng nhập trên máy khác.\n- Không xóa hàng đợi để làm mất thông báo lỗi. Với phiếu điều phối hết phiên, vào Điều phối nhập lại PIN.\n- Lỗi ID xung đột hoặc dữ liệu không hợp lệ làm gói tạm dừng. Xuất bản sao, đối chiếu Sheet và phiên bản nội dung trước khi gửi lại; không đổi ID để né lỗi vì có thể tạo dữ liệu lặp.\n- Ngày bắt đầu/chạy thử/kết thúc chờ chủ dự án xác nhận. App không tự khóa theo ngày; không triển khai tuần 5–8.\n\n\n## Cập nhật bản 2.3.0\n\nCập nhật đồng bộ `Code.gs`, `Schema.gs`, `Index.html`, giữ nguyên manifest có Sheets API và triển khai New version. Cấu trúc cột không đổi, không chạy lệnh xóa/ghi đè dữ liệu cũ. Nếu có gói 2.1 đang chờ hoặc đã ghi mà mất ACK, làm theo quyết định của nhóm nghiên cứu tại issue vận hành trước khi nâng cấp dữ liệu; không đổi ID để né xung đột.\n\nPIN sai 8 lần sẽ trả thời gian chờ còn lại, không có PIN dự phòng tự tạo. Cache có thể rớt trước 6 giờ: màn hình điều phối cho nhập lại PIN và giữ phiếu/đồng hồ. Dùng [checklist cấu hình](docs/DEPLOYMENT_CHECKLIST.md) để xác nhận quyền Sheet, deployment và người chỉnh Script Properties; các thiết lập đó chưa được xác minh trong môi trường lập trình này.\n\n\n## Đăng xuất 2.4.0\n\nCập nhật `Index.html` và `Code.gs` rồi Deploy New version để có nút Đăng xuất chung và RPC `logoutCoordinator` mới. `Schema.gs` không đổi so với 2.3.0. Kiểm tra đăng xuất/làm mới vẫn ở màn hình nhập mã, vào lại cùng hồ sơ còn nháp và bài chờ, đổi hồ sơ không lẫn bài. Thử thu hồi token giáo viên/điều phối trên deployment thử; không coi test mock là đã xác minh Google thật.\n\n## Nâng cấp 2.5.0\n\nCập nhật đủ `Code.gs`, `Accounts.gs`, `Schema.gs`, `Index.html`; giữ Script Properties và dữ liệu cũ. Thực hiện mục A2 trên bản thử, sau đó chủ dự án chuẩn bị tài khoản ở bản thật trước khi New version. Đăng nhập trên máy mới tải tiến độ các tuần đã nộp; nháp/bài gốc trong Sổ vẫn cần thiết bị cũ hoặc bản sao. Chi tiết thao tác, đặt lại PIN và nghiệm thu tại [hướng dẫn tài khoản](docs/TAI_KHOAN_HOC_SINH.md).\n\n## Nâng cấp 2.6.0 — mã từ Excel và mật khẩu\n\nBa lớp thực nghiệm mới thay cấu hình lớp cũ. Làm theo [nhập danh sách và cấp mật khẩu](docs/TAI_KHOAN_HOC_SINH.md): prepareStudentImport_ → dán CSV mã/trường/lớp → importStudentRoster_ → provisionStudentAccounts_ → tải file mật khẩu riêng → New version. Giữ nguyên khóa Script Properties và dữ liệu bài cũ; không tự gán lại trường/lớp trong nháp/hàng đợi. PIN số cũ giữ tương thích. HTML demo có thông báo riêng, không đăng nhập tài khoản thật.\n\n## Nâng cấp 2.7.0 — tiếp tục qua các tuần\n\nCập nhật đủ Code.gs, Accounts.gs, **Learning.gs**, Schema.gs, Index.html; chạy setup_ để thêm nhap_hoc_tap rồi New version. Nhập danh sách mới theo cách thêm mã, giữ mật khẩu/tiến trình cũ. Lộc Bình dùng danh tính mới, giữ Chi Lăng cũ; NT-10A6/NT-10A7 chưa kích hoạt. Xem [hướng dẫn nâng cấp và kiểm tra khôi phục](docs/TIEN_TRINH_HOC_TAP.md). Những ghi chú “chỉ có nháp/Sổ trên máy” của các bản cũ không áp dụng cho nháp/bài đã được bản 2.7 xác nhận đồng bộ.\n\n## Mã lớp 2.7.1\n\nGiá trị dữ liệu dùng 10A3, 11E1, LB-11A; chú thích chỉ hiển thị. Giữ tương thích tài khoản, mật khẩu, bài và nháp cũ. Cập nhật đồng bộ đủ 5 tệp Apps Script rồi New version, không đổi hàng loạt Sheet gốc. Xem [mã lớp và nâng cấp](docs/MA_LOP.md).\n\n## Quản lý trên Sheet và đồng bộ 1 phút (2.8.0)\n\nThêm Management.gs, cập nhật đủ sáu tệp Apps Script và chạy setup_ hoặc setupManagement_, rồi New version. Hai trang quan_ly_hoc_sinh và quan_ly_hoc_tap tự hiện tiến độ và câu trả lời an toàn của từng tài khoản. Nháp tự gửi mỗi 60 giây khi có thay đổi; checkpoint nộp/thoát vẫn lưu ngay. Xem [hướng dẫn quản lý Sheet](docs/QUAN_LY_SHEET.md).\n", "DU_LIEU_VA_TAP_HUAN.md": "# Dữ liệu và tập huấn\n\n## Trang chu_trinh\n\nMỗi lần nộp chủ động là một dòng. `id` là mã duy nhất của lượt, dùng chống gửi lại; không phải mã học sinh. Bộ ba `truong`, `lop`, `ma` dùng phân biệt hồ sơ. Không thu họ tên, email, vị trí hay thông tin thiết bị trong bản ghi ứng dụng.\n\n| Cột | Ý nghĩa |\n|---|---|\n| thoi_gian_nhan | Thời gian máy chủ nhận, ISO UTC |\n| thoi_gian | Thời điểm bấm nộp trên thiết bị, ISO UTC |\n| bat_dau | Lúc tạo nháp |\n| thoi_luong_giay | Thời gian màn hình làm bài hiển thị, không phải đo tập trung |\n| thoi_gian_troi_giay | Thời gian trôi từ tạo nháp đến nộp, gồm nghỉ |\n| thu_lam | Kết quả Thử; tuần 4 ghép hai phần thay đổi được/không được |\n| nghi_1..3 | Các câu Nghĩ; xem bảng tuần dưới |\n| noi | Câu trả lời liên hệ môn khác/đời sống, tách khỏi sản phẩm |\n| dang_san_pham, san_pham | Dạng và toàn văn sản phẩm, tuần 4 là bản 2 |\n| chia_se | Ý nghe từ bạn; tuần 3 là Đổi/Giữ ý và lý do |\n| tu_danh_gia | Mức học sinh tự chọn 1–3, không phải điểm giáo viên hay AI |\n| phe, doi_hay_giu | Lựa chọn nguyên trạng tuần 3; đồng thời có tiền tố trong nghi_1/chia_se theo yêu cầu |\n| kiem_soat, ngoai_kiem_soat | Hai câu trả lời nguyên văn riêng tuần 4 |\n| ban_goc_id | ID sản phẩm đã chọn để sửa; trống nếu nhập lại từ giấy |\n| phien_ban_app, phien_ban_noi_dung | Phiên bản app và nội dung của lượt làm |\n\n| Tuần | nghi_1 | nghi_2 | nghi_3 |\n|---|---|---|---|\n|1|Chỗ vấp khi giải thích|Vì sao tưởng đã hiểu|Cách kiểm tra mình hiểu|\n|2|So sánh hai cách học|Lý do giữ cách quen|Thói quen định đổi|\n|3|Phe A/B và 2 lý do|Lý lẽ mạnh của phía kia|Điểm chung và điều chưa chắc|\n|4|Bước nhỏ sẽ làm|Thư gửi chính mình (>=30 từ)|Thói quen muốn giữ và vì sao|\n\n`phieu_buoi`: buổi thực hiện theo lớp, tuần, ngày, khung giờ, thời lượng thực tế, sĩ số, số tham gia, các bước hoàn thành, app/giấy/kết hợp, điều tốt, khó khăn, tên viết tắt điều phối viên. `doi_y`: tuần 3, nhóm, đổi/giữ, lý do.\n\nKhông cộng mức 1–3 thành điểm năng lực hay coi phần trăm hoàn thành là hiệu quả can thiệp. Nhóm nghiên cứu tự xác định cách xử lý lượt làm lại, thiếu dữ liệu và đối chiếu khảo sát trước/sau. Giữ dữ liệu gốc, ghi rõ quy tắc chọn bản ghi trước khi phân tích.\n\n## Tập huấn đề xuất\n\n### Buổi 1 — hiểu công cụ (30–45 phút)\n\nGiải thích mục tiêu nghiên cứu và 5 thành tố. Mở tuần 1, thực hiện trọn chu trình. Học sinh giải thích vì sao mỗi câu hiện riêng, vì sao cần ghi lại suy nghĩ, vì sao không chấm đúng/sai. Không suy ra năng lực thật từ việc bấm hoàn thành.\n\n### Buổi 2 — dữ liệu và vận hành (30–45 phút)\n\nNhập mã thử, ghi một đoạn có xuống dòng, nộp và tìm dòng trong Sheet dưới sự hướng dẫn của người có quyền. Tắt mạng sau khi trang đã tải, thử lưu chờ rồi bật lại. Xem 2 lượt chủ động và phân biệt với gửi lại cùng ID. Mở tuần 3 thử điều phối, tuần 4 sửa sản phẩm.\n\n### Buổi 3 — trình bày và demo (30 phút)\n\nDemo trên điện thoại: mã → thư → câu hỏi → sản phẩm → tự đánh giá → xác nhận. Học sinh nói rõ vai trò của nhóm và người hỗ trợ kỹ thuật, phần có AI hỗ trợ; không học thuộc tuyên bố tự viết code nếu không đúng. Không bảo đảm hội đồng sẽ không hỏi code.\n\nCâu hỏi luyện tập:\n- Vì sao app dùng chu trình Thử–Nghĩ–Nối–Chia sẻ?\n- Vì sao lưu nguyên văn, tách câu Nối và sản phẩm?\n- Dữ liệu gửi đi đâu, ai có quyền xem? Mã khác mật khẩu thế nào?\n- Khi mất mạng, làm sao biết bài chỉ lưu trên máy hay đã vào Sheet?\n- Tuần 4 làm sao giữ bản gốc khi sửa sản phẩm?\n- Điều gì do nhóm tự thực hiện, điều gì có hỗ trợ?\n\n## Phạm vi kiểm tra bàn giao\n\nCó kiểm tra cú pháp, build, hàm kiểm tra đầu vào và ánh xạ bốn tuần, mô phỏng máy chủ ghi RAW/chống trùng/PIN, mô phỏng trạng thái nộp bài và lỗi bộ nhớ, kiểm tra hàng đợi mất mạng và gửi lại. Có kiểm tra khôi phục giữ gói chờ và phát hiện tab khác thay đổi dữ liệu.\n\nKiểm thử DOM bằng jsdom đi qua giao diện bốn tuần, kiểm tra không bỏ trống, tự đánh giá không chọn sẵn, quay lại và tải lại nháp, giữ dòng trống đầu, hiển thị văn bản có thẻ HTML, tạo lượt mới và sửa sản phẩm tuần 4. Đây là mô phỏng DOM trong Node.js, không phải kiểm tra bố cục bằng trình duyệt thật.\n\nBản 2.2.0 đã kiểm tra bằng Chromium ở viewport 360×800, sáng/tối, bốn tuần và giao diện giáo viên với RPC giả; chưa kiểm tra điện thoại vật lý; chưa xác thực trên Google Apps Script/Sheet thật của bạn và chưa đo tải 150 máy. Các bước đó nằm trong checklist triển khai, phải hoàn thành trước dùng nghiên cứu thật.\n\n\n## Thay đổi chính sách dữ liệu 2.2.0\n\n“Nguyên văn” chỉ áp dụng cho ô không chứa từ khóa an toàn. Ô có từ khóa được thay toàn bộ bằng `[đã ẩn – an toàn]` trước khi gửi, kiểm tra lại ở máy chủ. Tiền tố tuần 3 và cột tổng hợp tuần 4 được dựng lại từ phần đã che. Điều này áp dụng cả ghi chú điều phối. Bản nháp, lịch sử trên máy và bản sao cá nhân vẫn có thể chứa nội dung gốc: lưu riêng, không gửi chung cho lớp. Dữ liệu đã ghi ở phiên bản cũ không được tự động sửa hay xóa.\n\nGiáo viên chủ nhiệm chỉ có mã + tuần qua API tiến độ, không nhận mức tự đánh giá hoặc nội dung bài. Nhóm nghiên cứu/GV hướng dẫn xem/xuất Sheet theo quyền Google do chủ dự án cấp. Không dùng các mức 1–3 hay tiến độ làm điểm nghiên cứu. La bàn, `thanh_to`, chatbot kịch bản để giai đoạn sau; không dùng AI tạo sinh.\n", "src/app.js": "'use strict';\n/**\n * GIAO DIỆN VÀ ĐIỀU PHỐI DỮ LIỆU\n *\n * db.profiles: nháp + lịch sử theo bộ ba trường/lớp/mã.\n * db.queue: các gói nộp chưa nhận xác nhận, được lưu trước khi gọi mạng.\n * profile/tab/activeWeek: màn hình đang mở; không gửi thông tin thiết bị.\n * Các phần nội dung giáo dục đều đọc từ CONTENT, không nằm trong logic này.\n */\nconst $ = id => document.getElementById(id),\n  E = Core.esc,\n  KEY = APP_CONFIG.storageKey,\n  LIVE = !!globalThis.google?.script?.run,\n  AUTH_REQUIRED = APP_CONFIG.authRequired || LIVE,\n  NEEDS_PASSWORD = AUTH_REQUIRED && APP_CONFIG.requireStudentPassword !== false;\n// Một snapshot dùng để phát hiện tab khác vừa ghi; không ghi đè âm thầm.\nlet storageSnapshot = null,\n  storageConflict = false,\n  storageUnavailable = false,\n  previewOnly = false;\ntry {\n  storageSnapshot = localStorage.getItem(KEY);\n} catch { storageUnavailable = true; }\nlet db, loadBroken = false;\ntry {\n  db = JSON.parse(storageSnapshot || 'null') || {\n    profiles: {},\n    queue: [],\n    theme: 'light'\n  };\n  if (!db.profiles || !Array.isArray(db.queue)) throw Error('schema');\n} catch {\n  loadBroken = true;\n  db = {\n    profiles: {},\n    queue: [],\n    theme: 'light'\n  };\n}\nlet profile = AUTH_REQUIRED ? null : db.current || null,\n  studentAuth = null,\n  studentProgress = null,\n  studentProgressError = '',\n  tab = 'home',\n  activeWeek = 1,\n  coordToken = '',\n  coordUntil = 0,\n  teacherAuth = null,\n  teacherSelection = null,\n  sending = false,\n  lastTick = Date.now(),\n  saveTimer = null,\n  toastTimer, stageClock = null;\nif (profile) { profile = {...profile,lop:Core.classCode(profile.lop)}; db.current = profile; }\nconst cloudSync = () => typeof LearningSync === 'undefined' ? null : LearningSync;\nlet logoutPending = false;\nconst person = () => profile ? (db.profiles[Core.key(profile)] = db.profiles[Core.key(profile)] || {\n  drafts: {},\n  history: []\n}) : null;\n/** Lưu nguyên trạng toàn bộ dữ liệu cục bộ; thất bại trả false để giữ nháp. */\nfunction persist() {\n  // Chỉ bật sau khi người xem chủ động chọn demo tạm thời, không áp dụng bản LIVE.\n  if (previewOnly && !LIVE) return true;\n  if (loadBroken) {\n    toast('Dữ liệu cũ không đọc được. Hãy xuất bản sao trong Cài đặt.');\n    return false;\n  }\n  try {\n    if (storageConflict || localStorage.getItem(KEY) !== storageSnapshot) {\n      storageConflict = true;\n      showStorageConflict();\n      return false;\n    }\n    const next = JSON.stringify(db);\n    localStorage.setItem(KEY, next);\n    storageSnapshot = next;\n    return true;\n  } catch {\n    storageUnavailable = true;\n    toast('Không lưu được trên máy. Hãy xuất bản sao ngay; đừng đóng trang.');\n    return false;\n  }\n}\n\nfunction showStorageConflict() {\n  toast('Một tab khác đã thay đổi dữ liệu. Tab này tạm dừng lưu để tránh ghi đè.');\n  if (!$('conflict')) return;\n  $('conflict').classList.remove('hidden');\n}\n\nfunction toast(s) {\n  $('toast').textContent = s;\n  $('toast').classList.remove('hidden');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 6000);\n}\n\nfunction rpc(name, data) {\n  if (data && typeof data === 'object') {\n    if (data.lop !== undefined) data = {...data,lop:Core.classCode(data.lop)};\n    if (data.record) data = {...data,record:{...data.record,lop:Core.classCode(data.record.lop)}};\n  }\n  return new Promise((resolve, reject) => {\n    const t = setTimeout(() => reject(Error(\n        'Chưa nhận xác nhận từ máy chủ. Bài vẫn nằm trong hàng đợi.')), APP_CONFIG\n      .rpcTimeoutMs);\n    google.script.run.withSuccessHandler(r => {\n      clearTimeout(t);\n      resolve(r)\n    }).withFailureHandler(e => {\n      clearTimeout(t);\n      reject(Error(e.message || 'Không kết nối được máy chủ.'))\n    })[name](data);\n  });\n}\n\nfunction status() {\n  if (!$('net')) return;\n  const q = db.queue.length;\n  $('net').textContent = AUTH_REQUIRED && !LIVE ? 'Chưa kết nối máy chủ' : LIVE ? (sending ? 'Đang gửi…' : q ? `${q} bản ghi chờ gửi` :\n    'Đã đồng bộ hàng đợi') : previewOnly ? 'Xem thử tạm · không lưu' : 'Bản xem thử · lưu trên máy';\n}\n/**\n * Gửi tuần tự. Hàng đợi vẫn tồn tại trên đĩa trong suốt yêu cầu mạng.\n * ACK phải có đúng ID; timeout không có nghĩa bản ghi chưa đến máy chủ.\n * Vì vậy mọi lần thử lại gửi nguyên gói cũ, không sinh ID/thời gian mới.\n */\nasync function sync(force = false) {\n  if (sending || !LIVE || !navigator.onLine || loadBroken || storageConflict || !db.queue.length)\n    return;\n  let changed = false;\n  sending = true;\n  status();\n  try {\n    for (const item of [...db.queue]) {\n      item.record = {...item.record,lop:Core.classCode(item.record.lop)};\n      if (force) {\n        item.paused = false;\n        item.nextTryAt = 0;\n      }\n      if (item.paused || Date.now() \u003c (item.nextTryAt || 0)) continue;\n      if (item.record.loai === 'chu_trinh' && !studentAuthorized(item.record)) {\n        const message = 'Đăng nhập đúng mã, trường/lớp và PIN để gửi bài đang chờ.';\n        if (item.error !== message) { item.error = message; changed = true; persist(); }\n        if (profile && Core.key(profile) === Core.key(item.record)) showStudentReauth();\n        continue;\n      }\n      if (item.record.loai !== 'chu_trinh' && (!coordToken || Date.now() > coordUntil ||\n          profile?.truong !== item.record.truong || profile?.lop !== item.record.lop)) {\n        const message = 'Chọn đúng trường/lớp của phiếu, mở Điều phối và nhập lại PIN để gửi.';\n        if (item.error !== message) {\n          item.error = message;\n          changed = true;\n          persist();\n        }\n        if (tab === 'coord' && profile?.truong === item.record.truong && profile?.lop === item.record.lop) showCoordinatorReauth();\n        continue;\n      }\n      try {\n        item.record = Core.safeRecord(item.record, CONTENT.an_toan);\n        if (!persist()) throw new Error('Chưa lưu được gói an toàn; chưa gửi.');\n        const requestStudentAuth = studentAuth;\n        const result = await rpc('submitRecord', {\n          record: item.record,\n          token: item.record.loai === 'chu_trinh' ? requestStudentAuth.token : coordToken,\n        });\n        if (!result?.ok || result.id !== item.record.id) {\n          if (result?.code === 'AUTH_REQUIRED') {\n            if (item.record.loai === 'chu_trinh') {\n              if (studentAuth === requestStudentAuth) studentAuth = null;\n              if (!studentAuth && profile && Core.key(profile) === Core.key(item.record)) showStudentReauth();\n            } else {\n              coordToken = '';\n              coordUntil = 0;\n              if (tab === 'coord') showCoordinatorReauth();\n            }\n          }\n          const error = new Error(result?.error || 'Máy chủ chưa xác nhận đúng bản ghi.');\n          error.permanent = result?.code === 'INVALID_RECORD' || result?.code === 'ID_CONFLICT';\n          throw error;\n        }\n        if (item.record.loai === 'chu_trinh' && profile && Core.key(profile) === Core.key(item.record)) {\n          if (!studentProgress) studentProgress = { ...profile, weeks: [] };\n          studentProgress.weeks = [...new Set([...studentProgress.weeks, item.record.tuan])];\n        }\n        db.queue = db.queue.filter(q => q.record.id !== item.record.id);\n        changed = true;\n        Object.values(db.profiles).forEach(p => p.history.forEach(h => {\n          if (h.record.id === result.id) h.sent = true;\n        }));\n        // Nếu không lưu được ACK, trên đĩa vẫn còn gói: lần sau gửi lại cùng ID.\n        persist();\n      } catch (error) {\n        changed = true;\n        item.error = error.message;\n        item.attempts = (item.attempts || 0) + 1;\n        item.nextTryAt = Date.now() + Core.retryDelay(item.attempts, Math.random, APP_CONFIG);\n        item.paused = !!error.permanent;\n        persist();\n        // Một bản ghi lỗi không chặn các bản ghi hợp lệ khác trong hàng đợi.\n      }\n      if (storageConflict) break;\n    }\n  } finally {\n    sending = false;\n    status();\n    // Không dựng lại trang mỗi 5 giây nếu không có gì thay đổi: giữ trạng thái\n    // mở bài cũ và hộp chọn tệp sao lưu của người dùng.\n    if (changed && (['notebook', 'settings'].includes(tab) || (tab === 'home' && profile))) render();\n  }\n}\n\nfunction enqueue(record) {\n  if (db.queue.some(q => q.record.id === record.id)) return true;\n  db.queue.push({\n    record\n  });\n  if (!persist()) {\n    db.queue = db.queue.filter(q => q.record.id !== record.id);\n    return false;\n  }\n  sync();\n  return true;\n}\n\nfunction logo() {\n  return `\u003csvg class=\"logo\" viewBox=\"0 0 64 64\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\">\n    \u003ccircle cx=\"32\" cy=\"32\" r=\"29\" fill=\"var(--paper)\" stroke=\"var(--gold)\" stroke-width=\"1.2\"/>\n    \u003ccircle cx=\"32\" cy=\"32\" r=\"25\" fill=\"none\" stroke=\"var(--gold)\" stroke-opacity=\".35\" stroke-dasharray=\"1 4\"/>\n    \u003cg class=\"logo-orbit\">\n      \u003cpath d=\"M32 9C44 16 46 24 32 32C37 23 34 18 32 9Z\" fill=\"var(--gold)\"/>\n      \u003cpath d=\"M55 32C48 44 40 46 32 32C41 37 46 34 55 32Z\" fill=\"var(--green)\"/>\n      \u003cpath d=\"M32 55C20 48 18 40 32 32C27 41 30 46 32 55Z\" fill=\"var(--rose)\"/>\n      \u003cpath d=\"M9 32C16 20 24 18 32 32C23 27 18 30 9 32Z\" fill=\"var(--accent)\"/>\n    \u003c/g>\n    \u003cpath d=\"M32 25L39 32L32 39L25 32Z\" fill=\"var(--paper)\" stroke=\"var(--gold)\" stroke-width=\"1.2\"/>\n    \u003ccircle cx=\"32\" cy=\"32\" r=\"2.5\" fill=\"var(--gold)\"/>\n  \u003c/svg>`;\n}\n\nfunction render() {\n  document.body.classList.toggle('dark', db.theme === 'dark');\n  const names = [\n    ['home', '⌂', 'Hành trình'],\n    ['notebook', '▤', 'Sổ của mình'],\n    ['letters', '✉', 'Hộp thư'],\n    ['coord', '◷', 'Điều phối'],\n    ['teacher', '▦', 'Tiến độ lớp'],\n    ['settings', '⚙', 'Cài đặt']\n  ];\n  $('app').innerHTML =\n    `\u003cdiv class=\"shell\">\u003caside class=\"side\">\u003ca class=\"brand\" id=\"brandHome\" href=\"#home\" aria-label=\"Xoay Chiều — về trang chính\">${logo()}\u003cdiv>\u003cstrong>Xoay Chiều\u003c/strong>\u003csmall>Mỗi góc nhìn, một điều mới\u003c/small>\u003c/div>\u003c/a>\u003cnav class=\"nav\" aria-label=\"Chính\">${names.map(([k,ic,n])=>`\u003cbutton data-tab=\"${k}\" class=\"${tab===k?'on':''}\" ${tab===k?'aria-current=\"page\"':''}>\u003cspan>${ic}\u003c/span>${n}\u003c/button>`).join('')}\u003c/nav>\u003cdiv class=\"sidefoot\">\u003cp>THỬ · NGHĨ · NỐI · CHIA SẺ\u003c/p>\u003cp>Một hành trình nhỏ.\u003cbr>Nhiều cách nhìn mới.\u003c/p>\u003cdiv class=\"profile\">${profile?`\u003cstrong>${E(profile.ma)}\u003c/strong>\u003cbr>${E(profile.lop)}\u003cbr>\u003csmall>${E(profile.truong)}\u003c/small>`:'Chưa chọn mã học sinh'}\u003c/div>\u003c/div>\u003c/aside>\u003cmain class=\"main\">\u003cheader class=\"top\">\u003cspan class=\"caption\">HÀNH TRÌNH HỌC TẬP / ${CONTENT.so_tuan} TUẦN\u003c/span>\u003cdiv class=\"row\">\u003cspan id=\"net\" class=\"status\" aria-live=\"polite\">\u003c/span>\u003cbutton class=\"small\" id=\"theme\" aria-label=\"Đổi giao diện sáng tối\">${db.theme==='dark'?'☀':'☾'}\u003c/button>\u003c/div>\u003c/header>\u003csection id=\"sessionBar\" class=\"session-bar ${profile||teacherAuth?'':'hidden'}\" aria-label=\"Phiên đang sử dụng\">\u003cspan id=\"sessionIdentity\">\u003c/span>\u003cbutton id=\"logout\" class=\"small\" type=\"button\">Đăng xuất \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003c/section>\u003cdiv id=\"conflict\" class=\"notice hidden\" role=\"alert\">Dữ liệu đã đổi ở một tab khác. Tải bản sao của tab này trước khi tải lại trang. \u003cbutton id=\"conflictBackup\">Tải bản sao tab này\u003c/button>\u003cbutton id=\"conflictReload\">Tải lại trang\u003c/button>\u003c/div>${previewOnly?'\u003cdiv class=\"notice preview-notice\" role=\"status\">Đang xem thử không lưu. Bài chỉ giữ trong phiên này, mất khi tải lại hoặc đóng trang; không gửi Google Sheets. Muốn lưu lâu dài, hãy tải HTML xuống và mở bằng trình duyệt cho phép lưu dữ liệu.\u003c/div>':''}\u003cdiv class=\"page\" id=\"page\">\u003c/div>\u003c/main>\u003c/div>`;\n  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));\n  $('brandHome').onclick = event => {\n    event.preventDefault();\n    go('home');\n  };\n  $('theme').onclick = () => {\n    db.theme = db.theme === 'dark' ? 'light' : 'dark';\n    persist();\n    render();\n  };\n  $('logout').onclick = logout;\n  updateSessionControls();\n  status();\n  $('conflictBackup').onclick = () => download('XoayChieu-tab-backup.json', JSON.stringify(db, null,\n    2));\n  $('conflictReload').onclick = () => location.reload();\n  if (storageConflict) showStorageConflict();\n  if (!profile && !['settings', 'letters', 'teacher'].includes(tab)) login();\n  else({\n    home,\n    notebook,\n    letters,\n    coord,\n    settings,\n    teacher,\n    work\n  } [tab] || home)();\n  if (LIVE && profile && ['home', 'work', 'notebook'].includes(tab) && !studentAuthorized(profile)) showStudentReauth();\n  cloudSync()?.view();\n}\n\n/** Kết thúc phiên hiện tại, giữ bài và hàng đợi; không xóa dữ liệu hồ sơ. */\nfunction logout(skipCloud = false) {\n  if (logoutPending) return false;\n  collect();\n  clearTimeout(saveTimer);\n  if (profile) {\n    const previous = db.current;\n    delete db.current;\n    if (!persist()) {\n      db.current = previous;\n      toast('Chưa đăng xuất vì không lưu được nháp. Hãy giữ trang mở và tải bản sao trong Cài đặt.');\n      return false;\n    }\n  }\n  cloudSync()?.remember();\n  if (skipCloud !== true && LIVE && profile && navigator.onLine && studentAuthorized(profile) && cloudSync()?.ready && cloudSync().pending) {\n    logoutPending = true;\n    if ($('logout')) { $('logout').disabled = true; $('logout').textContent = 'Đang lưu trước khi đăng xuất…'; }\n    return cloudSync().flushBeforeLogout().finally(() => { logoutPending = false; logout(true); });\n  }\n  cloudSync()?.reset();\n  const teacherToken = teacherAuth?.token, coordinatorToken = coordToken, studentToken = studentAuth?.token;\n  studentAuth = null;\n  studentProgress = null;\n  studentProgressError = '';\n  profile = null;\n  teacherAuth = null;\n  teacherSelection = null;\n  coordToken = '';\n  coordUntil = 0;\n  stageClock = null;\n  activeWeek = 1;\n  tab = 'home';\n  const dialog = $('letterDialog');\n  if (dialog?.open) dialog.close();\n  render();\n  window.scrollTo({ top: 0 });\n  toast(previewOnly ? 'Đã đăng xuất. Bài xem thử chỉ còn trong phiên này; đóng hoặc tải lại trang sẽ mất.' :\n    'Đã đăng xuất. Nháp, bài cũ và bài chờ gửi vẫn được giữ trên thiết bị.');\n  if (LIVE) {\n    // Trả giao diện về nhập mã ngay; yêu cầu thu hồi phiên khi mạng cho phép.\n    if (studentToken) rpc('logoutStudent', studentToken).catch(() => {});\n    if (teacherToken) rpc('logoutTeacher', teacherToken).catch(() => {});\n    if (coordinatorToken) rpc('logoutCoordinator', coordinatorToken).catch(() => {});\n  }\n  return true;\n}\n\nfunction updateSessionControls() {\n  const bar = $('sessionBar'), identity = $('sessionIdentity');\n  if (!bar || !identity) return;\n  bar.classList.toggle('hidden', !profile && !teacherAuth);\n  identity.textContent = tab === 'teacher' && teacherAuth ?\n    `Giáo viên · ${teacherAuth.lop}` : profile ? `Mã ${profile.ma} · ${profile.lop}` : teacherAuth ? `Giáo viên · ${teacherAuth.lop}` : '';\n}\n\nfunction go(t) {\n  flushDraft();\n  tab = t;\n  render();\n  window.scrollTo({\n    top: 0\n  });\n}\n\nfunction login() {\n  const schools = Core.schools(CONTENT);\n  $('page').innerHTML =\n    `\u003cdiv class=\"welcome\">\u003cp class=\"eyebrow\">Chào bạn, rất vui được gặp\u003c/p>\u003ch1>Một góc nhìn mới\u003cbr>bắt đầu từ bạn.\u003c/h1>\u003cp class=\"muted\">Không có câu trả lời đúng hay sai. Hãy thử, lắng nghe và ghi lại những điều mình nhận ra.\u003c/p>\u003cform id=\"login\" class=\"panel\">\u003clabel class=\"field\">\u003cspan>Mã của bạn\u003c/span>\u003cinput id=\"code\" placeholder=\"Ví dụ định dạng: AB12-C\" maxlength=\"8\" autocomplete=\"off\" autocapitalize=\"characters\" required>\u003csmall>Dùng đúng mã trên phiếu khảo sát. Không nhập họ tên.\u003c/small>\u003c/label>\u003clabel class=\"field\">\u003cspan>Trường\u003c/span>\u003cselect id=\"school\">\u003coption value=\"\">Chọn trường\u003c/option>${schools.map(s=>`\u003coption value=\"${E(s.truong)}\">${E(s.truong)}${CONTENT.truong_lop_cu?.some(old=>old.truong===s.truong)?' (lớp cũ)':''}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>Lớp\u003c/span>\u003cselect id=\"class\">\u003coption value=\"\">Chọn lớp\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">\u003cspan>Mật khẩu${NEEDS_PASSWORD?'':' (không bắt buộc)'}\u003c/span>\u003cinput id=\"studentPin\" type=\"password\" autocomplete=\"current-password\" minlength=\"6\" maxlength=\"64\" ${NEEDS_PASSWORD?'required':AUTH_REQUIRED?'':'disabled'}>\u003csmall>${!AUTH_REQUIRED?'Đây là bản xem thử. Tài khoản thật đăng nhập tại link Apps Script do giáo viên cung cấp.':NEEDS_PASSWORD?'Dùng mật khẩu được cấp riêng cùng mã học sinh. Quên mật khẩu? Liên hệ người phụ trách để được đặt lại.':'Máy chủ đang để chế độ chỉ cần mã: có thể để trống ô này và bấm Đăng nhập.'}\u003c/small>\u003c/label>${AUTH_REQUIRED?'\u003cbutton id=\"toggleStudentPassword\" type=\"button\" class=\"small\" aria-controls=\"studentPin\" aria-pressed=\"false\">Hiện mật khẩu\u003c/button>':''}\u003cp id=\"loginErr\" class=\"error\" role=\"alert\">\u003c/p>\u003cbutton id=\"loginStart\" type=\"button\" class=\"primary\" style=\"width:100%\">${AUTH_REQUIRED?'Đăng nhập và bắt đầu →':'Vào bản xem thử →'}\u003c/button>\u003cdiv id=\"previewFallback\" class=\"${!AUTH_REQUIRED&&storageUnavailable&&!loadBroken&&!storageConflict?'':'hidden'}\">\u003cp class=\"caption\">Trình xem không cho lưu dữ liệu. Bạn có thể xem thử tạm thời; bài sẽ mất khi đóng hoặc tải lại trang.\u003c/p>\u003cbutton id=\"previewStart\" type=\"button\" class=\"ghost\" style=\"width:100%\">Xem thử không lưu →\u003c/button>\u003c/div>\u003cdetails style=\"margin-top:18px\">\u003csummary>${AUTH_REQUIRED?'Tài khoản được cấp':'Cách tạo mã theo phiếu khảo sát'}\u003c/summary>${AUTH_REQUIRED?'\u003cp class=\"caption\">Dùng mã trên phiếu khảo sát đã được người phụ trách đăng ký cùng trường/lớp và mật khẩu riêng được cấp. Nếu mã chưa được đăng ký hoặc bạn quên mật khẩu, hãy liên hệ người phụ trách.\u003c/p>':CONTENT.huong_dan_ma.buoc.map(b=>`\u003cp class=\"caption\">${E(b)}\u003c/p>`).join('')}\u003c/details>\u003c/form>\u003cp class=\"caption\">Câu trả lời lưu trên trình duyệt này${AUTH_REQUIRED?'; nháp và bài đã xử lý an toàn được đồng bộ lên Sheet để tuần sau tiếp tục':''}. Không nhập số điện thoại, địa chỉ hay thông tin nhận diện người khác. Ô có từ khóa an toàn được thay bằng “[đã ẩn – an toàn]” trước khi gửi; bản gốc vẫn ở trên máy.\u003c/p>\u003c/div>`;\n  $('school').onchange = () => {\n    $('class').innerHTML = '\u003coption value=\"\">Chọn lớp\u003c/option>' + (schools.find(s => s.truong ===\n      $('school').value)?.lop || []).map(c => `\u003coption value=\"${E(c)}\">${E(Core.classLabel(c))}\u003c/option>`).join('');\n  };\n  if ($('toggleStudentPassword')) $('toggleStudentPassword').onclick = () => {\n    const input = $('studentPin'), show = input.type === 'password';\n    input.type = show ? 'text' : 'password';\n    $('toggleStudentPassword').textContent = show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';\n    $('toggleStudentPassword').setAttribute('aria-pressed', String(show));\n  };\n  const attemptLogin = async (temporary = false) => {\n    const form = $('login'), button = $('loginStart');\n    if (button.disabled) return;\n    $('loginErr').textContent = '';\n    const ma = Core.normalize($('code').value),\n      truong = $('school').value,\n      lop = $('class').value;\n    if (!Core.validCode(ma)) {\n      $('loginErr').textContent = 'Mã cần có dạng AB12-C (2 chữ, 2 số, dấu -, 1 chữ).';\n      return;\n    }\n    if (!schools.some(s => s.truong === truong && s.lop.includes(lop))) {\n      $('loginErr').textContent = 'Hãy chọn trường và lớp.';\n      return;\n    }\n    if (temporary) {\n      if (AUTH_REQUIRED || loadBroken || storageConflict || !storageUnavailable) return;\n      previewOnly = true;\n    }\n    let auth = null;\n    if (AUTH_REQUIRED) {\n      if (!LIVE) { $('loginErr').textContent = 'Chưa kết nối được máy chủ xác thực. Hãy mở link web đã triển khai hoặc tải lại trang; chưa thể vào bài học.'; return; }\n      const pin = $('studentPin').value;\n      $('studentPin').value = '';\n      if (NEEDS_PASSWORD && !validStudentPassword(pin)) { $('loginErr').textContent = 'Nhập mật khẩu riêng được cấp (8–64 ký tự); PIN số cũ 6–12 chữ số vẫn dùng được.'; return; }\n      if (!navigator.onLine) { $('loginErr').textContent = 'Cần có mạng để đăng nhập. Nháp và bài chờ gửi vẫn được giữ.'; return; }\n      button.disabled = true;\n      try {\n        const response = await rpc('loginStudent', {ma, truong, lop, password: pin});\n        if ($('login') !== form) {\n          if (response?.ok) rpc('logoutStudent', response.token).catch(() => {});\n          return;\n        }\n        if (!response?.ok) throw Error(response?.error || 'Chưa đăng nhập được.');\n        auth = {ma, truong, lop, token: response.token, expires: response.expires};\n      } catch (error) {\n        if ($('login') === form) $('loginErr').textContent = error.message;\n        return;\n      } finally { if (button.isConnected) button.disabled = false; }\n    }\n    const previousProfile = profile, previousCurrent = db.current;\n    profile = { ma, truong, lop };\n    db.current = profile;\n    person();\n    if (!persist()) {\n      profile = previousProfile;\n      db.current = previousCurrent;\n      if (auth) rpc('logoutStudent', auth.token).catch(() => {});\n      $('loginErr').textContent = loadBroken ?\n        'Dữ liệu cũ không đọc được. Mở Cài đặt để tải bản sao; trang chưa ghi đè dữ liệu.' :\n        storageConflict ? 'Dữ liệu đã thay đổi ở tab khác. Hãy tải lại trang sau khi giữ bản sao.' :\n        'Trình xem hoặc trình duyệt đang chặn lưu dữ liệu. Tải HTML xuống và mở bằng Chrome/Edge, hoặc chọn Xem thử không lưu bên dưới.';\n      $('previewFallback').classList.toggle('hidden', AUTH_REQUIRED || loadBroken || storageConflict || !storageUnavailable);\n      $('loginErr').scrollIntoView?.({ block: 'nearest' });\n      return;\n    }\n    studentAuth = auth;\n    studentProgress = null;\n    studentProgressError = '';\n    if (LIVE) cloudSync()?.begin();\n    tab = 'home';\n    render();\n    if (LIVE) { refreshStudentProgress(); sync(true); }\n  };\n  $('login').onsubmit = event => { event.preventDefault(); attemptLogin(); };\n  // Một số trình xem cho chạy JS nhưng cấm submit form trong iframe sandbox.\n  $('loginStart').onclick = () => attemptLogin();\n  $('login').onkeydown = event => {\n    if (event.key === 'Enter' && !event.isComposing && event.target.tagName === 'INPUT') {\n      event.preventDefault();\n      attemptLogin();\n    }\n  };\n  $('previewStart').onclick = () => attemptLogin(true);\n}\n\n/** Trạng thái hiển thị của tuần; lưu cục bộ không đồng nghĩa đã được máy chủ nhận. */\nfunction weekStatus(week) {\n  const p = person(), history = p.history.filter(item => item.record.tuan === week);\n  if (p.drafts[week]) return { kind: 'draft', text: history.length ? 'Đang viết lượt mới' : 'Đang viết' };\n  if (!history.length) return studentProgress?.weeks.includes(week) ?\n    { kind: 'sent', text: 'Đã nộp trên Sheet' } : { kind: 'new', text: 'Chưa bắt đầu' };\n  if (history.some(item => !item.sent)) return LIVE ?\n    { kind: 'pending', text: 'Có bài chờ gửi' } : { kind: 'local', text: previewOnly ? 'Bài tạm trong phiên' : 'Bài lưu trên máy' };\n  return { kind: 'sent', text: 'Máy chủ đã xác nhận' };\n}\n\nfunction workflowSteps(week, step) {\n  const currentStage = week.steps[step].stage;\n  const stages = [...new Set(week.steps.map(item => item.stage))];\n  const active = stages.indexOf(currentStage);\n  return `\u003col class=\"workflow-steps\" aria-label=\"Các chặng của tuần\">${stages.map((stage, index) =>\n    `\u003cli class=\"${index \u003c active ? 'done' : index === active ? 'current' : ''}\" ${index === active ? 'aria-current=\"step\"' : ''}>\u003cspan aria-hidden=\"true\">${index \u003c active ? '✓' : index + 1}\u003c/span>${E(stage)}\u003c/li>`).join('')}
